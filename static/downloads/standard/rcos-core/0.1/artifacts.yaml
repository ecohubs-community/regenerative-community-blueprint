- key: authority-registry
  sourceId: 2e9c4a18
  layer: 2
  order: 2
  i18n:
    en:
      title: Authority Registry
      summary: >-
        Lists all roles, circles, or bodies that hold decision-making authority, along with their
        explicit scope, limits, and term.
    de:
      title: Autoritätenregister
      summary: >-
        Listet alle Rollen, Kreise oder Gremien auf, die Entscheidungsbefugnis besitzen, zusammen
        mit ihrem expliziten Geltungsbereich, ihren Grenzen und ihrer Amtszeit.
    es:
      title: Registro de Autoridades
      summary: >-
        Enumera todos los roles, círculos u órganos que poseen autoridad de toma de decisiones,
        junto con su alcance explícito, límites y duración del mandato.
    fr:
      title: Registre des autorités
      summary: >-
        Répertorie tous les rôles, cercles ou organes détenant une autorité décisionnelle, ainsi que
        leur périmètre explicite, leurs limites et leur durée de mandat.
    pt-br:
      title: Registro de Autoridades
      summary: >-
        Lista todos os papéis, círculos ou órgãos que detêm autoridade decisória, junto com seu
        escopo explícito, limites e duração.
  mandatory: true
  sectionKeys:
    - authority-registry.registered-authorities
    - authority-registry.ratification-record
- key: decision-matrix
  sourceId: 4885248e
  layer: 2
  order: 0
  i18n:
    en:
      title: Decision Matrix
      summary: >-
        Maps every decision type and domain to an authorized role or body, mechanism, threshold, and
        escalation path. Decisions made outside this matrix are considered invalid.
    de:
      title: Entscheidungsmatrix
      summary: >-
        Ordnet jeden Entscheidungstyp und -bereich einer autorisierten Rolle oder einem Gremium,
        einem Mechanismus, einer Schwelle und einem Eskalationspfad zu. Entscheidungen, die
        außerhalb dieser Matrix getroffen werden, gelten als ungültig.
    es:
      title: Matriz de Decisiones
      summary: >-
        Asigna cada tipo de decisión y dominio a un rol o cuerpo autorizado, mecanismo, umbral y vía
        de escalamiento. Las decisiones tomadas fuera de esta matriz se consideran inválidas.
    fr:
      title: Matrice de décision
      summary: >-
        Associe chaque type et domaine de décision à un rôle ou organe autorisé, un mécanisme, un
        seuil et un chemin d'escalade. Toute décision prise en dehors de cette matrice est
        considérée comme invalide.
    pt-br:
      title: Matriz de Decisão
      summary: >-
        Mapeia cada tipo e domínio de decisão para um papel ou órgão autorizado, mecanismo, limiar e
        caminho de escalonamento. Decisões tomadas fora desta matriz são consideradas inválidas.
  mandatory: true
  sectionKeys:
    - decision-matrix.voting-principles
    - decision-matrix.matrix
    - decision-matrix.decision-type-definitions
    - decision-matrix.ratification-record

- key: internal-economy-protocol
  sourceId: 1496e7ff
  layer: 3
  order: 0
  i18n:
    en:
      title: Internal Economy Protocol
      summary: >-
        Any unclassified resource must not be allocated, encumbered, monetized, or transferred until
        classification is completed.
    de:
      title: Protokoll für die interne Wirtschaft
      summary: >-
        Nicht klassifizierte Ressourcen dürfen weder zugewiesen, belastet, monetarisiert noch
        übertragen werden, bis die Klassifikation abgeschlossen ist.
    es:
      title: Protocolo de Economía Interna
      summary: >-
        Cualquier recurso sin clasificar no DEBE ser asignado, gravado, monetizado ni transferido
        hasta que se complete la clasificación.
    fr:
      title: Protocole d'économie interne
      summary: >-
        Toute ressource non classifiée NE DOIT PAS être allouée, grevée, monétisée ou transférée
        tant que la classification n'est pas complétée.
    pt-br:
      title: Protocolo de Economia Interna
      summary: >-
        Qualquer recurso não classificado não deve ser alocado, onerado, monetizado ou transferido
        até que a classificação seja concluída.
  mandatory: true
  sectionKeys:
    - internal-economy-protocol.commons-vs-private-classification
    - internal-economy-protocol.recognized-contribution-categories
    - internal-economy-protocol.contribution-recognition-mechanism

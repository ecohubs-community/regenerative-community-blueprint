- key: role-registry
  sourceId: 6de5caef
  layer: 5
  order: 1
  i18n:
    en:
      title: Role Registry
      summary: >-
        **"In good standing"** means a Full Member who has met their participation expectations in
        the last _<period>_ and is not currently subject to an active accountability process or
        conflict review under Layer 4.
    de:
      title: Rollenverzeichnis
      summary: >-
        **„In gutem Status"** bedeutet ein Vollmitglied, das seine Mitwirkungserwartungen in den
        letzten _<Zeitraum>_ erfüllt hat und derzeit keinem aktiven Rechenschaftsprozess oder
        Konfliktprüfung nach Schicht 4 unterliegt.
    es:
      title: Registro de Roles
      summary: >-
        **"En buen estado"** significa un Miembro Pleno que ha cumplido sus expectativas de
        participación en el último _<período>_ y no está actualmente sujeto a un proceso de
        rendición de cuentas activo ni a una revisión de conflicto bajo la Capa 4.
    fr:
      title: Registre des rôles
      summary: >-
        **« En règle »** signifie un Membre à part entière qui a rempli ses attentes de
        participation au cours de la dernière _<période>_ et qui ne fait pas actuellement l'objet
        d'un processus de redevabilité ou d'un examen de conflit en cours au titre de la Couche 4.
    pt-br:
      title: Registro de Papéis
      summary: >-
        **"Em situação regular"** significa um Membro Pleno que cumpriu suas expectativas de
        participação no último _<período>_ e não está atualmente sujeito a um processo ativo de
        responsabilização ou revisão de conflito sob a Camada 4.
  mandatory: true
  sectionKeys:
    - role-registry.overview
    - role-registry.summary-table
    - role-registry.operational-roles
    - role-registry.functional-roles
    - role-registry.ratification-record
- key: change-protocol
  sourceId: 0d3486d6
  layer: 6
  order: 0
  i18n:
    en:
      title: Change Protocol
      summary: If classification is unclear, it defaults to the higher-impact type.
    de:
      title: Änderungsprotokoll
      summary: Wenn die Klassifikation unklar ist, wird standardmäßig der höhere Auswirkungstyp angenommen.
    es:
      title: Protocolo de Cambios
      summary: Si la clasificación no está clara, se aplica por defecto el tipo de mayor impacto.
    fr:
      title: Protocole de changement
      summary: En cas de doute sur la classification, le type à impact supérieur s'applique par défaut.
    pt-br:
      title: Protocolo de Mudanças
      summary: Se a classificação não for clara, ela é elevada por padrão ao tipo de maior impacto.
  mandatory: true
  sectionKeys:
    - change-protocol.how-changes-are-proposed
    - change-protocol.how-proposals-are-classified
    - change-protocol.review-and-deliberation
    - change-protocol.adoption-and-publication
    - change-protocol.rejection
    - change-protocol.transition-and-migration
    - change-protocol.rollback
    - change-protocol.emergency-changes
    - change-protocol.experiments
    - change-protocol.ratification-record
- key: experiment-template
  sourceId: 896b1777
  layer: 6
  order: 3
  i18n:
    en:
      title: Experiment Template
      summary: >-
        Experiments let the community try a change without permanently adopting it. To stay safe,
        every experiment must be time-bounded, labeled, and auto-expiring — and must record its
        results in the Learning Log.
    de:
      title: Experiment-Vorlage
      summary: >-
        Experimente erlauben es der Gemeinschaft, eine Änderung auszuprobieren, ohne sie dauerhaft
        zu übernehmen. Damit das sicher bleibt, muss jedes Experiment zeitlich begrenzt,
        gekennzeichnet und automatisch ablaufend sein — und seine Ergebnisse im Lernprotokoll
        festhalten.
    es:
      title: Plantilla de Experimento
      summary: >-
        Los experimentos permiten que la comunidad pruebe un cambio sin adoptarlo de forma
        permanente. Para mantener la seguridad, cada experimento DEBE estar acotado en el tiempo,
        etiquetado y con expiración automática — y DEBE registrar sus resultados en el Registro de
        Aprendizajes.
    fr:
      title: Modèle d'expérimentation
      summary: >-
        Les expérimentations permettent à la communauté d'essayer un changement sans l'adopter
        définitivement. Pour rester sûre, chaque expérimentation DOIT être limitée dans le temps,
        étiquetée et à expiration automatique — et DOIT consigner ses résultats dans le Journal
        d'apprentissage.
    pt-br:
      title: Modelo de Experimento
      summary: >-
        Experimentos permitem que a comunidade teste uma mudança sem adotá-la permanentemente. Para
        serem seguros, todos os experimentos devem ter prazo definido, estar rotulados e expirar
        automaticamente — e devem registrar seus resultados no Registro de Aprendizados (Learning
        Log).
  mandatory: false
  sectionKeys:
    - experiment-template.required-fields
    - experiment-template.expiry-and-renewal
    - experiment-template.outcome-record-filled-in-at-experiment-end
- key: learning-log
  sourceId: 9a3f7c1e
  layer: 6
  order: 2
  i18n:
    en:
      title: Learning Log
      summary: >-
        Records major failures, adaptations, reversals, and systemic learnings. Repeated failure
        patterns must trigger structural review, not individual blame. Entries are prepended (most
        recent first).
    de:
      title: Lernprotokoll
      summary: >-
        Dokumentiert größere Fehler, Anpassungen, Rücknahmen und systemische Erkenntnisse.
        Wiederkehrende Fehlermuster müssen eine strukturelle Überprüfung auslösen, keine
        individuelle Schuldzuweisung. Einträge werden vorangestellt (neueste zuerst).
    es:
      title: Registro de Aprendizajes
      summary: >-
        Registra fallos importantes, adaptaciones, reversiones y aprendizajes sistémicos. Los
        patrones de fallo recurrentes DEBEN activar una revisión estructural, no culpa individual.
        Las entradas se añaden al inicio (las más recientes primero).
    fr:
      title: Journal d'apprentissage
      summary: >-
        Consigne les échecs majeurs, les adaptations, les retours en arrière et les apprentissages
        systémiques. Les schémas d'échec récurrents DOIVENT déclencher une revue structurelle, pas
        une mise en cause individuelle. Les entrées sont ajoutées en tête de liste (la plus récente
        en premier).
    pt-br:
      title: Registro de Aprendizado
      summary: >-
        Registra falhas importantes, adaptações, reversões e aprendizados sistêmicos. Padrões
        recorrentes de falha devem desencadear uma revisão estrutural, não a culpabilização
        individual. As entradas são adicionadas no topo (mais recentes primeiro).
  mandatory: true
  sectionKeys:
    - learning-log.what-constitutes-a-learnable-event
    - learning-log.entry-format
    - learning-log.yyyy-mm-dd-short-title
- key: version-history
  sourceId: 4c8e6d5b
  layer: 6
  order: 1
  i18n:
    en:
      title: Version History
      summary: >-
        The authoritative human-readable record of all adopted changes to your community's RCOS
        implementation. The currently active version is the most recent entry at the top of this
        file. Superseded rules remain accessible via version control.
    de:
      title: Versionshistorie
      summary: >-
        Das maßgebliche, menschenlesbare Protokoll aller übernommenen Änderungen an der
        RCOS-Implementierung eurer Gemeinschaft. Die aktuell gültige Version ist der neueste Eintrag
        am Anfang dieser Datei. Abgelöste Regeln bleiben über die Versionskontrolle zugänglich.
    es:
      title: Historial de Versiones
      summary: >-
        El registro legible por humanos y con carácter oficial de todos los cambios adoptados en la
        implementación RCOS de tu comunidad. La versión actualmente vigente es la entrada más
        reciente en la parte superior de este archivo. Las reglas sustituidas permanecen accesibles
        a través del control de versiones.
    fr:
      title: Historique des versions
      summary: >-
        Le registre officiel lisible par les humains de tous les changements adoptés dans
        l'implémentation RCOS de ta communauté. La version actuellement active est l'entrée la plus
        récente en haut de ce fichier. Les règles remplacées restent accessibles via le contrôle de
        version.
    pt-br:
      title: Histórico de Versões
      summary: >-
        O registro autoritativo legível por humanos de todas as mudanças adotadas na implementação
        RCOS da sua comunidade. A versão atualmente ativa é a entrada mais recente no topo deste
        arquivo. Regras substituídas permanecem acessíveis via controle de versão.
  mandatory: true
  sectionKeys:
    - version-history.entry-format
    - version-history.version-short-title
    - version-history.current-version-v0-0-repository-initialized

- key: accountability-protocol
  sourceId: d0c21119
  layer: 4
  order: 1
  i18n:
    en:
      title: Accountability Protocol
      summary: >-
        **Breach severity guidance:** _<medium = non-compliance with a Membership Agreement
        obligation that does not threaten member safety or community integrity; serious = Layer 0
        invariant violation, credible safety concern, persistent bad-faith conduct.>_
    de:
      title: Rechenschaftsprotokoll
      summary: >-
        **Leitlinie zur Verstoßschwere:** _<mittel = Nichteinhaltung einer Pflicht aus der
        Mitgliedschaftsvereinbarung, die weder die Sicherheit von Mitgliedern noch die Integrität
        der Gemeinschaft gefährdet; schwer = Verletzung einer Invariante der Schicht 0, glaubwürdige
        Sicherheitsbedenken, anhaltend bösgläubiges Verhalten.>_
    es:
      title: Protocolo de Rendición de Cuentas
      summary: >-
        **Guía de gravedad del incumplimiento:** _<intermedio = incumplimiento de una obligación del
        Acuerdo de Membresía que no amenaza la seguridad de los miembros ni la integridad de la
        comunidad; grave = violación de invariante de la Capa 0, preocupación creíble de seguridad,
        conducta persistente de mala fe.>_
    fr:
      title: Protocole de responsabilisation
      summary: >-
        **Guide de gravité des manquements :** _<intermédiaire = non-respect d'une obligation de
        l'Accord d'adhésion qui ne menace pas la sécurité des membres ni l'intégrité de la
        communauté ; grave = violation d'un invariant de la Couche 0, préoccupation crédible de
        sécurité, conduite persistante de mauvaise foi.>_
    pt-br:
      title: Protocolo de Responsabilização
      summary: >-
        **Orientação sobre a gravidade do descumprimento:** _<médio = descumprimento de uma
        obrigação do Acordo de Membresia que não ameaça a segurança dos membros ou a integridade da
        comunidade; sério = violação de invariante da Camada 0, preocupação crível com segurança,
        conduta persistente de má-fé.>_
  mandatory: true
  sectionKeys:
    - accountability-protocol.triggers
    - accountability-protocol.investigation-and-review
    - accountability-protocol.due-process-guarantees
    - accountability-protocol.anti-retaliation-protections
    - accountability-protocol.sanction-and-repair-options
    - accountability-protocol.conditions-for-restoring-rights
    - accountability-protocol.coordination-with-layer-1
    - accountability-protocol.ratification-record
- key: conflict-resolution-ladder
  sourceId: a1de3ac3
  layer: 4
  order: 0
  i18n:
    en:
      title: Conflict Resolution Ladder
      summary: >-
        Safety-critical conflicts override participation rights, role continuity, and operational
        convenience.
    de:
      title: Konfliktlösungsleiter
      summary: >-
        Sicherheitskritische Konflikte setzen Teilnahmerechte, Rollenkontinuität und betriebliche
        Zweckmässigkeit ausser Kraft.
    es:
      title: Escalera de Resolución de Conflictos
      summary: >-
        Los conflictos críticos para la seguridad prevalecen sobre los derechos de participación, la
        continuidad de roles y la conveniencia operativa.
    fr:
      title: Échelle de résolution des conflits
      summary: >-
        Les conflits critiques pour la sécurité priment sur les droits de participation, la
        continuité des rôles et la commodité opérationnelle.
    pt-br:
      title: Escada de Resolução de Conflitos
      summary: >-
        Conflitos críticos de segurança prevalecem sobre direitos de participação, continuidade de
        papéis e conveniência operacional.
  mandatory: true

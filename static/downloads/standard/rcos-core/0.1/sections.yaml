- key: role-registry.overview
  artifact: role-registry
  order: 0
  clauseRefs:
    - 7.1.1
    - 7.1.2
    - 7.1.4
    - 7.7.1
  i18n:
    en:
      title: Overview
      whyItMatters: >-
        Ongoing responsibilities without explicit roles become invisible labor — done by whoever
        notices, resented silently, and impossible to hand over. Making every ongoing responsibility
        a named, accountable role is what prevents the community from running on the unpaid goodwill
        of a few members.
      whatToDefine: >-
        Distinguish operational roles (carrying delegated authority per the Decision Matrix) from
        functional roles (contribution-scoped, no special governance authority). State the "in good
        standing" definition you will use for eligibility.
      placeholders:
        - period
    de:
      title: Überblick
      whyItMatters: >-
        Laufende Verantwortlichkeiten ohne explizite Rollen werden zu unsichtbarer Arbeit — erledigt
        von wem auch immer es auffällt, still hingenommen und unmöglich zu übergeben. Jede laufende
        Verantwortung zu einer benannten, rechenschaftspflichtigen Rolle zu machen, verhindert, dass
        die Gemeinschaft auf dem unbezahlten Wohlwollen einiger weniger Mitglieder läuft.
      whatToDefine: >-
        Unterscheidet operative Rollen (mit delegierter Autorität gemäß der Entscheidungsmatrix) von
        funktionalen Rollen (beitragsbezogen, ohne besondere Governance-Autorität). Legt die
        Definition von „in gutem Status" fest, die ihr für die Berechtigung verwenden werdet.
      placeholders:
        - Zeitraum
    es:
      title: Visión general
      whyItMatters: >-
        Las responsabilidades continuas sin roles explícitos se convierten en trabajo invisible — lo
        hace quien se da cuenta, genera resentimiento silencioso y es imposible de traspasar.
        Convertir cada responsabilidad continua en un rol con nombre y rendición de cuentas es lo
        que evita que la comunidad funcione a base de la buena voluntad no reconocida de unos pocos
        miembros.
      whatToDefine: >-
        Distingue los roles operativos (que llevan autoridad delegada según la Matriz de Decisiones)
        de los roles funcionales (limitados a contribuciones, sin autoridad de gobernanza especial).
        Indica la definición de "en buen estado" que usarás para la elegibilidad.
      placeholders:
        - período
    fr:
      title: Vue d'ensemble
      whyItMatters: >-
        Les responsabilités continues sans rôle explicite deviennent du travail invisible — effectué
        par la personne qui le remarque, source de ressentiment silencieux, et impossible à
        transmettre. Associer chaque responsabilité continue à un rôle nommé et redevable est ce qui
        empêche la communauté de fonctionner grâce à la bonne volonté non reconnue de quelques
        membres.
      whatToDefine: >-
        Distingue les rôles opérationnels (détenant une autorité déléguée selon la Matrice de
        décision) des rôles fonctionnels (limités à un périmètre de contribution, sans autorité de
        gouvernance particulière). Indique la définition de « en règle » que tu utiliseras pour
        l'éligibilité.
      placeholders:
        - période
    pt-br:
      title: Visão Geral
      whyItMatters: >-
        Responsabilidades contínuas sem papéis explícitos viram trabalho invisível — feitas por quem
        percebe, ressentidas silenciosamente e impossíveis de transferir. Tornar cada
        responsabilidade contínua um papel nomeado e responsabilizável é o que impede que a
        comunidade funcione à custa da boa vontade não remunerada de alguns membros.
      whatToDefine: >-
        Distinga papéis operacionais (que carregam autoridade delegada conforme a Matriz de Decisão)
        de papéis funcionais (com escopo de contribuição, sem autoridade especial de governança).
        Defina o que você usará como "em situação regular" para fins de elegibilidade.
      placeholders:
        - período
  ownsClauses:
    - 7.1.1
    - 7.1.2
    - 7.1.4
    - 7.7.1

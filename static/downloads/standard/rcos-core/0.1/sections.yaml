- key: learning-log.what-constitutes-a-learnable-event
  artifact: learning-log
  order: 0
  clauseRefs:
    - 8.4.1
    - 8.4.4
    - 8.6.5
    - 8.7.4
  i18n:
    en:
      title: What Constitutes a Learnable Event
      whyItMatters: >-
        If "we should learn from this" is left to individual judgement, the hardest lessons — the
        ones involving conflict, failure, or embarrassment — are the ones most likely to go
        unrecorded. Naming the specific events that MUST produce an entry takes the question out of
        the moment, and makes sure uncomfortable learnings are captured rather than quietly dropped.
      whatToDefine: >-
        List the specific events that obligate a Learning Log entry. State who owns the log and the
        synthesis cadence.
      placeholders:
        - >-
          A governance decision is reversed, rolled back, or found to contradict another adopted
          rule.
        - An experiment concludes (success, failure, or early termination).
        - A conflict escalates to the governance step of the Conflict Resolution Ladder.
        - >-
          A structural or systemic failure is identified that caused harm, confusion, or repeated
          process breakdown.
        - >-
          A major adaptation to community operations is adopted that significantly changes how a
          layer functions.
        - >-
          A near-miss: a situation that could have caused significant harm but was caught before it
          did.
        - Any event the community collectively identifies as worth learning from.
        - >-
          Minor operational adjustments, routine decisions, and individual issues fully resolved at
          the early steps of the Conflict Resolution Ladder do not require a Learning Log entry.
        - role responsible for ensuring entries are created and maintained.
        - >-
          the Learning Log is reviewed at the Reflection & Learning meeting; named role prepares a
          brief synthesis of entries since the last review, noting recurring patterns.
    de:
      title: Was ein lernrelevantes Ereignis ausmacht
      whyItMatters: >-
        Wenn „daraus sollten wir lernen" dem individuellen Ermessen überlassen wird, sind die
        härtesten Lektionen — jene, die mit Konflikten, Scheitern oder Peinlichkeit verbunden sind —
        am ehesten diejenigen, die undokumentiert bleiben. Die konkreten Ereignisse zu benennen, die
        einen Eintrag erzeugen MÜSSEN, nimmt die Frage aus dem Moment heraus und stellt sicher, dass
        unbequeme Erkenntnisse festgehalten werden, anstatt stillschweigend unter den Tisch zu
        fallen.
      whatToDefine: >-
        Liste die konkreten Ereignisse auf, die einen Eintrag im Lernprotokoll verpflichtend machen.
        Benenne, wer das Protokoll pflegt, und den Rhythmus der Zusammenfassung.
      placeholders:
        - >-
          Eine Governance-Entscheidung wird rückgängig gemacht, zurückgenommen oder steht im
          Widerspruch zu einer anderen verabschiedeten Regel.
        - Ein Experiment wird abgeschlossen (Erfolg, Misserfolg oder vorzeitiger Abbruch).
        - Ein Konflikt eskaliert bis zur Governance-Stufe der Konfliktlösungsleiter.
        - >-
          Ein strukturelles oder systemisches Versagen wird identifiziert, das Schaden, Verwirrung
          oder wiederholten Prozesszusammenbruch verursacht hat.
        - >-
          Eine wesentliche Anpassung der Gemeinschaftsabläufe wird verabschiedet, die die
          Funktionsweise einer Schicht erheblich verändert.
        - >-
          Ein Beinahe-Vorfall: eine Situation, die erheblichen Schaden hätte verursachen können,
          aber rechtzeitig erkannt wurde.
        - Jedes Ereignis, das die Gemeinschaft gemeinsam als lernwürdig einstuft.
        - >-
          Kleinere betriebliche Anpassungen, Routineentscheidungen und individuelle Probleme, die in
          den frühen Stufen der Konfliktlösungsleiter vollständig gelöst werden, erfordern keinen
          Eintrag im Lernprotokoll.
        - Rolle, die dafür verantwortlich ist, dass Einträge erstellt und gepflegt werden.
        - >-
          Das Lernprotokoll wird beim Reflexions- & Lerntreffen überprüft; die benannte Rolle
          bereitet eine kurze Zusammenfassung der Einträge seit der letzten Überprüfung vor und
          weist auf wiederkehrende Muster hin.
    es:
      title: Qué constituye un evento de aprendizaje
      whyItMatters: >-
        Si "deberíamos aprender de esto" queda a criterio individual, las lecciones más difíciles —
        las que implican conflicto, fracaso o vergüenza — son las que más probablemente quedarán sin
        registrar. Nombrar los eventos específicos que DEBEN producir una entrada elimina la
        pregunta del momento, y asegura que los aprendizajes incómodos se capturen en lugar de
        dejarse pasar en silencio.
      whatToDefine: >-
        Enumera los eventos específicos que obligan a crear una entrada en el Registro de
        Aprendizajes. Indica quién es responsable del registro y la cadencia de síntesis.
      placeholders:
        - >-
          Una decisión de gobernanza se revierte, se deshace, o se descubre que contradice otra
          regla adoptada.
        - Un experimento concluye (éxito, fracaso o terminación anticipada).
        - Un conflicto escala al paso de gobernanza de la Escalera de Resolución de Conflictos.
        - >-
          Se identifica un fallo estructural o sistémico que causó daño, confusión o quiebres
          repetidos del proceso.
        - >-
          Se adopta una adaptación importante de las operaciones comunitarias que cambia
          significativamente el funcionamiento de una capa.
        - >-
          Un cuasi-incidente: una situación que podría haber causado daño significativo pero fue
          detectada antes de que ocurriera.
        - Cualquier evento que la comunidad identifique colectivamente como digno de aprendizaje.
        - >-
          Los ajustes operativos menores, las decisiones rutinarias y los asuntos individuales
          resueltos completamente en los primeros pasos de la Escalera de Resolución de Conflictos
          no requieren una entrada en el Registro de Aprendizajes.
        - rol encargado de asegurar que las entradas se creen y mantengan.
        - >-
          el Registro de Aprendizajes se revisa en la reunión de Reflexión y Aprendizaje; el rol
          designado prepara una síntesis breve de las entradas desde la última revisión, señalando
          patrones recurrentes.
    fr:
      title: Ce qui constitue un événement apprenant
      whyItMatters: >-
        Si « on devrait tirer des leçons de ceci » est laissé au jugement individuel, les leçons les
        plus difficiles — celles qui impliquent un conflit, un échec ou un embarras — sont celles
        qui ont le plus de chances de ne jamais être consignées. Nommer les événements spécifiques
        qui DOIVENT produire une entrée retire la question du moment présent et garantit que les
        apprentissages inconfortables sont capturés plutôt que discrètement oubliés.
      whatToDefine: >-
        Liste les événements spécifiques qui obligent à créer une entrée dans le Journal
        d'apprentissage. Indique qui est responsable du journal et la cadence de synthèse.
      placeholders:
        - >-
          Une décision de gouvernance est annulée, révoquée, ou s'avère en contradiction avec une
          autre règle adoptée.
        - Une expérimentation se conclut (succès, échec ou arrêt anticipé).
        - >-
          Un conflit escalade jusqu'à l'étape de gouvernance de l'Échelle de résolution des
          conflits.
        - >-
          Une défaillance structurelle ou systémique est identifiée, ayant causé un préjudice, de la
          confusion ou des dysfonctionnements récurrents.
        - >-
          Une adaptation majeure des opérations communautaires est adoptée et modifie
          significativement le fonctionnement d'une couche.
        - >-
          Un quasi-incident : une situation qui aurait pu causer un préjudice significatif mais a
          été détectée à temps.
        - >-
          Tout événement que la communauté identifie collectivement comme méritant d'en tirer des
          enseignements.
        - >-
          Les ajustements opérationnels mineurs, les décisions de routine et les problèmes
          individuels entièrement résolus aux premières étapes de l'Échelle de résolution des
          conflits ne nécessitent pas d'entrée dans le Journal d'apprentissage.
        - rôle chargé de s'assurer que les entrées sont créées et maintenues.
        - >-
          le Journal d'apprentissage est examiné lors de la réunion Réflexion et apprentissage ; le
          rôle désigné prépare une brève synthèse des entrées depuis la dernière revue, en relevant
          les schémas récurrents.
    pt-br:
      title: O Que Constitui um Evento Passível de Aprendizado
      whyItMatters: >-
        Se "deveríamos aprender com isso" for deixado ao critério individual, as lições mais
        difíceis — aquelas que envolvem conflito, fracasso ou constrangimento — são justamente as
        que têm maior probabilidade de não serem registradas. Nomear os eventos específicos que
        DEVEM gerar uma entrada tira essa decisão do calor do momento e garante que aprendizados
        desconfortáveis sejam capturados, em vez de silenciosamente descartados.
      whatToDefine: >-
        Liste os eventos específicos que obrigam uma entrada no Registro de Aprendizado. Indique
        quem é responsável pelo registro e a cadência de síntese.
      placeholders:
        - >-
          Uma decisão de governança é revertida, desfeita ou identificada como contraditória a outra
          regra adotada.
        - Um experimento é concluído (sucesso, fracasso ou encerramento antecipado).
        - Um conflito escala para a etapa de governança da Escada de Resolução de Conflitos.
        - >-
          Uma falha estrutural ou sistêmica é identificada e causou dano, confusão ou quebras
          repetidas de processo.
        - >-
          Uma adaptação importante das operações da comunidade é adotada e altera significativamente
          o funcionamento de uma camada.
        - >-
          Um quase acidente: uma situação que poderia ter causado dano significativo, mas foi
          detectada antes que isso acontecesse.
        - Qualquer evento que a comunidade identifique coletivamente como digno de aprendizado.
        - >-
          Ajustes operacionais menores, decisões rotineiras e questões individuais totalmente
          resolvidas nas etapas iniciais da Escada de Resolução de Conflitos não exigem uma entrada
          no Registro de Aprendizado.
        - papel responsável por garantir que as entradas sejam criadas e mantidas.
        - >-
          o Registro de Aprendizado é revisado na reunião de Reflexão e Aprendizado; o papel nomeado
          prepara uma breve síntese das entradas desde a última revisão, destacando padrões
          recorrentes.

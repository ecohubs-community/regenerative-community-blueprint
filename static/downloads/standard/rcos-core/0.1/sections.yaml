- key: conflict-resolution-ladder.resolution-ladder-steps
  artifact: conflict-resolution-ladder
  order: 1
  clauseRefs:
    - 6.2.1
    - 6.2.2
    - 6.2.3
    - 6.2.4
    - 6.2.5
    - 6.5.3
    - 6.6.1
  i18n:
    en:
      title: Resolution Ladder Steps
      whyItMatters: >-
        Most conflict is low-stakes and best resolved between the people involved; forcing
        everything into formal review would kill trust and flood the governance system. A ladder
        matches process weight to dispute weight — private conversation first, facilitated dialogue
        next, written record only when needed, governance vote only when all else fails. It also
        makes escalation a structural right, not a favour granted by whoever holds social power.
      whatToDefine: >-
        Define each ladder step: who is involved, what happens, the time window, and the escalation
        rule. Keep the early steps light and confidential; reserve formal review for later steps.
      placeholders:
        - parties attempt to resolve privately; window; outcome rules.
        - facilitator hosts conversation; confidentiality; window; outcome rules.
        - formal written record opened; submissions; window; outcome rules.
        - structured review; both parties present; written recommendation; window; outcome rules.
        - >-
          minimum-necessary disclosure to Full Members; deliberation period; vote mechanism and
          threshold.
        - coordinated with the Exit & Separation Protocol; minimum re-application block.
    de:
      title: Stufen der Lösungsleiter
      whyItMatters: >-
        Die meisten Konflikte sind niedrigschwellig und lassen sich am besten zwischen den
        Beteiligten lösen; alles in eine formelle Überprüfung zu zwingen würde Vertrauen zerstören
        und das Governance-System überfluten. Eine Leiter passt den Prozessaufwand an das
        Streitgewicht an — zuerst ein privates Gespräch, dann ein moderierter Dialog, eine
        schriftliche Dokumentation nur bei Bedarf, eine Governance-Abstimmung nur wenn alles andere
        scheitert. Ausserdem wird die Eskalation zu einem strukturellen Recht, statt einem Gefallen,
        der von der Person mit der meisten sozialen Macht gewährt wird.
      whatToDefine: >-
        Definiere jede Leiterstufe: wer beteiligt ist, was passiert, das Zeitfenster und die
        Eskalationsregel. Halte die frühen Stufen leicht und vertraulich; reserviere die formelle
        Überprüfung für spätere Stufen.
      placeholders:
        - Parteien versuchen, die Sache privat zu klären; Zeitfenster; Ergebnisregeln.
        - Moderator*in leitet das Gespräch; Vertraulichkeit; Zeitfenster; Ergebnisregeln.
        - formelle schriftliche Dokumentation wird eröffnet; Eingaben; Zeitfenster; Ergebnisregeln.
        - >-
          strukturierte Überprüfung; beide Parteien anwesend; schriftliche Empfehlung; Zeitfenster;
          Ergebnisregeln.
        - >-
          minimalnotwendige Offenlegung gegenüber Vollmitgliedern; Beratungsfrist;
          Abstimmungsverfahren und Schwellenwert.
        - >-
          koordiniert mit dem Austritts- & Trennungsprotokoll; Mindest-Sperrfrist für erneute
          Bewerbung.
    es:
      title: Pasos de la Escalera de Resolución
      whyItMatters: >-
        La mayoría de los conflictos son de bajo impacto y se resuelven mejor entre las personas
        involucradas; forzar todo hacia una revisión formal destruiría la confianza e inundaría el
        sistema de gobernanza. Una escalera ajusta el peso del proceso al peso de la disputa —
        primero conversación privada, luego diálogo facilitado, registro escrito solo cuando sea
        necesario, votación de gobernanza solo cuando todo lo demás falla. También convierte la
        escalada en un derecho estructural, no en un favor concedido por quien detenta el poder
        social.
      whatToDefine: >-
        Define cada paso de la escalera: quién participa, qué sucede, la ventana temporal y la regla
        de escalada. Mantén los primeros pasos ligeros y confidenciales; reserva la revisión formal
        para pasos posteriores.
      placeholders:
        - las partes intentan resolver en privado; ventana; reglas de resultado.
        - un facilitador conduce la conversación; confidencialidad; ventana; reglas de resultado.
        - se abre un registro escrito formal; presentaciones; ventana; reglas de resultado.
        - >-
          revisión estructurada; ambas partes presentes; recomendación escrita; ventana; reglas de
          resultado.
        - >-
          divulgación mínima necesaria a los Miembros Plenos; período de deliberación; mecanismo de
          votación y umbral.
        - >-
          coordinado con el Protocolo de Salida y Separación; período mínimo de bloqueo para
          re-solicitud.
    fr:
      title: Étapes de l'échelle de résolution
      whyItMatters: >-
        La plupart des conflits sont à faible enjeu et se résolvent mieux entre les personnes
        concernées ; tout forcer dans un examen formel tuerait la confiance et submergerait le
        système de gouvernance. Une échelle adapte le poids du processus au poids du différend —
        conversation privée d'abord, dialogue facilité ensuite, trace écrite seulement quand c'est
        nécessaire, vote de gouvernance uniquement quand tout le reste a échoué. Cela fait aussi de
        l'escalade un droit structurel, et non une faveur accordée par la personne qui détient le
        pouvoir social.
      whatToDefine: >-
        Définis chaque étape de l'échelle : qui est impliqué, ce qui se passe, le délai et la règle
        d'escalade. Garde les premières étapes légères et confidentielles ; réserve l'examen formel
        aux étapes ultérieures.
      placeholders:
        - les parties tentent de résoudre en privé ; délai ; règles de résultat.
        - >-
          un·e facilitateur·rice anime la conversation ; confidentialité ; délai ; règles de
          résultat.
        - ouverture d'un dossier écrit formel ; soumissions ; délai ; règles de résultat.
        - >-
          examen structuré ; les deux parties présentes ; recommandation écrite ; délai ; règles de
          résultat.
        - >-
          divulgation minimale nécessaire aux Membres Titulaires ; période de délibération ;
          mécanisme de vote et seuil.
        - >-
          coordonné avec le Protocole de sortie et de séparation ; période minimale avant une
          nouvelle candidature.
    pt-br:
      title: Passos da Escada de Resolução
      whyItMatters: >-
        A maior parte dos conflitos é de baixo impacto e é melhor resolvida entre as pessoas
        envolvidas; forçar tudo para uma revisão formal destruiria a confiança e sobrecarregaria o
        sistema de governança. Uma escada ajusta o peso do processo ao peso da disputa — conversa
        privada primeiro, diálogo facilitado em seguida, registro escrito apenas quando necessário,
        votação de governança somente quando tudo mais falhar. Isso também torna a escalada um
        direito estrutural, e não um favor concedido por quem detém poder social.
      whatToDefine: >-
        Defina cada passo da escada: quem está envolvido, o que acontece, o prazo e a regra de
        escalada. Mantenha os primeiros passos leves e confidenciais; reserve a revisão formal para
        passos posteriores.
      placeholders:
        - as partes tentam resolver em privado; prazo; regras de resultado.
        - facilitador conduz a conversa; confidencialidade; prazo; regras de resultado.
        - registro formal escrito aberto; submissões; prazo; regras de resultado.
        - >-
          revisão estruturada; ambas as partes presentes; recomendação escrita; prazo; regras de
          resultado.
        - >-
          divulgação mínima necessária aos Membros Plenos; período de deliberação; mecanismo de
          votação e limiar.
        - coordenado com o Protocolo de Saída e Separação; bloqueio mínimo para reaplicação.
  ownsClauses:
    - 6.2.1
    - 6.2.2
    - 6.2.3
    - 6.2.4
    - 6.2.5
    - 6.6.1
- key: conflict-resolution-ladder.non-response-withdrawal-and-deadlock
  artifact: conflict-resolution-ladder
  order: 2
  clauseRefs:
    - 6.2.5
    - 6.1.5
  i18n:
    en:
      title: Non-Response, Withdrawal, and Deadlock
      whyItMatters: >-
        The easiest way to defeat any accountability process is to ignore it. If non-response,
        withdrawal, or deadlock leaves the matter frozen, the party on the receiving end of harm
        carries the cost of the inaction. Explicit rules for each failure mode convert silence into
        a documented escalation trigger rather than a veto.
      whatToDefine: >-
        Define how non-response, mid-process withdrawal, deadlock, and procedural failure are
        handled. Each should have a documented escalation path.
      placeholders:
        - >-
          Follow-up notice; additional grace period; treatment of continued silence as
          non-resolution; escalation rule.
        - >-
          Notification of withdrawal; option for the other party to close or request a written
          summary; escalation rule for outstanding accountability matters.
        - Documentation of the deadlock; escalation to governance decision.
        - >-
          How procedural objections are raised; where they are logged; trigger for review of this
          artifact under the Change Protocol.
    de:
      title: Nichtreaktion, Rückzug und Pattsituation
      whyItMatters: >-
        Der einfachste Weg, jeden Rechenschaftsprozess auszuhebeln, ist ihn zu ignorieren. Wenn
        Nichtreaktion, Rückzug oder Pattsituation die Angelegenheit einfriert, trägt die geschädigte
        Partei die Kosten der Untätigkeit. Explizite Regeln für jeden Ausfallmodus verwandeln
        Schweigen in einen dokumentierten Eskalationsauslöser statt in ein Veto.
      whatToDefine: >-
        Definiere, wie Nichtreaktion, Rückzug während des Prozesses, Pattsituationen und
        Verfahrensfehler behandelt werden. Jeder Fall sollte einen dokumentierten Eskalationspfad
        haben.
      placeholders:
        - >-
          Folgebenachrichtigung; zusätzliche Nachfrist; Behandlung anhaltenden Schweigens als
          Nichtlösung; Eskalationsregel.
        - >-
          Mitteilung über den Rückzug; Option für die andere Partei, den Fall abzuschliessen oder
          eine schriftliche Zusammenfassung anzufordern; Eskalationsregel für offene
          Rechenschaftsfragen.
        - Dokumentation der Pattsituation; Eskalation zur Governance-Entscheidung.
        - >-
          Wie Verfahrenseinwände erhoben werden; wo sie protokolliert werden; Auslöser für eine
          Überprüfung dieses Artefakts gemäss dem Änderungsprotokoll.
    es:
      title: Falta de Respuesta, Retiro y Punto Muerto
      whyItMatters: >-
        La forma más fácil de derrotar cualquier proceso de rendición de cuentas es ignorarlo. Si la
        falta de respuesta, el retiro o el punto muerto dejan el asunto congelado, la parte que
        recibe el daño carga con el costo de la inacción. Reglas explícitas para cada modo de fallo
        convierten el silencio en un detonante de escalada documentado en lugar de un veto.
      whatToDefine: >-
        Define cómo se manejan la falta de respuesta, el retiro a mitad del proceso, el punto muerto
        y el fallo procedimental. Cada uno DEBE tener una ruta de escalada documentada.
      placeholders:
        - >-
          Aviso de seguimiento; período de gracia adicional; tratamiento del silencio continuado
          como no resolución; regla de escalada.
        - >-
          Notificación de retiro; opción para la otra parte de cerrar o solicitar un resumen
          escrito; regla de escalada para asuntos pendientes de rendición de cuentas.
        - Documentación del punto muerto; escalada a decisión de gobernanza.
        - >-
          Cómo se plantean las objeciones procedimentales; dónde se registran; detonante para
          revisión de este artefacto bajo el Protocolo de Cambios.
    fr:
      title: Non-réponse, retrait et impasse
      whyItMatters: >-
        Le moyen le plus simple de faire échouer tout processus de responsabilité est de l'ignorer.
        Si la non-réponse, le retrait ou l'impasse laissent l'affaire gelée, la partie qui subit le
        préjudice porte le coût de l'inaction. Des règles explicites pour chaque mode de défaillance
        transforment le silence en déclencheur d'escalade documenté plutôt qu'en veto.
      whatToDefine: >-
        Définis comment la non-réponse, le retrait en cours de processus, l'impasse et la
        défaillance procédurale sont gérés. Chacun doit avoir un chemin d'escalade documenté.
      placeholders:
        - >-
          Relance ; délai de grâce supplémentaire ; traitement du silence prolongé comme
          non-résolution ; règle d'escalade.
        - >-
          Notification du retrait ; possibilité pour l'autre partie de clore ou de demander un
          résumé écrit ; règle d'escalade pour les questions de responsabilité en suspens.
        - Documentation de l'impasse ; escalade vers une décision de gouvernance.
        - >-
          Comment les objections procédurales sont soulevées ; où elles sont consignées ;
          déclencheur pour la révision de cet artefact dans le cadre du Protocole de modification.
    pt-br:
      title: Não-Resposta, Retirada e Impasse
      whyItMatters: >-
        A maneira mais fácil de derrotar qualquer processo de responsabilização é ignorá-lo. Se a
        não-resposta, a retirada ou o impasse deixam o assunto congelado, é a parte que sofre o dano
        que arca com o custo da inação. Regras explícitas para cada modo de falha convertem o
        silêncio em um gatilho documentado de escalada, em vez de um veto.
      whatToDefine: >-
        Defina como a não-resposta, a retirada no meio do processo, o impasse e a falha
        procedimental são tratados. Cada um deve ter um caminho de escalada documentado.
      placeholders:
        - >-
          Aviso de acompanhamento; período de tolerância adicional; tratamento do silêncio
          continuado como não-resolução; regra de escalada.
        - >-
          Notificação da retirada; opção para a outra parte encerrar ou solicitar um resumo escrito;
          regra de escalada para questões de responsabilização pendentes.
        - Documentação do impasse; escalada para decisão de governança.
        - >-
          Como objeções procedimentais são levantadas; onde são registradas; gatilho para revisão
          deste artefato sob o Protocolo de Mudança.
  ownsClauses: []
- key: conflict-resolution-ladder.facilitator-selection-and-replacement
  artifact: conflict-resolution-ladder
  order: 3
  clauseRefs:
    - 6.3.1
    - 6.3.3
  i18n:
    en:
      title: Facilitator Selection and Replacement
      whyItMatters: >-
        A facilitator who is implicated in the conflict — or socially aligned with one party —
        cannot hold the process fairly, no matter how good their intentions. Naming selection and
        replacement rules up front means the affected party does not have to fight for a neutral
        hearing while already under stress.
      whatToDefine: >-
        State the default facilitator role, the rule when the facilitator is a party, the right to
        decline, and any provision for external facilitation.
      placeholders:
        - Default facilitator role per the Role Registry.
        - Rule when the facilitator is a party — selection of a neutral substitute.
        - Right of either party to decline a facilitator with stated conflict of interest.
        - Optional external facilitation by mutual agreement.
    de:
      title: Auswahl und Ersetzung der Moderation
      whyItMatters: >-
        Eine moderierende Person, die selbst in den Konflikt verwickelt ist — oder sozial einer
        Partei nahesteht — kann den Prozess nicht fair führen, egal wie gut ihre Absichten sind.
        Auswahl- und Ersetzungsregeln vorab festzulegen bedeutet, dass die betroffene Partei nicht
        um ein neutrales Verfahren kämpfen muss, während sie ohnehin unter Stress steht.
      whatToDefine: >-
        Lege die standardmässige Moderationsrolle fest, die Regel für den Fall, dass die
        moderierende Person selbst Partei ist, das Ablehnungsrecht und eine optionale externe
        Moderation.
      placeholders:
        - Standard-Moderationsrolle gemäss dem Rollenverzeichnis.
        - >-
          Regel für den Fall, dass die moderierende Person selbst Partei ist — Auswahl einer
          neutralen Vertretung.
        - >-
          Recht jeder Partei, eine moderierende Person bei festgestelltem Interessenkonflikt
          abzulehnen.
        - Optionale externe Moderation in gegenseitigem Einvernehmen.
    es:
      title: Selección y Sustitución del Facilitador
      whyItMatters: >-
        Un facilitador que está implicado en el conflicto — o socialmente alineado con una parte —
        no puede conducir el proceso de manera justa, sin importar cuán buenas sean sus intenciones.
        Definir las reglas de selección y sustitución de antemano significa que la parte afectada no
        tiene que luchar por una audiencia neutral mientras ya está bajo estrés.
      whatToDefine: >-
        Indica el rol de facilitador por defecto, la regla cuando el facilitador es parte del
        conflicto, el derecho a declinar y cualquier disposición para facilitación externa.
      placeholders:
        - Rol de facilitador por defecto según el Registro de Roles.
        - Regla cuando el facilitador es parte — selección de un sustituto neutral.
        - >-
          Derecho de cualquiera de las partes a declinar a un facilitador con conflicto de interés
          declarado.
        - Facilitación externa opcional por acuerdo mutuo.
    fr:
      title: Sélection et remplacement du facilitateur ou de la facilitatrice
      whyItMatters: >-
        Un·e facilitateur·rice impliqué·e dans le conflit — ou socialement aligné·e avec l'une des
        parties — ne peut pas conduire le processus équitablement, quelles que soient ses
        intentions. Nommer les règles de sélection et de remplacement dès le départ signifie que la
        partie concernée n'a pas à se battre pour obtenir une audience neutre alors qu'elle est déjà
        sous pression.
      whatToDefine: >-
        Indique le rôle de facilitateur·rice par défaut, la règle lorsque le facilitateur ou la
        facilitatrice est partie au conflit, le droit de récusation et toute disposition pour une
        facilitation externe.
      placeholders:
        - Rôle de facilitateur·rice par défaut selon le Registre des rôles.
        - >-
          Règle lorsque le facilitateur ou la facilitatrice est partie au conflit — sélection d'un·e
          remplaçant·e neutre.
        - >-
          Droit de chaque partie de récuser un·e facilitateur·rice en cas de conflit d'intérêts
          déclaré.
        - Facilitation externe optionnelle par accord mutuel.
    pt-br:
      title: Seleção e Substituição de Facilitador
      whyItMatters: >-
        Um facilitador implicado no conflito — ou socialmente alinhado a uma das partes — não
        consegue conduzir o processo de forma justa, por melhores que sejam suas intenções. Definir
        regras de seleção e substituição com antecedência significa que a parte afetada não precisa
        lutar por uma escuta neutra enquanto já está sob estresse.
      whatToDefine: >-
        Indique o papel padrão do facilitador, a regra quando o facilitador é uma das partes, o
        direito de recusa e qualquer previsão de facilitação externa.
      placeholders:
        - Papel padrão do facilitador conforme o Registro de Papéis.
        - Regra quando o facilitador é uma das partes — seleção de um substituto neutro.
        - >-
          Direito de qualquer das partes de recusar um facilitador com conflito de interesse
          declarado.
        - Facilitação externa opcional mediante acordo mútuo.
  ownsClauses: []
- key: conflict-resolution-ladder.privacy-and-information-access-boundaries
  artifact: conflict-resolution-ladder
  order: 4
  clauseRefs:
    - 6.5.3
  i18n:
    en:
      title: Privacy and Information Access Boundaries
      whyItMatters: >-
        Conflict records contain the most sensitive material the community holds. Leaks, gossip, or
        casual disclosure cause second-order harm and deter future reporting. Explicit boundaries —
        what stays with the parties, what reaches Full Members, and when records are destroyed —
        make confidentiality enforceable rather than aspirational.
      whatToDefine: >-
        State which steps are fully confidential, what minimum information may be disclosed at the
        governance step, the retention period, and the non-disclosure obligation.
      placeholders:
        - 'Steps 1–4: fully confidential; only parties and Facilitator may access records.'
        - >-
          Steps 5–6: minimum necessary information disclosed to Full Members; parties notified
          before disclosure. Define what "minimum necessary" means.
        - 'Record retention: who holds records, for how long, then destroyed.'
        - >-
          Non-disclosure: no participant may share information about the process outside the defined
          participants without written consent of all parties.
    de:
      title: Datenschutz und Informationszugangsgrenzen
      whyItMatters: >-
        Konfliktakten enthalten das sensibelste Material, über das die Gemeinschaft verfügt.
        Durchsickern, Klatsch oder beiläufige Weitergabe verursachen Folgeschäden und schrecken vor
        zukünftigen Meldungen ab. Explizite Grenzen — was bei den Parteien bleibt, was die
        Vollmitglieder erfahren und wann Akten vernichtet werden — machen Vertraulichkeit
        durchsetzbar statt nur wünschenswert.
      whatToDefine: >-
        Lege fest, welche Stufen vollständig vertraulich sind, welche Mindestinformationen in der
        Governance-Stufe offengelegt werden dürfen, die Aufbewahrungsfrist und die
        Verschwiegenheitspflicht.
      placeholders:
        - >-
          Stufen 1–4: vollständig vertraulich; nur Parteien und Moderation haben Zugang zu den
          Akten.
        - >-
          Stufen 5–6: minimalnotwendige Informationen werden den Vollmitgliedern offengelegt;
          Parteien werden vor der Offenlegung benachrichtigt. Definiere, was „minimalnotwendig"
          bedeutet.
        - 'Aufbewahrung: wer die Akten verwahrt, für wie lange, danach Vernichtung.'
        - >-
          Verschwiegenheit: kein*e Teilnehmer*in darf Informationen über den Prozess ausserhalb der
          definierten Beteiligten ohne schriftliche Zustimmung aller Parteien weitergeben.
    es:
      title: Privacidad y Límites de Acceso a la Información
      whyItMatters: >-
        Los registros de conflictos contienen el material más sensible que posee la comunidad. Las
        filtraciones, los rumores o la divulgación casual causan daño de segundo orden y disuaden
        futuras denuncias. Límites explícitos — qué permanece con las partes, qué llega a los
        Miembros Plenos y cuándo se destruyen los registros — hacen que la confidencialidad sea
        exigible en lugar de aspiracional.
      whatToDefine: >-
        Indica qué pasos son completamente confidenciales, qué información mínima puede divulgarse
        en el paso de gobernanza, el período de retención y la obligación de no divulgación.
      placeholders:
        - >-
          Pasos 1–4: completamente confidenciales; solo las partes y el Facilitador pueden acceder a
          los registros.
        - >-
          Pasos 5–6: información mínima necesaria divulgada a los Miembros Plenos; las partes son
          notificadas antes de la divulgación. Definir qué significa "mínimo necesario".
        - >-
          Retención de registros: quién conserva los registros, por cuánto tiempo, y luego se
          destruyen.
        - >-
          No divulgación: ningún participante puede compartir información sobre el proceso fuera de
          los participantes definidos sin el consentimiento escrito de todas las partes.
    fr:
      title: Vie privée et limites d'accès à l'information
      whyItMatters: >-
        Les dossiers de conflit contiennent les informations les plus sensibles que la communauté
        détient. Les fuites, les commérages ou les divulgations informelles causent des préjudices
        secondaires et découragent les signalements futurs. Des limites explicites — ce qui reste
        entre les parties, ce qui parvient aux Membres Titulaires et quand les dossiers sont
        détruits — rendent la confidentialité exécutoire plutôt qu'aspirationnelle.
      whatToDefine: >-
        Indique quelles étapes sont entièrement confidentielles, quelles informations minimales
        peuvent être divulguées à l'étape de gouvernance, la durée de conservation et l'obligation
        de non-divulgation.
      placeholders:
        - >-
          Étapes 1–4 : entièrement confidentielles ; seules les parties et le facilitateur ou la
          facilitatrice peuvent accéder aux dossiers.
        - >-
          Étapes 5–6 : information minimale nécessaire divulguée aux Membres Titulaires ; les
          parties sont notifiées avant la divulgation. Définis ce que signifie « minimale nécessaire
          ».
        - >-
          Conservation des dossiers : qui détient les dossiers, pendant combien de temps, puis
          destruction.
        - >-
          Non-divulgation : aucun·e participant·e ne peut partager d'informations sur le processus
          en dehors des participant·e·s défini·e·s sans le consentement écrit de toutes les parties.
    pt-br:
      title: Limites de Privacidade e Acesso à Informação
      whyItMatters: >-
        Os registros de conflito contêm o material mais sensível que a comunidade guarda.
        Vazamentos, fofocas ou divulgações casuais causam danos de segunda ordem e desencorajam
        relatos futuros. Limites explícitos — o que permanece com as partes, o que chega aos Membros
        Plenos e quando os registros são destruídos — tornam a confidencialidade exigível, e não
        meramente aspiracional.
      whatToDefine: >-
        Indique quais passos são totalmente confidenciais, qual a informação mínima que pode ser
        divulgada na etapa de governança, o período de retenção e a obrigação de não divulgação.
      placeholders:
        - >-
          Passos 1–4: totalmente confidenciais; apenas as partes e o Facilitador podem acessar os
          registros.
        - >-
          Passos 5–6: informação mínima necessária divulgada aos Membros Plenos; partes notificadas
          antes da divulgação. Defina o que significa "mínima necessária".
        - >-
          Retenção de registros: quem guarda os registros, por quanto tempo, e quando são
          destruídos.
        - >-
          Não divulgação: nenhum participante pode compartilhar informações sobre o processo fora
          dos participantes definidos sem o consentimento escrito de todas as partes.
  ownsClauses: []
- key: conflict-resolution-ladder.safeguards
  artifact: conflict-resolution-ladder
  order: 5
  clauseRefs:
    - 6.3.1
    - 6.3.2
    - 6.3.3
    - 6.3.4
    - 6.3.5
    - 6.6.2
  i18n:
    en:
      title: Safeguards
      whyItMatters: >-
        Process alone does not protect the party with less power. Retaliation, bad-faith complaints,
        conflicted facilitators, and unreviewed safety risks can all neutralize an otherwise good
        procedure. Safeguards are the backstops that keep the ladder functional when incentives push
        against honest reporting.
      whatToDefine: >-
        For each safeguard, state the rule and the consequence when it is violated.
        Power-differential cases need their own intake channel.
      placeholders:
        - >-
          retaliation against a member raising a conflict in good faith is itself grounds for an
          accountability process.
        - >-
          deliberately false complaints may trigger an accountability process against the
          complainant.
        - see Facilitator Selection and Replacement.
        - either party may pause once for up to X days by written notice.
        - facilitator may recommend a temporary access restriction pending review; review window.
        - >-
          where a power differential exists, the affected member may submit intake directly to a
          body other than the standard Facilitator.
        - >-
          Full Members may temporarily suspend a role holder's delegated authority during review
          without constituting forced exit.
    de:
      title: Schutzmassnahmen
      whyItMatters: >-
        Ein Prozess allein schützt nicht die Partei mit weniger Macht. Vergeltung, böswillige
        Beschwerden, befangene Moderation und ungeprüfte Sicherheitsrisiken können ein ansonsten
        gutes Verfahren aushebeln. Schutzmassnahmen sind die Sicherheitsnetze, die die Leiter
        funktionsfähig halten, wenn Anreize gegen ehrliche Meldungen wirken.
      whatToDefine: >-
        Lege für jede Schutzmassnahme die Regel und die Konsequenz bei Verstoss fest. Fälle mit
        Machtgefälle benötigen einen eigenen Eingangskanal.
      placeholders:
        - >-
          Vergeltung gegen ein Mitglied, das in gutem Glauben einen Konflikt meldet, ist selbst
          Grund für ein Rechenschaftsverfahren.
        - >-
          Vorsätzlich falsche Beschwerden können ein Rechenschaftsverfahren gegen die
          beschwerdeführende Person auslösen.
        - siehe Auswahl und Ersetzung der Moderation.
        - >-
          Jede Partei darf den Prozess einmal für bis zu X Tage per schriftlicher Mitteilung
          pausieren.
        - >-
          Die Moderation darf eine vorübergehende Zugangsbeschränkung bis zur Überprüfung empfehlen;
          Überprüfungsfenster.
        - >-
          Wenn ein Machtgefälle besteht, darf das betroffene Mitglied die Eingabe direkt an ein
          anderes Gremium als die standardmässige Moderation richten.
        - >-
          Vollmitglieder dürfen die delegierte Autorität einer Rolleninhaberin oder eines
          Rolleninhabers während der Überprüfung vorübergehend aussetzen, ohne dass dies einen
          erzwungenen Austritt darstellt.
    es:
      title: Salvaguardas
      whyItMatters: >-
        El proceso por sí solo no protege a la parte con menos poder. Las represalias, las quejas de
        mala fe, los facilitadores con conflictos de interés y los riesgos de seguridad no revisados
        pueden neutralizar un procedimiento que de otro modo sería bueno. Las salvaguardas son los
        mecanismos de respaldo que mantienen la escalera funcional cuando los incentivos empujan en
        contra de la denuncia honesta.
      whatToDefine: >-
        Para cada salvaguarda, establece la regla y la consecuencia cuando se viola. Los casos con
        diferencial de poder necesitan su propio canal de admisión.
      placeholders:
        - >-
          las represalias contra un miembro que plantea un conflicto de buena fe son en sí mismas
          motivo para un proceso de rendición de cuentas.
        - >-
          las quejas deliberadamente falsas pueden desencadenar un proceso de rendición de cuentas
          contra el denunciante.
        - ver Selección y Sustitución del Facilitador.
        - cualquiera de las partes puede pausar una vez por hasta X días mediante aviso escrito.
        - >-
          el facilitador puede recomendar una restricción temporal de acceso pendiente de revisión;
          ventana de revisión.
        - >-
          cuando existe un diferencial de poder, el miembro afectado puede presentar la admisión
          directamente a un órgano distinto al Facilitador estándar.
        - >-
          los Miembros Plenos pueden suspender temporalmente la autoridad delegada de un titular de
          rol durante la revisión sin que esto constituya una salida forzada.
    fr:
      title: Garde-fous
      whyItMatters: >-
        Le processus seul ne protège pas la partie ayant le moins de pouvoir. Les représailles, les
        plaintes de mauvaise foi, les facilitateur·rice·s en conflit d'intérêts et les risques de
        sécurité non examinés peuvent tous neutraliser une procédure par ailleurs bien conçue. Les
        garde-fous sont les filets de sécurité qui maintiennent l'échelle fonctionnelle lorsque les
        incitations poussent contre un signalement honnête.
      whatToDefine: >-
        Pour chaque garde-fou, indique la règle et la conséquence en cas de violation. Les
        situations avec différentiel de pouvoir nécessitent leur propre canal de prise en charge.
      placeholders:
        - >-
          les représailles contre un membre soulevant un conflit de bonne foi constituent
          elles-mêmes un motif de processus de responsabilité.
        - >-
          les plaintes délibérément fausses peuvent déclencher un processus de responsabilité contre
          le ou la plaignant·e.
        - voir Sélection et remplacement du facilitateur ou de la facilitatrice.
        - >-
          chaque partie peut suspendre une fois pour une durée maximale de X jours par notification
          écrite.
        - >-
          le facilitateur ou la facilitatrice peut recommander une restriction d'accès temporaire en
          attendant l'examen ; délai d'examen.
        - >-
          lorsqu'un différentiel de pouvoir existe, le membre concerné peut soumettre sa prise en
          charge directement à une instance autre que le facilitateur ou la facilitatrice
          habituel·le.
        - >-
          les Membres Titulaires peuvent suspendre temporairement l'autorité déléguée d'un·e
          titulaire de rôle pendant l'examen sans que cela constitue une exclusion forcée.
    pt-br:
      title: Salvaguardas
      whyItMatters: >-
        Processo, por si só, não protege a parte com menos poder. Retaliação, denúncias de má-fé,
        facilitadores em conflito de interesse e riscos de segurança não revisados podem neutralizar
        até mesmo um bom procedimento. As salvaguardas são as redes de proteção que mantêm a escada
        funcional quando os incentivos atuam contra o relato honesto.
      whatToDefine: >-
        Para cada salvaguarda, indique a regra e a consequência quando ela é violada. Casos com
        diferencial de poder precisam de seu próprio canal de abertura.
      placeholders:
        - >-
          retaliação contra um membro que levanta um conflito de boa-fé é, em si, motivo para um
          processo de responsabilização.
        - >-
          denúncias deliberadamente falsas podem desencadear um processo de responsabilização contra
          o denunciante.
        - ver Seleção e Substituição de Facilitador.
        - qualquer das partes pode pausar uma vez por até X dias mediante aviso escrito.
        - >-
          o facilitador pode recomendar uma restrição temporária de acesso aguardando revisão; prazo
          de revisão.
        - >-
          quando há um diferencial de poder, o membro afetado pode submeter a abertura diretamente a
          um órgão diferente do Facilitador padrão.
        - >-
          os Membros Plenos podem suspender temporariamente a autoridade delegada de um detentor de
          papel durante a revisão, sem que isso constitua saída forçada.
  ownsClauses:
    - 6.3.1
    - 6.3.3
    - 6.3.4
    - 6.3.5
    - 6.6.2

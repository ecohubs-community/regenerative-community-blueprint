- key: change-protocol.how-changes-are-proposed
  artifact: change-protocol
  order: 0
  clauseRefs:
    - 8.1.1
    - 8.1.3
    - 8.6.3
    - 8.8.1
  i18n:
    en:
      title: How Changes Are Proposed
      whyItMatters: >-
        A change that arrives as a vague idea in chat cannot be evaluated, challenged, or rolled
        back later. Forcing every proposal through the same minimum shape — affected artifacts,
        rationale, risks, rollback — turns an opinion into a reviewable artifact and makes it
        impossible to slip a rule change past the community by accident.
      whatToDefine: >-
        State who may propose, where proposals are submitted, and the mandatory content fields. Tie
        this to the Governance Protocol (Layer 2).
      placeholders:
        - Any Full Member may propose a change to any RCOS artifact. State the submission channel.
        - Summary of the change.
        - Affected layers and artifacts (with links).
        - Decision type (Operational / Strategic / Constitutional).
        - Rationale.
        - Risks and mitigations.
        - Rollback plan.
        - Proposed effective date.
    de:
      title: Wie Änderungen vorgeschlagen werden
      whyItMatters: >-
        Eine Änderung, die als vage Idee im Chat auftaucht, kann nicht bewertet, angefochten oder
        später zurückgenommen werden. Indem jeder Vorschlag durch dieselbe Mindestform geleitet wird
        — betroffene Artefakte, Begründung, Risiken, Rücknahmeplan — wird eine Meinung zu einem
        überprüfbaren Artefakt, und es wird unmöglich, eine Regeländerung versehentlich an der
        Gemeinschaft vorbeizuschleusen.
      whatToDefine: >-
        Legt fest, wer vorschlagen darf, wo Vorschläge eingereicht werden und welche Pflichtfelder
        sie enthalten müssen. Verknüpft dies mit dem Governance-Protokoll (Schicht 2).
      placeholders:
        - >-
          Jedes Vollmitglied darf eine Änderung an jedem RCOS-Artefakt vorschlagen. Gebt den
          Einreichungskanal an.
        - Zusammenfassung der Änderung.
        - Betroffene Schichten und Artefakte (mit Links).
        - Entscheidungstyp (Operativ / Strategisch / Konstitutionell).
        - Begründung.
        - Risiken und Gegenmaßnahmen.
        - Rücknahmeplan.
        - Vorgeschlagenes Inkrafttreten.
    es:
      title: Cómo se proponen los cambios
      whyItMatters: >-
        Un cambio que llega como una idea vaga en un chat no puede ser evaluado, cuestionado ni
        revertido después. Obligar a que cada propuesta pase por una forma mínima común —artefactos
        afectados, justificación, riesgos, plan de reversión— convierte una opinión en un artefacto
        revisable y hace imposible colar un cambio de reglas sin que la comunidad se dé cuenta.
      whatToDefine: >-
        Indica quién puede proponer, dónde se envían las propuestas y los campos de contenido
        obligatorios. Vincúlalo con el Protocolo de Gobernanza (Capa 2).
      placeholders:
        - >-
          Cualquier Miembro Pleno puede proponer un cambio a cualquier artefacto RCOS. Indica el
          canal de envío.
        - Resumen del cambio.
        - Capas y artefactos afectados (con enlaces).
        - Tipo de decisión (Operativa / Estratégica / Constitucional).
        - Justificación.
        - Riesgos y mitigaciones.
        - Plan de reversión.
        - Fecha de entrada en vigor propuesta.
    fr:
      title: Comment les changements sont proposés
      whyItMatters: >-
        Un changement qui arrive sous forme d'idée vague dans une discussion ne peut être ni évalué,
        ni contesté, ni annulé par la suite. Imposer à chaque proposition la même structure minimale
        — artefacts concernés, justification, risques, retour en arrière — transforme une opinion en
        artefact vérifiable et rend impossible de faire passer un changement de règle inaperçu au
        sein de la communauté.
      whatToDefine: >-
        Indique qui peut proposer, où les propositions sont soumises et quels champs de contenu sont
        obligatoires. Relie ceci au Protocole de gouvernance (Couche 2).
      placeholders:
        - >-
          Tout Membre de plein droit peut proposer un changement à tout artefact RCOS. Indique le
          canal de soumission.
        - Résumé du changement.
        - Couches et artefacts concernés (avec liens).
        - Type de décision (Opérationnel / Stratégique / Constitutionnel).
        - Justification.
        - Risques et mesures d'atténuation.
        - Plan de retour en arrière.
        - Date d'entrée en vigueur proposée.
    pt-br:
      title: Como as Mudanças São Propostas
      whyItMatters: >-
        Uma mudança que chega como uma ideia vaga no chat não pode ser avaliada, questionada ou
        revertida mais tarde. Forçar toda proposta a passar pelo mesmo formato mínimo — artefatos
        afetados, justificativa, riscos, reversão — transforma uma opinião em um artefato revisável
        e torna impossível passar uma mudança de regra pela comunidade por acidente.
      whatToDefine: >-
        Declare quem pode propor, onde as propostas são submetidas e os campos de conteúdo
        obrigatórios. Conecte isso ao Protocolo de Governança (Camada 2).
      placeholders:
        - >-
          Qualquer Membro Pleno pode propor uma mudança em qualquer artefato RCOS. Declare o canal
          de submissão.
        - Resumo da mudança.
        - Camadas e artefatos afetados (com links).
        - Tipo de decisão (Operacional / Estratégica / Constitucional).
        - Justificativa.
        - Riscos e mitigações.
        - Plano de reversão.
        - Data de vigência proposta.
  ownsClauses:
    - 8.1.1
    - 8.1.3
    - 8.6.3
    - 8.8.1
- key: change-protocol.how-proposals-are-classified
  artifact: change-protocol
  order: 1
  clauseRefs:
    - 8.1.2
    - 8.1.4
  i18n:
    en:
      title: How Proposals Are Classified
      whyItMatters: >-
        Not every change deserves the same friction. Typo fixes should not need a supermajority;
        constitutional shifts should not pass quietly. Mapping proposals to decision types — and
        defaulting unclear cases upward — makes the cost of a change proportional to its blast
        radius and protects Layer 0 from being eroded through small moves.
      whatToDefine: >-
        Define what falls under each decision type. State the default-higher rule for ambiguous
        cases.
      placeholders:
        - >-
          wording corrections, formatting, minor content updates; no vote required; executed by the
          responsible role within delegated limits.
        - changes to Layer 1–5 content that affect member rights, processes, or structures.
        - >-
          changes to Layer 0 (purpose, scope, invariants) or to the governance system itself (Layer
          2).
    de:
      title: Wie Vorschläge klassifiziert werden
      whyItMatters: >-
        Nicht jede Änderung verdient denselben Aufwand. Tippfehlerkorrekturen sollten keine
        Supermehrheit erfordern; verfassungsändernde Eingriffe sollten nicht still und leise
        durchgehen. Indem Vorschläge Entscheidungstypen zugeordnet werden — und unklare Fälle
        standardmäßig nach oben gestuft werden — wird der Aufwand einer Änderung proportional zu
        ihrem Wirkungsradius, und Schicht 0 wird davor geschützt, durch kleine Schritte ausgehöhlt
        zu werden.
      whatToDefine: >-
        Definiert, was unter jeden Entscheidungstyp fällt. Legt die Regel fest, dass unklare Fälle
        in die höhere Kategorie eingestuft werden.
      placeholders:
        - >-
          Formulierungskorrekturen, Formatierung, kleinere inhaltliche Aktualisierungen; keine
          Abstimmung erforderlich; wird von der zuständigen Rolle im Rahmen delegierter Befugnisse
          umgesetzt.
        - >-
          Änderungen an Inhalten der Schichten 1–5, die Mitgliedsrechte, Prozesse oder Strukturen
          betreffen.
        - >-
          Änderungen an Schicht 0 (Zweck, Geltungsbereich, Invarianten) oder am Governance-System
          selbst (Schicht 2).
    es:
      title: Cómo se clasifican las propuestas
      whyItMatters: >-
        No todos los cambios merecen la misma fricción. Las correcciones de erratas no deberían
        necesitar una supermayoría; los cambios constitucionales no deberían aprobarse en silencio.
        Asignar las propuestas a tipos de decisión —y elevar por defecto los casos ambiguos— hace
        que el coste de un cambio sea proporcional a su radio de impacto y protege la Capa 0 de ser
        erosionada mediante movimientos pequeños.
      whatToDefine: >-
        Define qué entra en cada tipo de decisión. Indica la regla de elevación por defecto para
        casos ambiguos.
      placeholders:
        - >-
          correcciones de redacción, formato, actualizaciones menores de contenido; sin votación
          requerida; ejecutada por el rol responsable dentro de los límites delegados.
        - >-
          cambios en el contenido de las Capas 1–5 que afectan derechos de miembros, procesos o
          estructuras.
        - >-
          cambios en la Capa 0 (propósito, alcance, invariantes) o en el propio sistema de
          gobernanza (Capa 2).
    fr:
      title: Comment les propositions sont classifiées
      whyItMatters: >-
        Tous les changements ne méritent pas le même niveau de friction. Les corrections de
        coquilles ne devraient pas nécessiter une supermajorité ; les changements constitutionnels
        ne devraient pas passer en silence. Associer les propositions aux types de décision — et
        classer par défaut les cas ambigus vers le type supérieur — rend le coût d'un changement
        proportionnel à sa portée et protège la Couche 0 contre l'érosion par petites touches.
      whatToDefine: >-
        Définis ce qui relève de chaque type de décision. Indique la règle de classification par
        défaut vers le type supérieur pour les cas ambigus.
      placeholders:
        - >-
          corrections de formulation, mise en forme, mises à jour mineures de contenu ; aucun vote
          requis ; exécuté par le rôle responsable dans les limites de sa délégation.
        - >-
          changements du contenu des Couches 1 à 5 qui affectent les droits des membres, les
          processus ou les structures.
        - >-
          changements de la Couche 0 (raison d'être, périmètre, invariants) ou du système de
          gouvernance lui-même (Couche 2).
    pt-br:
      title: Como as Propostas São Classificadas
      whyItMatters: >-
        Nem toda mudança merece a mesma fricção. Correções de erros de digitação não deveriam exigir
        uma supermaioria; mudanças constitucionais não deveriam passar silenciosamente. Mapear
        propostas para tipos de decisão — e elevar casos ambíguos por padrão — torna o custo de uma
        mudança proporcional ao seu raio de impacto e protege a Camada 0 de ser erodida por pequenos
        movimentos.
      whatToDefine: >-
        Defina o que se enquadra em cada tipo de decisão. Declare a regra de elevação padrão para
        casos ambíguos.
      placeholders:
        - >-
          correções de redação, formatação, atualizações menores de conteúdo; não exige votação;
          executada pelo papel responsável dentro dos limites delegados.
        - >-
          mudanças no conteúdo das Camadas 1–5 que afetam direitos, processos ou estruturas dos
          membros.
        - >-
          mudanças na Camada 0 (propósito, escopo, invariantes) ou no próprio sistema de governança
          (Camada 2).
  ownsClauses:
    - 8.1.2
    - 8.1.4
- key: change-protocol.review-and-deliberation
  artifact: change-protocol
  order: 2
  clauseRefs:
    - 8.1.2
    - 8.7.1
  i18n:
    en:
      title: Review and Deliberation
      whyItMatters: >-
        Without a floor on deliberation time, any change can be rushed through on a slow day when
        few members are paying attention. Mandatory minimums — longer for higher-impact changes —
        guarantee that members who are travelling, ill, or simply busy still get a real chance to
        read, object, or show up.
      whatToDefine: >-
        Set minimum deliberation periods for each decision type, and a ratification period for
        Constitutional changes.
      placeholders:
        - no deliberation required.
        - minimum X-day deliberation; deliberation venue.
        - minimum Y-day deliberation; Z-day ratification period after the vote passes.
    de:
      title: Prüfung und Beratung
      whyItMatters: >-
        Ohne eine Mindestberatungszeit kann jede Änderung an einem ruhigen Tag durchgepeitscht
        werden, wenn nur wenige Mitglieder aufpassen. Verbindliche Mindestfristen — länger bei
        größerer Tragweite — garantieren, dass Mitglieder, die verreist, krank oder einfach
        beschäftigt sind, eine echte Chance bekommen, zu lesen, Einwände zu erheben oder
        teilzunehmen.
      whatToDefine: >-
        Legt Mindestberatungsfristen für jeden Entscheidungstyp fest sowie eine Ratifizierungsfrist
        für konstitutionelle Änderungen.
      placeholders:
        - Keine Beratung erforderlich.
        - Mindestens X Tage Beratung; Beratungsort.
        - Mindestens Y Tage Beratung; Z Tage Ratifizierungsfrist nach erfolgreicher Abstimmung.
    es:
      title: Revisión y deliberación
      whyItMatters: >-
        Sin un mínimo de tiempo de deliberación, cualquier cambio puede aprobarse de forma
        apresurada en un día tranquilo cuando pocos miembros están prestando atención. Los mínimos
        obligatorios —más largos para cambios de mayor impacto— garantizan que los miembros que
        están viajando, enfermos o simplemente ocupados tengan una oportunidad real de leer, objetar
        o participar.
      whatToDefine: >-
        Establece periodos mínimos de deliberación para cada tipo de decisión y un periodo de
        ratificación para los cambios Constitucionales.
      placeholders:
        - sin deliberación requerida.
        - mínimo X días de deliberación; lugar de deliberación.
        - >-
          mínimo Y días de deliberación; Z días de periodo de ratificación tras la aprobación de la
          votación.
    fr:
      title: Examen et délibération
      whyItMatters: >-
        Sans durée minimale de délibération, tout changement peut être adopté à la hâte un jour
        calme où peu de membres sont attentifs. Des minimums obligatoires — plus longs pour les
        changements à fort impact — garantissent que les membres en déplacement, malades ou
        simplement occupés disposent d'une vraie chance de lire, d'objecter ou de se manifester.
      whatToDefine: >-
        Définis les périodes minimales de délibération pour chaque type de décision, ainsi qu'une
        période de ratification pour les changements constitutionnels.
      placeholders:
        - aucune délibération requise.
        - délibération minimale de X jours ; lieu de délibération.
        - >-
          délibération minimale de Y jours ; période de ratification de Z jours après l'adoption du
          vote.
    pt-br:
      title: Revisão e Deliberação
      whyItMatters: >-
        Sem um piso para o tempo de deliberação, qualquer mudança pode ser apressada em um dia
        tranquilo em que poucos membros estão prestando atenção. Mínimos obrigatórios — mais longos
        para mudanças de maior impacto — garantem que membros que estejam viajando, doentes ou
        simplesmente ocupados ainda tenham uma chance real de ler, objetar ou aparecer.
      whatToDefine: >-
        Defina períodos mínimos de deliberação para cada tipo de decisão e um período de ratificação
        para mudanças Constitucionais.
      placeholders:
        - não exige deliberação.
        - deliberação mínima de X dias; espaço de deliberação.
        - >-
          deliberação mínima de Y dias; período de ratificação de Z dias após a aprovação da
          votação.
  ownsClauses:
    - 8.7.1
- key: change-protocol.adoption-and-publication
  artifact: change-protocol
  order: 3
  clauseRefs:
    - 8.2.1
    - 8.2.2
    - 8.2.5
    - 8.6.3
  i18n:
    en:
      title: Adoption and Publication
      whyItMatters: >-
        A vote that passes but is never written down is the same as no vote at all — and worse, it
        creates a gap where whoever remembers the outcome gets to define it. Tight, ordered
        publication steps close that gap and make "what was adopted" a matter of record, not of
        memory.
      whatToDefine: >-
        State the ordered steps that must run after a proposal passes. Include time bounds and the
        version-history obligation.
      placeholders:
        - Proposal file moved to the passed-proposals archive within X days.
        - Affected artifacts updated within X days.
        - Version history entry added.
        - Status fields updated on affected artifacts.
    de:
      title: Annahme und Veröffentlichung
      whyItMatters: >-
        Eine Abstimmung, die bestanden wird, aber nie schriftlich festgehalten wird, ist so gut wie
        keine Abstimmung — und schlimmer noch, sie schafft eine Lücke, in der derjenige, der sich an
        das Ergebnis erinnert, es definieren darf. Strikte, geordnete Veröffentlichungsschritte
        schließen diese Lücke und machen „was wurde beschlossen" zu einer Frage der Akten, nicht des
        Gedächtnisses.
      whatToDefine: >-
        Legt die geordneten Schritte fest, die nach Annahme eines Vorschlags durchlaufen werden
        müssen. Gebt Fristen und die Versionsverlaufspflicht an.
      placeholders:
        - >-
          Vorschlagsdatei wird innerhalb von X Tagen ins Archiv für angenommene Vorschläge
          verschoben.
        - Betroffene Artefakte werden innerhalb von X Tagen aktualisiert.
        - Eintrag im Versionsverlauf wird hinzugefügt.
        - Statusfelder der betroffenen Artefakte werden aktualisiert.
    es:
      title: Adopción y publicación
      whyItMatters: >-
        Una votación que se aprueba pero nunca se registra por escrito es lo mismo que ninguna
        votación — y peor, crea un vacío donde quien recuerde el resultado puede definirlo a su
        manera. Unos pasos de publicación estrictos y ordenados cierran ese vacío y convierten el
        "qué se adoptó" en una cuestión de registro, no de memoria.
      whatToDefine: >-
        Indica los pasos ordenados que DEBEN ejecutarse después de que una propuesta sea aprobada.
        Incluye plazos y la obligación de historial de versiones.
      placeholders:
        - >-
          El archivo de la propuesta se mueve al archivo de propuestas aprobadas en un plazo de X
          días.
        - Los artefactos afectados se actualizan en un plazo de X días.
        - Se añade una entrada en el historial de versiones.
        - Se actualizan los campos de estado en los artefactos afectados.
    fr:
      title: Adoption et publication
      whyItMatters: >-
        Un vote qui passe mais n'est jamais consigné par écrit équivaut à une absence de vote — et
        pire, il crée un vide où quiconque se souvient du résultat peut le définir à sa guise. Des
        étapes de publication rigoureuses et ordonnées comblent ce vide et font de « ce qui a été
        adopté » une question d'archive, non de mémoire.
      whatToDefine: >-
        Indique les étapes ordonnées qui doivent être exécutées après l'adoption d'une proposition.
        Inclus les délais et l'obligation de maintenir un historique des versions.
      placeholders:
        - >-
          Fichier de proposition déplacé vers l'archive des propositions adoptées dans un délai de X
          jours.
        - Artefacts concernés mis à jour dans un délai de X jours.
        - Entrée ajoutée à l'historique des versions.
        - Champs de statut mis à jour sur les artefacts concernés.
    pt-br:
      title: Adoção e Publicação
      whyItMatters: >-
        Uma votação que passa mas nunca é registrada é o mesmo que nenhuma votação — e pior, cria
        uma lacuna em que quem se lembra do resultado é quem o define. Etapas de publicação rígidas
        e ordenadas fecham essa lacuna e tornam "o que foi adotado" uma questão de registro, não de
        memória.
      whatToDefine: >-
        Declare as etapas ordenadas que devem ocorrer após a aprovação de uma proposta. Inclua
        limites de tempo e a obrigação de histórico de versões.
      placeholders:
        - Arquivo da proposta movido para o arquivo de propostas aprovadas em até X dias.
        - Artefatos afetados atualizados em até X dias.
        - Entrada de histórico de versão adicionada.
        - Campos de status atualizados nos artefatos afetados.
  ownsClauses:
    - 8.2.5
- key: change-protocol.rejection
  artifact: change-protocol
  order: 4
  clauseRefs:
    - 8.2.2
    - 8.2.4
  i18n:
    en:
      title: Rejection
      whyItMatters: >-
        Rejected ideas carry as much signal as accepted ones — they show what the community
        considered and declined. Keeping rejections filed and accessible prevents the same proposal
        from reappearing under a new name every six months and gives future members a view of the
        paths not taken.
      whatToDefine: >-
        State the archive location for rejected proposals and the re-vote conditions for revisiting
        the question.
      placeholders:
        - Proposal file moved to the rejected-proposals archive within X days.
        - No artifact changes made.
        - Re-vote mechanism applies if new information emerges (per the Decision Matrix, Layer 2).
    de:
      title: Ablehnung
      whyItMatters: >-
        Abgelehnte Ideen sind ebenso aufschlussreich wie angenommene — sie zeigen, was die
        Gemeinschaft in Betracht gezogen und verworfen hat. Das Aufbewahren und Zugänglichmachen von
        Ablehnungen verhindert, dass derselbe Vorschlag alle sechs Monate unter neuem Namen wieder
        auftaucht, und gibt zukünftigen Mitgliedern einen Blick auf die nicht eingeschlagenen Wege.
      whatToDefine: >-
        Gebt den Archivort für abgelehnte Vorschläge und die Bedingungen für eine erneute Abstimmung
        an.
      placeholders:
        - >-
          Vorschlagsdatei wird innerhalb von X Tagen ins Archiv für abgelehnte Vorschläge
          verschoben.
        - Keine Artefaktänderungen werden vorgenommen.
        - >-
          Mechanismus zur erneuten Abstimmung greift, wenn neue Informationen vorliegen (gemäß der
          Entscheidungsmatrix, Schicht 2).
    es:
      title: Rechazo
      whyItMatters: >-
        Las ideas rechazadas aportan tanta información como las aceptadas — muestran lo que la
        comunidad consideró y declinó. Mantener los rechazos archivados y accesibles evita que la
        misma propuesta reaparezca con un nombre nuevo cada seis meses y da a los futuros miembros
        una visión de los caminos no tomados.
      whatToDefine: >-
        Indica la ubicación del archivo de propuestas rechazadas y las condiciones de re-votación
        para revisitar la cuestión.
      placeholders:
        - >-
          El archivo de la propuesta se mueve al archivo de propuestas rechazadas en un plazo de X
          días.
        - No se realizan cambios en los artefactos.
        - >-
          Se aplica el mecanismo de re-votación si surge nueva información (según la Matriz de
          Decisión, Capa 2).
    fr:
      title: Rejet
      whyItMatters: >-
        Les idées rejetées portent autant de signal que celles acceptées — elles montrent ce que la
        communauté a examiné et refusé. Garder les rejets classés et accessibles empêche la même
        proposition de réapparaître sous un nouveau nom tous les six mois et offre aux futurs
        membres une vue des chemins non empruntés.
      whatToDefine: >-
        Indique l'emplacement de l'archive pour les propositions rejetées et les conditions de
        nouveau vote pour rouvrir la question.
      placeholders:
        - >-
          Fichier de proposition déplacé vers l'archive des propositions rejetées dans un délai de X
          jours.
        - Aucune modification d'artefact effectuée.
        - >-
          Le mécanisme de nouveau vote s'applique si de nouvelles informations émergent (selon la
          Matrice de décision, Couche 2).
    pt-br:
      title: Rejeição
      whyItMatters: >-
        Ideias rejeitadas carregam tanto sinal quanto as aceitas — elas mostram o que a comunidade
        considerou e recusou. Manter rejeições arquivadas e acessíveis impede que a mesma proposta
        reapareça com um novo nome a cada seis meses e dá aos futuros membros uma visão dos caminhos
        não trilhados.
      whatToDefine: >-
        Declare o local de arquivamento das propostas rejeitadas e as condições de nova votação para
        revisitar a questão.
      placeholders:
        - Arquivo da proposta movido para o arquivo de propostas rejeitadas em até X dias.
        - Nenhuma alteração em artefatos é feita.
        - >-
          O mecanismo de nova votação se aplica se surgirem novas informações (conforme a Matriz de
          Decisão, Camada 2).
  ownsClauses: []
- key: change-protocol.transition-and-migration
  artifact: change-protocol
  order: 5
  clauseRefs:
    - 8.5.1
    - 8.5.2
  i18n:
    en:
      title: Transition and Migration
      whyItMatters: >-
        If new rules could silently rewrite existing agreements, membership would be meaningless —
        what you signed up for could be changed out from under you. Explicit transition rules
        guarantee that rights are not reduced retroactively and that people operating under the old
        rules are given time and notice before the ground shifts.
      whatToDefine: >-
        State the rules protecting existing role holders, members, and records when a rule change
        takes effect.
      placeholders:
        - Existing role holders notified before the change takes effect.
        - Existing members' rights may not be reduced without consent or a Constitutional vote.
        - >-
          Records that predate the change are not retroactively altered unless explicitly part of
          the proposal.
        - A transition period may be defined in the proposal itself.
    de:
      title: Übergang und Migration
      whyItMatters: >-
        Wenn neue Regeln bestehende Vereinbarungen stillschweigend umschreiben könnten, wäre die
        Mitgliedschaft bedeutungslos — das, wofür ihr euch angemeldet habt, könnte unter euren Füßen
        geändert werden. Explizite Übergangsregeln garantieren, dass Rechte nicht rückwirkend
        eingeschränkt werden und dass Personen, die unter den alten Regeln arbeiten, Zeit und
        Vorankündigung erhalten, bevor sich die Grundlage ändert.
      whatToDefine: >-
        Legt die Regeln fest, die bestehende Rolleninhaber, Mitglieder und Aufzeichnungen schützen,
        wenn eine Regeländerung in Kraft tritt.
      placeholders:
        - Bestehende Rolleninhaber werden vor Inkrafttreten der Änderung benachrichtigt.
        - >-
          Bestehende Mitgliedsrechte dürfen nicht ohne Zustimmung oder eine konstitutionelle
          Abstimmung eingeschränkt werden.
        - >-
          Aufzeichnungen, die vor der Änderung entstanden sind, werden nicht rückwirkend geändert,
          es sei denn, dies ist ausdrücklich Teil des Vorschlags.
        - Eine Übergangsfrist kann im Vorschlag selbst festgelegt werden.
    es:
      title: Transición y migración
      whyItMatters: >-
        Si las nuevas reglas pudieran reescribir silenciosamente los acuerdos existentes, la
        membresía no tendría sentido — lo que firmaste podría cambiar sin que te enteres. Las reglas
        de transición explícitas garantizan que los derechos no se reduzcan retroactivamente y que
        las personas que operan bajo las reglas antiguas reciban tiempo y aviso antes de que el
        terreno cambie.
      whatToDefine: >-
        Indica las reglas que protegen a los titulares de roles existentes, miembros y registros
        cuando un cambio de regla entra en vigor.
      placeholders:
        - Los titulares de roles existentes son notificados antes de que el cambio entre en vigor.
        - >-
          Los derechos de los miembros existentes no pueden reducirse sin consentimiento o una
          votación Constitucional.
        - >-
          Los registros anteriores al cambio no se alteran retroactivamente a menos que sea parte
          explícita de la propuesta.
        - Se puede definir un periodo de transición en la propia propuesta.
    fr:
      title: Transition et migration
      whyItMatters: >-
        Si de nouvelles règles pouvaient réécrire silencieusement des accords existants, l'adhésion
        n'aurait aucun sens — ce à quoi tu as souscrit pourrait être modifié sans que tu t'en
        aperçoives. Des règles de transition explicites garantissent que les droits ne sont pas
        réduits rétroactivement et que les personnes opérant sous les anciennes règles disposent de
        temps et d'un préavis avant que le terrain ne change.
      whatToDefine: >-
        Indique les règles protégeant les titulaires de rôles existants, les membres et les
        registres lorsqu'un changement de règle prend effet.
      placeholders:
        - Les titulaires de rôles existants sont notifiés avant l'entrée en vigueur du changement.
        - >-
          Les droits des membres existants ne peuvent pas être réduits sans consentement ou vote
          constitutionnel.
        - >-
          Les registres antérieurs au changement ne sont pas modifiés rétroactivement, sauf si cela
          fait explicitement partie de la proposition.
        - Une période de transition peut être définie dans la proposition elle-même.
    pt-br:
      title: Transição e Migração
      whyItMatters: >-
        Se novas regras pudessem silenciosamente reescrever acordos existentes, a participação como
        membro perderia o sentido — aquilo com o que você se comprometeu poderia ser mudado por
        baixo dos panos. Regras explícitas de transição garantem que direitos não sejam reduzidos
        retroativamente e que pessoas operando sob as regras antigas tenham tempo e aviso antes que
        o terreno mude.
      whatToDefine: >-
        Declare as regras que protegem os atuais ocupantes de papéis, membros e registros quando uma
        mudança de regra entra em vigor.
      placeholders:
        - Os atuais ocupantes de papéis são notificados antes da mudança entrar em vigor.
        - >-
          Os direitos dos membros existentes não podem ser reduzidos sem consentimento ou uma
          votação Constitucional.
        - >-
          Registros anteriores à mudança não são alterados retroativamente, a menos que isso faça
          parte explícita da proposta.
        - Um período de transição pode ser definido na própria proposta.
  ownsClauses:
    - 8.5.2
- key: change-protocol.rollback
  artifact: change-protocol
  order: 6
  clauseRefs:
    - 8.1.5
    - 8.5.1
  i18n:
    en:
      title: Rollback
      whyItMatters: >-
        A change that cannot be undone through the same path that created it is a trap. Requiring
        rollback to use the original decision type keeps the door open for correction without
        letting a single member quietly reverse a community-level decision by calling it a "fix."
      whatToDefine: State that rollback uses the same decision type and process as the original adoption.
      placeholders:
        - >-
          Any passed decision can be reversed through the same process as the original. Any Full
          Member may trigger a re-vote by submitting a written reasoned objection that was not
          considered during the original deliberation. Rollback uses the same decision type as the
          original.
    de:
      title: Rücknahme
      whyItMatters: >-
        Eine Änderung, die nicht auf demselben Weg rückgängig gemacht werden kann, auf dem sie
        entstanden ist, ist eine Falle. Indem die Rücknahme denselben Entscheidungstyp verwenden
        muss, bleibt die Tür für Korrekturen offen, ohne dass ein einzelnes Mitglied eine
        Entscheidung auf Gemeinschaftsebene stillschweigend rückgängig machen kann, indem es sie als
        „Korrektur" bezeichnet.
      whatToDefine: >-
        Legt fest, dass die Rücknahme denselben Entscheidungstyp und denselben Prozess wie die
        ursprüngliche Annahme verwendet.
      placeholders:
        - >-
          Jede angenommene Entscheidung kann über denselben Prozess wie die ursprüngliche rückgängig
          gemacht werden. Jedes Vollmitglied kann eine erneute Abstimmung auslösen, indem es einen
          schriftlichen begründeten Einwand einreicht, der in der ursprünglichen Beratung nicht
          berücksichtigt wurde. Die Rücknahme verwendet denselben Entscheidungstyp wie das Original.
    es:
      title: Reversión
      whyItMatters: >-
        Un cambio que no puede deshacerse por el mismo camino que lo creó es una trampa. Exigir que
        la reversión use el mismo tipo de decisión original mantiene la puerta abierta a la
        corrección sin permitir que un solo miembro revierta en silencio una decisión comunitaria
        llamándola una "corrección."
      whatToDefine: >-
        Indica que la reversión utiliza el mismo tipo de decisión y proceso que la adopción
        original.
      placeholders:
        - >-
          Cualquier decisión aprobada puede revertirse mediante el mismo proceso que la original.
          Cualquier Miembro Pleno puede activar una re-votación presentando una objeción razonada
          por escrito que no fue considerada durante la deliberación original. La reversión utiliza
          el mismo tipo de decisión que la original.
    fr:
      title: Retour en arrière
      whyItMatters: >-
        Un changement qui ne peut pas être annulé par le même chemin qui l'a créé est un piège.
        Exiger que le retour en arrière utilise le même type de décision que l'original maintient la
        porte ouverte à la correction sans permettre à un seul membre d'inverser discrètement une
        décision communautaire en l'appelant une « correction ».
      whatToDefine: >-
        Indique que le retour en arrière utilise le même type de décision et le même processus que
        l'adoption originale.
      placeholders:
        - >-
          Toute décision adoptée peut être annulée par le même processus que l'original. Tout Membre
          de plein droit peut déclencher un nouveau vote en soumettant une objection écrite et
          motivée qui n'a pas été prise en compte lors de la délibération originale. Le retour en
          arrière utilise le même type de décision que l'original.
    pt-br:
      title: Reversão
      whyItMatters: >-
        Uma mudança que não pode ser desfeita pelo mesmo caminho que a criou é uma armadilha. Exigir
        que a reversão use o tipo de decisão original mantém a porta aberta para correção sem
        permitir que um único membro silenciosamente reverta uma decisão de nível comunitário
        chamando-a de "correção".
      whatToDefine: Declare que a reversão usa o mesmo tipo de decisão e processo da adoção original.
      placeholders:
        - >-
          Qualquer decisão aprovada pode ser revertida pelo mesmo processo que a original. Qualquer
          Membro Pleno pode acionar uma nova votação ao submeter uma objeção fundamentada por
          escrito que não foi considerada durante a deliberação original. A reversão usa o mesmo
          tipo de decisão da original.
  ownsClauses:
    - 8.1.5
    - 8.5.1
- key: change-protocol.emergency-changes
  artifact: change-protocol
  order: 7
  clauseRefs:
    - 8.5.3
  i18n:
    en:
      title: Emergency Changes
      whyItMatters: >-
        Some harms unfold faster than a vote can be convened. A narrow, well-guarded emergency path
        lets the community respond to genuine safety or platform failures without handing anyone a
        general-purpose override. The mandatory report, review, and ratification-or-rollback cycle
        is what keeps emergency powers from becoming ordinary powers.
      whatToDefine: >-
        Define the conditions under which an emergency change may be made, who can make it, and the
        mandatory report-review-ratify-or-rollback cycle.
      placeholders:
        - role
        - Immediate action required to prevent safety harm or platform failure.
        - A Full Member vote cannot be convened in time.
        - The change does not override a Layer 0 invariant.
        - Reported to all Full Members within X hours.
        - Reviewed at the next community meeting.
        - Ratified via the appropriate decision type within Y days, or automatically rolled back.
    de:
      title: Notfalländerungen
      whyItMatters: >-
        Manche Schäden entfalten sich schneller, als eine Abstimmung einberufen werden kann. Ein
        enger, gut abgesicherter Notfallpfad ermöglicht es der Gemeinschaft, auf echte
        Sicherheitsrisiken oder Plattformausfälle zu reagieren, ohne jemandem einen allgemeinen
        Überstimmungsmechanismus in die Hand zu geben. Der verpflichtende Zyklus aus Bericht,
        Prüfung und Ratifizierung-oder-Rücknahme verhindert, dass Notfallbefugnisse zu gewöhnlichen
        Befugnissen werden.
      whatToDefine: >-
        Definiert die Bedingungen, unter denen eine Notfalländerung vorgenommen werden darf, wer sie
        durchführen darf, und den verpflichtenden Zyklus aus
        Bericht-Prüfung-Ratifizierung-oder-Rücknahme.
      placeholders:
        - Rolle
        - >-
          Sofortiges Handeln ist erforderlich, um Sicherheitsschäden oder Plattformausfälle zu
          verhindern.
        - Eine Abstimmung der Vollmitglieder kann nicht rechtzeitig einberufen werden.
        - Die Änderung setzt keine Invariante der Schicht 0 außer Kraft.
        - Allen Vollmitgliedern innerhalb von X Stunden gemeldet werden.
        - Beim nächsten Gemeinschaftstreffen geprüft werden.
        - >-
          Über den entsprechenden Entscheidungstyp innerhalb von Y Tagen ratifiziert werden, oder
          sie werden automatisch zurückgenommen.
    es:
      title: Cambios de emergencia
      whyItMatters: >-
        Algunos daños se producen más rápido de lo que se puede convocar una votación. Una vía de
        emergencia estrecha y bien protegida permite a la comunidad responder ante fallos genuinos
        de seguridad o plataforma sin otorgar a nadie un poder de anulación general. El ciclo
        obligatorio de informe, revisión y ratificación-o-reversión es lo que evita que los poderes
        de emergencia se conviertan en poderes ordinarios.
      whatToDefine: >-
        Define las condiciones bajo las cuales se puede realizar un cambio de emergencia, quién
        puede hacerlo y el ciclo obligatorio de informe-revisión-ratificación-o-reversión.
      placeholders:
        - rol
        - >-
          Se requiere acción inmediata para prevenir un daño a la seguridad o un fallo de
          plataforma.
        - No se puede convocar una votación de Miembros Plenos a tiempo.
        - El cambio no anula un invariante de la Capa 0.
        - Ser comunicados a todos los Miembros Plenos en un plazo de X horas.
        - Ser revisados en la siguiente reunión comunitaria.
        - >-
          Ser ratificados mediante el tipo de decisión correspondiente en un plazo de Y días, o
          revertidos automáticamente.
    fr:
      title: Changements d'urgence
      whyItMatters: >-
        Certains dommages se produisent plus vite qu'un vote ne peut être convoqué. Un chemin
        d'urgence étroit et bien encadré permet à la communauté de répondre à de véritables
        problèmes de sécurité ou défaillances de plateforme sans accorder à quiconque un pouvoir de
        dérogation général. Le cycle obligatoire de signalement, examen et
        ratification-ou-retour-en-arrière est ce qui empêche les pouvoirs d'urgence de devenir des
        pouvoirs ordinaires.
      whatToDefine: >-
        Définis les conditions dans lesquelles un changement d'urgence peut être effectué, qui peut
        le faire, et le cycle obligatoire de signalement-examen-ratification-ou-retour-en-arrière.
      placeholders:
        - rôle
        - >-
          Action immédiate requise pour prévenir un préjudice à la sécurité ou une défaillance de
          plateforme.
        - Un vote des Membres de plein droit ne peut pas être convoqué à temps.
        - Le changement ne contrevient pas à un invariant de la Couche 0.
        - Signalés à tous les Membres de plein droit dans un délai de X heures.
        - Examinés lors de la prochaine réunion communautaire.
        - >-
          Ratifiés via le type de décision approprié dans un délai de Y jours, ou automatiquement
          annulés.
    pt-br:
      title: Mudanças de Emergência
      whyItMatters: >-
        Alguns danos se desenrolam mais rápido do que uma votação pode ser convocada. Um caminho de
        emergência estreito e bem protegido permite que a comunidade responda a falhas genuínas de
        segurança ou de plataforma sem entregar a ninguém um mecanismo geral de override. O ciclo
        obrigatório de relato, revisão e ratificação-ou-reversão é o que impede que poderes
        emergenciais se tornem poderes ordinários.
      whatToDefine: >-
        Defina as condições sob as quais uma mudança de emergência pode ser feita, quem pode fazê-la
        e o ciclo obrigatório de relatar-revisar-ratificar-ou-reverter.
      placeholders:
        - papel
        - Ação imediata necessária para prevenir dano à segurança ou falha de plataforma.
        - Uma votação dos Membros Plenos não pode ser convocada a tempo.
        - A mudança não anula um invariante da Camada 0.
        - Relatadas a todos os Membros Plenos em até X horas.
        - Revisadas na próxima reunião comunitária.
        - >-
          Ratificadas por meio do tipo de decisão apropriado em até Y dias, ou revertidas
          automaticamente.
  ownsClauses:
    - 8.5.3
- key: change-protocol.experiments
  artifact: change-protocol
  order: 8
  clauseRefs:
    - 8.3.1
    - 8.3.2
    - 8.3.3
    - 8.3.4
    - 8.3.5
    - 8.7.3
  i18n:
    en:
      title: Experiments
      whyItMatters: >-
        The community needs a way to try new things without having to permanently adopt them to test
        them. Experiments create that space — but only if they are time-bounded, labeled, and
        auto-expiring. Without those guardrails, an "experiment" becomes the fastest way to install
        a permanent rule with no real deliberation.
      whatToDefine: >-
        Define the rules every experiment must satisfy. Reference the Experiment Template for the
        full submission shape.
      placeholders:
        - >-
          Any Full Member may propose a time-bounded experiment via Strategic decision. See the
          Experiment Template for the required fields.
        - >-
          Experiments expire automatically at the end of their defined duration unless explicitly
          renewed via a new proposal.
        - >-
          All artifacts affected by an experiment must be explicitly labeled as experimental for the
          duration.
        - >-
          Safety suspension: if an experiment introduces a credible safety risk, coercion, or
          sustained harm, an emergency suspension may be invoked per Emergency Changes above.
        - Results and learnings are recorded in the Learning Log.
    de:
      title: Experimente
      whyItMatters: >-
        Die Gemeinschaft braucht eine Möglichkeit, Neues auszuprobieren, ohne es dauerhaft
        übernehmen zu müssen, um es zu testen. Experimente schaffen diesen Raum — aber nur, wenn sie
        zeitlich begrenzt, gekennzeichnet und automatisch ablaufend sind. Ohne diese Leitplanken
        wird ein „Experiment" zum schnellsten Weg, eine dauerhafte Regel ohne echte Beratung
        einzuführen.
      whatToDefine: >-
        Definiert die Regeln, die jedes Experiment erfüllen muss. Verweist auf die Experimentvorlage
        für die vollständige Einreichungsform.
      placeholders:
        - >-
          Jedes Vollmitglied darf ein zeitlich begrenztes Experiment per strategischer Entscheidung
          vorschlagen. Siehe die Experimentvorlage für die erforderlichen Felder.
        - >-
          Experimente laufen automatisch am Ende ihrer festgelegten Dauer ab, sofern sie nicht
          ausdrücklich durch einen neuen Vorschlag verlängert werden.
        - >-
          Alle von einem Experiment betroffenen Artefakte müssen für die Dauer ausdrücklich als
          experimentell gekennzeichnet sein.
        - >-
          Sicherheitsaussetzung: Wenn ein Experiment ein glaubhaftes Sicherheitsrisiko, Zwang oder
          anhaltenden Schaden verursacht, kann eine Notfallaussetzung gemäß den obigen
          Notfalländerungen eingeleitet werden.
        - Ergebnisse und Erkenntnisse werden im Lernprotokoll festgehalten.
    es:
      title: Experimentos
      whyItMatters: >-
        La comunidad necesita una forma de probar cosas nuevas sin tener que adoptarlas
        permanentemente para poder evaluarlas. Los experimentos crean ese espacio — pero solo si
        tienen una duración limitada, están etiquetados y expiran automáticamente. Sin esas
        salvaguardas, un "experimento" se convierte en la forma más rápida de instalar una regla
        permanente sin deliberación real.
      whatToDefine: >-
        Define las reglas que cada experimento DEBE cumplir. Haz referencia a la Plantilla de
        Experimento para la estructura completa de envío.
      placeholders:
        - >-
          Cualquier Miembro Pleno puede proponer un experimento con duración limitada mediante
          decisión Estratégica. Consulta la Plantilla de Experimento para los campos requeridos.
        - >-
          Los experimentos expiran automáticamente al final de su duración definida a menos que se
          renueven explícitamente mediante una nueva propuesta.
        - >-
          Todos los artefactos afectados por un experimento DEBEN estar explícitamente etiquetados
          como experimentales durante su vigencia.
        - >-
          Suspensión de seguridad: si un experimento introduce un riesgo de seguridad creíble,
          coerción o daño sostenido, se puede invocar una suspensión de emergencia conforme a los
          Cambios de emergencia descritos arriba.
        - Los resultados y aprendizajes se registran en el Registro de Aprendizajes.
    fr:
      title: Expérimentations
      whyItMatters: >-
        La communauté a besoin d'un moyen d'essayer de nouvelles choses sans devoir les adopter
        définitivement pour les tester. Les expérimentations créent cet espace — mais seulement si
        elles sont limitées dans le temps, étiquetées et à expiration automatique. Sans ces
        garde-fous, une « expérimentation » devient le moyen le plus rapide d'installer une règle
        permanente sans véritable délibération.
      whatToDefine: >-
        Définis les règles que chaque expérimentation doit satisfaire. Réfère-toi au Modèle
        d'expérimentation pour la structure complète de soumission.
      placeholders:
        - >-
          Tout Membre de plein droit peut proposer une expérimentation limitée dans le temps via une
          décision stratégique. Voir le Modèle d'expérimentation pour les champs obligatoires.
        - >-
          Les expérimentations expirent automatiquement à la fin de leur durée définie, sauf
          renouvellement explicite via une nouvelle proposition.
        - >-
          Tous les artefacts affectés par une expérimentation doivent être explicitement étiquetés
          comme expérimentaux pendant toute la durée.
        - >-
          Suspension de sécurité : si une expérimentation introduit un risque crédible pour la
          sécurité, de la coercition ou un préjudice durable, une suspension d'urgence peut être
          invoquée conformément aux Changements d'urgence ci-dessus.
        - Les résultats et enseignements sont consignés dans le Journal d'apprentissage.
    pt-br:
      title: Experimentos
      whyItMatters: >-
        A comunidade precisa de uma forma de testar coisas novas sem ter que adotá-las
        permanentemente para testá-las. Experimentos criam esse espaço — mas só se forem limitados
        no tempo, rotulados e com expiração automática. Sem essas salvaguardas, um "experimento" se
        torna a forma mais rápida de instalar uma regra permanente sem deliberação real.
      whatToDefine: >-
        Defina as regras que todo experimento deve satisfazer. Faça referência ao Modelo de
        Experimento para o formato completo de submissão.
      placeholders:
        - >-
          Qualquer Membro Pleno pode propor um experimento com prazo definido por meio de decisão
          Estratégica. Veja o Modelo de Experimento para os campos obrigatórios.
        - >-
          Experimentos expiram automaticamente ao final de sua duração definida, a menos que sejam
          explicitamente renovados por uma nova proposta.
        - >-
          Todos os artefatos afetados por um experimento devem ser explicitamente rotulados como
          experimentais durante o período.
        - >-
          Suspensão por segurança: se um experimento introduzir um risco credível de segurança,
          coerção ou dano contínuo, uma suspensão de emergência pode ser invocada conforme Mudanças
          de Emergência acima.
        - Resultados e aprendizados são registrados no Registro de Aprendizado.

- key: identity-constraints-register.active-identity-constraints
  artifact: identity-constraints-register
  order: 0
  clauseRefs:
    - 2.4.1
    - 2.4.2
    - 2.4.3
    - 2.4.4
  i18n:
    en:
      title: Active Identity Constraints
      whyItMatters: >-
        Every community has implicit rules — "we don't do that here." Implicit rules become tools of
        arbitrary enforcement: whoever has social power decides what they mean. Writing identity
        constraints down, and requiring them to be testable through defined processes, is what turns
        an informal norm into something a member can actually rely on or contest.
      whatToDefine: >-
        Each constraint must be testable and enforceable through a defined process — not vague
        aspirations. Common categories from RCOS §2.4.2: ethical/behavioural boundaries,
        participation prerequisites, non-negotiable cultural or ecological constraints. Reference
        Layer 4 for enforcement, Layer 1 for participation consequences.
      placeholders:
        - >-
          Constraint 1, e.g. Members must not act in ways that concentrate power, extract value, or
          cause harm to people, land, or governance integrity.
        - >-
          Constraint 2, e.g. The community may not be used as a vehicle for speculative financial
          gain — internal economic mechanisms exist to recognize contribution, not generate profit.
        - >-
          Constraint 3, e.g. No member or role may claim authority that is not explicitly granted
          through the governance system.
        - >-
          Constraint 4, e.g. The community must not cause sustained net harm to local ecosystems,
          land, or biodiversity.
        - >-
          Constraint 5, e.g. Ecological impact must be considered in all significant resource, land,
          and infrastructure decisions.
        - >-
          Constraint 6, e.g. The structural layer of the community must remain non-ideological and
          non-normative — it provides scaffolding, not a prescribed way of living.
        - >-
          Constraint 7, e.g. No specific belief system, spirituality, culture, or political ideology
          may be required as a condition of membership or participation.
        - >-
          Constraint 8, e.g. Diversity of approaches to regenerative living is a feature, not a
          problem.
    de:
      title: Aktive Identitätsbeschränkungen
      whyItMatters: >-
        Jede Gemeinschaft hat implizite Regeln — „das machen wir hier nicht." Implizite Regeln
        werden zu Werkzeugen willkürlicher Durchsetzung: Wer soziale Macht hat, bestimmt, was sie
        bedeuten. Identitätsbeschränkungen aufzuschreiben und zu verlangen, dass sie durch
        definierte Prozesse überprüfbar sind, macht aus einer informellen Norm etwas, auf das sich
        ein Mitglied tatsächlich verlassen oder das es anfechten kann.
      whatToDefine: >-
        Jede Beschränkung muss durch einen definierten Prozess überprüfbar und durchsetzbar sein —
        keine vagen Bestrebungen. Gängige Kategorien aus RCOS §2.4.2: ethische/verhaltensbezogene
        Grenzen, Teilnahmevoraussetzungen, nicht verhandelbare kulturelle oder ökologische
        Beschränkungen. Verweise auf Schicht 4 für die Durchsetzung, Schicht 1 für
        Teilnahmekonsequenzen.
      placeholders:
        - >-
          Beschränkung 1, z. B. Mitglieder dürfen nicht in einer Weise handeln, die Macht
          konzentriert, Wert abschöpft oder Menschen, Land oder die Integrität der Governance
          schädigt.
        - >-
          Beschränkung 2, z. B. Die Gemeinschaft darf nicht als Vehikel für spekulativen
          finanziellen Gewinn genutzt werden — interne Wirtschaftsmechanismen dienen der Anerkennung
          von Beiträgen, nicht der Profiterzielung.
        - >-
          Beschränkung 3, z. B. Kein Mitglied und keine Rolle darf Autorität beanspruchen, die nicht
          ausdrücklich durch das Governance-System erteilt wurde.
        - >-
          Beschränkung 4, z. B. Die Gemeinschaft darf lokalen Ökosystemen, dem Land oder der
          Biodiversität keinen anhaltenden Nettoschaden zufügen.
        - >-
          Beschränkung 5, z. B. Ökologische Auswirkungen müssen bei allen wesentlichen
          Entscheidungen zu Ressourcen, Land und Infrastruktur berücksichtigt werden.
        - >-
          Beschränkung 6, z. B. Die strukturelle Ebene der Gemeinschaft muss nicht-ideologisch und
          nicht-normativ bleiben — sie bietet ein Gerüst, keine vorgeschriebene Lebensweise.
        - >-
          Beschränkung 7, z. B. Kein bestimmtes Glaubenssystem, keine Spiritualität, Kultur oder
          politische Ideologie darf als Voraussetzung für Mitgliedschaft oder Teilnahme verlangt
          werden.
        - >-
          Beschränkung 8, z. B. Die Vielfalt der Ansätze für regeneratives Leben ist ein Merkmal,
          kein Problem.
    es:
      title: Restricciones de Identidad Activas
      whyItMatters: >-
        Toda comunidad tiene reglas implícitas — "eso aquí no se hace." Las reglas implícitas se
        convierten en herramientas de aplicación arbitraria: quien tiene poder social decide lo que
        significan. Escribir las restricciones de identidad y exigir que sean verificables a través
        de procesos definidos es lo que convierte una norma informal en algo en lo que un miembro
        puede confiar o que puede cuestionar.
      whatToDefine: >-
        Cada restricción debe ser verificable y aplicable mediante un proceso definido — no
        aspiraciones vagas. Categorías comunes de RCOS §2.4.2: límites éticos/conductuales,
        prerrequisitos de participación, restricciones culturales o ecológicas no negociables.
        Consultar la Capa 4 para la aplicación, la Capa 1 para las consecuencias de participación.
      placeholders:
        - >-
          Restricción 1, p. ej. Los miembros no deben actuar de formas que concentren poder,
          extraigan valor o causen daño a personas, territorio o integridad de la gobernanza.
        - >-
          Restricción 2, p. ej. La comunidad no puede ser utilizada como vehículo para la ganancia
          financiera especulativa — los mecanismos económicos internos existen para reconocer la
          contribución, no para generar beneficio.
        - >-
          Restricción 3, p. ej. Ningún miembro o rol puede reclamar autoridad que no haya sido
          explícitamente otorgada a través del sistema de gobernanza.
        - >-
          Restricción 4, p. ej. La comunidad no debe causar daño neto sostenido a los ecosistemas
          locales, el territorio o la biodiversidad.
        - >-
          Restricción 5, p. ej. El impacto ecológico debe ser considerado en todas las decisiones
          significativas sobre recursos, territorio e infraestructura.
        - >-
          Restricción 6, p. ej. La capa estructural de la comunidad debe permanecer no ideológica y
          no normativa — proporciona andamiaje, no una forma de vida prescrita.
        - >-
          Restricción 7, p. ej. Ningún sistema de creencias, espiritualidad, cultura o ideología
          política específica puede ser requerido como condición de membresía o participación.
        - >-
          Restricción 8, p. ej. La diversidad de enfoques hacia la vida regenerativa es una
          característica, no un problema.
    fr:
      title: Contraintes d'identité actives
      whyItMatters: >-
        Toute communauté a des règles implicites — « on ne fait pas ça ici ». Les règles implicites
        deviennent des outils d'application arbitraire : c'est la personne qui détient le pouvoir
        social qui décide de leur signification. Mettre les contraintes d'identité par écrit, et
        exiger qu'elles soient vérifiables à travers des processus définis, c'est ce qui transforme
        une norme informelle en quelque chose sur lequel un membre peut réellement s'appuyer ou
        qu'il peut contester.
      whatToDefine: >-
        Chaque contrainte doit être vérifiable et applicable à travers un processus défini — pas de
        vagues aspirations. Catégories courantes issues de RCOS §2.4.2 : limites
        éthiques/comportementales, prérequis de participation, contraintes culturelles ou
        écologiques non négociables. Référence à la Couche 4 pour l'application, à la Couche 1 pour
        les conséquences sur la participation.
      placeholders:
        - >-
          Contrainte 1, p. ex. Les membres NE DOIVENT PAS agir de manière à concentrer le pouvoir,
          extraire de la valeur ou causer du tort aux personnes, à la terre ou à l'intégrité de la
          gouvernance.
        - >-
          Contrainte 2, p. ex. La communauté NE PEUT PAS être utilisée comme véhicule de gain
          financier spéculatif — les mécanismes économiques internes existent pour reconnaître la
          contribution, pas pour générer du profit.
        - >-
          Contrainte 3, p. ex. Aucun membre ou rôle NE PEUT revendiquer une autorité qui n'est pas
          explicitement accordée par le système de gouvernance.
        - >-
          Contrainte 4, p. ex. La communauté NE DOIT PAS causer de dommage net durable aux
          écosystèmes locaux, à la terre ou à la biodiversité.
        - >-
          Contrainte 5, p. ex. L'impact écologique DOIT être pris en compte dans toutes les
          décisions significatives concernant les ressources, la terre et les infrastructures.
        - >-
          Contrainte 6, p. ex. La couche structurelle de la communauté DOIT rester non idéologique
          et non normative — elle fournit un cadre, pas un mode de vie prescrit.
        - >-
          Contrainte 7, p. ex. Aucun système de croyance, spiritualité, culture ou idéologie
          politique spécifique NE PEUT être exigé comme condition d'adhésion ou de participation.
        - >-
          Contrainte 8, p. ex. La diversité des approches de la vie régénérative est une
          caractéristique, pas un problème.
    pt-br:
      title: Restrições de Identidade Ativas
      whyItMatters: >-
        Toda comunidade tem regras implícitas — "isso aqui a gente não faz". Regras implícitas se
        tornam ferramentas de aplicação arbitrária: quem tem poder social decide o que elas
        significam. Escrever as restrições de identidade, e exigir que sejam testáveis através de
        processos definidos, é o que transforma uma norma informal em algo no qual um membro pode
        realmente confiar ou contestar.
      whatToDefine: >-
        Cada restrição deve ser testável e aplicável através de um processo definido — não
        aspirações vagas. Categorias comuns do RCOS §2.4.2: limites éticos/comportamentais,
        pré-requisitos de participação, restrições culturais ou ecológicas inegociáveis. Consulte a
        Camada 4 para aplicação, a Camada 1 para consequências de participação.
      placeholders:
        - >-
          Restrição 1, ex.: Membros não devem agir de formas que concentrem poder, extraiam valor ou
          causem dano a pessoas, à terra ou à integridade da governança.
        - >-
          Restrição 2, ex.: A comunidade não pode ser usada como veículo para ganho financeiro
          especulativo — os mecanismos econômicos internos existem para reconhecer contribuição, não
          para gerar lucro.
        - >-
          Restrição 3, ex.: Nenhum membro ou papel pode reivindicar autoridade que não tenha sido
          explicitamente concedida pelo sistema de governança.
        - >-
          Restrição 4, ex.: A comunidade não deve causar dano líquido sustentado aos ecossistemas
          locais, à terra ou à biodiversidade.
        - >-
          Restrição 5, ex.: O impacto ecológico deve ser considerado em todas as decisões
          significativas sobre recursos, terra e infraestrutura.
        - >-
          Restrição 6, ex.: A camada estrutural da comunidade deve permanecer não-ideológica e
          não-normativa — ela fornece o andaime, não uma forma prescrita de viver.
        - >-
          Restrição 7, ex.: Nenhum sistema específico de crença, espiritualidade, cultura ou
          ideologia política pode ser exigido como condição para a filiação ou participação.
        - >-
          Restrição 8, ex.: A diversidade de abordagens à vida regenerativa é uma qualidade, não um
          problema.
  ownsClauses:
    - 2.4.1
    - 2.4.2
- key: identity-constraints-register.enforcement-and-testability
  artifact: identity-constraints-register
  order: 1
  clauseRefs:
    - 2.4.3
    - 2.4.4
  i18n:
    en:
      title: Enforcement and Testability
      whyItMatters: >-
        A constraint that cannot be tested is a constraint that gets enforced by whoever has the
        most social capital in the room. Defining how each constraint is detected, who raises it,
        and through which process it is resolved is what prevents identity rules from becoming tools
        of arbitrary exclusion.
      whatToDefine: >-
        For each constraint above (or as a general policy), describe how a violation is identified
        and addressed. Reference the Conflict Resolution Ladder (Layer 4) and any role responsible
        for monitoring (Layer 5).
      placeholders:
        - How violations are detected and reported.
        - Which Layer 4 process handles violations of which class of constraint.
        - Which roles or bodies are responsible for monitoring and review.
    de:
      title: Durchsetzung und Überprüfbarkeit
      whyItMatters: >-
        Eine Beschränkung, die nicht überprüft werden kann, ist eine Beschränkung, die von
        demjenigen durchgesetzt wird, der das meiste soziale Kapital im Raum hat. Zu definieren, wie
        jede Beschränkung erkannt wird, wer sie anspricht und durch welchen Prozess sie gelöst wird,
        verhindert, dass Identitätsregeln zu Werkzeugen willkürlichen Ausschlusses werden.
      whatToDefine: >-
        Beschreibe für jede oben genannte Beschränkung (oder als allgemeine Richtlinie), wie ein
        Verstoß erkannt und behandelt wird. Verweise auf die Konfliktlösungsleiter (Schicht 4) und
        alle für die Überwachung zuständigen Rollen (Schicht 5).
      placeholders:
        - Wie Verstöße erkannt und gemeldet werden.
        - Welcher Ebene-4-Prozess Verstöße welcher Beschränkungsklasse behandelt.
        - Welche Rollen oder Gremien für Überwachung und Überprüfung zuständig sind.
    es:
      title: Aplicación y Verificabilidad
      whyItMatters: >-
        Una restricción que no puede ser verificada es una restricción que será aplicada por quien
        tenga más capital social en la sala. Definir cómo se detecta cada restricción, quién la
        plantea y a través de qué proceso se resuelve es lo que impide que las reglas de identidad
        se conviertan en herramientas de exclusión arbitraria.
      whatToDefine: >-
        Para cada restricción anterior (o como política general), describe cómo se identifica y
        aborda una violación. Consultar la Escalera de Resolución de Conflictos (Capa 4) y cualquier
        rol responsable de la supervisión (Capa 5).
      placeholders:
        - Cómo se detectan y reportan las violaciones.
        - Qué proceso de la Capa 4 gestiona las violaciones de cada clase de restricción.
        - Qué roles u órganos son responsables de la supervisión y revisión.
    fr:
      title: Application et vérifiabilité
      whyItMatters: >-
        Une contrainte qui ne peut pas être vérifiée est une contrainte appliquée par la personne
        disposant du plus grand capital social dans la pièce. Définir comment chaque contrainte est
        détectée, qui la signale et par quel processus elle est résolue, c'est ce qui empêche les
        règles d'identité de devenir des outils d'exclusion arbitraire.
      whatToDefine: >-
        Pour chaque contrainte ci-dessus (ou en tant que politique générale), décris comment une
        violation est identifiée et traitée. Réfère-toi à l'Échelle de résolution des conflits
        (Couche 4) et à tout rôle responsable du suivi (Couche 5).
      placeholders:
        - Comment les violations sont détectées et signalées.
        - Quel processus de Couche 4 traite les violations de quelle classe de contrainte.
        - Quels rôles ou organes sont responsables du suivi et de la révision.
    pt-br:
      title: Aplicação e Testabilidade
      whyItMatters: >-
        Uma restrição que não pode ser testada é uma restrição aplicada por quem tem o maior capital
        social na sala. Definir como cada restrição é detectada, quem a aciona e através de qual
        processo é resolvida é o que impede que regras de identidade se tornem ferramentas de
        exclusão arbitrária.
      whatToDefine: >-
        Para cada restrição acima (ou como política geral), descreva como uma violação é
        identificada e tratada. Consulte a Escada de Resolução de Conflitos (Camada 4) e qualquer
        papel responsável por monitoramento (Camada 5).
      placeholders:
        - Como as violações são detectadas e reportadas.
        - Qual processo da Camada 4 trata violações de qual classe de restrição.
        - Quais papéis ou instâncias são responsáveis por monitorar e revisar.
  ownsClauses:
    - 2.4.3
    - 2.4.4

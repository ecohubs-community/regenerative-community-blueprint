        Si une réunion peut à la fois discuter et décider, ce sont les personnes présentes ce
        jour-là qui décident — indépendamment des règles de quorum ou d'autorité. Séparer la
        délibération du vote contraignant préserve l'intégrité de la Matrice de décision et garantit

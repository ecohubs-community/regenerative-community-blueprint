- key: invariants-register.active-invariants
  artifact: invariants-register
  order: 0
  clauseRefs:
    - 2.3.1
    - 2.3.2
    - 2.3.3
    - 2.3.4
    - 2.3.5
    - 2.3.6
  i18n:
    en:
      title: Active Invariants
      whyItMatters: >-
        Invariants are the hard floor of the system — the things that must hold true even under
        pressure, emergency, or a popular vote. If any decision, role, or crisis measure could
        override them, they would stop being constraints and become preferences. Listing them
        explicitly and binding them across every layer is what makes the governance system
        trustworthy under stress, not just on calm days.
      whatToDefine: >-
        Each invariant is a hard constraint. Keep them few, specific, and absolute — phrased so that
        any violation is unambiguously identifiable. Common categories: purpose protection,
        authority traceability, exit rights, ideological neutrality, non-extraction, safety primacy.
      placeholders:
        - >-
          Invariant statement, e.g. The primary purpose may never be overridden by any operational
          or strategic decision, role, or emergency measure.
        - >-
          Invariant statement, e.g. Authority must always be explicit and traceable to the
          governance system — no person or role may hold or exercise undeclared authority.
        - >-
          Invariant statement, e.g. Exit from the community must always be possible and must never
          be blocked, penalised, or made conditional beyond what is defined in Layer 1.
        - Invariant statement.
        - Invariant statement.
        - >-
          Invariant statement, e.g. Physical, psychological, and child safety always override
          participation rights, role continuity, and reputational concerns.
    de:
      title: Aktive Invarianten
      whyItMatters: >-
        Invarianten sind der harte Boden des Systems — Dinge, die auch unter Druck, in Notfällen
        oder bei einer Mehrheitsentscheidung gelten müssen. Wenn eine Entscheidung, eine Rolle oder
        eine Krisenmaßnahme sie außer Kraft setzen könnte, wären sie keine Rahmenbedingungen mehr,
        sondern nur noch Präferenzen. Sie explizit aufzulisten und auf allen Schichten zu verankern
        macht das Governance-System auch unter Stress verlässlich — nicht nur an ruhigen Tagen.
      whatToDefine: >-
        Jede Invariante ist eine harte Rahmenbedingung. Halte sie wenige, spezifisch und absolut —
        so formuliert, dass jede Verletzung eindeutig erkennbar ist. Häufige Kategorien:
        Zweckschutz, Rückverfolgbarkeit von Autorität, Austrittsrechte, ideologische Neutralität,
        Nicht-Extraktion, Sicherheitsvorrang.
      placeholders:
        - >-
          Invariantenaussage, z. B. Der primäre Zweck darf durch keine operative oder strategische
          Entscheidung, Rolle oder Notfallmaßnahme außer Kraft gesetzt werden.
        - >-
          Invariantenaussage, z. B. Autorität muss stets explizit und auf das Governance-System
          zurückführbar sein — keine Person und keine Rolle darf nicht deklarierte Autorität
          innehaben oder ausüben.
        - >-
          Invariantenaussage, z. B. Der Austritt aus der Gemeinschaft muss stets möglich sein und
          darf niemals blockiert, bestraft oder über das in Schicht 1 Festgelegte hinaus an
          Bedingungen geknüpft werden.
        - Invariantenaussage.
        - Invariantenaussage.
        - >-
          Invariantenaussage, z. B. Körperliche, psychische und Kindersicherheit haben stets Vorrang
          vor Teilnahmerechten, Rollenkontinuität und Reputationsbelangen.
    es:
      title: Invariantes Activas
      whyItMatters: >-
        Las invariantes son el piso firme del sistema — aquello que debe mantenerse verdadero
        incluso bajo presión, emergencia o votación popular. Si cualquier decisión, rol o medida de
        crisis pudiera anularlas, dejarían de ser restricciones y se convertirían en preferencias.
        Enumerarlas explícitamente y vincularlas a todas las capas es lo que hace que el sistema de
        gobernanza sea confiable bajo estrés, no solo en días tranquilos.
      whatToDefine: >-
        Cada invariante es una restricción firme. Mantenlas pocas, específicas y absolutas —
        formuladas de modo que cualquier violación sea inequívocamente identificable. Categorías
        comunes: protección del propósito, trazabilidad de la autoridad, derechos de salida,
        neutralidad ideológica, no-extracción, primacía de la seguridad.
      placeholders:
        - >-
          Declaración de invariante, p. ej. El propósito principal nunca puede ser anulado por
          ninguna decisión operativa o estratégica, rol o medida de emergencia.
        - >-
          Declaración de invariante, p. ej. La autoridad siempre debe ser explícita y trazable al
          sistema de gobernanza — ninguna persona o rol puede poseer o ejercer autoridad no
          declarada.
        - >-
          Declaración de invariante, p. ej. La salida de la comunidad siempre debe ser posible y
          nunca puede ser bloqueada, penalizada ni condicionada más allá de lo definido en la Capa
          1.
        - Declaración de invariante.
        - Declaración de invariante.
        - >-
          Declaración de invariante, p. ej. La seguridad física, psicológica e infantil siempre
          prevalece sobre los derechos de participación, la continuidad de roles y las
          preocupaciones reputacionales.
    fr:
      title: Invariants actifs
      whyItMatters: >-
        Les invariants constituent le socle dur du système — les éléments qui doivent rester vrais
        même sous pression, en situation d'urgence ou lors d'un vote populaire. Si une décision, un
        rôle ou une mesure de crise pouvait les outrepasser, ils cesseraient d'être des contraintes
        pour devenir de simples préférences. Les lister explicitement et les rendre contraignants à
        travers toutes les couches est ce qui rend le système de gouvernance fiable sous stress, pas
        seulement les jours de calme.
      whatToDefine: >-
        Chaque invariant est une contrainte dure. Garde-les peu nombreux, spécifiques et absolus —
        formulés de sorte que toute violation soit identifiable sans ambiguïté. Catégories courantes
        : protection de la raison d'être, traçabilité de l'autorité, droits de sortie, neutralité
        idéologique, non-extraction, primauté de la sécurité.
      placeholders:
        - >-
          Énoncé de l'invariant, p. ex. La raison d'être principale ne peut jamais être outrepassée
          par une décision opérationnelle ou stratégique, un rôle ou une mesure d'urgence.
        - >-
          Énoncé de l'invariant, p. ex. L'autorité doit toujours être explicite et traçable jusqu'au
          système de gouvernance — aucune personne ni aucun rôle ne peut détenir ou exercer une
          autorité non déclarée.
        - >-
          Énoncé de l'invariant, p. ex. La sortie de la communauté doit toujours être possible et ne
          doit jamais être bloquée, pénalisée ou conditionnée au-delà de ce qui est défini dans la
          Couche 1.
        - Énoncé de l'invariant.
        - Énoncé de l'invariant.
        - >-
          Énoncé de l'invariant, p. ex. La sécurité physique, psychologique et celle des enfants
          prévaut toujours sur les droits de participation, la continuité des rôles et les
          préoccupations de réputation.
    pt-br:
      title: Invariantes Ativos
      whyItMatters: >-
        Os invariantes são o piso rígido do sistema — as coisas que precisam continuar verdadeiras
        mesmo sob pressão, emergência ou votação popular. Se qualquer decisão, papel ou medida de
        crise pudesse sobrepô-los, eles deixariam de ser restrições e se tornariam preferências.
        Listá-los explicitamente e vinculá-los a todas as camadas é o que torna o sistema de
        governança confiável sob estresse, não apenas em dias tranquilos.
      whatToDefine: >-
        Cada invariante é uma restrição rígida. Mantenha-os poucos, específicos e absolutos —
        formulados de modo que qualquer violação seja inequivocamente identificável. Categorias
        comuns: proteção do propósito, rastreabilidade da autoridade, direitos de saída,
        neutralidade ideológica, não extração, primazia da segurança.
      placeholders:
        - >-
          Declaração do invariante, ex.: O propósito primário nunca pode ser sobreposto por qualquer
          decisão operacional ou estratégica, papel ou medida emergencial.
        - >-
          Declaração do invariante, ex.: A autoridade deve ser sempre explícita e rastreável até o
          sistema de governança — nenhuma pessoa ou papel pode deter ou exercer autoridade não
          declarada.
        - >-
          Declaração do invariante, ex.: A saída da comunidade deve ser sempre possível e nunca deve
          ser bloqueada, penalizada ou condicionada além do que está definido na Camada 1.
        - Declaração do invariante.
        - Declaração do invariante.
        - >-
          Declaração do invariante, ex.: A segurança física, psicológica e infantil sempre tem
          precedência sobre direitos de participação, continuidade de papéis e preocupações
          reputacionais.
  ownsClauses:

- key: role-registry.operational-roles
  artifact: role-registry
  order: 2
  clauseRefs:
    - 7.1.2
    - 7.1.3
  i18n:
    en:
      title: Operational Roles
      whyItMatters: >-
        Operational roles carry real power — they can act without a community vote within their
        scope. That power only stays safe if each role has a clear accountability mechanism: who can
        raise concerns, how review happens, and how a role can be reassigned when trust breaks.
      whatToDefine: >-
        For each operational role, fill in the template below with concrete scope, decision
        authority, interfaces, eligibility, term, appointment, review/removal, and handover
        requirements.
      placeholders:
        - Operational Role Name, e.g. Membership Admin
        - one-sentence purpose.
        - concrete responsibilities.
        - which decisions in the Decision Matrix this role executes; explicit limits.
        - other roles this role hands off to or receives from.
        - Full Member in good standing; any additional criteria.
        - ongoing / rotating / fixed term.
        - how the role is assigned.
        - how concerns are raised; reassignment via Strategic vote.
        - what must be transferred before vacating.
        - Operational Role Name, e.g. Finance Steward
        - purpose.
        - responsibilities.
        - Decision Matrix scope; spending limit.
        - other roles.
        - Full Member in good standing.
        - ...
        - ...
        - ...
        - ...
        - >-
          Add additional operational roles as needed (e.g. Infrastructure Steward, Communications
          Steward).
    de:
      title: Operative Rollen
      whyItMatters: >-
        Operative Rollen tragen echte Macht — sie können innerhalb ihres Zuständigkeitsbereichs ohne
        Gemeinschaftsabstimmung handeln. Diese Macht bleibt nur sicher, wenn jede Rolle einen klaren
        Rechenschaftsmechanismus hat: Wer kann Bedenken äußern, wie läuft die Überprüfung ab, und
        wie kann eine Rolle neu besetzt werden, wenn das Vertrauen bricht.
      whatToDefine: >-
        Füllt für jede operative Rolle die untenstehende Vorlage mit konkretem
        Zuständigkeitsbereich, Entscheidungsbefugnis, Schnittstellen, Berechtigungskriterien,
        Amtszeit, Ernennung, Überprüfung/Abberufung und Übergabeanforderungen aus.
      placeholders:
        - Name der operativen Rolle, z. B. Mitgliederverwaltung
        - Zweck in einem Satz.
        - konkrete Verantwortlichkeiten.
        - welche Entscheidungen in der Entscheidungsmatrix diese Rolle ausführt; explizite Grenzen.
        - andere Rollen, an die diese Rolle übergibt oder von denen sie empfängt.
        - Vollmitglied in gutem Status; ggf. weitere Kriterien.
        - fortlaufend / rotierend / befristet.
        - wie die Rolle besetzt wird.
        - wie Bedenken vorgebracht werden; Neubesetzung per Strategischer Abstimmung.
        - was vor dem Verlassen der Rolle übergeben werden muss.
        - Name der operativen Rolle, z. B. Finanzverantwortliche\*r
        - Zweck.
        - Verantwortlichkeiten.
        - Entscheidungsmatrix-Bereich; Ausgabenlimit.
        - andere Rollen.
        - Vollmitglied in gutem Status.
        - ...
        - ...
        - ...
        - ...
        - >-
          Weitere operative Rollen nach Bedarf hinzufügen (z. B. Infrastrukturverantwortliche\*r,
          Kommunikationsverantwortliche\*r).
    es:
      title: Roles operativos
      whyItMatters: >-
        Los roles operativos tienen poder real — pueden actuar sin votación comunitaria dentro de su
        ámbito. Ese poder solo se mantiene seguro si cada rol tiene un mecanismo claro de rendición
        de cuentas: quién puede plantear preocupaciones, cómo se realiza la revisión y cómo se puede
        reasignar un rol cuando se rompe la confianza.
      whatToDefine: >-
        Para cada rol operativo, completa la plantilla a continuación con ámbito concreto, autoridad
        de decisión, interfaces, elegibilidad, mandato, nombramiento, revisión/remoción y requisitos
        de traspaso.
      placeholders:
        - Nombre del rol operativo, p. ej. Administrador de Membresía
        - propósito en una frase.
        - responsabilidades concretas.
        - qué decisiones de la Matriz de Decisiones ejecuta este rol; límites explícitos.
        - otros roles con los que este rol entrega o recibe trabajo.
        - Miembro Pleno en buen estado; cualquier criterio adicional.
        - continuo / rotativo / mandato fijo.
        - cómo se asigna el rol.
        - cómo se plantean preocupaciones; reasignación mediante votación Estratégica.
        - qué debe transferirse antes de dejar el cargo.
        - Nombre del rol operativo, p. ej. Administrador de Finanzas
        - propósito.
        - responsabilidades.
        - ámbito en la Matriz de Decisiones; límite de gasto.
        - otros roles.
        - Miembro Pleno en buen estado.
        - ...
        - ...
        - ...
        - ...
        - >-
          Añade roles operativos adicionales según sea necesario (p. ej. Administrador de
          Infraestructura, Administrador de Comunicaciones).
    fr:
      title: Rôles opérationnels
      whyItMatters: >-
        Les rôles opérationnels détiennent un pouvoir réel — ils peuvent agir sans vote
        communautaire dans leur périmètre. Ce pouvoir ne reste sûr que si chaque rôle dispose d'un
        mécanisme de redevabilité clair : qui peut soulever des préoccupations, comment se déroule
        l'examen, et comment un rôle peut être réattribué lorsque la confiance se brise.
      whatToDefine: >-
        Pour chaque rôle opérationnel, remplis le modèle ci-dessous avec le périmètre concret,
        l'autorité de décision, les interfaces, l'éligibilité, la durée, la procédure de nomination,
        l'examen/la révocation, et les exigences de passation.
      placeholders:
        - Nom du rôle opérationnel, p. ex. Administration des adhésions
        - objet en une phrase.
        - responsabilités concrètes.
        - quelles décisions de la Matrice de décision ce rôle exécute ; limites explicites.
        - autres rôles auxquels ce rôle transmet ou dont il reçoit.
        - Membre à part entière en règle ; tout critère supplémentaire.
        - continu / rotatif / durée fixe.
        - comment le rôle est attribué.
        - comment les préoccupations sont soulevées ; réattribution par vote Stratégique.
        - ce qui doit être transmis avant de quitter le rôle.
        - Nom du rôle opérationnel, p. ex. Intendant·e des finances
        - objet.
        - responsabilités.
        - périmètre de la Matrice de décision ; plafond de dépenses.
        - autres rôles.
        - Membre à part entière en règle.
        - ...
        - ...
        - ...
        - ...
        - >-
          Ajouter d'autres rôles opérationnels selon les besoins (p. ex. Intendant·e des
          infrastructures, Intendant·e de la communication).
    pt-br:
      title: Papéis Operacionais
      whyItMatters: >-
        Papéis operacionais carregam poder real — podem agir sem uma votação da comunidade dentro do
        seu escopo. Esse poder só permanece seguro se cada papel tiver um mecanismo claro de
        responsabilização: quem pode levantar preocupações, como acontece a revisão e como um papel
        pode ser reatribuído quando a confiança é quebrada.
      whatToDefine: >-
        Para cada papel operacional, preencha o modelo abaixo com escopo concreto, autoridade
        decisória, interfaces, elegibilidade, mandato, nomeação, revisão/remoção e requisitos de
        transição.
      placeholders:
        - 'Nome do Papel Operacional, ex.: Administrador(a) de Membros'
        - propósito em uma frase.
        - responsabilidades concretas.
        - quais decisões da Matriz de Decisão este papel executa; limites explícitos.
        - outros papéis para os quais este papel transfere ou dos quais recebe.
        - Membro Pleno em situação regular; quaisquer critérios adicionais.
        - contínuo / rotativo / mandato fixo.
        - como o papel é atribuído.
        - como preocupações são levantadas; reatribuição via votação Estratégica.
        - o que DEVE ser transferido antes de deixar o cargo.
        - 'Nome do Papel Operacional, ex.: Guardião(ã) das Finanças'
        - propósito.
        - responsabilidades.
        - escopo na Matriz de Decisão; limite de gastos.
        - outros papéis.
        - Membro Pleno em situação regular.
        - ...
        - ...
        - ...
        - ...
        - >-
          Adicione papéis operacionais adicionais conforme necessário (ex.: Guardião(ã) de
          Infraestrutura, Guardião(ã) de Comunicação).
  ownsClauses:

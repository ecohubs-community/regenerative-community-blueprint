- key: treasury-ruleset.treasury-scope
  artifact: treasury-ruleset
  order: 0
  clauseRefs:
    - 5.3.1
    - 5.5.4
  i18n:
    en:
      title: Treasury Scope
      whyItMatters: >-
        Without an explicit boundary, any money flowing near the community — a founder's personal
        card, a side account, an informal reimbursement pool — can drift into being treated as
        community money, with all the obligations that entails. Naming exactly which accounts are
        treasury and which are not protects both the community and the individuals paying out of
        pocket.
      whatToDefine: >-
        Name every account that is treasury (wallet, bank account, etc.) and state explicitly that
        personal funds operating informally are not treasury and create no community obligation.
      placeholders:
        - >-
          Define which accounts are community treasury — explicit wallet addresses, bank accounts,
          etc. State that any new treasury account must be declared and approved via a Strategic
          decision before funds are received into it. State that personal funds covering operational
          costs are not treasury and carry no community repayment claim.
    de:
      title: Geltungsbereich der Kasse
      whyItMatters: >-
        Ohne eine ausdrückliche Abgrenzung kann jedes Geld, das in der Nähe der Gemeinschaft fließt
        — die persönliche Karte einer Gründerin, ein Nebenkonto, ein informeller Erstattungspool —
        schleichend als Gemeinschaftsgeld behandelt werden, mit allen Pflichten, die das mit sich
        bringt. Genau festzulegen, welche Konten zur Kasse gehören und welche nicht, schützt sowohl
        die Gemeinschaft als auch die Einzelpersonen, die aus eigener Tasche zahlen.
      whatToDefine: >-
        Benennt jedes Konto, das zur Kasse gehört (Wallet, Bankkonto usw.), und stellt ausdrücklich
        fest, dass persönliche Mittel, die informell eingesetzt werden, nicht zur Kasse gehören und
        keine Verpflichtung der Gemeinschaft begründen.
      placeholders:
        - >-
          Legt fest, welche Konten die Gemeinschaftskasse bilden — explizite Wallet-Adressen,
          Bankkonten usw. Stellt fest, dass jedes neue Kassenkonto vor dem Eingang von Geldern durch
          eine Strategische Entscheidung deklariert und genehmigt werden muss. Stellt fest, dass
          persönliche Mittel, die Betriebskosten decken, nicht zur Kasse gehören und keinen
          Rückzahlungsanspruch gegenüber der Gemeinschaft begründen.
    es:
      title: Alcance de la Tesorería
      whyItMatters: >-
        Sin un límite explícito, cualquier dinero que fluya cerca de la comunidad — la tarjeta
        personal de un fundador, una cuenta paralela, un fondo informal de reembolsos — puede
        terminar siendo tratado como dinero comunitario, con todas las obligaciones que eso implica.
        Nombrar exactamente qué cuentas son tesorería y cuáles no protege tanto a la comunidad como
        a las personas que pagan de su propio bolsillo.
      whatToDefine: >-
        Nombra cada cuenta que es tesorería (billetera, cuenta bancaria, etc.) y establece
        explícitamente que los fondos personales que operan informalmente no son tesorería y no
        crean ninguna obligación comunitaria.
      placeholders:
        - >-
          Define qué cuentas son tesorería comunitaria — direcciones de billetera explícitas,
          cuentas bancarias, etc. Establece que cualquier nueva cuenta de tesorería DEBE ser
          declarada y aprobada mediante una decisión Estratégica antes de que se reciban fondos en
          ella. Establece que los fondos personales que cubren costes operativos no son tesorería y
          no generan derecho de reembolso comunitario.
    fr:
      title: Périmètre de la trésorerie
      whyItMatters: >-
        Sans limite explicite, tout argent circulant près de la communauté — la carte personnelle
        d'un fondateur, un compte parallèle, une cagnotte informelle de remboursement — peut
        progressivement être traité comme de l'argent communautaire, avec toutes les obligations que
        cela implique. Nommer précisément quels comptes relèvent de la trésorerie et lesquels n'en
        relèvent pas protège à la fois la communauté et les individus qui paient de leur poche.
      whatToDefine: >-
        Nomme chaque compte qui fait partie de la trésorerie (portefeuille, compte bancaire, etc.)
        et indique explicitement que les fonds personnels utilisés de manière informelle ne sont pas
        de la trésorerie et ne créent aucune obligation communautaire.
      placeholders:
        - >-
          Définis quels comptes constituent la trésorerie communautaire — adresses de portefeuille
          explicites, comptes bancaires, etc. Indique que tout nouveau compte de trésorerie DOIT
          être déclaré et approuvé par une décision Stratégique avant que des fonds y soient reçus.
          Indique que les fonds personnels couvrant des coûts opérationnels ne sont pas de la
          trésorerie et n'ouvrent aucun droit à remboursement communautaire.
    pt-br:
      title: Escopo da Tesouraria
      whyItMatters: >-
        Sem um limite explícito, qualquer dinheiro que circule perto da comunidade — o cartão
        pessoal de uma fundadora, uma conta paralela, um fundo informal de reembolsos — pode acabar
        sendo tratado como dinheiro comunitário, com todas as obrigações que isso implica. Nomear
        exatamente quais contas são da tesouraria e quais não são protege tanto a comunidade quanto
        as pessoas que pagam do próprio bolso.
      whatToDefine: >-
        Nomeie cada conta que faz parte da tesouraria (carteira, conta bancária, etc.) e declare
        explicitamente que fundos pessoais usados informalmente não são da tesouraria e não geram
        nenhuma obrigação para a comunidade.
      placeholders:
        - >-
          Defina quais contas são a tesouraria da comunidade — endereços específicos de carteira,
          contas bancárias, etc. Declare que qualquer nova conta de tesouraria DEVE ser declarada e
          aprovada por uma decisão Estratégica antes de receber recursos. Declare que fundos
          pessoais usados para cobrir custos operacionais não são da tesouraria e não geram nenhum
          direito de reembolso pela comunidade.
  ownsClauses:
    - 5.3.1
    - 5.5.4
- key: treasury-ruleset.income-sources
  artifact: treasury-ruleset
  order: 1
  clauseRefs:
    - 5.3.2
  i18n:
    en:
      title: Income Sources
      whyItMatters: >-
        Every income source carries strings — reporting requirements, expectations, dependency
        risks. If income channels can open informally, those strings get attached before the
        community has had a chance to weigh them. One declared list, changed only through Strategic
        decisions, keeps the community's obligations under its own control.
      whatToDefine: >-
        Name every income source the community currently has, and reference the Internal Economy
        Protocol for the rule that any new income channel requires a Strategic decision.
      placeholders:
        - >-
          List current income sources, or state that there are none. Reference the External Income
          Interfaces section in the Internal Economy Protocol.
    de:
      title: Einnahmequellen
      whyItMatters: >-
        Jede Einnahmequelle bringt Bedingungen mit sich — Berichtspflichten, Erwartungen,
        Abhängigkeitsrisiken. Wenn Einnahmekanäle informell entstehen können, werden diese
        Bedingungen angehängt, bevor die Gemeinschaft Gelegenheit hatte, sie abzuwägen. Eine
        deklarierte Liste, die nur durch Strategische Entscheidungen geändert wird, hält die
        Verpflichtungen der Gemeinschaft unter ihrer eigenen Kontrolle.
      whatToDefine: >-
        Benennt jede Einnahmequelle, die die Gemeinschaft derzeit hat, und verweist auf das
        Binnenwirtschaftsprotokoll für die Regel, dass jeder neue Einnahmekanal eine Strategische
        Entscheidung erfordert.
      placeholders:
        - >-
          Listet die aktuellen Einnahmequellen auf oder stellt fest, dass es keine gibt. Verweist
          auf den Abschnitt „Externe Einnahmeschnittstellen" im Binnenwirtschaftsprotokoll.
    es:
      title: Fuentes de Ingreso
      whyItMatters: >-
        Cada fuente de ingreso trae condiciones — requisitos de reporte, expectativas, riesgos de
        dependencia. Si los canales de ingreso pueden abrirse informalmente, esas condiciones se
        adhieren antes de que la comunidad haya tenido oportunidad de evaluarlas. Una lista
        declarada, modificable solo mediante decisiones Estratégicas, mantiene las obligaciones de
        la comunidad bajo su propio control.
      whatToDefine: >-
        Nombra cada fuente de ingreso que la comunidad tiene actualmente y referencia el Protocolo
        de Economía Interna para la regla de que cualquier nuevo canal de ingreso requiere una
        decisión Estratégica.
      placeholders:
        - >-
          Enumera las fuentes de ingreso actuales, o indica que no hay ninguna. Referencia la
          sección de Interfaces de Ingresos Externos en el Protocolo de Economía Interna.
    fr:
      title: Sources de revenus
      whyItMatters: >-
        Chaque source de revenus comporte des contreparties — obligations de déclaration, attentes,
        risques de dépendance. Si des canaux de revenus peuvent s'ouvrir de manière informelle, ces
        contreparties s'attachent avant que la communauté ait eu l'occasion de les évaluer. Une
        liste unique et déclarée, modifiable uniquement par décision Stratégique, maintient les
        obligations de la communauté sous son propre contrôle.
      whatToDefine: >-
        Nomme chaque source de revenus actuelle de la communauté, et renvoie au Protocole d'économie
        interne pour la règle selon laquelle tout nouveau canal de revenus nécessite une décision
        Stratégique.
      placeholders:
        - >-
          Liste les sources de revenus actuelles, ou indique qu'il n'y en a aucune. Renvoie à la
          section Interfaces de revenus externes du Protocole d'économie interne.
    pt-br:
      title: Fontes de Receita
      whyItMatters: >-
        Toda fonte de receita carrega amarras — exigências de prestação de contas, expectativas,
        riscos de dependência. Se canais de receita podem se abrir informalmente, essas amarras se
        conectam antes que a comunidade tenha tido a chance de avaliá-las. Uma única lista
        declarada, alterada apenas por decisões Estratégicas, mantém as obrigações da comunidade sob
        seu próprio controle.
      whatToDefine: >-
        Nomeie cada fonte de receita que a comunidade tem atualmente e faça referência ao Protocolo
        de Economia Interna para a regra de que qualquer novo canal de receita requer uma decisão
        Estratégica.
      placeholders:
        - >-
          Liste as fontes de receita atuais, ou declare que não há nenhuma. Faça referência à seção
          Interfaces de Receita Externa no Protocolo de Economia Interna.
  ownsClauses:
    - 5.3.2
- key: treasury-ruleset.spending-authority
  artifact: treasury-ruleset
  order: 2
  clauseRefs:
    - 5.3.3
    - 5.7.1
  i18n:
    en:
      title: Spending Authority
      whyItMatters: >-
        When spending authority is vague, two failure modes appear: either every small decision
        escalates and nothing gets done, or a single steward quietly accumulates discretion no one
        ever voted to grant them. A table of amounts, decision types, and authorized bodies removes
        the ambiguity and makes unauthorized spending immediately visible.
      whatToDefine: >-
        Define spending tiers by amount and the decision type, authorized body, and mechanism for
        each. Multi-year contracts and debt should sit in their own (Constitutional) tier.
      placeholders:
        - Up to delegated limit (e.g. €X)
        - Operational
        - Finance Steward
        - Delegated
        - Any amount above delegated limit
        - Strategic
        - Full Members
        - Vote
        - Multi-year contracts, debt, or structural financial obligations
        - Constitutional
        - Full Members
        - Supermajority + ratification
    de:
      title: Ausgabenbefugnis
      whyItMatters: >-
        Wenn die Ausgabenbefugnis vage ist, treten zwei Fehlermodi auf: Entweder eskaliert jede
        kleine Entscheidung und nichts wird erledigt, oder eine einzelne Stewardship-Person häuft
        still Ermessensspielraum an, den ihr niemand je per Abstimmung eingeräumt hat. Eine Tabelle
        mit Beträgen, Entscheidungstypen und befugten Gremien beseitigt die Mehrdeutigkeit und macht
        unautorisierte Ausgaben sofort sichtbar.
      whatToDefine: >-
        Definiert Ausgabenstufen nach Betrag sowie den Entscheidungstyp, das befugte Gremium und den
        Mechanismus für jede Stufe. Mehrjährige Verträge und Schulden sollten in einer eigenen
        (konstitutionellen) Stufe stehen.
      placeholders:
        - Bis zur delegierten Grenze (z. B. €X)
        - Operativ
        - Finanz-Steward
        - Delegiert
        - Jeder Betrag über der delegierten Grenze
        - Strategisch
        - Vollmitglieder
        - Abstimmung
        - Mehrjährige Verträge, Schulden oder strukturelle finanzielle Verpflichtungen
        - Konstitutionell
        - Vollmitglieder
        - Supermehrheit + Ratifizierung
    es:
      title: Autoridad de Gasto
      whyItMatters: >-
        Cuando la autoridad de gasto es vaga, aparecen dos modos de fallo: o cada pequeña decisión
        escala y nada se hace, o un solo administrador acumula silenciosamente discrecionalidad que
        nadie votó concederle. Una tabla con montos, tipos de decisión y órganos autorizados elimina
        la ambigüedad y hace que el gasto no autorizado sea inmediatamente visible.
      whatToDefine: >-
        Define niveles de gasto por monto y el tipo de decisión, órgano autorizado y mecanismo para
        cada uno. Los contratos plurianuales y la deuda DEBERÍAN tener su propio nivel
        (Constitucional).
      placeholders:
        - Hasta el límite delegado (p. ej. €X)
        - Operacional
        - Administrador/a de Finanzas
        - Delegado
        - Cualquier monto por encima del límite delegado
        - Estratégico
        - Miembros Plenos
        - Votación
        - Contratos plurianuales, deuda u obligaciones financieras estructurales
        - Constitucional
        - Miembros Plenos
        - Supermayoría + ratificación
    fr:
      title: Autorité de dépense
      whyItMatters: >-
        Quand l'autorité de dépense est floue, deux modes de défaillance apparaissent : soit chaque
        petite décision est escaladée et rien n'avance, soit un·e intendant·e accumule discrètement
        un pouvoir discrétionnaire que personne n'a jamais voté. Un tableau indiquant les montants,
        les types de décision et les organes autorisés supprime l'ambiguïté et rend immédiatement
        visible toute dépense non autorisée.
      whatToDefine: >-
        Définis des paliers de dépense par montant avec le type de décision, l'organe autorisé et le
        mécanisme pour chacun. Les contrats pluriannuels et la dette DEVRAIENT avoir leur propre
        palier (Constitutionnel).
      placeholders:
        - Jusqu'à la limite déléguée (p. ex. X €)
        - Opérationnel
        - Intendant·e des finances
        - Délégué
        - Tout montant au-delà de la limite déléguée
        - Stratégique
        - Membres à part entière
        - Vote
        - Contrats pluriannuels, dette ou obligations financières structurelles
        - Constitutionnel
        - Membres à part entière
        - Supermajorité + ratification
    pt-br:
      title: Autoridade de Gastos
      whyItMatters: >-
        Quando a autoridade de gastos é vaga, surgem dois modos de falha: ou cada pequena decisão é
        escalada e nada anda, ou uma única pessoa responsável acumula silenciosamente uma
        discricionariedade que ninguém votou para conceder. Uma tabela com valores, tipos de decisão
        e órgãos autorizados elimina a ambiguidade e torna qualquer gasto não autorizado
        imediatamente visível.
      whatToDefine: >-
        Defina os escalões de gasto por valor e o tipo de decisão, órgão autorizado e mecanismo para
        cada um. Contratos plurianuais e dívidas DEVERIAM ficar em seu próprio escalão
        (Constitucional).
      placeholders:
        - 'Até o limite delegado (ex.: R$ X)'
        - Operacional
        - Pessoa Responsável pelas Finanças
        - Delegado
        - Qualquer valor acima do limite delegado
        - Estratégica
        - Membros Plenos
        - Votação
        - Contratos plurianuais, dívidas ou obrigações financeiras estruturais
        - Constitucional
        - Membros Plenos
        - Supermaioria + ratificação
  ownsClauses:
    - 5.3.3
    - 5.7.1
- key: treasury-ruleset.transparency-and-reporting
  artifact: treasury-ruleset
  order: 3
  clauseRefs:
    - 5.3.4
    - 5.3.5
    - 5.6.1
  i18n:
    en:
      title: Transparency and Reporting
      whyItMatters: >-
        Opacity in a treasury compounds: one missing disclosure invites another, and before long
        members can no longer verify whether the community's money is being handled as they agreed.
        Making real-time visibility the baseline — and requiring any exception to be named,
        justified, and time-bounded — keeps audit within reach of every member, not just stewards.
      whatToDefine: >-
        State the visibility default for each treasury account. Where direct visibility is not
        possible (e.g. some bank accounts), define a periodic reporting cadence with a named owner.
      placeholders:
        - >-
          Primary treasury (e.g. Safe multi-sig): all Full Members hold at minimum read access;
          real-time visibility.
        - >-
          Other declared accounts: direct multi-user read access if supported; otherwise periodic
          balance and transaction summary.
        - >-
          All spending decisions reference the linked governance record (vote ID or delegated
          decision log).
    de:
      title: Transparenz und Berichtswesen
      whyItMatters: >-
        Intransparenz in der Kasse potenziert sich: Eine fehlende Offenlegung lädt zur nächsten ein,
        und bald können die Mitglieder nicht mehr überprüfen, ob das Geld der Gemeinschaft so
        verwaltet wird, wie sie es vereinbart haben. Echtzeit-Sichtbarkeit als Ausgangslage zu
        setzen — und jede Ausnahme namentlich, begründet und zeitlich begrenzt zu verlangen — hält
        die Prüfbarkeit für jedes Mitglied erreichbar, nicht nur für Stewards.
      whatToDefine: >-
        Legt den Sichtbarkeitsstandard für jedes Kassenkonto fest. Wo direkte Einsicht nicht möglich
        ist (z. B. bei manchen Bankkonten), definiert einen periodischen Berichtszyklus mit einer
        namentlich benannten verantwortlichen Person.
      placeholders:
        - >-
          Primäre Kasse (z. B. Safe Multi-Sig): Alle Vollmitglieder haben mindestens Lesezugriff;
          Echtzeit-Sichtbarkeit.
        - >-
          Andere deklarierte Konten: direkter Mehrbenutzerzugriff zum Lesen, falls unterstützt;
          andernfalls periodische Saldo- und Transaktionsübersicht.
        - >-
          Alle Ausgabenentscheidungen verweisen auf den verknüpften Governance-Eintrag
          (Abstimmungs-ID oder delegiertes Entscheidungsprotokoll).
    es:
      title: Transparencia y Reportes
      whyItMatters: >-
        La opacidad en una tesorería se acumula: una divulgación faltante invita a otra, y antes de
        que te des cuenta los miembros ya no pueden verificar si el dinero de la comunidad se está
        gestionando como acordaron. Hacer de la visibilidad en tiempo real la línea base — y exigir
        que cualquier excepción sea nombrada, justificada y limitada en el tiempo — mantiene la
        auditoría al alcance de cada miembro, no solo de los administradores.
      whatToDefine: >-
        Establece la visibilidad por defecto para cada cuenta de tesorería. Donde la visibilidad
        directa no sea posible (p. ej. algunas cuentas bancarias), define una cadencia de reporte
        periódico con un responsable nombrado.
      placeholders:
        - >-
          Tesorería principal (p. ej. multi-firma Safe): todos los Miembros Plenos tienen como
          mínimo acceso de lectura; visibilidad en tiempo real.
        - >-
          Otras cuentas declaradas: acceso directo de lectura multiusuario si es compatible; de lo
          contrario, resumen periódico de saldo y transacciones.
        - >-
          Todas las decisiones de gasto referencian el registro de gobernanza vinculado (ID de
          votación o registro de decisiones delegadas).
    fr:
      title: Transparence et rapports
      whyItMatters: >-
        L'opacité dans une trésorerie s'accumule : une divulgation manquante en invite une autre, et
        bientôt les membres ne peuvent plus vérifier si l'argent de la communauté est géré comme ils
        l'avaient convenu. Faire de la visibilité en temps réel la référence — et exiger que toute
        exception soit nommée, justifiée et limitée dans le temps — maintient l'audit à la portée de
        chaque membre, pas seulement des intendant·e·s.
      whatToDefine: >-
        Indique le niveau de visibilité par défaut pour chaque compte de trésorerie. Lorsque la
        visibilité directe n'est pas possible (p. ex. certains comptes bancaires), définis une
        cadence de reporting périodique avec un·e responsable nommé·e.
      placeholders:
        - >-
          Trésorerie principale (p. ex. multi-sig Safe) : tous les Membres à part entière disposent
          au minimum d'un accès en lecture ; visibilité en temps réel.
        - >-
          Autres comptes déclarés : accès en lecture multi-utilisateur direct si possible ; sinon,
          résumé périodique des soldes et transactions.
        - >-
          Toutes les décisions de dépense font référence à l'enregistrement de gouvernance associé
          (identifiant de vote ou journal des décisions déléguées).
    pt-br:
      title: Transparência e Prestação de Contas
      whyItMatters: >-
        A opacidade em uma tesouraria se acumula: uma divulgação ausente convida outra, e em pouco
        tempo os membros já não conseguem verificar se o dinheiro da comunidade está sendo gerido
        como acordaram. Tornar a visibilidade em tempo real a linha de base — e exigir que qualquer
        exceção seja nomeada, justificada e com prazo definido — mantém a auditoria ao alcance de
        cada membro, não só das pessoas responsáveis.
      whatToDefine: >-
        Declare o padrão de visibilidade para cada conta da tesouraria. Onde a visibilidade direta
        não for possível (ex.: algumas contas bancárias), defina uma cadência periódica de prestação
        de contas com um responsável nomeado.
      placeholders:
        - >-
          Tesouraria principal (ex.: multi-sig Safe): todos os Membros Plenos têm, no mínimo, acesso
          de leitura; visibilidade em tempo real.
        - >-
          Outras contas declaradas: acesso direto de leitura para múltiplos usuários, se houver
          suporte; caso contrário, resumo periódico de saldo e transações.
        - >-
          Todas as decisões de gasto fazem referência ao registro de governança vinculado (ID da
          votação ou registro de decisão delegada).
  ownsClauses:
    - 5.3.4
    - 5.3.5
    - 5.6.1
- key: treasury-ruleset.reserve-risk-and-debt-constraints
  artifact: treasury-ruleset
  order: 4
  clauseRefs:
    - 5.3.6
  i18n:
    en:
      title: Reserve, Risk, and Debt Constraints
      whyItMatters: >-
        Debt and recurring commitments bind the community beyond the people currently in it — future
        members inherit the obligations. Forbidding them unless a Strategic vote explicitly
        authorizes keeps long-term constraints from being entered into casually, and preserves the
        option to stay lightweight.
      whatToDefine: >-
        State the rules on debt, recurring obligations, contingency reserves, and off-treasury
        financial instruments. Default to "not allowed without Strategic vote" for anything that
        binds the future.
      placeholders:
        - allowed only via Strategic vote.
        - recurring costs / contracts allowed only via Strategic vote.
        - reserve target, or state that one is not yet defined.
        - loans, investments, guarantees only via Strategic vote.
    de:
      title: Rücklagen-, Risiko- und Schuldenbeschränkungen
      whyItMatters: >-
        Schulden und wiederkehrende Verpflichtungen binden die Gemeinschaft über die aktuellen
        Mitglieder hinaus — zukünftige Mitglieder erben die Verpflichtungen. Sie nur zuzulassen,
        wenn eine Strategische Abstimmung sie ausdrücklich genehmigt, verhindert, dass langfristige
        Bindungen beiläufig eingegangen werden, und bewahrt die Möglichkeit, schlank zu bleiben.
      whatToDefine: >-
        Legt die Regeln zu Schulden, wiederkehrenden Verpflichtungen, Rücklagen und außerhalb der
        Kasse geführten Finanzinstrumenten fest. Standard ist „nicht erlaubt ohne Strategische
        Abstimmung" für alles, was die Zukunft bindet.
      placeholders:
        - nur per Strategischer Abstimmung zulässig.
        - wiederkehrende Kosten / Verträge nur per Strategischer Abstimmung zulässig.
        - Rücklagenziel, oder feststellen, dass noch keines definiert ist.
        - Darlehen, Investitionen, Bürgschaften nur per Strategischer Abstimmung.
    es:
      title: Reservas, Riesgos y Restricciones de Deuda
      whyItMatters: >-
        La deuda y los compromisos recurrentes vinculan a la comunidad más allá de las personas que
        actualmente la integran — los futuros miembros heredan las obligaciones. Prohibirlas salvo
        que una votación Estratégica las autorice explícitamente evita que se contraigan
        restricciones a largo plazo de manera casual y preserva la opción de mantenerse ligeros.
      whatToDefine: >-
        Establece las reglas sobre deuda, obligaciones recurrentes, reservas de contingencia e
        instrumentos financieros fuera de tesorería. Por defecto: "no permitido sin votación
        Estratégica" para todo lo que comprometa el futuro.
      placeholders:
        - permitida solo mediante votación Estratégica.
        - costes recurrentes / contratos permitidos solo mediante votación Estratégica.
        - objetivo de reserva, o indicar que aún no se ha definido.
        - préstamos, inversiones, garantías solo mediante votación Estratégica.
    fr:
      title: Réserve, risque et contraintes d'endettement
      whyItMatters: >-
        La dette et les engagements récurrents lient la communauté au-delà des personnes qui en font
        actuellement partie — les futurs membres héritent des obligations. Les interdire sauf
        autorisation explicite par vote Stratégique empêche que des contraintes à long terme soient
        contractées à la légère, et préserve la possibilité de rester léger.
      whatToDefine: >-
        Indique les règles concernant la dette, les engagements récurrents, les réserves de
        contingence et les instruments financiers hors trésorerie. Par défaut, « non autorisé sans
        vote Stratégique » pour tout ce qui engage l'avenir.
      placeholders:
        - autorisée uniquement par vote Stratégique.
        - coûts récurrents / contrats autorisés uniquement par vote Stratégique.
        - objectif de réserve, ou indiquer qu'il n'est pas encore défini.
        - prêts, investissements, garanties uniquement par vote Stratégique.
    pt-br:
      title: Restrições de Reserva, Risco e Dívida
      whyItMatters: >-
        Dívida e compromissos recorrentes vinculam a comunidade para além das pessoas que estão nela
        hoje — futuros membros herdam as obrigações. Proibi-los a menos que uma votação Estratégica
        autorize explicitamente impede que restrições de longo prazo sejam assumidas de forma
        leviana e preserva a opção de manter a estrutura enxuta.
      whatToDefine: >-
        Declare as regras sobre dívida, obrigações recorrentes, reservas de contingência e
        instrumentos financeiros fora da tesouraria. Padrão para "não permitido sem votação
        Estratégica" para qualquer coisa que vincule o futuro.
      placeholders:
        - permitida apenas via votação Estratégica.
        - custos / contratos recorrentes permitidos apenas via votação Estratégica.
        - meta de reserva, ou declare que ainda não está definida.
        - empréstimos, investimentos, garantias apenas via votação Estratégica.
  ownsClauses:
    - 5.3.6
- key: treasury-ruleset.conflict-of-interest-rules
  artifact: treasury-ruleset
  order: 5
  clauseRefs:
    - 5.4.3
  i18n:
    en:
      title: Conflict-of-Interest Rules
      whyItMatters: >-
        Even well-intentioned people unconsciously tilt decisions toward their own interests; a rule
        that requires disclosure and abstention removes the judgment call and the social pressure to
        "trust someone." Self-approval of spending is the single most common way small governance
        systems quietly lose integrity, so the rule is stated bluntly.
      whatToDefine: >-
        State the no-self-approval rule and the disclose-and-abstain rule for any member with a
        direct financial interest in a spending decision.
      placeholders:
        - Requesters may not approve their own spending requests.
        - >-
          Members with a direct financial interest in a spending decision must declare it and
          abstain.
        - Treasury role holders may not authorize unilateral spending beyond the delegated limit.
    de:
      title: Interessenkonfliktregeln
      whyItMatters: >-
        Selbst gut meinende Menschen neigen unbewusst dazu, Entscheidungen zu ihren eigenen Gunsten
        zu kippen; eine Regel, die Offenlegung und Enthaltung verlangt, beseitigt die subjektive
        Einschätzung und den sozialen Druck, jemandem „einfach zu vertrauen". Die Selbstgenehmigung
        von Ausgaben ist der häufigste Weg, auf dem kleine Governance-Systeme still ihre Integrität
        verlieren — daher wird die Regel unmissverständlich formuliert.
      whatToDefine: >-
        Formuliert die Regel gegen Selbstgenehmigung und die Regel zur Offenlegung und Enthaltung
        für jedes Mitglied mit einem direkten finanziellen Interesse an einer Ausgabenentscheidung.
      placeholders:
        - Antragstellende dürfen ihre eigenen Ausgabenanträge nicht genehmigen.
        - >-
          Mitglieder mit einem direkten finanziellen Interesse an einer Ausgabenentscheidung müssen
          dieses offenlegen und sich enthalten.
        - >-
          Kassenverantwortliche dürfen keine einseitigen Ausgaben über die delegierte Grenze hinaus
          autorisieren.
    es:
      title: Reglas de Conflicto de Intereses
      whyItMatters: >-
        Incluso las personas bienintencionadas inclinan inconscientemente las decisiones hacia sus
        propios intereses; una regla que exige divulgación y abstención elimina el juicio subjetivo
        y la presión social de "confiar en alguien". La autoaprobación de gastos es la forma más
        común en que los sistemas de gobernanza pequeños pierden silenciosamente su integridad, por
        eso la regla se enuncia sin rodeos.
      whatToDefine: >-
        Establece la regla de no autoaprobación y la regla de divulgar y abstenerse para cualquier
        miembro con un interés financiero directo en una decisión de gasto.
      placeholders:
        - Los solicitantes no PUEDEN aprobar sus propias solicitudes de gasto.
        - >-
          Los miembros con un interés financiero directo en una decisión de gasto DEBEN declararlo y
          abstenerse.
        - >-
          Los titulares de roles de tesorería no PUEDEN autorizar gastos unilaterales por encima del
          límite delegado.
    fr:
      title: Règles relatives aux conflits d'intérêts
      whyItMatters: >-
        Même des personnes bien intentionnées orientent inconsciemment les décisions vers leurs
        propres intérêts ; une règle exigeant la divulgation et l'abstention supprime le jugement
        subjectif et la pression sociale de « faire confiance à quelqu'un ». L'auto-approbation des
        dépenses est le moyen le plus courant par lequel les petits systèmes de gouvernance perdent
        silencieusement leur intégrité, c'est pourquoi la règle est énoncée sans détour.
      whatToDefine: >-
        Énonce la règle de non-auto-approbation et la règle de divulgation-et-abstention pour tout
        membre ayant un intérêt financier direct dans une décision de dépense.
      placeholders:
        - Les demandeur·euse·s NE DOIVENT PAS approuver leurs propres demandes de dépense.
        - >-
          Les membres ayant un intérêt financier direct dans une décision de dépense DOIVENT le
          déclarer et s'abstenir.
        - >-
          Les titulaires de rôles de trésorerie NE DOIVENT PAS autoriser de dépense unilatérale
          au-delà de la limite déléguée.
    pt-br:
      title: Regras de Conflito de Interesses
      whyItMatters: >-
        Até mesmo pessoas bem-intencionadas inclinam, inconscientemente, decisões a favor dos
        próprios interesses; uma regra que exige divulgação e abstenção elimina o julgamento
        subjetivo e a pressão social para "confiar em alguém". A autoaprovação de gastos é,
        isoladamente, a forma mais comum pela qual pequenos sistemas de governança perdem
        integridade silenciosamente, por isso a regra é colocada de forma direta.
      whatToDefine: >-
        Declare a regra de não autoaprovação e a regra de divulgar-e-abster-se para qualquer membro
        com interesse financeiro direto em uma decisão de gasto.
      placeholders:
        - Quem solicita NÃO DEVE aprovar suas próprias solicitações de gasto.
        - >-
          Membros com interesse financeiro direto em uma decisão de gasto DEVEM declará-lo e
          abster-se.
        - >-
          Quem ocupa cargo na tesouraria NÃO DEVE autorizar gastos unilaterais acima do limite
          delegado.

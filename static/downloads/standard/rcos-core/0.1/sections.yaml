- key: membership-agreement.consent-acknowledgment
  artifact: membership-agreement
  order: 5
  clauseRefs:
    - 3.2.2
  i18n:
    en:
      title: Consent Acknowledgment
      whyItMatters: >-
        Consent that is assumed is consent that can be denied later. Requiring an explicit act —
        signing, clicking, acknowledging — at a known moment binds the member to the specific
        artifact versions in force that day, and gives the community a defensible record that the
        agreement was entered freely and knowingly.
      whatToDefine: >-
        Describe the act of consent (signature, in-app acknowledgment, etc.), and what artifact
        versions the member is consenting to at that moment.
      placeholders: []
    de:
      title: Zustimmungserklärung
      whyItMatters: >-
        Zustimmung, die angenommen wird, ist Zustimmung, die später bestritten werden kann. Einen
        ausdrücklichen Akt zu verlangen — Unterschrift, Klick, Bestätigung — zu einem bekannten
        Zeitpunkt bindet das Mitglied an die an diesem Tag geltenden Artefaktversionen und gibt der
        Gemeinschaft einen belastbaren Nachweis, dass die Vereinbarung freiwillig und wissentlich
        eingegangen wurde.
      whatToDefine: >-
        Beschreibe den Akt der Zustimmung (Unterschrift, In-App-Bestätigung usw.) und welche
        Artefaktversionen das Mitglied zu diesem Zeitpunkt anerkennt.
      placeholders: []
    es:
      title: Reconocimiento de Consentimiento
      whyItMatters: >-
        El consentimiento que se asume es consentimiento que puede negarse después. Exigir un acto
        explícito — firmar, hacer clic, reconocer — en un momento conocido vincula al miembro con
        las versiones específicas de los artefactos vigentes ese día, y da a la comunidad un
        registro defendible de que el acuerdo fue celebrado libre y conscientemente.
      whatToDefine: >-
        Describe el acto de consentimiento (firma, reconocimiento en la aplicación, etc.) y a qué
        versiones de los artefactos está consintiendo el miembro en ese momento.
      placeholders: []
    fr:
      title: Reconnaissance du consentement
      whyItMatters: >-
        Un consentement présumé est un consentement qui peut être nié ultérieurement. Exiger un acte
        explicite — signer, cliquer, reconnaître — à un moment connu lie le membre aux versions
        spécifiques des artefacts en vigueur ce jour-là, et fournit à la communauté une preuve
        défendable que l'accord a été conclu librement et en connaissance de cause.
      whatToDefine: >-
        Décris l'acte de consentement (signature, reconnaissance dans l'application, etc.), et à
        quelles versions d'artefacts le membre consent à ce moment-là.
      placeholders: []
    pt-br:
      title: Reconhecimento de Consentimento
      whyItMatters: >-
        Consentimento presumido é consentimento que pode ser negado depois. Exigir um ato explícito
        — assinar, clicar, reconhecer — em um momento conhecido vincula o membro às versões
        específicas dos artefatos vigentes naquele dia, e dá à comunidade um registro defensável de
        que o acordo foi firmado livre e conscientemente.
      whatToDefine: >-
        Descreva o ato de consentimento (assinatura, reconhecimento no aplicativo etc.) e a quais
        versões dos artefatos o membro está consentindo naquele momento.
      placeholders: []
  ownsClauses: []

- key: internal-economy-protocol.contribution-recognition-mechanism
  artifact: internal-economy-protocol
  order: 2
  clauseRefs:
    - 5.2.2
    - 5.2.5
  i18n:
    en:
      title: Contribution Recognition Mechanism
      whyItMatters: >-
        Without a defined mechanism, "who gets credit" becomes a matter of who is loudest or closest
        to whoever decides. Specifying what qualifies, how it's recorded, who validates, and how to
        dispute it turns recognition into something a member can actually rely on — and blocks
        recognition from silently mutating into governance influence.
      whatToDefine: >-
        State what qualifies, how recognitions are recorded, who validates, what they unlock (or do
        not unlock), and how members dispute a record.
      placeholders:
        - which activities count, and at whose declaration.
        - structured channel; informal/self-reported channel.
        - automatic / role holder / nomination process.
        - >-
          recognition affects internal-unit balance only; does not grant additional governance
          rights beyond the membership state.
        - window and process for contesting a record.
    de:
      title: Mechanismus zur Beitragsanerkennung
      whyItMatters: >-
        Ohne einen definierten Mechanismus wird „wer Anerkennung bekommt" zu einer Frage davon, wer
        am lautesten ist oder der entscheidenden Person am nächsten steht. Wenn festgelegt wird, was
        zählt, wie es dokumentiert wird, wer es bestätigt und wie man es anfechten kann, wird
        Anerkennung zu etwas, auf das sich ein Mitglied tatsächlich verlassen kann — und es wird
        verhindert, dass Anerkennung sich stillschweigend in Governance-Einfluss verwandelt.
      whatToDefine: >-
        Lege fest, was zählt, wie Anerkennungen dokumentiert werden, wer sie bestätigt, was sie
        bewirken (oder nicht bewirken), und wie Mitglieder einen Eintrag anfechten können.
      placeholders:
        - welche Aktivitäten zählen und auf wessen Erklärung hin.
        - strukturierter Kanal; informeller/selbst gemeldeter Kanal.
        - automatisch / Rolleninhaber\*in / Nominierungsprozess.
        - >-
          Anerkennung wirkt sich nur auf das Guthaben interner Einheiten aus; sie gewährt keine
          zusätzlichen Governance-Rechte über den Mitgliedschaftsstatus hinaus.
        - Frist und Verfahren zur Anfechtung eines Eintrags.
    es:
      title: Mecanismo de Reconocimiento de Contribuciones
      whyItMatters: >-
        Sin un mecanismo definido, "quién obtiene crédito" se convierte en una cuestión de quién
        habla más fuerte o está más cerca de quien decide. Especificar qué califica, cómo se
        registra, quién valida y cómo se impugna convierte el reconocimiento en algo con lo que un
        miembro puede contar de verdad — y evita que el reconocimiento mute silenciosamente en
        influencia de gobernanza.
      whatToDefine: >-
        Indica qué califica, cómo se registran los reconocimientos, quién valida, qué desbloquean (o
        no desbloquean) y cómo los miembros impugnan un registro.
      placeholders:
        - qué actividades cuentan y a declaración de quién.
        - canal estructurado; canal informal/auto-reportado.
        - automático / titular de rol / proceso de nominación.
        - >-
          el reconocimiento solo afecta el saldo de unidades internas; no otorga derechos de
          gobernanza adicionales más allá del estado de membresía.
        - plazo y proceso para impugnar un registro.
    fr:
      title: Mécanisme de reconnaissance des contributions
      whyItMatters: >-
        Sans mécanisme défini, « qui obtient du crédit » devient une affaire de qui parle le plus
        fort ou de qui est le plus proche de la personne qui décide. Spécifier ce qui est éligible,
        comment c'est enregistré, qui valide et comment contester transforme la reconnaissance en
        quelque chose sur lequel un membre peut réellement compter — et empêche la reconnaissance de
        se muer silencieusement en influence de gouvernance.
      whatToDefine: >-
        Indique ce qui est éligible, comment les reconnaissances sont enregistrées, qui valide, ce
        qu'elles débloquent (ou ne débloquent pas) et comment les membres contestent un
        enregistrement.
      placeholders:
        - quelles activités comptent, et sur déclaration de qui.
        - canal structuré ; canal informel / auto-déclaré.
        - automatique / titulaire de rôle / processus de nomination.
        - >-
          la reconnaissance affecte uniquement le solde en unités internes ; elle n'accorde pas de
          droits de gouvernance supplémentaires au-delà de l'état d'adhésion.
        - délai et processus pour contester un enregistrement.
    pt-br:
      title: Mecanismo de Reconhecimento de Contribuições
      whyItMatters: >-
        Sem um mecanismo definido, "quem recebe crédito" se torna uma questão de quem grita mais
        alto ou está mais próximo de quem decide. Especificar o que se qualifica, como é registrado,
        quem valida e como contestar transforma o reconhecimento em algo com que um membro pode
        realmente contar — e impede que o reconhecimento se transforme silenciosamente em influência
        sobre a governança.
      whatToDefine: >-
        Indique o que se qualifica, como os reconhecimentos são registrados, quem valida, o que eles
        desbloqueiam (ou não desbloqueiam) e como os membros contestam um registro.
      placeholders:
        - quais atividades contam, e por declaração de quem.
        - canal estruturado; canal informal/autodeclarado.
        - automático / titular de papel / processo de nomeação.
        - >-
          o reconhecimento afeta apenas o saldo da unidade interna; não concede direitos adicionais
          de governança além do estado de membresia.
        - janela e processo para contestar um registro.
  ownsClauses:
    - 5.2.2
    - 5.2.5
- key: internal-economy-protocol.internal-units
  artifact: internal-economy-protocol
  order: 3
  clauseRefs:
    - 5.2.4
    - 5.2.5
  i18n:
    en:
      title: Internal Units
      whyItMatters: >-
        Internal units tend to grow powers no one voted for — decay, caps, transferability,
        governance weight — unless each property is nailed down in writing. Listing issuance,
        transfer rules, privacy, and explicit non-governance status makes the units tools of
        recognition rather than quiet shadow currencies.
      whatToDefine: >-
        If your community uses internal units (XP, ECO, credits, etc.), define each unit's purpose,
        issuance, transferability, decay, cap, fraud prevention, and privacy. Explicitly state that
        units do not grant governance rights beyond the membership state.
      placeholders:
        - Unit A
        - Unit B
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
    de:
      title: Interne Einheiten
      whyItMatters: >-
        Interne Einheiten neigen dazu, Befugnisse zu entwickeln, über die niemand abgestimmt hat —
        Verfall, Obergrenzen, Übertragbarkeit, Governance-Gewicht — es sei denn, jede Eigenschaft
        wird schriftlich festgehalten. Die Auflistung von Ausgabe, Übertragungsregeln, Datenschutz
        und explizitem Nicht-Governance-Status macht die Einheiten zu Werkzeugen der Anerkennung
        statt zu stillen Schattenwährungen.
      whatToDefine: >-
        Wenn deine Gemeinschaft interne Einheiten verwendet (XP, ECO, Credits usw.), definiere für
        jede Einheit Zweck, Ausgabe, Übertragbarkeit, Verfall, Obergrenze, Betrugsprävention und
        Datenschutz. Stelle explizit fest, dass Einheiten keine Governance-Rechte über den
        Mitgliedschaftsstatus hinaus gewähren.
      placeholders:
        - Einheit A
        - Einheit B
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
    es:
      title: Unidades Internas
      whyItMatters: >-
        Las unidades internas tienden a adquirir poderes que nadie votó — decaimiento, topes,
        transferibilidad, peso en la gobernanza — a menos que cada propiedad quede fijada por
        escrito. Listar la emisión, reglas de transferencia, privacidad y su estatus explícito de
        no-gobernanza hace que las unidades sean herramientas de reconocimiento en lugar de monedas
        sombra silenciosas.
      whatToDefine: >-
        Si tu comunidad usa unidades internas (XP, ECO, créditos, etc.), define para cada unidad su
        propósito, emisión, transferibilidad, decaimiento, tope, prevención de fraude y privacidad.
        Indica explícitamente que las unidades no otorgan derechos de gobernanza más allá del estado
        de membresía.
      placeholders:
        - Unidad A
        - Unidad B
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...
        - ...

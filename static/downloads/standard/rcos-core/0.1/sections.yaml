- key: experiment-template.required-fields
  artifact: experiment-template
  order: 0
  clauseRefs:
    - 8.3.1
    - 8.3.2
    - 8.3.3
    - 8.3.4
    - 8.3.5
    - 8.7.3
  i18n:
    en:
      title: Required Fields
      whyItMatters: >-
        Without scope, duration, success criteria, and rollback, an "experiment" is just a permanent
        change with friendlier branding. Forcing every proposal to specify what it changes, when it
        ends, how it will be reviewed, and how it will be rolled back keeps experimentation
        reversible — and prevents the experiment label from being used to bypass deliberation.
      whatToDefine: >-
        Fill each field. Maximum duration is set by your Change Protocol. The decision authority
        must come from the Decision Matrix.
      placeholders:
        - short experiment name.
        - member name.
        - exactly what is being tried; which artifacts and behaviors are affected.
        - start date — end date; maximum duration as set by the Change Protocol.
        - at minimum one midpoint check-in; specify dates and what is reviewed.
        - observable conditions that would justify making the change permanent.
        - observable conditions that would terminate the experiment early.
        - what triggers rollback and how it is executed.
        - who may start, extend, modify, or terminate the experiment, per the Decision Matrix.
        - >-
          all artifacts affected by the experiment must be explicitly labelled as experimental for
          the duration.
        - >-
          acknowledge that an emergency suspension may be invoked under the Change Protocol if a
          credible safety risk emerges.
    de:
      title: Pflichtfelder
      whyItMatters: >-
        Ohne Umfang, Dauer, Erfolgskriterien und Rollback ist ein „Experiment" nur eine dauerhafte
        Änderung mit freundlicherem Etikett. Indem jeder Vorschlag angeben muss, was er ändert, wann
        er endet, wie er überprüft wird und wie er rückgängig gemacht wird, bleibt Experimentieren
        umkehrbar — und das Experiment-Label kann nicht dazu verwendet werden, die Beratung zu
        umgehen.
      whatToDefine: >-
        Fülle jedes Feld aus. Die maximale Dauer wird durch dein Änderungsprotokoll festgelegt. Die
        Entscheidungsbefugnis muss aus der Entscheidungsmatrix stammen.
      placeholders:
        - kurzer Experimentname.
        - Name des Mitglieds.
        - was genau ausprobiert wird; welche Artefakte und Verhaltensweisen betroffen sind.
        - Startdatum — Enddatum; maximale Dauer gemäß Änderungsprotokoll.
        - mindestens ein Zwischencheck; gib Termine und Prüfgegenstände an.
        - beobachtbare Bedingungen, die eine dauerhafte Übernahme der Änderung rechtfertigen würden.
        - beobachtbare Bedingungen, die das Experiment vorzeitig beenden würden.
        - was ein Rollback auslöst und wie es durchgeführt wird.
        - >-
          wer das Experiment gemäß der Entscheidungsmatrix starten, verlängern, ändern oder beenden
          darf.
        - >-
          alle vom Experiment betroffenen Artefakte müssen für die Dauer des Experiments
          ausdrücklich als experimentell gekennzeichnet werden.
        - >-
          bestätige, dass eine Notaussetzung gemäß Änderungsprotokoll eingeleitet werden kann, wenn
          ein glaubhaftes Sicherheitsrisiko entsteht.
    es:
      title: Campos Requeridos
      whyItMatters: >-
        Sin alcance, duración, criterios de éxito y reversión, un "experimento" es simplemente un
        cambio permanente con un nombre más amigable. Obligar a cada propuesta a especificar qué
        cambia, cuándo termina, cómo se evaluará y cómo se revertirá mantiene la experimentación
        reversible — e impide que la etiqueta de experimento se use para eludir la deliberación.
      whatToDefine: >-
        Completa cada campo. La duración máxima la establece tu Protocolo de Cambios. La autoridad
        de decisión DEBE provenir de la Matriz de Decisiones.
      placeholders:
        - nombre breve del experimento.
        - nombre del miembro.
        - exactamente qué se está probando; qué artefactos y comportamientos se ven afectados.
        - >-
          fecha de inicio — fecha de fin; duración máxima según lo establecido por el Protocolo de
          Cambios.
        - al menos una revisión intermedia; especifica fechas y qué se revisa.
        - condiciones observables que justificarían hacer el cambio permanente.
        - condiciones observables que terminarían el experimento anticipadamente.
        - qué activa la reversión y cómo se ejecuta.
        - >-
          quién puede iniciar, extender, modificar o terminar el experimento, según la Matriz de
          Decisiones.
        - >-
          todos los artefactos afectados por el experimento DEBEN estar explícitamente etiquetados
          como experimentales durante toda su duración.
        - >-
          reconoce que se PUEDE invocar una suspensión de emergencia bajo el Protocolo de Cambios si
          surge un riesgo de seguridad creíble.
    fr:
      title: Champs obligatoires
      whyItMatters: >-
        Sans périmètre, durée, critères de succès et procédure de retour arrière, une «
        expérimentation » n'est qu'un changement permanent avec un habillage plus sympathique.
        Obliger chaque proposition à préciser ce qu'elle modifie, quand elle se termine, comment
        elle sera évaluée et comment elle sera annulée garantit que l'expérimentation reste
        réversible — et empêche l'étiquette « expérimentation » d'être utilisée pour contourner la
        délibération.
      whatToDefine: >-
        Remplis chaque champ. La durée maximale est définie par ton Protocole de changement.
        L'autorité de décision doit provenir de la Matrice de décision.
      placeholders:
        - nom court de l'expérimentation.
        - nom du membre.
        - ce qui est exactement testé ; quels artefacts et comportements sont concernés.
        - >-
          date de début — date de fin ; durée maximale telle que définie par le Protocole de
          changement.
        - au minimum un bilan à mi-parcours ; précise les dates et ce qui est évalué.
        - conditions observables qui justifieraient de rendre le changement permanent.
        - conditions observables qui mettraient fin à l'expérimentation de manière anticipée.
        - ce qui déclenche le retour arrière et comment il est exécuté.
        - >-
          qui peut démarrer, prolonger, modifier ou terminer l'expérimentation, selon la Matrice de
          décision.
        - >-
          tous les artefacts concernés par l'expérimentation DOIVENT être explicitement étiquetés
          comme expérimentaux pendant toute la durée.
        - >-
          reconnaître qu'une suspension d'urgence PEUT être invoquée en vertu du Protocole de
          changement si un risque crédible pour la sécurité apparaît.
    pt-br:
      title: Campos Obrigatórios
      whyItMatters: >-
        Sem escopo, duração, critérios de sucesso e rollback, um "experimento" não passa de uma
        mudança permanente com uma roupagem mais simpática. Exigir que toda proposta especifique o
        que muda, quando termina, como será revisada e como será revertida mantém a experimentação
        reversível — e impede que o rótulo de "experimento" seja usado para contornar a deliberação.
      whatToDefine: >-
        Preencha cada campo. A duração máxima é definida pelo seu Protocolo de Mudança (Change
        Protocol). A autoridade de decisão deve vir da Matriz de Decisão (Decision Matrix).
      placeholders:
        - nome curto do experimento.
        - nome do membro.
        - exatamente o que está sendo testado; quais artefatos e comportamentos são afetados.
        - >-
          data de início — data de término; duração máxima conforme definida pelo Protocolo de
          Mudança.
        - no mínimo um check-in no meio do percurso; especifique as datas e o que será revisado.
        - condições observáveis que justificariam tornar a mudança permanente.
        - condições observáveis que encerrariam o experimento antes do prazo.
        - o que dispara o rollback e como ele é executado.
        - >-
          quem pode iniciar, estender, modificar ou encerrar o experimento, conforme a Matriz de
          Decisão.
        - >-
          todos os artefatos afetados pelo experimento DEVEM ser explicitamente rotulados como
          experimentais durante toda a duração.
        - >-
          reconheça que uma suspensão de emergência PODE ser invocada nos termos do Protocolo de
          Mudança caso surja um risco de segurança crível.
  ownsClauses: []
- key: experiment-template.expiry-and-renewal
  artifact: experiment-template
  order: 1
  clauseRefs: []
  i18n:
    en:
      title: Expiry and Renewal
      whyItMatters: >-
        The community needs the option to revert. Auto-expiry forces a deliberate decision to make
        the change permanent — not a slow drift in which nobody remembers it was ever conditional.
      whatToDefine: >-
        State the auto-expiry rule, the renewal mechanism, and the obligation to record results in
        the Learning Log.
      placeholders:
        - >-
          Experiments expire automatically at the end of their defined duration unless explicitly
          renewed via a new proposal. Renewal requires a new Strategic vote.
        - Results and learnings are recorded in the Learning Log.
    de:
      title: Ablauf und Verlängerung
      whyItMatters: >-
        Die Gemeinschaft braucht die Möglichkeit, Änderungen rückgängig zu machen. Automatisches
        Ablaufen erzwingt eine bewusste Entscheidung, die Änderung dauerhaft zu übernehmen — statt
        eines schleichenden Drifts, bei dem sich niemand mehr erinnert, dass sie jemals vorläufig
        war.
      whatToDefine: >-
        Halte die Regel zum automatischen Ablauf, den Verlängerungsmechanismus und die Pflicht zur
        Ergebniserfassung im Lernprotokoll fest.
      placeholders:
        - >-
          Experimente laufen automatisch am Ende ihrer festgelegten Dauer ab, sofern sie nicht
          ausdrücklich durch einen neuen Vorschlag verlängert werden. Eine Verlängerung erfordert
          eine neue strategische Abstimmung.
        - Ergebnisse und Erkenntnisse werden im Lernprotokoll festgehalten.
    es:
      title: Expiración y Renovación
      whyItMatters: >-
        La comunidad necesita la opción de revertir. La expiración automática obliga a tomar una
        decisión deliberada para hacer el cambio permanente — en lugar de una deriva lenta en la que
        nadie recuerda que alguna vez fue condicional.
      whatToDefine: >-
        Indica la regla de expiración automática, el mecanismo de renovación y la obligación de
        registrar los resultados en el Registro de Aprendizajes.
      placeholders:
        - >-
          Los experimentos expiran automáticamente al final de su duración definida, a menos que se
          renueven explícitamente mediante una nueva propuesta. La renovación requiere una nueva
          votación Estratégica.
        - Los resultados y aprendizajes se registran en el Registro de Aprendizajes.
    fr:
      title: Expiration et renouvellement
      whyItMatters: >-
        La communauté a besoin de pouvoir revenir en arrière. L'expiration automatique impose une
        décision délibérée pour rendre le changement permanent — plutôt qu'une dérive lente où plus
        personne ne se souvient que c'était conditionnel.
      whatToDefine: >-
        Indique la règle d'expiration automatique, le mécanisme de renouvellement et l'obligation de
        consigner les résultats dans le Journal d'apprentissage.
      placeholders:
        - >-
          Les expérimentations expirent automatiquement à la fin de leur durée définie, sauf
          renouvellement explicite via une nouvelle proposition. Le renouvellement nécessite un
          nouveau vote Stratégique.
        - Les résultats et enseignements sont consignés dans le Journal d'apprentissage.
    pt-br:
      title: Expiração e Renovação
      whyItMatters: >-
        A comunidade precisa ter a opção de reverter. A expiração automática obriga uma decisão
        deliberada para tornar a mudança permanente — em vez de uma deriva lenta na qual ninguém
        lembra que ela já foi condicional.
      whatToDefine: >-
        Declare a regra de expiração automática, o mecanismo de renovação e a obrigação de registrar
        os resultados no Registro de Aprendizados.
      placeholders:
        - >-
          Os experimentos expiram automaticamente ao final da duração definida, a menos que sejam
          explicitamente renovados por meio de uma nova proposta. A renovação requer uma nova
          votação Estratégica.
        - Os resultados e aprendizados são registrados no Registro de Aprendizados.
  ownsClauses: []

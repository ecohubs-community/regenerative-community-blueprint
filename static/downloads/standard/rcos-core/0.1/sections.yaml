- key: internal-economy-protocol.commons-vs-private-classification
  artifact: internal-economy-protocol
  order: 0
  clauseRefs:
    - 5.1.1
    - 5.1.2
    - 5.1.3
    - 5.1.4
    - 5.1.5
    - 5.6.2
  i18n:
    en:
      title: Commons vs. Private Classification
      whyItMatters: >-
        Unclassified resources are where quiet privatization happens — someone starts treating a
        shared asset as personal, or a private asset gets quietly absorbed into community
        obligations, and by the time anyone notices the norm has shifted. Explicit classification,
        with stewards and transfer rules named up front, makes any change to that status a visible
        governance act rather than a creeping fact.
      whatToDefine: >-
        For each resource the community holds, declare classification (Commons / Private), name a
        steward, define access rules, and state transfer constraints. Unclassified resources must
        not be allocated, encumbered, monetized, or transferred until classified.
      placeholders:
        - e.g. RCOS specification and artifacts
        - Commons / Private
        - steward role
        - who reads / writes
        - transfer constraints
        - e.g. Shared treasury
        - ...
        - ...
        - ...
        - ...
        - e.g. Community website / domains
        - ...
        - ...
        - ...
        - ...
        - e.g. Brand and social accounts
        - ...
        - ...
        - ...
        - ...
        - e.g. Land or physical infrastructure
        - ...
        - ...
        - ...
        - ...
    de:
      title: 'Klassifikation: Gemeingut vs. Privateigentum'
      whyItMatters: >-
        Nicht klassifizierte Ressourcen sind der Ort, an dem stille Privatisierung geschieht —
        jemand beginnt, ein gemeinschaftliches Gut als persönliches zu behandeln, oder ein privates
        Gut wird stillschweigend in Gemeinschaftsverpflichtungen übernommen, und wenn es jemand
        bemerkt, hat sich die Norm bereits verschoben. Eine explizite Klassifikation — mit vorab
        benannten Verwalter\*innen und Übertragungsregeln — macht jede Statusänderung zu einem
        sichtbaren Governance-Akt statt zu einer schleichenden Tatsache.
      whatToDefine: >-
        Lege für jede Ressource der Gemeinschaft die Klassifikation fest (Gemeingut /
        Privateigentum), benenne eine\*n Verwalter\*in, definiere Zugangsregeln und formuliere
        Übertragungsbeschränkungen. Nicht klassifizierte Ressourcen dürfen weder zugewiesen,
        belastet, monetarisiert noch übertragen werden, bis sie klassifiziert sind.
      placeholders:
        - z. B. RCOS-Spezifikation und Artefakte
        - Gemeingut / Privateigentum
        - Verwalterrolle
        - wer liest / schreibt
        - Übertragungsbeschränkungen
        - z. B. Gemeinschaftskasse
        - ...
        - ...
        - ...
        - ...
        - z. B. Gemeinschaftswebsite / Domains
        - ...
        - ...
        - ...
        - ...
        - z. B. Marke und Social-Media-Konten
        - ...
        - ...
        - ...
        - ...
        - z. B. Grundstück oder physische Infrastruktur
        - ...
        - ...
        - ...
        - ...
    es:
      title: Clasificación de Bienes Comunes vs. Privados
      whyItMatters: >-
        Los recursos sin clasificar son donde ocurre la privatización silenciosa: alguien empieza a
        tratar un bien compartido como personal, o un bien privado se absorbe silenciosamente en las
        obligaciones comunitarias, y para cuando alguien se da cuenta la norma ya cambió. La
        clasificación explícita, con custodios y reglas de transferencia nombrados desde el inicio,
        convierte cualquier cambio de ese estado en un acto de gobernanza visible en lugar de un
        hecho que se impone gradualmente.
      whatToDefine: >-
        Para cada recurso que posea la comunidad, declara la clasificación (Bienes Comunes /
        Privado), nombra un custodio, define reglas de acceso y establece restricciones de
        transferencia. Los recursos sin clasificar no DEBEN ser asignados, gravados, monetizados ni
        transferidos hasta que estén clasificados.
      placeholders:
        - p. ej. Especificación y artefactos RCOS
        - Bienes Comunes / Privado
        - rol de custodio
        - quién lee / escribe
        - restricciones de transferencia
        - p. ej. Tesorería compartida
        - ...
        - ...

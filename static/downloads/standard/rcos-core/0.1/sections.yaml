- key: operations-manual.temporary-and-ad-hoc-responsibilities
  artifact: operations-manual
  order: 1
  clauseRefs:
    - 7.1.5
    - 7.1.4
    - 7.7.1
  i18n:
    en:
      title: Temporary and Ad-Hoc Responsibilities
      whyItMatters: >-
        Ad-hoc tasks quietly calcify into permanent unpaid jobs — usually on whoever said yes once.
        A hard time-box and a forced review make the difference between "I covered for a week" and
        "apparently this is my role now."
      whatToDefine: >-
        State that any temporary responsibility must be time-bounded at assignment, documented,
        reviewed before expiry, and either formalised or terminated.
      placeholders:
        - Explicitly time-bounded from the outset (specific end date or completion condition).
        - Documented as temporary at the time of assignment.
        - Reviewed before the end date; converted to a formal role or terminated.
        - >-
          Maximum duration of any temporary responsibility before it must be formally assigned or
          terminated — e.g. 90 days.
    de:
      title: Temporäre und Ad-hoc-Verantwortlichkeiten
      whyItMatters: >-
        Ad-hoc-Aufgaben verfestigen sich still und leise zu dauerhaften, unbezahlten Jobs — meist
        bei der Person, die einmal Ja gesagt hat. Eine feste Zeitbegrenzung und eine erzwungene
        Überprüfung machen den Unterschied zwischen „Ich bin eine Woche eingesprungen" und
        „Anscheinend ist das jetzt meine Aufgabe."
      whatToDefine: >-
        Haltet fest, dass jede temporäre Verantwortlichkeit bei der Zuweisung zeitlich begrenzt,
        dokumentiert und vor Ablauf überprüft werden muss — und dann entweder formalisiert oder
        beendet wird.
      placeholders:
        - >-
          Von Anfang an ausdrücklich zeitlich begrenzt sein (konkretes Enddatum oder
          Abschlussbedingung).
        - Zum Zeitpunkt der Zuweisung als temporär dokumentiert werden.
        - >-
          Vor dem Enddatum überprüft und entweder in eine formale Rolle überführt oder beendet
          werden.
        - >-
          Maximale Dauer einer temporären Verantwortlichkeit, bevor sie formal zugewiesen oder
          beendet werden muss — z. B. 90 Tage.
    es:
      title: Responsabilidades Temporales y Ad-Hoc
      whyItMatters: >-
        Las tareas ad-hoc se solidifican silenciosamente en trabajos permanentes no remunerados —
        generalmente sobre quien dijo que sí una vez. Un límite temporal estricto y una revisión
        obligatoria marcan la diferencia entre "cubrí durante una semana" y "aparentemente este es
        mi rol ahora."
      whatToDefine: >-
        Establece que toda responsabilidad temporal DEBE estar acotada en el tiempo al asignarla,
        documentada, revisada antes del vencimiento, y formalizada o terminada.
      placeholders:
        - >-
          Estar explícitamente acotada en el tiempo desde el inicio (fecha de fin específica o
          condición de finalización).
        - Documentarse como temporal en el momento de la asignación.
        - Revisarse antes de la fecha de fin; convertirse en un rol formal o terminarse.
        - >-
          Duración máxima de cualquier responsabilidad temporal antes de que DEBA asignarse
          formalmente o terminarse — p. ej. 90 días.
    fr:
      title: Responsabilités temporaires et ponctuelles
      whyItMatters: >-
        Les tâches ponctuelles se transforment silencieusement en postes permanents non rémunérés —
        généralement portés par la personne qui a dit oui une fois. Une durée maximale stricte et
        une revue obligatoire font la différence entre « j'ai assuré le relais pendant une semaine »
        et « apparemment c'est mon rôle maintenant. »
      whatToDefine: >-
        Indique que toute responsabilité temporaire DOIT être limitée dans le temps dès son
        attribution, documentée, revue avant expiration, puis soit formalisée soit clôturée.
      placeholders:
        - >-
          Explicitement limitée dans le temps dès le départ (date de fin spécifique ou condition
          d'achèvement).
        - Documentée comme temporaire au moment de l'attribution.
        - Revue avant la date de fin ; convertie en rôle formel ou clôturée.
        - >-
          Durée maximale de toute responsabilité temporaire avant qu'elle ne DOIVE être formellement
          attribuée ou clôturée — p. ex. 90 jours.
    pt-br:
      title: Responsabilidades Temporárias e Ad-Hoc
      whyItMatters: >-
        Tarefas ad-hoc silenciosamente se cristalizam em trabalhos permanentes não remunerados —
        geralmente sobre quem disse sim uma vez. Um prazo rígido e uma revisão obrigatória fazem a
        diferença entre "cobri por uma semana" e "aparentemente esse é o meu papel agora".
      whatToDefine: >-
        Estabeleça que qualquer responsabilidade temporária DEVE ter prazo definido na atribuição,
        ser documentada, revisada antes da expiração e formalizada ou encerrada.
      placeholders:
        - >-
          Explicitamente limitada no tempo desde o início (data final específica ou condição de
          conclusão).
        - Documentada como temporária no momento da atribuição.
        - Revisada antes da data final; convertida em papel formal ou encerrada.
        - >-
          Duração máxima de qualquer responsabilidade temporária antes que precise ser formalmente
          atribuída ou encerrada — por exemplo, 90 dias.
  ownsClauses:
    - 7.1.5
- key: operations-manual.role-and-domain-interfaces
  artifact: operations-manual
  order: 2
  clauseRefs:
    - 7.6.3
    - 7.3.4
  i18n:
    en:
      title: Role and Domain Interfaces
      whyItMatters: >-
        Most operational failures happen not inside a role but between roles — at the boundaries
        where work moves from one owner to the next. Naming the handoffs turns invisible
        dependencies into reviewable ones, and prevents "I thought you had it" failures.
      whatToDefine: >-
        For each pair of roles that pass work to each other, name the handoff and the type of work
        transferred.
      placeholders:
        - role
        - role
        - what is handed off
        - role
        - role
        - ...
    de:
      title: Rollen- und Zuständigkeitsschnittstellen
      whyItMatters: >-
        Die meisten Betriebsfehler passieren nicht innerhalb einer Rolle, sondern zwischen Rollen —
        an den Schnittstellen, wo Arbeit von einer verantwortlichen Person zur nächsten wandert. Die
        Übergaben zu benennen macht unsichtbare Abhängigkeiten überprüfbar und verhindert „Ich
        dachte, du hättest dich drum gekümmert"-Situationen.
      whatToDefine: >-
        Benennt für jedes Rollenpaar, das Arbeit weitergibt, die Übergabe und die Art der
        übertragenen Arbeit.
      placeholders:
        - Rolle
        - Rolle
        - was übergeben wird
        - Rolle
        - Rolle
        - ...
    es:
      title: Interfaces entre Roles y Dominios
      whyItMatters: >-
        La mayoría de los fallos operativos no ocurren dentro de un rol sino entre roles — en las
        fronteras donde el trabajo pasa de un responsable al siguiente. Nombrar los traspasos
        convierte dependencias invisibles en dependencias revisables, y previene los fallos de "yo
        pensaba que lo tenías tú".
      whatToDefine: >-
        Para cada par de roles que se pasan trabajo entre sí, nombra el traspaso y el tipo de
        trabajo transferido.
      placeholders:
        - rol
        - rol
        - qué se traspasa
        - rol
        - rol
        - ...
    fr:
      title: Interfaces entre rôles et domaines
      whyItMatters: >-
        La plupart des défaillances opérationnelles ne surviennent pas à l'intérieur d'un rôle mais
        entre les rôles — aux frontières où le travail passe d'un·e responsable à l'autre. Nommer
        les passations transforme des dépendances invisibles en dépendances vérifiables, et prévient
        les échecs du type « je pensais que c'était toi qui t'en occupais ».
      whatToDefine: >-
        Pour chaque paire de rôles qui se transmettent du travail, nomme la passation et le type de
        travail transféré.
      placeholders:
        - rôle
        - rôle
        - ce qui est transmis
        - rôle
        - rôle
        - ...
    pt-br:
      title: Interfaces entre Papéis e Domínios
      whyItMatters: >-
        A maioria das falhas operacionais não acontece dentro de um papel, mas entre papéis — nas
        fronteiras onde o trabalho passa de um responsável para outro. Nomear as transições
        transforma dependências invisíveis em revisáveis e evita falhas do tipo "achei que você
        tivesse cuidado disso".
      whatToDefine: >-
        Para cada par de papéis que passa trabalho entre si, nomeie a transição e o tipo de trabalho
        transferido.
      placeholders:
        - papel
        - papel
        - o que é entregue
        - papel
        - papel
        - ...
  ownsClauses: []
- key: operations-manual.workload-boundaries
  artifact: operations-manual
  order: 3
  clauseRefs:
    - 7.4.1
    - 7.4.2
    - 7.4.3
    - 7.4.4
    - 7.7.3
  i18n:
    en:
      title: Workload Boundaries
      whyItMatters: >-
        Unbounded coordination load is the default failure mode of volunteer communities — it
        quietly burns out the most committed members until they leave. Explicit, reviewable limits
        make capacity a shared concern rather than a private burden.
      whatToDefine: >-
        Set bounds on meeting load, role load, response-time expectations, and the path for
        renegotiating responsibilities.
      placeholders:
        - recurring meeting cadence and maximum duration; rules for extraordinary meetings.
        - cap if any; rule for flagging overload; resolution window.
        - non-urgent async; urgent operational; safety-critical.
        - process for redistributing responsibilities; resolution window.
        - >-
          how persistent overload, burnout risk, chronic non-participation, or dependency on
          over-functioning individuals is detected, and how it is routed into the Layer 4 review or
          repair process.
    de:
      title: Belastungsgrenzen
      whyItMatters: >-
        Unbegrenzte Koordinationslast ist der Standard-Fehlermodus von Freiwilligengemeinschaften —
        sie brennt still die engagiertesten Mitglieder aus, bis sie gehen. Explizite, überprüfbare
        Grenzen machen Kapazität zu einer gemeinsamen Angelegenheit statt zu einer privaten Last.
      whatToDefine: >-
        Legt Grenzen für Sitzungsbelastung, Rollenbelastung, Reaktionszeit-Erwartungen und den Weg
        zur Neuverhandlung von Verantwortlichkeiten fest.
      placeholders:
        - >-
          Wiederkehrender Sitzungsrhythmus und maximale Dauer; Regeln für außerordentliche
          Sitzungen.
        - Obergrenze falls vorhanden; Regel zur Überlastungsmeldung; Lösungsfrist.
        - Nicht-dringend asynchron; dringend betrieblich; sicherheitskritisch.
        - Verfahren zur Umverteilung von Verantwortlichkeiten; Lösungsfrist.
        - >-
          Wie anhaltende Überlastung, Burnout-Risiko, chronische Nichtbeteiligung oder Abhängigkeit
          von überfunktionierenden Personen erkannt und in den Review- oder Reparaturprozess von
          Schicht 4 überführt wird.
    es:
      title: Límites de Carga de Trabajo
      whyItMatters: >-
        La carga de coordinación ilimitada es el modo de fallo predeterminado de las comunidades
        voluntarias — quema silenciosamente a los miembros más comprometidos hasta que se van.
        Límites explícitos y revisables hacen de la capacidad una preocupación compartida en lugar
        de una carga privada.
      whatToDefine: >-
        Establece límites para la carga de reuniones, carga de roles, expectativas de tiempo de
        respuesta, y el camino para renegociar responsabilidades.
      placeholders:
        - >-
          cadencia de reuniones recurrentes y duración máxima; reglas para reuniones
          extraordinarias.
        - tope si lo hay; regla para señalar sobrecarga; plazo de resolución.
        - asíncrono no urgente; operativo urgente; crítico para la seguridad.
        - proceso para redistribuir responsabilidades; plazo de resolución.
        - >-
          cómo se detecta la sobrecarga persistente, el riesgo de agotamiento, la no participación
          crónica o la dependencia de personas que sobrefuncionan, y cómo se deriva al proceso de
          revisión o reparación de la Capa 4.
    fr:
      title: Limites de charge de travail
      whyItMatters: >-
        Une charge de coordination illimitée est le mode de défaillance par défaut des communautés
        bénévoles — elle épuise silencieusement les membres les plus engagés jusqu'à ce qu'ils
        partent. Des limites explicites et vérifiables font de la capacité une préoccupation
        collective plutôt qu'un fardeau individuel.
      whatToDefine: >-
        Définis des limites pour la charge de réunions, la charge par rôle, les attentes en termes
        de temps de réponse, et le processus de renégociation des responsabilités.
      placeholders:
        - >-
          cadence des réunions récurrentes et durée maximale ; règles pour les réunions
          extraordinaires.
        - plafond le cas échéant ; règle pour signaler une surcharge ; délai de résolution.
        - asynchrone non urgent ; opérationnel urgent ; critique pour la sécurité.
        - processus de redistribution des responsabilités ; délai de résolution.
        - >-
          comment la surcharge persistante, le risque d'épuisement, la non-participation chronique
          ou la dépendance envers des personnes en sur-fonctionnement sont détectés, et comment ils
          sont orientés vers le processus de révision ou de réparation de la Couche 4.
    pt-br:
      title: Limites de Carga de Trabalho
      whyItMatters: >-
        Carga de coordenação sem limites é o modo padrão de falha de comunidades voluntárias — ela
        silenciosamente esgota as pessoas mais comprometidas até que elas saiam. Limites explícitos
        e revisáveis fazem da capacidade uma preocupação compartilhada em vez de um fardo privado.
      whatToDefine: >-
        Defina limites para carga de reuniões, carga de papéis, expectativas de tempo de resposta e
        o caminho para renegociar responsabilidades.
      placeholders:
        - cadência das reuniões recorrentes e duração máxima; regras para reuniões extraordinárias.
        - limite, se houver; regra para sinalizar sobrecarga; janela de resolução.
        - assíncrono não urgente; operacional urgente; crítico para a segurança.
        - processo para redistribuir responsabilidades; janela de resolução.
        - >-
          como a sobrecarga persistente, o risco de esgotamento, a não participação crônica ou a
          dependência de pessoas que assumem funções em excesso são detectados, e como são
          encaminhados ao processo de revisão ou reparação da Camada 4.
  ownsClauses:
    - 7.4.1
    - 7.4.2
    - 7.4.3
    - 7.4.4
    - 7.7.3
- key: operations-manual.operational-continuity
  artifact: operations-manual
  order: 4
  clauseRefs:
    - 7.5.1
    - 7.5.2
    - 7.5.3
  i18n:
    en:
      title: Operational Continuity
      whyItMatters: >-
        A community that depends on one irreplaceable person is one illness, one conflict, or one
        exit away from collapse. Naming the single points of failure — honestly — and building
        handover into every role is what keeps the community surviving its founders.
      whatToDefine: >-
        Name current single points of failure honestly. State the handover requirement for each role
        and the cadence of continuity review.
      placeholders:
        - honest list of single points of failure; recruitment plan to reduce concentration.
        - >-
          reference handover requirements per role in the Role Registry; handover must be completed
          before a role is vacated.
        - quarterly; ad hoc on role change.
    de:
      title: Betriebliche Kontinuität
      whyItMatters: >-
        Eine Gemeinschaft, die von einer einzigen unersetzlichen Person abhängt, ist nur eine
        Krankheit, einen Konflikt oder einen Austritt vom Zusammenbruch entfernt. Die Single Points
        of Failure ehrlich zu benennen — und Übergaben in jede Rolle einzubauen — ist das, was die
        Gemeinschaft ihre Gründer:innen überleben lässt.
      whatToDefine: >-
        Benennt die aktuellen Single Points of Failure ehrlich. Haltet die Übergabe-Anforderungen
        pro Rolle und den Rhythmus der Kontinuitätsüberprüfung fest.
      placeholders:
        - >-
          Ehrliche Auflistung der Single Points of Failure; Rekrutierungsplan zur Verringerung der
          Konzentration.
        - >-
          Verweis auf die Übergabe-Anforderungen pro Rolle im Rollenregister; Übergabe muss
          abgeschlossen sein, bevor eine Rolle aufgegeben wird.
        - Vierteljährlich; ad hoc bei Rollenwechsel.
    es:
      title: Continuidad Operativa
      whyItMatters: >-
        Una comunidad que depende de una persona irremplazable está a una enfermedad, un conflicto o
        una salida de distancia del colapso. Nombrar los puntos únicos de fallo — con honestidad — e
        incorporar el traspaso en cada rol es lo que permite a la comunidad sobrevivir a sus
        fundadores.
      whatToDefine: >-
        Nombra honestamente los puntos únicos de fallo actuales. Establece el requisito de traspaso
        para cada rol y la cadencia de revisión de continuidad.
      placeholders:
        - >-
          lista honesta de puntos únicos de fallo; plan de reclutamiento para reducir la
          concentración.
        - >-
          referencia a los requisitos de traspaso por rol en el Registro de Roles; el traspaso DEBE
          completarse antes de que un rol quede vacante.
        - trimestral; ad hoc ante cambio de rol.
    fr:
      title: Continuité opérationnelle
      whyItMatters: >-
        Une communauté qui dépend d'une personne irremplaçable n'est qu'à une maladie, un conflit ou
        un départ de l'effondrement. Nommer honnêtement les points de défaillance uniques — et
        intégrer la passation dans chaque rôle — c'est ce qui permet à la communauté de survivre à
        ses fondateur·rices.
      whatToDefine: >-
        Nomme honnêtement les points de défaillance uniques actuels. Indique les exigences de
        passation pour chaque rôle et la cadence de revue de continuité.
      placeholders:
        - >-
          liste honnête des points de défaillance uniques ; plan de recrutement pour réduire la
          concentration.
        - >-
          référence aux exigences de passation par rôle dans le Registre des rôles ; la passation
          DOIT être achevée avant qu'un rôle ne soit libéré.
        - trimestrielle ; ponctuelle lors d'un changement de rôle.
    pt-br:
      title: Continuidade Operacional
      whyItMatters: >-
        Uma comunidade que depende de uma pessoa insubstituível está a uma doença, um conflito ou
        uma saída do colapso. Nomear os pontos únicos de falha — honestamente — e incorporar a
        transição em cada papel é o que mantém a comunidade sobrevivendo aos seus fundadores.
      whatToDefine: >-
        Nomeie os atuais pontos únicos de falha honestamente. Estabeleça a exigência de transição
        para cada papel e a cadência de revisão da continuidade.
      placeholders:
        - >-
          lista honesta de pontos únicos de falha; plano de recrutamento para reduzir a
          concentração.
        - >-
          consulte as exigências de transição por papel no Registro de Papéis; a transição DEVE ser
          concluída antes que um papel seja desocupado.
        - trimestral; ad hoc em caso de mudança de papel.
  ownsClauses:
    - 7.5.1
    - 7.5.2
    - 7.5.3
- key: operations-manual.information-flow-and-anti-gatekeeping
  artifact: operations-manual
  order: 5
  clauseRefs:
    - 7.3.5
    - 7.7.4
    - 7.3.2
  i18n:
    en:
      title: Information Flow and Anti-Gatekeeping
      whyItMatters: >-
        Whoever controls access to information controls the community, whether they mean to or not.
        Making access rules explicit — and disallowing sole points of access — is what prevents
        informal gatekeepers from accumulating the kind of power the governance system is supposed
        to check.
      whatToDefine: >-
        State which records are open to all Full Members, the response window for information
        requests, and the rule against sole points of access for governance-relevant information.
      placeholders:
        - Governance decisions accessible to all Full Members.
        - Meeting notes published within X hours.
        - Membership state and role assignments accessible.
        - Contribution records accessible.
        - Information request response window.
        - >-
          Withholding access to information members are entitled to is an accountability trigger
          under Layer 4.
        - >-
          No role or individual may be the sole point of access for information required by other
          role holders.
    de:
      title: Informationsfluss und Anti-Gatekeeping
      whyItMatters: >-
        Wer den Zugang zu Informationen kontrolliert, kontrolliert die Gemeinschaft — ob
        beabsichtigt oder nicht. Zugriffsregeln explizit zu machen — und alleinige Zugangspunkte zu
        untersagen — verhindert, dass informelle Gatekeeper die Art von Macht ansammeln, die das
        Governance-System eigentlich kontrollieren soll.
      whatToDefine: >-
        Haltet fest, welche Unterlagen allen Vollmitgliedern zugänglich sind, wie lang die
        Antwortfrist für Informationsanfragen ist und welche Regel gegen alleinige Zugangspunkte für
        governance-relevante Informationen gilt.
      placeholders:
        - Governance-Entscheidungen sind für alle Vollmitglieder zugänglich.
        - Sitzungsprotokolle werden innerhalb von X Stunden veröffentlicht.
        - Mitgliedschaftsstatus und Rollenzuweisungen sind einsehbar.
        - Beitragsnachweise sind einsehbar.
        - Antwortfrist für Informationsanfragen.
        - >-
          Das Zurückhalten von Informationen, auf die Mitglieder Anspruch haben, ist ein
          Rechenschaftsauslöser gemäß Schicht 4.
        - >-
          Keine Rolle und keine Einzelperson darf der alleinige Zugangspunkt für Informationen sein,
          die andere Rolleninhaber:innen benötigen.
    es:
      title: Flujo de Información y Anti-Monopolización
      whyItMatters: >-
        Quien controla el acceso a la información controla la comunidad, lo pretenda o no. Hacer
        explícitas las reglas de acceso — y prohibir los puntos únicos de acceso — es lo que impide
        que los guardianes informales acumulen el tipo de poder que el sistema de gobernanza se
        supone que debe controlar.
      whatToDefine: >-
        Indica qué registros están abiertos a todos los Miembros Plenos, el plazo de respuesta para
        solicitudes de información, y la regla contra los puntos únicos de acceso para información
        relevante de gobernanza.
      placeholders:
        - Decisiones de gobernanza accesibles para todos los Miembros Plenos.
        - Actas de reuniones publicadas en un plazo de X horas.
        - Estado de membresía y asignaciones de roles accesibles.
        - Registros de contribuciones accesibles.
        - Plazo de respuesta a solicitudes de información.
        - >-
          Retener el acceso a información a la que los miembros tienen derecho es un activador de
          rendición de cuentas según la Capa 4.
        - >-
          Ningún rol o individuo PUEDE ser el único punto de acceso para información requerida por
          otros titulares de roles.
    fr:
      title: Flux d'information et anti-verrouillage
      whyItMatters: >-
        Quiconque contrôle l'accès à l'information contrôle la communauté, intentionnellement ou
        non. Rendre les règles d'accès explicites — et interdire les points d'accès uniques — c'est
        ce qui empêche les gardien·nes informel·les d'accumuler le type de pouvoir que le système de
        gouvernance est censé contrôler.
      whatToDefine: >-
        Indique quels registres sont accessibles à tou·tes les Membres actifs, le délai de réponse
        aux demandes d'information, et la règle interdisant les points d'accès uniques pour
        l'information pertinente à la gouvernance.
      placeholders:
        - Décisions de gouvernance accessibles à tou·tes les Membres actifs.
        - Notes de réunion publiées dans un délai de X heures.
        - État des adhésions et affectations de rôles accessibles.
        - Registres de contributions accessibles.
        - Délai de réponse aux demandes d'information.
        - >-
          Retenir l'accès à des informations auxquelles les membres ont droit déclenche le processus
          de responsabilité prévu par la Couche 4.
        - >-
          Aucun rôle ni individu NE PEUT être le seul point d'accès à une information requise par
          d'autres titulaires de rôle.
    pt-br:
      title: Fluxo de Informação e Antibloqueio de Acesso
      whyItMatters: >-
        Quem controla o acesso à informação controla a comunidade, querendo ou não. Tornar as regras
        de acesso explícitas — e proibir pontos únicos de acesso — é o que impede que guardiões
        informais acumulem o tipo de poder que o sistema de governança deveria conter.
      whatToDefine: >-
        Estabeleça quais registros são abertos a todos os Membros Plenos, a janela de resposta para
        solicitações de informação e a regra contra pontos únicos de acesso a informações relevantes
        para a governança.
      placeholders:
        - Decisões de governança acessíveis a todos os Membros Plenos.
        - Notas de reuniões publicadas em até X horas.
        - Estado de adesão e atribuições de papéis acessíveis.
        - Registros de contribuições acessíveis.
        - Janela de resposta para solicitações de informação.
        - >-
          Negar acesso a informações às quais os membros têm direito é um gatilho de
          responsabilização sob a Camada 4.
        - >-
          Nenhum papel ou indivíduo PODE ser o único ponto de acesso a informações requeridas por
          outros responsáveis por papéis.
  ownsClauses:
    - 7.3.5
    - 7.7.4

- key: governance-protocol.proposal-submission
  artifact: governance-protocol
  order: 0
  clauseRefs:
    - 4.5.1
    - 4.5.2
  i18n:
    en:
      title: Proposal Submission
      whyItMatters: >-
        A decision process that accepts proposals informally — a message, a verbal suggestion, a
        founder's idea — has no reliable way to tell what is actually on the table. Requiring a
        standard submission format, filing location, and mandatory content fields means every
        proposal arrives with the same information, visible to everyone, traceable from day one.
      whatToDefine: >-
        State who may propose, where proposals are submitted, the mandatory content fields, and how
        decision type is determined and challenged.
      placeholders:
        - >-
          Operational decisions — handled by the relevant role holder per the Role Registry; no
          proposal required.
        - Strategic and Constitutional decisions — who may submit, and on what platform.
        - >-
          Mandatory proposal fields: summary, affected layers and artifacts, decision type,
          rationale, risks and mitigations, rollback plan, proposed effective date.
        - Decision type is declared by proposer; defaults to higher-impact type if unclear.
        - Withdrawal rules — when a proposal can be withdrawn and how.
    de:
      title: Antragseinreichung
      whyItMatters: >-
        Ein Entscheidungsprozess, der Anträge informell annimmt — eine Nachricht, ein mündlicher
        Vorschlag, eine Idee der Gründer:innen — hat keine verlässliche Möglichkeit festzustellen,
        was tatsächlich zur Abstimmung steht. Ein standardisiertes Einreichungsformat, ein
        festgelegter Ablageort und verbindliche Inhaltsfelder bedeuten, dass jeder Antrag mit
        denselben Informationen eingeht, für alle sichtbar und von Tag eins an nachvollziehbar.
      whatToDefine: >-
        Lege fest, wer Anträge stellen darf, wo Anträge eingereicht werden, welche Inhaltsfelder
        verpflichtend sind und wie der Entscheidungstyp bestimmt und angefochten wird.
      placeholders:
        - >-
          Operative Entscheidungen — werden von der zuständigen Rolleninhaber:in gemäß dem
          Rollenregister bearbeitet; kein Antrag erforderlich.
        - >-
          Strategische und Verfassungsentscheidungen — wer einreichen darf und auf welcher
          Plattform.
        - >-
          Pflichtfelder im Antrag: Zusammenfassung, betroffene Layer und Artefakte,
          Entscheidungstyp, Begründung, Risiken und Gegenmaßnahmen, Rücknahmeplan, vorgeschlagenes
          Wirksamkeitsdatum.
        - >-
          Der Entscheidungstyp wird von der antragstellenden Person angegeben; im Zweifelsfall gilt
          der höhere Wirkungstyp.
        - Rücknahmeregeln — wann ein Antrag zurückgezogen werden kann und wie.
    es:
      title: Presentación de Propuestas
      whyItMatters: >-
        Un proceso de decisión que acepta propuestas de manera informal — un mensaje, una sugerencia
        verbal, una idea del fundador — no tiene forma fiable de saber qué está realmente sobre la
        mesa. Exigir un formato de presentación estándar, una ubicación de archivo y campos de
        contenido obligatorios significa que cada propuesta llega con la misma información, visible
        para todos, rastreable desde el primer día.
      whatToDefine: >-
        Indica quién puede proponer, dónde se presentan las propuestas, los campos de contenido
        obligatorios y cómo se determina y se impugna el tipo de decisión.
      placeholders:
        - >-
          Decisiones operativas — gestionadas por el titular del rol correspondiente según el
          Registro de Roles; no se requiere propuesta.
        - Decisiones estratégicas y constitucionales — quién puede presentarlas y en qué plataforma.
        - >-
          Campos obligatorios de la propuesta: resumen, capas y artefactos afectados, tipo de
          decisión, justificación, riesgos y mitigaciones, plan de reversión, fecha de entrada en
          vigor propuesta.
        - >-
          El tipo de decisión lo declara quien propone; por defecto se asigna el tipo de mayor
          impacto si no está claro.
        - Reglas de retirada — cuándo se puede retirar una propuesta y cómo.
    fr:
      title: Soumission de proposition
      whyItMatters: >-
        Un processus décisionnel qui accepte les propositions de manière informelle — un message,
        une suggestion verbale, une idée du fondateur — n'a aucun moyen fiable de déterminer ce qui
        est réellement sur la table. Exiger un format de soumission standard, un emplacement de
        dépôt et des champs de contenu obligatoires garantit que chaque proposition arrive avec les
        mêmes informations, visible par tous, traçable dès le premier jour.
      whatToDefine: >-
        Indique qui peut proposer, où les propositions sont soumises, les champs de contenu
        obligatoires, et comment le type de décision est déterminé et contesté.
      placeholders:
        - >-
          Décisions opérationnelles — traitées par le titulaire du rôle concerné selon le Registre
          des rôles ; aucune proposition requise.
        - >-
          Décisions stratégiques et constitutionnelles — qui peut soumettre, et sur quelle
          plateforme.
        - >-
          Champs obligatoires de la proposition : résumé, couches et artefacts concernés, type de
          décision, justification, risques et mesures d'atténuation, plan de retour en arrière, date
          d'entrée en vigueur proposée.
        - >-
          Le type de décision est déclaré par le proposant ; par défaut, le type à impact le plus
          élevé s'applique en cas d'ambiguïté.
        - Règles de retrait — quand une proposition peut être retirée et comment.
    pt-br:
      title: Submissão de Propostas
      whyItMatters: >-
        Um processo de decisão que aceita propostas informalmente — uma mensagem, uma sugestão
        verbal, uma ideia de um fundador — não tem como saber com confiabilidade o que está
        realmente em pauta. Exigir um formato padrão de submissão, um local de arquivamento e campos
        de conteúdo obrigatórios significa que toda proposta chega com as mesmas informações,
        visível para todo mundo, rastreável desde o primeiro dia.
      whatToDefine: >-
        Indique quem pode propor, onde as propostas são submetidas, os campos de conteúdo
        obrigatórios e como o tipo de decisão é determinado e contestado.
      placeholders:
        - >-
          Decisões operacionais — tratadas pela pessoa responsável pelo papel correspondente,
          conforme o Registro de Papéis; não exigem proposta.
        - Decisões estratégicas e constitucionais — quem pode submeter e em qual plataforma.
        - >-
          Campos obrigatórios da proposta: resumo, camadas e artefatos afetados, tipo de decisão,
          justificativa, riscos e mitigações, plano de reversão, data efetiva proposta.
        - >-
          O tipo de decisão é declarado pela pessoa proponente; em caso de dúvida, assume-se o tipo
          de maior impacto.
        - Regras de retirada — quando uma proposta pode ser retirada e como.
  ownsClauses:
    - 4.5.1
    - 4.5.2
- key: governance-protocol.review-and-deliberation
  artifact: governance-protocol
  order: 1
  clauseRefs:
    - 4.5.1
    - 4.5.2
  i18n:
    en:
      title: Review and Deliberation
      whyItMatters: >-
        Rushed votes favor whoever is already paying attention and disadvantage everyone else. A
        mandatory deliberation period, tied to the weight of the decision, gives members time to
        read, respond, and surface concerns before the vote opens — so the vote reflects considered
        judgment, not speed of reaction.
      whatToDefine: >-
        Name the deliberation venues and the minimum periods for Strategic and Constitutional
        decisions before a vote may open.
      placeholders:
        - Where deliberation happens (forum, chat, meeting).
        - Minimum deliberation period before a vote opens — Strategic.
        - Minimum deliberation period before a vote opens — Constitutional.
        - >-
          Expectation that members raise concerns during deliberation to avoid the need for
          re-votes.
    de:
      title: Prüfung und Beratung
      whyItMatters: >-
        Überhastete Abstimmungen bevorzugen diejenigen, die ohnehin schon aufmerksam sind, und
        benachteiligen alle anderen. Eine verpflichtende Beratungsfrist, abgestimmt auf die
        Tragweite der Entscheidung, gibt den Mitgliedern Zeit zum Lesen, Reagieren und Einbringen
        von Bedenken, bevor die Abstimmung beginnt — sodass die Abstimmung eine durchdachte
        Beurteilung widerspiegelt, keine Reaktionsgeschwindigkeit.
      whatToDefine: >-
        Benenne die Beratungsorte und die Mindestfristen für strategische und
        Verfassungsentscheidungen, bevor eine Abstimmung eröffnet werden darf.
      placeholders:
        - Wo die Beratung stattfindet (Forum, Chat, Treffen).
        - Mindestberatungsfrist vor Eröffnung einer Abstimmung — strategisch.
        - Mindestberatungsfrist vor Eröffnung einer Abstimmung — Verfassung.
        - >-
          Erwartung, dass Mitglieder Bedenken während der Beratung äußern, um erneute Abstimmungen
          zu vermeiden.
    es:
      title: Revisión y Deliberación
      whyItMatters: >-
        Las votaciones apresuradas favorecen a quien ya está prestando atención y perjudican a todos
        los demás. Un período de deliberación obligatorio, proporcional al peso de la decisión, da a
        los miembros tiempo para leer, responder y plantear inquietudes antes de que se abra la
        votación — de modo que el voto refleje un juicio meditado, no velocidad de reacción.
      whatToDefine: >-
        Indica los espacios de deliberación y los períodos mínimos para decisiones Estratégicas y
        Constitucionales antes de que pueda abrirse una votación.
      placeholders:
        - Dónde se lleva a cabo la deliberación (foro, chat, reunión).
        - Período mínimo de deliberación antes de abrir votación — Estratégica.
        - Período mínimo de deliberación antes de abrir votación — Constitucional.
        - >-
          Expectativa de que los miembros planteen inquietudes durante la deliberación para evitar
          la necesidad de revotaciones.
    fr:
      title: Examen et délibération
      whyItMatters: >-
        Les votes précipités favorisent ceux qui sont déjà attentifs et désavantagent tous les
        autres. Une période de délibération obligatoire, proportionnelle au poids de la décision,
        donne aux membres le temps de lire, répondre et soulever des préoccupations avant
        l'ouverture du vote — afin que le vote reflète un jugement réfléchi, et non une réaction
        rapide.
      whatToDefine: >-
        Nomme les lieux de délibération et les périodes minimales pour les décisions stratégiques et
        constitutionnelles avant qu'un vote puisse être ouvert.
      placeholders:
        - Où se déroule la délibération (forum, chat, réunion).
        - Période minimale de délibération avant l'ouverture d'un vote — Stratégique.
        - Période minimale de délibération avant l'ouverture d'un vote — Constitutionnelle.
        - >-
          Attente que les membres soulèvent leurs préoccupations pendant la délibération pour éviter
          la nécessité de re-votes.
    pt-br:
      title: Análise e Deliberação
      whyItMatters: >-
        Votações apressadas favorecem quem já está prestando atenção e prejudicam todo mundo. Um
        período obrigatório de deliberação, proporcional ao peso da decisão, dá às pessoas membras
        tempo para ler, responder e levantar preocupações antes da abertura da votação — para que o
        voto reflita um juízo ponderado, não a velocidade de reação.
      whatToDefine: >-
        Nomeie os espaços de deliberação e os períodos mínimos para decisões estratégicas e
        constitucionais antes da abertura de uma votação.
      placeholders:
        - Onde a deliberação acontece (fórum, chat, reunião).
        - Período mínimo de deliberação antes da abertura da votação — Estratégica.
        - Período mínimo de deliberação antes da abertura da votação — Constitucional.
        - >-
          Expectativa de que as pessoas membras levantem preocupações durante a deliberação para
          evitar a necessidade de nova votação.
  ownsClauses: []
- key: governance-protocol.decision-execution
  artifact: governance-protocol
  order: 2
  clauseRefs:
    - 4.5.1
    - 4.5.4
  i18n:
    en:
      title: Decision Execution
      whyItMatters: >-
        A passed proposal that never reaches the affected artifact is a decision in name only — the
        rules on the ground still say what they said before. Binding execution to a concrete
        artifact update and version-history entry closes the gap between what was decided and what
        is actually in force.
      whatToDefine: >-
        State what happens when a proposal passes (artifact updates, version history) and when it is
        rejected (archive). Define a time bound for both.
      placeholders:
        - 'On passing: how proposal is filed; affected artifacts updated; version history entry made.'
        - 'On rejection: where proposal is archived.'
        - Time bound for execution after a vote concludes.
    de:
      title: Entscheidungsumsetzung
      whyItMatters: >-
        Ein angenommener Antrag, der nie im betroffenen Artefakt ankommt, ist eine Entscheidung nur
        dem Namen nach — die geltenden Regeln sagen immer noch dasselbe wie vorher. Die Umsetzung an
        eine konkrete Artefakt-Aktualisierung und einen Versionshistorie-Eintrag zu knüpfen,
        schließt die Lücke zwischen dem, was entschieden wurde, und dem, was tatsächlich gilt.
      whatToDefine: >-
        Lege fest, was passiert, wenn ein Antrag angenommen wird (Artefakt-Aktualisierungen,
        Versionshistorie) und wenn er abgelehnt wird (Archivierung). Definiere eine Frist für
        beides.
      placeholders:
        - >-
          Bei Annahme: wie der Antrag abgelegt wird; betroffene Artefakte aktualisiert werden;
          Eintrag in der Versionshistorie erstellt wird.
        - 'Bei Ablehnung: wo der Antrag archiviert wird.'
        - Frist für die Umsetzung nach Abschluss einer Abstimmung.
    es:
      title: Ejecución de la Decisión
      whyItMatters: >-
        Una propuesta aprobada que nunca llega al artefacto afectado es una decisión solo de nombre
        — las reglas vigentes siguen diciendo lo mismo que antes. Vincular la ejecución a una
        actualización concreta del artefacto y a una entrada en el historial de versiones cierra la
        brecha entre lo que se decidió y lo que está realmente en vigor.
      whatToDefine: >-
        Indica qué sucede cuando una propuesta se aprueba (actualización de artefactos, historial de
        versiones) y cuando se rechaza (archivo). Define un plazo para ambos casos.
      placeholders:
        - >-
          Al aprobarse: cómo se archiva la propuesta; artefactos afectados actualizados; entrada en
          el historial de versiones registrada.
        - 'Al rechazarse: dónde se archiva la propuesta.'
        - Plazo para la ejecución después de que concluye una votación.
    fr:
      title: Exécution de la décision
      whyItMatters: >-
        Une proposition adoptée qui ne parvient jamais à l'artefact concerné n'est une décision que
        de nom — les règles en vigueur sur le terrain disent toujours ce qu'elles disaient avant.
        Lier l'exécution à une mise à jour concrète de l'artefact et à une entrée dans l'historique
        des versions comble l'écart entre ce qui a été décidé et ce qui est réellement en vigueur.
      whatToDefine: >-
        Indique ce qui se passe quand une proposition est adoptée (mise à jour des artefacts,
        historique des versions) et quand elle est rejetée (archivage). Définis un délai pour les
        deux cas.
      placeholders:
        - >-
          En cas d'adoption : comment la proposition est classée ; les artefacts concernés sont mis
          à jour ; une entrée dans l'historique des versions est créée.
        - 'En cas de rejet : où la proposition est archivée.'
        - Délai d'exécution après la clôture du vote.
    pt-br:
      title: Execução da Decisão
      whyItMatters: >-
        Uma proposta aprovada que nunca chega ao artefato afetado é uma decisão só no nome — as
        regras na prática continuam dizendo o que diziam antes. Vincular a execução a uma
        atualização concreta de artefato e a uma entrada no histórico de versões fecha a lacuna
        entre o que foi decidido e o que de fato está em vigor.
      whatToDefine: >-
        Indique o que acontece quando uma proposta é aprovada (atualizações de artefatos, histórico
        de versões) e quando é rejeitada (arquivamento). Defina um prazo limite para ambos os casos.
      placeholders:
        - >-
          Em caso de aprovação: como a proposta é arquivada; artefatos afetados atualizados; entrada
          no histórico de versões.
        - 'Em caso de rejeição: onde a proposta é arquivada.'
        - Prazo limite para execução após o encerramento da votação.
  ownsClauses: []
- key: governance-protocol.documentation-and-publication
  artifact: governance-protocol
  order: 3
  clauseRefs:
    - 4.5.4
  i18n:
    en:
      title: Documentation and Publication
      whyItMatters: >-
        Keeping a record of only the decisions that passed erases the reasoning history — members
        lose track of what was already considered and rejected, and the same debates get
        re-litigated indefinitely. Archiving both passed and rejected proposals, with a time bound
        and a verifiable decision record, preserves institutional memory and makes the governance
        system auditable.
      whatToDefine: >-
        State retention rules for passed and rejected proposals, what counts as the decision record,
        and the version-history update obligation.
      placeholders:
        - All passed and rejected proposals are filed within X days of the vote closing.
        - The vote artifact (e.g. Snapshot link) serves as the decision record.
        - Version history (Layer 6) updated with every passed proposal.
    de:
      title: Dokumentation und Veröffentlichung
      whyItMatters: >-
        Wenn nur die angenommenen Entscheidungen aufbewahrt werden, geht die Begründungsgeschichte
        verloren — Mitglieder verlieren den Überblick darüber, was bereits geprüft und abgelehnt
        wurde, und dieselben Debatten werden endlos wieder aufgerollt. Sowohl angenommene als auch
        abgelehnte Anträge zu archivieren, mit einer Frist und einem überprüfbaren
        Entscheidungsprotokoll, bewahrt das institutionelle Gedächtnis und macht das
        Governance-System prüfbar.
      whatToDefine: >-
        Lege Aufbewahrungsregeln für angenommene und abgelehnte Anträge fest, was als
        Entscheidungsprotokoll gilt und die Pflicht zur Aktualisierung der Versionshistorie.
      placeholders:
        - >-
          Alle angenommenen und abgelehnten Anträge werden innerhalb von X Tagen nach
          Abstimmungsende abgelegt.
        - Das Abstimmungsartefakt (z. B. Snapshot-Link) dient als Entscheidungsprotokoll.
        - Versionshistorie (Schicht 6) wird bei jedem angenommenen Antrag aktualisiert.
    es:
      title: Documentación y Publicación
      whyItMatters: >-
        Mantener un registro solo de las decisiones aprobadas borra el historial de razonamiento —
        los miembros pierden la pista de lo que ya se consideró y rechazó, y los mismos debates se
        reabren indefinidamente. Archivar tanto las propuestas aprobadas como las rechazadas, con un
        plazo y un registro de decisión verificable, preserva la memoria institucional y hace que el
        sistema de gobernanza sea auditable.
      whatToDefine: >-
        Indica las reglas de retención para propuestas aprobadas y rechazadas, qué constituye el
        registro de decisión y la obligación de actualizar el historial de versiones.
      placeholders:
        - >-
          Todas las propuestas aprobadas y rechazadas se archivan dentro de los X días posteriores
          al cierre de la votación.
        - El artefacto de votación (p. ej., enlace de Snapshot) sirve como registro de decisión.
        - El historial de versiones (Capa 6) se actualiza con cada propuesta aprobada.
    fr:
      title: Documentation et publication
      whyItMatters: >-
        Ne conserver un registre que des décisions adoptées efface l'historique des raisonnements —
        les membres perdent la trace de ce qui a déjà été examiné et rejeté, et les mêmes débats
        sont indéfiniment relancés. Archiver les propositions adoptées et rejetées, avec un délai et
        un registre de décision vérifiable, préserve la mémoire institutionnelle et rend le système
        de gouvernance auditable.
      whatToDefine: >-
        Indique les règles de conservation pour les propositions adoptées et rejetées, ce qui
        constitue le registre de décision, et l'obligation de mise à jour de l'historique des
        versions.
      placeholders:
        - >-
          Toutes les propositions adoptées et rejetées sont classées dans les X jours suivant la
          clôture du vote.
        - L'artefact de vote (p. ex. lien Snapshot) sert de registre de décision.
        - L'historique des versions (Couche 6) est mis à jour avec chaque proposition adoptée.
    pt-br:
      title: Documentação e Publicação
      whyItMatters: >-
        Manter registro apenas das decisões aprovadas apaga o histórico de raciocínio — as pessoas
        membras perdem a noção do que já foi considerado e rejeitado, e os mesmos debates voltam à
        tona indefinidamente. Arquivar tanto propostas aprovadas quanto rejeitadas, com um prazo
        limite e um registro verificável de decisão, preserva a memória institucional e torna o
        sistema de governança auditável.
      whatToDefine: >-
        Indique as regras de retenção para propostas aprovadas e rejeitadas, o que conta como
        registro de decisão e a obrigação de atualização do histórico de versões.
      placeholders:
        - >-
          Todas as propostas aprovadas e rejeitadas são arquivadas em até X dias após o encerramento
          da votação.
        - O artefato da votação (por exemplo, link do Snapshot) serve como registro de decisão.
        - O histórico de versões (Camada 6) é atualizado a cada proposta aprovada.
  ownsClauses:
    - 4.5.4
- key: governance-protocol.appeal-and-review
  artifact: governance-protocol
  order: 4
  clauseRefs:
    - 4.5.2
    - 4.6.2
  i18n:
    en:
      title: Appeal and Review
      whyItMatters: >-
        A governance system with no appeal route hardens mistakes into permanent rules; one with
        unlimited informal appeal paths never settles anything. Allowing any Full Member to trigger
        a re-vote — but only with a written, reasoned objection raising something not already
        addressed — keeps the system self-correcting without turning every decision into a standing
        referendum.
      whatToDefine: >-
        Define the conditions for triggering a re-vote, the objection format, and the
        threshold/mechanism for the re-vote itself.
      placeholders:
        - Who may trigger a re-vote and how.
        - Reasoned objection requirement — a consideration not addressed in original deliberation.
        - Re-vote uses the same mechanism and threshold as the original.
        - Treatment of repeated frivolous re-vote requests.
    de:
      title: Einspruch und Überprüfung
      whyItMatters: >-
        Ein Governance-System ohne Einspruchsmöglichkeit zementiert Fehler zu dauerhaften Regeln;
        eines mit unbegrenzten informellen Einspruchswegen bringt nichts zum Abschluss. Jedem
        Vollmitglied die Möglichkeit zu geben, eine erneute Abstimmung auszulösen — aber nur mit
        einem schriftlichen, begründeten Einwand, der etwas noch nicht Behandeltes aufwirft — hält
        das System selbstkorrigierend, ohne dass jede Entscheidung zu einem Dauerreferendum wird.
      whatToDefine: >-
        Definiere die Bedingungen für eine erneute Abstimmung, das Format des Einwands und den
        Schwellenwert/Mechanismus für die erneute Abstimmung selbst.
      placeholders:
        - Wer eine erneute Abstimmung auslösen darf und wie.
        - >-
          Anforderung eines begründeten Einwands — ein Aspekt, der in der ursprünglichen Beratung
          nicht behandelt wurde.
        - >-
          Die erneute Abstimmung verwendet denselben Mechanismus und Schwellenwert wie die
          ursprüngliche.
        - Umgang mit wiederholten nichtigen Anträgen auf erneute Abstimmung.
    es:
      title: Apelación y Revisión
      whyItMatters: >-
        Un sistema de gobernanza sin vía de apelación convierte los errores en reglas permanentes;
        uno con vías de apelación informales ilimitadas nunca resuelve nada. Permitir que cualquier
        Miembro Pleno solicite una revotación — pero solo con una objeción escrita y razonada que
        plantee algo no abordado previamente — mantiene el sistema autocorrectivo sin convertir cada
        decisión en un referéndum permanente.
      whatToDefine: >-
        Define las condiciones para solicitar una revotación, el formato de la objeción y el
        umbral/mecanismo para la revotación en sí.
      placeholders:
        - Quién puede solicitar una revotación y cómo.
        - >-
          Requisito de objeción razonada — una consideración no abordada en la deliberación
          original.
        - La revotación utiliza el mismo mecanismo y umbral que la original.
        - Tratamiento de solicitudes de revotación reiteradas y frívolas.
    fr:
      title: Appel et révision
      whyItMatters: >-
        Un système de gouvernance sans voie d'appel fige les erreurs en règles permanentes ; un
        système avec des voies d'appel informelles illimitées ne règle jamais rien. Permettre à tout
        membre actif de déclencher un re-vote — mais uniquement avec une objection écrite et motivée
        soulevant un point non encore traité — maintient le système auto-correctif sans transformer
        chaque décision en référendum permanent.
      whatToDefine: >-
        Définis les conditions pour déclencher un re-vote, le format de l'objection, et le
        seuil/mécanisme du re-vote lui-même.
      placeholders:
        - Qui peut déclencher un re-vote et comment.
        - Exigence d'objection motivée — un point non traité lors de la délibération initiale.
        - Le re-vote utilise le même mécanisme et le même seuil que le vote initial.
        - Traitement des demandes de re-vote répétées et abusives.
    pt-br:
      title: Recurso e Revisão
      whyItMatters: >-
        Um sistema de governança sem rota de recurso cristaliza erros em regras permanentes; um com
        rotas informais ilimitadas de recurso nunca decide nada de fato. Permitir que qualquer
        Membro Pleno acione uma nova votação — mas apenas com uma objeção escrita e fundamentada que
        traga algo ainda não tratado — mantém o sistema autocorretivo sem transformar toda decisão
        em um referendo permanente.
      whatToDefine: >-
        Defina as condições para acionar uma nova votação, o formato da objeção e o limiar/mecanismo
        da nova votação em si.
      placeholders:
        - Quem pode acionar uma nova votação e como.
        - Exigência de objeção fundamentada — uma consideração não tratada na deliberação original.
        - A nova votação usa o mesmo mecanismo e limiar da original.
        - Tratamento de pedidos repetidos e frívolos de nova votação.
  ownsClauses: []
- key: governance-protocol.conflict-between-decisions
  artifact: governance-protocol
  order: 5
  clauseRefs:
    - 4.5.3
  i18n:
    en:
      title: Conflict Between Decisions
      whyItMatters: >-
        When two decisions point in different directions, someone has to choose which one counts —
        and if that choice is made ad hoc, it reduces to whoever has the authority or energy to
        enforce their reading. A fixed precedence rule (higher type wins; more recent wins at the
        same type) resolves conflicts mechanically, without a judgment call.
      whatToDefine: >-
        State the precedence rule (typically: higher decision type prevails; more recent wins at the
        same type, unless explicitly locked).
      placeholders:
        - 'Same-type conflicts: more recent prevails unless earlier explicitly locked future changes.'
        - Where conflicts are surfaced and how they are resolved.
    de:
      title: Konflikte zwischen Entscheidungen
      whyItMatters: >-
        Wenn zwei Entscheidungen in unterschiedliche Richtungen weisen, muss jemand bestimmen,
        welche gilt — und wenn diese Wahl ad hoc getroffen wird, läuft es darauf hinaus, wer die
        Autorität oder Energie hat, seine Auslegung durchzusetzen. Eine feste Vorrangegel (höherer
        Typ gewinnt; neuere gewinnt bei gleichem Typ) löst Konflikte mechanisch, ohne eine
        Ermessensentscheidung.
      whatToDefine: >-
        Lege die Vorrangregel fest (typischerweise: höherer Entscheidungstyp hat Vorrang; neuere
        gewinnt bei gleichem Typ, sofern nicht ausdrücklich gesperrt).
      placeholders:
        - >-
          Konflikte gleichen Typs: neuere hat Vorrang, es sei denn, die ältere hat zukünftige
          Änderungen ausdrücklich gesperrt.
        - Wo Konflikte aufgedeckt werden und wie sie gelöst werden.
    es:
      title: Conflicto entre Decisiones
      whyItMatters: >-
        Cuando dos decisiones apuntan en direcciones opuestas, alguien tiene que elegir cuál
        prevalece — y si esa elección se hace de forma improvisada, se reduce a quien tenga la
        autoridad o la energía para imponer su interpretación. Una regla de precedencia fija (el
        tipo superior prevalece; la más reciente prevalece dentro del mismo tipo) resuelve
        conflictos de forma mecánica, sin necesidad de un juicio discrecional.
      whatToDefine: >-
        Indica la regla de precedencia (típicamente: el tipo de decisión superior prevalece; la más
        reciente prevalece dentro del mismo tipo, salvo bloqueo explícito).
      placeholders:
        - >-
          Conflictos del mismo tipo: la más reciente prevalece, salvo que la anterior haya bloqueado
          explícitamente cambios futuros.
        - Dónde se plantean los conflictos y cómo se resuelven.
    fr:
      title: Conflit entre décisions
      whyItMatters: >-
        Quand deux décisions pointent dans des directions différentes, quelqu'un doit choisir
        laquelle prime — et si ce choix est fait de manière ad hoc, cela se réduit à celui qui a
        l'autorité ou l'énergie pour imposer sa lecture. Une règle de préséance fixe (le type
        supérieur l'emporte ; la plus récente l'emporte à type égal) résout les conflits
        mécaniquement, sans appel au jugement.
      whatToDefine: >-
        Indique la règle de préséance (typiquement : le type de décision supérieur prévaut ; la plus
        récente l'emporte à type égal, sauf verrouillage explicite).
      placeholders:
        - >-
          Conflits de même type : la plus récente prévaut, sauf si la précédente a explicitement
          verrouillé les modifications futures.
        - Où les conflits sont signalés et comment ils sont résolus.
    pt-br:
      title: Conflito Entre Decisões
      whyItMatters: >-
        Quando duas decisões apontam em direções diferentes, alguém precisa escolher qual delas vale
        — e se essa escolha for feita caso a caso, ela se reduz a quem tem autoridade ou energia
        para impor sua leitura. Uma regra fixa de precedência (o tipo mais alto prevalece; em caso
        de empate de tipo, a mais recente prevalece) resolve conflitos de forma mecânica, sem
        julgamento subjetivo.
      whatToDefine: >-
        Indique a regra de precedência (tipicamente: o tipo de decisão mais alto prevalece; no mesmo
        tipo, a mais recente vence, salvo se travada explicitamente).
      placeholders:
        - >-
          Conflitos no mesmo tipo: a mais recente prevalece, salvo se a anterior travou
          explicitamente mudanças futuras.
        - Onde os conflitos aparecem e como são resolvidos.
  ownsClauses:
    - 4.5.3
- key: governance-protocol.safeguards-and-failure-modes
  artifact: governance-protocol
  order: 6
  clauseRefs:
    - 4.6.1
    - 4.6.2
    - 4.6.3
  i18n:
    en:
      title: Safeguards and Failure Modes
      whyItMatters: >-
        Every governance system fails somewhere — captured by a subgroup, frozen by informal vetoes,
        drifted by a role holder who quietly expanded their remit. Naming the specific failure modes
        in advance, wiring in challenge routes that cannot be retaliated against, and requiring a
        formal review when failures accumulate, is what keeps governance from slowly hollowing out
        while no one is watching.
      whatToDefine: >-
        For each named failure mode, state the safeguard. Include a trigger that forces a
        Constitutional review if failures accumulate.
      placeholders:
        - how the protocol prevents unilateral authority above operational scope.
        - >-
          rule that only written, reasoned objections submitted via the defined process carry
          weight.
        - rule about quorum and openness of voting.
        - >-
          rule that no role grants permanent authority; founders hold no special governance
          authority beyond membership state.
        - reference Layer 4 anti-retaliation provisions.
        - e.g. three or more governance failures within X months trigger a Constitutional review.
    de:
      title: Schutzmaßnahmen und Fehlermodi
      whyItMatters: >-
        Jedes Governance-System versagt irgendwo — vereinnahmt von einer Untergruppe, blockiert
        durch informelle Vetos, verwässert von einer Rolleninhaber:in, die ihren
        Zuständigkeitsbereich still und leise ausgeweitet hat. Die spezifischen Fehlermodi im Voraus
        zu benennen, Anfechtungswege einzubauen, die nicht mit Vergeltung beantwortet werden können,
        und eine formale Überprüfung zu verlangen, wenn sich Fehler häufen — das ist es, was
        verhindert, dass Governance sich langsam aushöhlt, während niemand hinschaut.
      whatToDefine: >-
        Benenne für jeden Fehlermodus die entsprechende Schutzmaßnahme. Füge einen Auslöser hinzu,
        der eine Verfassungsüberprüfung erzwingt, wenn sich Fehler häufen.
      placeholders:
        - wie das Protokoll einseitige Autorität über den operativen Rahmen hinaus verhindert.
        - >-
          Regel, dass nur schriftliche, begründete Einwände, die über den definierten Prozess
          eingereicht werden, Gewicht haben.
        - Regel zu Beschlussfähigkeit und Offenheit der Abstimmung.
        - >-
          Regel, dass keine Rolle dauerhafte Autorität verleiht; Gründer:innen haben keine besondere
          Governance-Autorität über ihren Mitgliedschaftsstatus hinaus.
        - Verweis auf die Anti-Vergeltungsbestimmungen in Schicht 4.
        - >-
          z. B. drei oder mehr Governance-Fehler innerhalb von X Monaten lösen eine
          Verfassungsüberprüfung aus.
    es:
      title: Salvaguardas y Modos de Fallo
      whyItMatters: >-
        Todo sistema de gobernanza falla en algún punto — capturado por un subgrupo, paralizado por
        vetos informales, desviado por un titular de rol que amplió silenciosamente su ámbito.
        Nombrar los modos de fallo específicos de antemano, establecer vías de impugnación que no
        puedan ser objeto de represalias, y exigir una revisión formal cuando los fallos se
        acumulan, es lo que evita que la gobernanza se vacíe lentamente mientras nadie observa.
      whatToDefine: >-
        Para cada modo de fallo nombrado, indica la salvaguarda. Incluye un disparador que fuerce
        una revisión Constitucional si los fallos se acumulan.
      placeholders:
        - cómo el protocolo previene la autoridad unilateral más allá del ámbito operativo.
        - >-
          regla de que solo las objeciones escritas y razonadas presentadas a través del proceso
          definido tienen peso.
        - regla sobre quórum y apertura de la votación.
        - >-
          regla de que ningún rol otorga autoridad permanente; los fundadores no tienen autoridad de
          gobernanza especial más allá de su estado de membresía.
        - referencia a las disposiciones anti-represalias de la Capa 4.
        - p. ej., tres o más fallos de gobernanza en X meses activan una revisión Constitucional.
    fr:
      title: Garde-fous et modes de défaillance
      whyItMatters: >-
        Tout système de gouvernance échoue quelque part — capturé par un sous-groupe, figé par des
        vetos informels, dévié par un titulaire de rôle qui a discrètement élargi son périmètre.
        Nommer les modes de défaillance spécifiques à l'avance, intégrer des voies de contestation à
        l'abri de représailles, et exiger une révision formelle lorsque les défaillances
        s'accumulent, voilà ce qui empêche la gouvernance de se vider lentement de sa substance sans
        que personne ne s'en aperçoive.
      whatToDefine: >-
        Pour chaque mode de défaillance nommé, indique le garde-fou correspondant. Inclus un
        déclencheur qui impose une révision constitutionnelle si les défaillances s'accumulent.
      placeholders:
        - comment le protocole empêche l'autorité unilatérale au-delà du périmètre opérationnel.
        - >-
          règle selon laquelle seules les objections écrites et motivées soumises via le processus
          défini ont du poids.
        - règle concernant le quorum et l'ouverture du vote.
        - >-
          règle selon laquelle aucun rôle ne confère d'autorité permanente ; les fondateurs ne
          détiennent aucune autorité de gouvernance spéciale au-delà de leur statut de membre.
        - référence aux dispositions anti-représailles de la Couche 4.
        - >-
          p. ex. trois défaillances de gouvernance ou plus en X mois déclenchent une révision
          constitutionnelle.
    pt-br:
      title: Salvaguardas e Modos de Falha
      whyItMatters: >-
        Todo sistema de governança falha em algum ponto — capturado por um subgrupo, congelado por
        vetos informais, desviado por uma pessoa responsável por um papel que silenciosamente
        expandiu seu escopo. Nomear os modos de falha específicos com antecedência, prever rotas de
        contestação que não possam sofrer retaliação e exigir uma revisão formal quando as falhas se
        acumulam é o que impede que a governança se esvazie lentamente sem ninguém perceber.
      whatToDefine: >-
        Para cada modo de falha nomeado, indique a salvaguarda. Inclua um gatilho que force uma
        revisão constitucional caso as falhas se acumulem.
      placeholders:
        - como o protocolo impede autoridade unilateral acima do escopo operacional.
        - >-
          regra de que apenas objeções escritas e fundamentadas, submetidas pelo processo definido,
          têm peso.
        - regra sobre quórum e abertura da votação.
        - >-
          regra de que nenhum papel concede autoridade permanente; pessoas fundadoras não detêm
          autoridade especial de governança além de seu estado de membresia.
        - referência às disposições antirretaliação da Camada 4.
        - >-
          por exemplo, três ou mais falhas de governança em X meses acionam uma revisão
          constitucional.
  ownsClauses:
    - 4.6.1
    - 4.6.2
    - 4.6.3

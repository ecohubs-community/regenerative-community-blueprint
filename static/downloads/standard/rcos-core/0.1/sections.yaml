- key: exit-protocol.voluntary-exit
  artifact: exit-protocol
  order: 0
  clauseRefs:
    - 3.6.1
    - 3.6.2
    - 3.6.4
  i18n:
    en:
      title: Voluntary Exit
      whyItMatters: >-
        A community that is hard to leave is not a community — it is a trap. Voluntary exit must be
        available at all times, without interrogation, notice periods, or punishment, because the
        right to withdraw consent is what makes every other act of consent real. Retaining
        contribution history separately ensures that leaving does not erase the work the person did.
      whatToDefine: >-
        Describe the channel for submitting exit, time-to-revocation of access, what records are
        retained, and the resulting state transition.
      placeholders:
        - How a member submits a voluntary exit; reasons optional.
        - Notice period or handover expectation, if any.
        - Time-to-revocation of access (e.g. within 24 hours of confirmation).
        - What is retained — contribution history, recognition records — and what is removed.
        - Resulting state transition (e.g. to Exited Member).
        - Where and how the exit is recorded with timestamp.
    de:
      title: Freiwilliger Austritt
      whyItMatters: >-
        Eine Gemeinschaft, die schwer zu verlassen ist, ist keine Gemeinschaft — sie ist eine Falle.
        Freiwilliger Austritt muss jederzeit möglich sein, ohne Verhör, Kündigungsfristen oder
        Bestrafung, denn das Recht, Zustimmung zurückzuziehen, ist das, was jede andere Zustimmung
        erst real macht. Die separate Aufbewahrung der Beitragshistorie stellt sicher, dass ein
        Austritt die geleistete Arbeit nicht auslöscht.
      whatToDefine: >-
        Beschreibe den Kanal für die Einreichung des Austritts, die Frist bis zum Entzug des
        Zugangs, welche Aufzeichnungen aufbewahrt werden und den resultierenden Statusübergang.
      placeholders:
        - Wie ein Mitglied einen freiwilligen Austritt einreicht; Gründe optional.
        - Kündigungsfrist oder Übergabeerwartung, falls vorhanden.
        - Frist bis zum Entzug des Zugangs (z. B. innerhalb von 24 Stunden nach Bestätigung).
        - Was aufbewahrt wird — Beitragshistorie, Anerkennungsnachweise — und was entfernt wird.
        - Resultierender Statusübergang (z. B. zu „Ausgetretenes Mitglied").
        - Wo und wie der Austritt mit Zeitstempel erfasst wird.
    es:
      title: Salida Voluntaria
      whyItMatters: >-
        Una comunidad de la que es difícil salir no es una comunidad — es una trampa. La salida
        voluntaria DEBE estar disponible en todo momento, sin interrogatorios, períodos de preaviso
        ni castigos, porque el derecho a retirar el consentimiento es lo que hace real cada otro
        acto de consentimiento. Conservar el historial de contribuciones por separado garantiza que
        irse no borre el trabajo que la persona realizó.
      whatToDefine: >-
        Describe el canal para solicitar la salida, el tiempo hasta la revocación de acceso, qué
        registros se conservan y la transición de estado resultante.
      placeholders:
        - Cómo un miembro solicita una salida voluntaria; motivos opcionales.
        - Período de preaviso o expectativa de traspaso, si corresponde.
        - >-
          Tiempo hasta la revocación de acceso (p. ej., dentro de las 24 horas posteriores a la
          confirmación).
        - >-
          Qué se conserva — historial de contribuciones, registros de reconocimiento — y qué se
          elimina.
        - Transición de estado resultante (p. ej., a Miembro Salido).
        - Dónde y cómo se registra la salida con marca temporal.
    fr:
      title: Sortie volontaire
      whyItMatters: >-
        Une communauté qu'il est difficile de quitter n'est pas une communauté — c'est un piège. La
        sortie volontaire DOIT être disponible à tout moment, sans interrogatoire, délai de préavis
        ou sanction, car le droit de retirer son consentement est ce qui rend tout autre acte de
        consentement réel. Conserver l'historique des contributions séparément garantit que partir
        n'efface pas le travail accompli par la personne.
      whatToDefine: >-
        Décris le canal de soumission de la sortie, le délai de révocation des accès, les données
        conservées et la transition d'état résultante.
      placeholders:
        - Comment un membre soumet une sortie volontaire ; les raisons sont facultatives.
        - Délai de préavis ou attente de passation, le cas échéant.
        - Délai de révocation des accès (par ex. dans les 24 heures suivant la confirmation).
        - >-
          Ce qui est conservé — historique des contributions, registres de reconnaissance — et ce
          qui est supprimé.
        - Transition d'état résultante (par ex. vers Membre sorti·e).
        - Où et comment la sortie est enregistrée avec horodatage.
    pt-br:
      title: Saída Voluntária
      whyItMatters: >-
        Uma comunidade da qual é difícil sair não é uma comunidade — é uma armadilha. A saída
        voluntária deve estar disponível a qualquer momento, sem interrogatórios, períodos de aviso
        prévio ou punições, porque o direito de retirar o consentimento é o que torna real cada
        outro ato de consentimento. Reter o histórico de contribuições separadamente garante que
        sair não apague o trabalho que a pessoa realizou.
      whatToDefine: >-
        Descreva o canal para submeter a saída, o tempo até a revogação de acesso, quais registros
        são retidos e a transição de estado resultante.
      placeholders:
        - Como um membro submete uma saída voluntária; motivos opcionais.
        - Período de aviso prévio ou expectativa de transferência de responsabilidades, se houver.
        - Tempo até a revogação do acesso (por exemplo, dentro de 24 horas após a confirmação).
        - >-
          O que é retido — histórico de contribuições, registros de reconhecimento — e o que é
          removido.
        - Transição de estado resultante (por exemplo, para Membro Saído).
        - Onde e como a saída é registrada com data e hora.
  ownsClauses:
    - 3.6.1
    - 3.6.2
    - 3.6.4
- key: exit-protocol.forced-exit
  artifact: exit-protocol
  order: 1
  clauseRefs:
    - 3.6.3
    - 3.6.4
  i18n:
    en:
      title: Forced Exit
      whyItMatters: >-
        Removal is the sharpest power the community holds over a person. If it can be exercised by
        anyone with enough social pull, membership is worthless. Requiring a concluded Layer 4
        accountability decision — with written reasons, a notification, and a minimum re-application
        window — turns removal from an act of power into an act of governance that can be reviewed
        and contested.
      whatToDefine: >-
        State that forced exit can only follow a concluded Layer 4 accountability process. Define
        notification, access revocation, retained records, re-application block, and decision-record
        privacy.
      placeholders:
        - >-
          Forced exit may only result from a concluded Layer 4 accountability process with a
          documented decision.
        - >-
          Affected member must be notified in writing with reason and decision-record reference
          before access is revoked.
        - Time-to-revocation of access (e.g. within 24 hours of decision).
        - What is retained, what is removed.
        - >-
          Re-application block (minimum duration, set by accountability decision; reference Layer
          4).
        - Privacy of the decision record (reference Conflict Resolution Ladder privacy rules).
    de:
      title: Erzwungener Austritt
      whyItMatters: >-
        Der Ausschluss ist die schärfste Macht, die eine Gemeinschaft über eine Person hat. Wenn sie
        von jedem ausgeübt werden kann, der genug sozialen Einfluss hat, ist die Mitgliedschaft
        wertlos. Die Voraussetzung eines abgeschlossenen Rechenschaftsverfahrens der Schicht 4 — mit
        schriftlicher Begründung, einer Benachrichtigung und einer Mindest-Wartefrist für erneute
        Bewerbung — verwandelt den Ausschluss von einem Machtakt in einen Akt der Governance, der
        überprüft und angefochten werden kann.
      whatToDefine: >-
        Lege fest, dass ein erzwungener Austritt nur nach einem abgeschlossenen
        Rechenschaftsverfahren der Schicht 4 erfolgen kann. Definiere Benachrichtigung,
        Zugangsentzug, aufbewahrte Aufzeichnungen, Sperrfrist für erneute Bewerbung und Datenschutz
        des Entscheidungsprotokolls.
      placeholders:
        - >-
          Ein erzwungener Austritt darf nur aus einem abgeschlossenen Rechenschaftsverfahren der
          Schicht 4 mit dokumentierter Entscheidung resultieren.
        - >-
          Das betroffene Mitglied muss schriftlich mit Begründung und Verweis auf das
          Entscheidungsprotokoll benachrichtigt werden, bevor der Zugang entzogen wird.
        - Frist bis zum Entzug des Zugangs (z. B. innerhalb von 24 Stunden nach Entscheidung).
        - Was aufbewahrt wird, was entfernt wird.
        - >-
          Sperrfrist für erneute Bewerbung (Mindestdauer, festgelegt durch
          Rechenschaftsentscheidung; Verweis auf Schicht 4).
        - >-
          Datenschutz des Entscheidungsprotokolls (Verweis auf die Datenschutzregeln der
          Konfliktlösungsleiter).
    es:
      title: Salida Forzada
      whyItMatters: >-
        La expulsión es el poder más severo que la comunidad ejerce sobre una persona. Si puede ser
        ejercido por cualquiera con suficiente influencia social, la membresía no vale nada. Exigir
        una decisión concluida de rendición de cuentas en la Capa 4 — con motivos por escrito, una
        notificación y un período mínimo de bloqueo para re-solicitud — convierte la expulsión de un
        acto de poder en un acto de gobernanza que puede ser revisado e impugnado.
      whatToDefine: >-
        Indica que la salida forzada solo puede seguir a un proceso de rendición de cuentas
        concluido en la Capa 4. Define la notificación, la revocación de acceso, los registros
        conservados, el bloqueo de re-solicitud y la privacidad del registro de decisión.
      placeholders:
        - >-
          La salida forzada solo PUEDE resultar de un proceso de rendición de cuentas concluido en
          la Capa 4 con una decisión documentada.
        - >-
          El miembro afectado DEBE ser notificado por escrito con el motivo y la referencia al
          registro de decisión antes de que se revoque el acceso.
        - >-
          Tiempo hasta la revocación de acceso (p. ej., dentro de las 24 horas posteriores a la
          decisión).
        - Qué se conserva, qué se elimina.
        - >-
          Bloqueo de re-solicitud (duración mínima, establecida por la decisión de rendición de
          cuentas; referencia a la Capa 4).
        - >-
          Privacidad del registro de decisión (referencia a las reglas de privacidad de la Escalera
          de Resolución de Conflictos).
    fr:
      title: Sortie forcée
      whyItMatters: >-
        L'exclusion est le pouvoir le plus tranchant que la communauté détient sur une personne. Si
        elle peut être exercée par quiconque dispose de suffisamment d'influence sociale, l'adhésion
        ne vaut rien. Exiger une décision de responsabilité conclue en Couche 4 — avec des motifs
        écrits, une notification et une durée minimale avant nouvelle candidature — transforme
        l'exclusion d'un acte de pouvoir en un acte de gouvernance qui peut être examiné et
        contesté.
      whatToDefine: >-
        Indique que la sortie forcée ne peut résulter que d'un processus de responsabilité conclu en
        Couche 4. Définis la notification, la révocation des accès, les données conservées, le
        blocage de nouvelle candidature et la confidentialité du dossier de décision.
      placeholders:
        - >-
          La sortie forcée ne PEUT résulter que d'un processus de responsabilité conclu en Couche 4
          avec une décision documentée.
        - >-
          Le membre concerné DOIT être notifié par écrit avec le motif et la référence du dossier de
          décision avant que les accès ne soient révoqués.
        - Délai de révocation des accès (par ex. dans les 24 heures suivant la décision).
        - Ce qui est conservé, ce qui est supprimé.
        - >-
          Blocage de nouvelle candidature (durée minimale, fixée par la décision de responsabilité ;
          référence Couche 4).
        - >-
          Confidentialité du dossier de décision (référence aux règles de confidentialité de
          l'Échelle de résolution des conflits).
    pt-br:
      title: Saída Forçada
      whyItMatters: >-
        A remoção é o poder mais agudo que a comunidade detém sobre uma pessoa. Se puder ser
        exercida por qualquer um com influência social suficiente, a membresia não vale nada. Exigir
        uma decisão concluída de responsabilização na Camada 4 — com motivos por escrito, uma
        notificação e uma janela mínima de reaplicação — transforma a remoção de um ato de poder em
        um ato de governança que pode ser revisado e contestado.
      whatToDefine: >-
        Declare que a saída forçada só pode seguir um processo de responsabilização concluído na
        Camada 4. Defina notificação, revogação de acesso, registros retidos, bloqueio de
        reaplicação e privacidade do registro da decisão.
      placeholders:
        - >-
          A saída forçada só pode resultar de um processo de responsabilização concluído na Camada 4
          com uma decisão documentada.
        - >-
          O membro afetado DEVE ser notificado por escrito com o motivo e a referência ao registro
          da decisão antes que o acesso seja revogado.
        - Tempo até a revogação do acesso (por exemplo, dentro de 24 horas após a decisão).
        - O que é retido, o que é removido.
        - >-
          Bloqueio de reaplicação (duração mínima, definida pela decisão de responsabilização;
          referenciar Camada 4).
        - >-
          Privacidade do registro da decisão (referenciar as regras de privacidade da Escada de
          Resolução de Conflitos).
  ownsClauses:
    - 3.6.3
- key: exit-protocol.suspension
  artifact: exit-protocol
  order: 2
  clauseRefs:
    - 3.7.1
    - 3.7.2
    - 3.7.3
  i18n:
    en:
      title: Suspension
      whyItMatters: >-
        A poorly-designed suspension state is worse than none — it becomes a soft exit with no due
        process, or an indefinite limbo used to punish without the accountability of a full removal.
        If the community cannot commit to explicit conditions, time bounds, and review mechanisms,
        it is safer to have no formal suspension than a loose one.
      whatToDefine: >-
        Either define suspension explicitly (entry conditions, time limits, rights during
        suspension, review mechanism, exit) or state that no formal suspension exists. Do not leave
        this section ambiguous.
      placeholders:
        - >-
          Either: define suspension state with entry conditions, maximum duration, rights during
          suspension, mandatory review mechanism, and exit; or: state that formal suspension is not
          currently defined.
    de:
      title: Suspendierung
      whyItMatters: >-
        Ein schlecht gestalteter Suspendierungsstatus ist schlimmer als keiner — er wird zu einem
        weichen Austritt ohne ordentliches Verfahren oder zu einem unbefristeten Schwebezustand, der
        als Strafe dient, ohne die Rechenschaftspflicht eines vollständigen Ausschlusses. Wenn die
        Gemeinschaft sich nicht zu expliziten Bedingungen, Zeitgrenzen und Überprüfungsmechanismen
        verpflichten kann, ist es sicherer, keine formale Suspendierung zu haben als eine unklare.
      whatToDefine: >-
        Definiere die Suspendierung entweder explizit (Eintrittsbedingungen, Zeitlimits, Rechte
        während der Suspendierung, Überprüfungsmechanismus, Ende) oder stelle fest, dass keine
        formale Suspendierung existiert. Lass diesen Abschnitt nicht mehrdeutig.
      placeholders:
        - >-
          Entweder: Definiere den Suspendierungsstatus mit Eintrittsbedingungen, Höchstdauer,
          Rechten während der Suspendierung, verpflichtendem Überprüfungsmechanismus und Ende; oder:
          stelle fest, dass eine formale Suspendierung derzeit nicht definiert ist.
    es:
      title: Suspensión
      whyItMatters: >-
        Un estado de suspensión mal diseñado es peor que ninguno — se convierte en una salida
        encubierta sin debido proceso, o en un limbo indefinido utilizado para castigar sin la
        rendición de cuentas de una expulsión completa. Si la comunidad no puede comprometerse con
        condiciones explícitas, límites temporales y mecanismos de revisión, es más seguro no tener
        una suspensión formal que tener una laxa.
      whatToDefine: >-
        Define la suspensión explícitamente (condiciones de entrada, límites temporales, derechos
        durante la suspensión, mecanismo de revisión, salida) o indica que no existe una suspensión
        formal. No dejes esta sección ambigua.
      placeholders:
        - >-
          O bien: define el estado de suspensión con condiciones de entrada, duración máxima,
          derechos durante la suspensión, mecanismo de revisión obligatorio y salida; o bien: indica
          que la suspensión formal no está definida actualmente.
    fr:
      title: Suspension
      whyItMatters: >-
        Un état de suspension mal conçu est pire que pas de suspension du tout — il devient une
        sortie douce sans procédure régulière, ou un limbe indéfini utilisé pour punir sans la
        responsabilité d'une exclusion complète. Si la communauté ne peut pas s'engager sur des
        conditions explicites, des limites de durée et des mécanismes de révision, il est plus sûr
        de n'avoir aucune suspension formelle qu'une suspension floue.
      whatToDefine: >-
        Soit tu définis explicitement la suspension (conditions d'entrée, limites de durée, droits
        pendant la suspension, mécanisme de révision, sortie), soit tu indiques qu'aucune suspension
        formelle n'existe. Ne laisse pas cette section ambiguë.
      placeholders:
        - >-
          Soit : définis l'état de suspension avec les conditions d'entrée, la durée maximale, les
          droits pendant la suspension, le mécanisme de révision obligatoire et la sortie ; soit :
          indique que la suspension formelle n'est pas définie actuellement.
    pt-br:
      title: Suspensão
      whyItMatters: >-
        Um estado de suspensão mal projetado é pior do que nenhum — torna-se uma saída disfarçada
        sem devido processo, ou um limbo indefinido usado para punir sem a responsabilização de uma
        remoção completa. Se a comunidade não consegue se comprometer com condições explícitas,
        limites de tempo e mecanismos de revisão, é mais seguro não ter suspensão formal do que ter
        uma frouxa.
      whatToDefine: >-
        Defina a suspensão explicitamente (condições de entrada, limites de tempo, direitos durante
        a suspensão, mecanismo de revisão, saída) ou declare que não existe suspensão formal. Não
        deixe esta seção ambígua.
      placeholders:
        - >-
          Ou: defina o estado de suspensão com condições de entrada, duração máxima, direitos
          durante a suspensão, mecanismo de revisão obrigatório e saída; ou: declare que a suspensão
          formal não está atualmente definida.
  ownsClauses:
    - 3.7.1
    - 3.7.2
    - 3.7.3
- key: exit-protocol.asset-role-and-responsibility-separation
  artifact: exit-protocol
  order: 3
  clauseRefs:
    - 3.6.5
  i18n:
    en:
      title: Asset, Role, and Responsibility Separation
      whyItMatters: >-
        When someone leaves, every unclosed thread — a role nobody vacated, a wallet key still
        active, a task still assigned — becomes a live attack surface or an operational gap. A
        checklist forces these threads to be closed deliberately, not discovered months later when
        something breaks or someone abuses access they no longer should have.
      whatToDefine: >-
        Provide a checklist applied to both voluntary and forced exits. Include role vacation, task
        release, financial-instrument access removal, platform admin revocation, and resolution of
        outstanding obligations.
      placeholders:
        - Roles held must be vacated and documented in the Role Registry.
        - Ongoing tasks must be released or handed over.
        - Treasury / wallet / signing access must be removed.
        - All administrative access to platforms must be revoked.
        - Outstanding obligations resolved or transferred before exit is finalised where possible.
    de:
      title: Trennung von Vermögenswerten, Rollen und Verantwortlichkeiten
      whyItMatters: >-
        Wenn jemand geht, wird jeder offene Faden — eine Rolle, die niemand abgegeben hat, ein
        Wallet-Schlüssel, der noch aktiv ist, eine Aufgabe, die noch zugewiesen ist — zu einer
        aktiven Angriffsfläche oder einer operativen Lücke. Eine Checkliste erzwingt, dass diese
        Fäden bewusst geschlossen werden, anstatt Monate später entdeckt zu werden, wenn etwas
        kaputtgeht oder jemand Zugang missbraucht, den er nicht mehr haben sollte.
      whatToDefine: >-
        Erstelle eine Checkliste, die sowohl bei freiwilligem als auch bei erzwungenem Austritt
        angewendet wird. Berücksichtige Rollenabgabe, Aufgabenfreigabe, Entzug des Zugangs zu
        Finanzinstrumenten, Entzug von Plattform-Administrationsrechten und Klärung offener
        Verpflichtungen.
      placeholders:
        - Gehaltene Rollen müssen abgegeben und im Rollenregister dokumentiert werden.
        - Laufende Aufgaben müssen freigegeben oder übergeben werden.
        - Zugang zu Kasse / Wallet / Signaturrechten muss entzogen werden.
        - Alle Administrationsrechte auf Plattformen müssen widerrufen werden.
        - >-
          Offene Verpflichtungen werden nach Möglichkeit geklärt oder übertragen, bevor der Austritt
          abgeschlossen wird.
    es:
      title: Separación de Activos, Roles y Responsabilidades
      whyItMatters: >-
        Cuando alguien se va, cada hilo sin cerrar — un rol que nadie dejó vacante, una clave de
        billetera aún activa, una tarea aún asignada — se convierte en una superficie de ataque
        activa o una brecha operativa. Una lista de verificación obliga a cerrar estos hilos
        deliberadamente, en lugar de descubrirlos meses después cuando algo falla o alguien abusa de
        un acceso que ya no debería tener.
      whatToDefine: >-
        Proporciona una lista de verificación que se aplique tanto a salidas voluntarias como
        forzadas. Incluye la desocupación de roles, la liberación de tareas, la eliminación de
        acceso a instrumentos financieros, la revocación de administración de plataformas y la
        resolución de obligaciones pendientes.
      placeholders:
        - Los roles ocupados DEBEN ser desocupados y documentados en el Registro de Roles.
        - Las tareas en curso DEBEN ser liberadas o traspasadas.
        - El acceso a tesorería / billetera / firma DEBE ser eliminado.
        - Todo acceso administrativo a plataformas DEBE ser revocado.
        - >-
          Las obligaciones pendientes DEBEN ser resueltas o transferidas antes de que se finalice la
          salida, cuando sea posible.
    fr:
      title: Séparation des actifs, rôles et responsabilités
      whyItMatters: >-
        Quand quelqu'un part, chaque fil non clos — un rôle que personne n'a libéré, une clé de
        portefeuille encore active, une tâche encore assignée — devient une surface d'attaque active
        ou une faille opérationnelle. Une liste de vérification force la clôture délibérée de ces
        fils, au lieu de les découvrir des mois plus tard quand quelque chose casse ou que quelqu'un
        utilise un accès qu'il ne DEVRAIT plus avoir.
      whatToDefine: >-
        Fournis une liste de vérification applicable aux sorties volontaires et forcées. Inclus la
        libération des rôles, le transfert des tâches, la suppression des accès aux instruments
        financiers, la révocation des droits d'administration des plateformes et la résolution des
        obligations en cours.
      placeholders:
        - Les rôles détenus DOIVENT être libérés et documentés dans le Registre des rôles.
        - Les tâches en cours DOIVENT être libérées ou transférées.
        - Les accès à la trésorerie / au portefeuille / à la signature DOIVENT être supprimés.
        - Tous les accès administratifs aux plateformes DOIVENT être révoqués.
        - >-
          Les obligations en cours sont résolues ou transférées avant la finalisation de la sortie
          dans la mesure du possible.
    pt-br:
      title: Separação de Ativos, Papéis e Responsabilidades
      whyItMatters: >-
        Quando alguém sai, cada fio solto — um papel que ninguém desocupou, uma chave de carteira
        ainda ativa, uma tarefa ainda atribuída — torna-se uma superfície de ataque ativa ou uma
        lacuna operacional. Uma lista de verificação força que esses fios sejam encerrados
        deliberadamente, e não descobertos meses depois quando algo quebra ou alguém abusa de um
        acesso que já não deveria mais ter.
      whatToDefine: >-
        Forneça uma lista de verificação aplicada tanto às saídas voluntárias quanto às forçadas.
        Inclua a desocupação de papéis, liberação de tarefas, remoção de acesso a instrumentos
        financeiros, revogação de administração em plataformas e resolução de obrigações pendentes.
      placeholders:
        - Os papéis ocupados DEVEM ser desocupados e documentados no Registro de Papéis.
        - As tarefas em andamento DEVEM ser liberadas ou transferidas.
        - O acesso à tesouraria / carteira / assinatura DEVE ser removido.
        - Todo acesso administrativo às plataformas DEVE ser revogado.
        - >-
          Obrigações pendentes resolvidas ou transferidas antes que a saída seja finalizada, sempre
          que possível.
  ownsClauses:
    - 3.6.5

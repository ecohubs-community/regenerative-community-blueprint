        Camada 4, não pela própria reunião.
      placeholders:
        - tipicamente 60–90 minutos; o(a) Facilitador(a) PODE estender.
        - duração; consentimento, confidencialidade, não retaliação, direito de pausa.
        - sem interrupções; tempo igual.
        - duração.
        - duração.
        - duração.
        - duração.
        - duração; registrar conforme regras de privacidade da Camada 4.
        - Acordo alcançado / Escalado para o próximo passo / Suspenso

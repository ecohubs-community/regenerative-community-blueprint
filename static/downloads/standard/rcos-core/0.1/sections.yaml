- key: meeting-templates.meeting-type-operations
  artifact: meeting-templates
  order: 0
  clauseRefs:
    - 7.2.1
    - 7.2.2
    - 7.2.3
    - 7.2.4
    - 7.6.4
  i18n:
    en:
      title: 'Meeting Type: Operations'
      whyItMatters: >-
        Day-to-day coordination needs a regular beat, not ad-hoc improvisation. The Operations
        meeting is the community's heartbeat — a predictable space to review active work, surface
        blockers, and make small operational decisions. Crucially, only Operational decisions happen
        here; Strategic and Constitutional ones go through the governance process, so the meeting
        can't quietly accumulate authority it doesn't have.
      whatToDefine: >-
        Set purpose, decision scope, required and optional participants, cadence, duration, and
        facilitation rules. Keep decision scope to Operational only.
      placeholders:
        - review active work, coordinate tasks, surface blockers, make operational decisions.
        - who is invited; minimum quorum.
        - who may attend on invitation.
        - weekly / bi-weekly / monthly.
        - e.g. 90 minutes maximum.
        - facilitator role; substitute rule.
        - duration
        - duration
        - duration
        - duration
        - duration
        - duration
        - duration; optional
        - role holder per Decision Matrix
        - what was decided
        - location
    de:
      title: 'Sitzungstyp: Operativ'
      whyItMatters: >-
        Die tägliche Koordination braucht einen regelmäßigen Rhythmus, keine Ad-hoc-Improvisation.
        Die operative Sitzung ist der Herzschlag der Gemeinschaft — ein vorhersehbarer Raum, um
        laufende Arbeit zu prüfen, Hindernisse sichtbar zu machen und kleine operative
        Entscheidungen zu treffen. Entscheidend ist: Hier fallen nur operative Entscheidungen;
        strategische und konstitutionelle laufen über den Governance-Prozess, sodass die Sitzung
        nicht stillschweigend Befugnisse ansammeln kann, die sie nicht hat.
      whatToDefine: >-
        Legt Zweck, Entscheidungsbereich, erforderliche und optionale Teilnehmende, Rhythmus, Dauer
        und Moderationsregeln fest. Beschränkt den Entscheidungsbereich auf ausschließlich operative
        Entscheidungen.
      placeholders:
        - >-
          laufende Arbeit prüfen, Aufgaben koordinieren, Hindernisse sichtbar machen, operative
          Entscheidungen treffen.
        - wer eingeladen ist; Mindest-Quorum.
        - wer auf Einladung teilnehmen darf.
        - wöchentlich / zweiwöchentlich / monatlich.
        - z. B. maximal 90 Minuten.
        - Moderationsrolle; Vertretungsregel.
        - Dauer
        - Dauer
        - Dauer
        - Dauer
        - Dauer
        - Dauer
        - Dauer; optional
        - Rolleninhaber:in laut Entscheidungsmatrix
        - was entschieden wurde
        - Ablageort
    es:
      title: 'Tipo de Reunión: Operaciones'
      whyItMatters: >-
        La coordinación del día a día necesita un ritmo regular, no improvisación ad-hoc. La reunión
        de Operaciones es el latido de la comunidad — un espacio predecible para revisar el trabajo
        activo, detectar bloqueos y tomar pequeñas decisiones operativas. Fundamentalmente, solo las
        decisiones Operativas ocurren aquí; las Estratégicas y Constitucionales pasan por el proceso
        de gobernanza, así que la reunión no puede acumular silenciosamente autoridad que no tiene.
      whatToDefine: >-
        Define el propósito, el alcance de decisión, los participantes obligatorios y opcionales, la
        cadencia, la duración y las reglas de facilitación. Mantén el alcance de decisión solo en
        Operativo.
      placeholders:
        - revisar trabajo activo, coordinar tareas, detectar bloqueos, tomar decisiones operativas.
        - quién está invitado; quórum mínimo.
        - quién puede asistir por invitación.
        - semanal / quincenal / mensual.
        - p. ej. 90 minutos máximo.
        - rol de facilitador/a; regla de sustitución.
        - duración
        - duración
        - duración
        - duración
        - duración
        - duración
        - duración; opcional
        - titular del rol según la Matriz de Decisión
        - qué se decidió
        - ubicación
    fr:
      title: 'Type de réunion : Opérations'
      whyItMatters: >-
        La coordination au quotidien a besoin d'un rythme régulier, pas d'improvisation ad hoc. La
        réunion Opérations est le pouls de la communauté — un espace prévisible pour passer en revue
        le travail en cours, faire remonter les blocages et prendre de petites décisions
        opérationnelles. Point crucial : seules les décisions Opérationnelles sont prises ici ; les
        décisions Stratégiques et Constitutionnelles passent par le processus de gouvernance, de
        sorte que la réunion ne peut pas accumuler discrètement une autorité qu'elle n'a pas.
      whatToDefine: >-
        Définis l'objectif, le périmètre de décision, les participants requis et optionnels, la
        cadence, la durée et les règles de facilitation. Limite le périmètre de décision aux
        décisions Opérationnelles uniquement.
      placeholders:
        - >-

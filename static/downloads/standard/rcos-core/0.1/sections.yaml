- key: decision-matrix.decision-type-definitions
  artifact: decision-matrix
  order: 2
  clauseRefs:
    - 4.1.1
    - 4.1.2
    - 4.1.3
    - 4.1.4
    - 4.1.5
  i18n:
    en:
      title: Decision Type Definitions
      whyItMatters: >-
        Without a type, every decision gets handled at whatever speed and scrutiny happens to suit
        the moment — routine changes stall in debate, and constitutional shifts slip through
        unnoticed. Fixed types tie the weight of a decision to the process it must pass through, and
        the default-higher rule closes the gap where ambiguity would otherwise be exploited.
      whatToDefine: >-
        Define each decision type by what it covers, who executes it, what process it requires, and
        how disputes about classification are resolved.
      placeholders:
        - >-
          day-to-day functioning within existing rules; executed by the relevant role holder without
          a vote.
        - >-
          long-term direction, significant resource allocation, creation/removal of major
          structures; requires a Full Member vote with a defined deliberation period.
        - >-
          changes to Layer 0 (purpose, scope, invariants) or to the governance system itself;
          requires a Full Member vote, supermajority, and a ratification period.
    de:
      title: Definitionen der Entscheidungstypen
      whyItMatters: >-
        Ohne einen Typ wird jede Entscheidung mit der Geschwindigkeit und Sorgfalt behandelt, die
        gerade passt — Routineänderungen versanden in Debatten, und konstitutionelle Änderungen
        rutschen unbemerkt durch. Feste Typen binden das Gewicht einer Entscheidung an den Prozess,
        den sie durchlaufen muss, und die Regel „im Zweifel höher einstufen" schließt die Lücke, die
        sonst ausgenutzt werden könnte.
      whatToDefine: >-
        Definiere jeden Entscheidungstyp anhand seines Geltungsbereichs, wer ihn ausführt, welchen
        Prozess er erfordert und wie Streitigkeiten über die Klassifizierung gelöst werden.
      placeholders:
        - >-
          Tagesgeschäft innerhalb bestehender Regeln; wird von der zuständigen Rolleninhaberin ohne
          Abstimmung ausgeführt.
        - >-
          langfristige Ausrichtung, bedeutende Ressourcenzuweisung, Schaffung/Abschaffung
          wesentlicher Strukturen; erfordert eine Abstimmung der Vollmitglieder mit definiertem
          Beratungszeitraum.
        - >-
          Änderungen an Schicht 0 (Zweck, Geltungsbereich, Invarianten) oder am Governance-System
          selbst; erfordert eine Abstimmung der Vollmitglieder, Supermehrheit und einen
          Ratifizierungszeitraum.
    es:
      title: Definiciones de Tipos de Decisión
      whyItMatters: >-
        Sin un tipo, cada decisión se maneja a la velocidad y con el escrutinio que convenga en el
        momento — los cambios rutinarios se estancan en debates, y los cambios constitucionales
        pasan desapercibidos. Los tipos fijos vinculan el peso de una decisión al proceso que DEBE
        superar, y la regla de tipo superior por defecto cierra la brecha donde la ambigüedad de
        otro modo sería explotada.
      whatToDefine: >-
        Define cada tipo de decisión según lo que abarca, quién la ejecuta, qué proceso requiere y
        cómo se resuelven las disputas sobre la clasificación.
      placeholders:
        - >-
          funcionamiento diario dentro de las reglas existentes; ejecutado por el titular del rol
          correspondiente sin votación.
        - >-
          dirección a largo plazo, asignación significativa de recursos, creación/eliminación de
          estructuras importantes; requiere votación de Miembros Plenos con un período de
          deliberación definido.
        - >-
          cambios a la Capa 0 (propósito, alcance, invariantes) o al propio sistema de gobernanza;
          requiere votación de Miembros Plenos, supermayoría y un período de ratificación.
    fr:
      title: Définitions des types de décision
      whyItMatters: >-
        Sans type, chaque décision est traitée à la vitesse et avec le niveau de scrutin qui
        convient sur le moment — les changements de routine s'enlisent dans des débats, et les
        modifications constitutionnelles passent inaperçues. Des types fixes lient le poids d'une
        décision au processus qu'elle DOIT traverser, et la règle du défaut vers le haut comble la
        faille que l'ambiguïté permettrait autrement d'exploiter.
      whatToDefine: >-
        Définis chaque type de décision en précisant ce qu'il couvre, qui l'exécute, quel processus
        il requiert et comment les litiges de classification sont résolus.
      placeholders:
        - >-
          fonctionnement quotidien dans le cadre des règles existantes ; exécuté par le titulaire du
          rôle concerné sans vote.
        - >-
          orientation à long terme, allocation significative de ressources, création/suppression de
          structures majeures ; requiert un vote des Membres titulaires avec une période de
          délibération définie.
        - >-
          modifications de la Couche 0 (mission, périmètre, invariants) ou du système de gouvernance
          lui-même ; requiert un vote des Membres titulaires, une supermajorité et une période de
          ratification.
    pt-br:
      title: Definições dos Tipos de Decisão
      whyItMatters: >-
        Sem um tipo, cada decisão é tratada na velocidade e com o rigor que calhar no momento —
        mudanças rotineiras travam em debates, e mudanças constitucionais passam despercebidas.
        Tipos fixos vinculam o peso de uma decisão ao processo pelo qual ela precisa passar, e a
        regra do tipo-mais-alto-por-padrão fecha a brecha onde a ambiguidade seria explorada.
      whatToDefine: >-
        Defina cada tipo de decisão pelo que ele abrange, quem o executa, qual processo exige e como
        disputas sobre classificação são resolvidas.
      placeholders:
        - >-
          funcionamento cotidiano dentro das regras existentes; executado pelo detentor do papel
          relevante sem votação.
        - >-
          direção de longo prazo, alocação significativa de recursos, criação/remoção de estruturas
          importantes; requer votação dos Membros Plenos com um período de deliberação definido.
        - >-
          mudanças na Camada 0 (propósito, escopo, invariantes) ou no próprio sistema de governança;
          requer votação dos Membros Plenos, supermaioria e um período de ratificação.

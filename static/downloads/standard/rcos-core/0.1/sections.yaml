- key: decision-matrix.voting-principles
  artifact: decision-matrix
  order: 0
  clauseRefs:
    - 4.2.1
    - 4.2.2
    - 4.2.3
    - 4.2.4
  i18n:
    en:
      title: Voting Principles
      whyItMatters: >-
        A vote without a predefined mechanism, threshold, and deliberation window is an invitation
        to manufacture outcomes after the fact — whoever counts the votes or sets the clock wins.
        Declaring these parameters in advance makes every collective decision reproducible and
        contestable on the same terms, regardless of who is in the room.
      whatToDefine: >-
        State the voting platform, the threshold for each decision type, the deliberation period,
        the tie rule, the re-vote rule, and any delegated-authority spending or scope limit.
      placeholders:
        - e.g. Snapshot, Loomio, in-person consensus.
        - >-
          e.g. no vote required — delegated to the relevant operational role holder per the Role
          Registry.
        - e.g. supermajority (≥⅔); minimum Y-day deliberation; Z-day ratification period.
        - e.g. proposal fails; status quo maintained.
        - >-
          e.g. any Full Member may trigger a re-vote with a written reasoned objection citing a
          consideration not addressed during deliberation.
        - >-
          define what qualifies as a reasoned objection — cite a specific consideration not raised
          during deliberation; general disagreement does not qualify.
        - e.g. €0; or define a threshold under which delegated spending is allowed.
        - Other voting principles your community wants to declare.
    de:
      title: Abstimmungsgrundsätze
      whyItMatters: >-
        Eine Abstimmung ohne vordefinierten Mechanismus, Schwelle und Beratungszeitraum ist eine
        Einladung, Ergebnisse im Nachhinein zu manipulieren — wer die Stimmen zählt oder die Uhr
        stellt, gewinnt. Diese Parameter im Voraus festzulegen macht jede kollektive Entscheidung
        reproduzierbar und unter denselben Bedingungen anfechtbar, unabhängig davon, wer gerade im
        Raum ist.
      whatToDefine: >-
        Lege die Abstimmungsplattform, die Schwelle für jeden Entscheidungstyp, den
        Beratungszeitraum, die Patt-Regel, die Regel für erneute Abstimmungen sowie etwaige
        delegierte Ausgabenlimits oder Zuständigkeitsgrenzen fest.
      placeholders:
        - z. B. Snapshot, Loomio, Konsens in Präsenz.
        - >-
          z. B. keine Abstimmung erforderlich — delegiert an die zuständige operative
          Rolleninhaberin laut Rollenregister.
        - z. B. Supermehrheit (≥⅔); mindestens Y Tage Beratungszeit; Z Tage Ratifizierungszeitraum.
        - z. B. Vorschlag scheitert; Status quo bleibt bestehen.
        - >-
          z. B. jedes Vollmitglied kann mit einem schriftlich begründeten Einwand, der eine während
          der Beratung nicht behandelte Erwägung benennt, eine erneute Abstimmung auslösen.
        - >-
          Definiere, was als begründeter Einwand gilt — nenne eine konkrete Erwägung, die während
          der Beratung nicht vorgebracht wurde; allgemeine Ablehnung genügt nicht.
        - >-
          z. B. 0 €; oder definiere eine Schwelle, unterhalb derer delegierte Ausgaben zulässig
          sind.
        - Weitere Abstimmungsgrundsätze, die deine Gemeinschaft festlegen möchte.
    es:
      title: Principios de Votación
      whyItMatters: >-
        Una votación sin un mecanismo, umbral y período de deliberación predefinidos es una
        invitación a fabricar resultados después del hecho — quien cuenta los votos o establece el
        plazo gana. Declarar estos parámetros de antemano hace que cada decisión colectiva sea
        reproducible y contestable en los mismos términos, independientemente de quién esté
        presente.
      whatToDefine: >-
        Indica la plataforma de votación, el umbral para cada tipo de decisión, el período de
        deliberación, la regla de empate, la regla de re-votación, y cualquier límite de gasto o
        alcance de autoridad delegada.
      placeholders:
        - p. ej. Snapshot, Loomio, consenso presencial.
        - >-
          p. ej. no se requiere votación — delegado al titular del rol operativo correspondiente
          según el Registro de Roles.
        - >-
          p. ej. supermayoría (≥⅔); deliberación mínima de Y días; período de ratificación de Z
          días.
        - p. ej. la propuesta no se aprueba; se mantiene el statu quo.
        - >-
          p. ej. cualquier Miembro Pleno puede solicitar una re-votación mediante una objeción
          razonada por escrito que cite una consideración no abordada durante la deliberación.
        - >-
          definir qué constituye una objeción razonada — citar una consideración específica no
          planteada durante la deliberación; el desacuerdo general no califica.
        - p. ej. 0 €; o definir un umbral por debajo del cual se permite el gasto delegado.
        - Otros principios de votación que tu comunidad quiera declarar.
    fr:
      title: Principes de vote
      whyItMatters: >-
        Un vote sans mécanisme, seuil et délai de délibération prédéfinis est une invitation à
        fabriquer des résultats après coup — celui qui compte les votes ou fixe l'horloge gagne.
        Déclarer ces paramètres à l'avance rend chaque décision collective reproductible et
        contestable selon les mêmes conditions, indépendamment de qui est présent.
      whatToDefine: >-
        Indique la plateforme de vote, le seuil pour chaque type de décision, la période de
        délibération, la règle en cas d'égalité, la règle de revote et toute limite de dépense ou de
        périmètre en cas d'autorité déléguée.
      placeholders:
        - p. ex. Snapshot, Loomio, consensus en présentiel.
        - >-
          p. ex. aucun vote requis — délégué au titulaire du rôle opérationnel concerné selon le
          Registre des rôles.
        - >-
          p. ex. supermajorité (≥⅔) ; délibération minimale de Y jours ; période de ratification de
          Z jours.
        - p. ex. la proposition échoue ; le statu quo est maintenu.
        - >-
          p. ex. tout Membre titulaire PEUT déclencher un revote par une objection motivée écrite
          citant un point non abordé pendant la délibération.
        - >-
          définis ce qui constitue une objection motivée — citer un point précis non soulevé pendant
          la délibération ; un désaccord général ne suffit pas.
        - p. ex. 0 € ; ou définis un seuil en dessous duquel la dépense déléguée est autorisée.
        - Autres principes de vote que ta communauté souhaite déclarer.
    pt-br:
      title: Princípios de Votação
      whyItMatters: >-
        Uma votação sem mecanismo, limiar e janela de deliberação predefinidos é um convite para
        fabricar resultados depois do fato — quem conta os votos ou define o relógio vence. Declarar
        esses parâmetros com antecedência torna cada decisão coletiva reproduzível e contestável nos
        mesmos termos, independentemente de quem está na sala.
      whatToDefine: >-
        Indique a plataforma de votação, o limiar para cada tipo de decisão, o período de
        deliberação, a regra de empate, a regra de nova votação e qualquer limite de gastos ou
        escopo da autoridade delegada.
      placeholders:
        - 'ex.: Snapshot, Loomio, consenso presencial.'
        - >-
          ex.: nenhuma votação necessária — delegada ao detentor do papel operacional relevante
          conforme o Registro de Papéis.
        - 'ex.: supermaioria (≥⅔); deliberação mínima de Y dias; período de ratificação de Z dias.'
        - 'ex.: a proposta falha; o status quo é mantido.'
        - >-
          ex.: qualquer Membro Pleno pode acionar nova votação com uma objeção escrita e
          fundamentada citando uma consideração não abordada durante a deliberação.
        - >-
          defina o que qualifica como objeção fundamentada — citar uma consideração específica não
          levantada durante a deliberação; discordância geral não qualifica.
        - 'ex.: R$ 0; ou defina um limiar abaixo do qual gastos delegados são permitidos.'
        - Outros princípios de votação que sua comunidade queira declarar.

- key: conflict-resolution-ladder.conflict-classification
  artifact: conflict-resolution-ladder
  order: 0
  clauseRefs:
    - 6.1.1
    - 6.1.2
    - 6.1.3
    - 6.1.4
    - 6.1.5
    - 6.5.3
    - 6.6.4
    - 6.7.1
  i18n:
    en:
      title: Conflict Classification
      whyItMatters: >-
        Without named classes, every dispute gets treated the same — or worse, treated differently
        based on who is involved. Explicit classes set the entry point, the response window, and the
        documentation burden up front, so safety-critical matters cannot be quietly routed through a
        friendly chat and minor friction cannot be weaponized into a formal review.
      whatToDefine: >-
        For each class, set entry criteria, the entry step in the ladder, the initial response
        window, and the documentation burden.
      placeholders:
        - Interpersonal
        - member-to-member friction
        - Step 1
        - window
        - from which step
        - Role-based
        - role-performance dispute
        - ...
        - ...
        - ...
        - Structural
        - governance-process dispute
        - ...
        - ...
        - ...
        - Ethical / obligation breach
        - ...
        - ...
        - ...
        - ...
        - Safety-critical
        - credible safety risk, coercion, abuse, or threats
        - bypasses earlier steps
        - short window
        - from intake; immediate action permitted
    de:
      title: Konfliktklassifizierung
      whyItMatters: >-
        Ohne benannte Klassen wird jeder Streit gleich behandelt — oder schlimmer noch, je nach
        beteiligter Person unterschiedlich. Explizite Klassen legen den Einstiegspunkt, das
        Reaktionsfenster und den Dokumentationsaufwand von vornherein fest, sodass
        sicherheitskritische Angelegenheiten nicht stillschweigend über ein freundliches Gespräch
        abgehandelt und geringfügige Reibungen nicht zu einer formellen Überprüfung aufgebauscht
        werden können.
      whatToDefine: >-
        Lege für jede Klasse die Eintrittskriterien, die Einstiegsstufe in der Leiter, das
        anfängliche Reaktionsfenster und den Dokumentationsaufwand fest.
      placeholders:
        - Zwischenmenschlich
        - Reibung zwischen Mitgliedern
        - Stufe 1
        - Fenster
        - ab welcher Stufe
        - Rollenbasiert
        - Streit über Rollenausübung
        - ...
        - ...
        - ...
        - Strukturell
        - Streit über Governance-Prozesse
        - ...
        - ...
        - ...
        - Ethischer / Pflichtverstoss
        - ...
        - ...
        - ...
        - ...
        - Sicherheitskritisch
        - glaubhaftes Sicherheitsrisiko, Nötigung, Missbrauch oder Drohungen
        - überspringt frühere Stufen
        - kurzes Fenster
        - ab Eingang; sofortiges Handeln erlaubt
    es:
      title: Clasificación de Conflictos
      whyItMatters: >-
        Sin clases definidas, toda disputa recibe el mismo tratamiento — o peor, un tratamiento
        diferente según quién esté involucrado. Las clases explícitas establecen desde el inicio el
        punto de entrada, la ventana de respuesta y la carga de documentación, de modo que los
        asuntos críticos para la seguridad no puedan canalizarse discretamente a través de una
        conversación amistosa y las fricciones menores no puedan convertirse en arma mediante una
        revisión formal.
      whatToDefine: >-
        Para cada clase, define los criterios de entrada, el paso de entrada en la escalera, la
        ventana de respuesta inicial y la carga de documentación.
      placeholders:
        - Interpersonal
        - fricción entre miembros
        - Paso 1
        - ventana
        - desde qué paso
        - Basado en roles
        - disputa sobre desempeño del rol
        - ...
        - ...
        - ...
        - Estructural
        - disputa sobre procesos de gobernanza
        - ...
        - ...
        - ...
        - Ético / incumplimiento de obligaciones
        - ...
        - ...
        - ...
        - ...
        - Crítico para la seguridad
        - riesgo de seguridad creíble, coerción, abuso o amenazas
        - omite pasos anteriores
        - ventana corta
        - desde la admisión; acción inmediata permitida
    fr:
      title: Classification des conflits
      whyItMatters: >-
        Sans classes nommées, chaque différend est traité de la même manière — ou pire, traité
        différemment selon les personnes impliquées. Des classes explicites définissent le point
        d'entrée, le délai de réponse et la charge de documentation dès le départ, de sorte que les
        situations critiques pour la sécurité ne puissent pas être discrètement redirigées vers une
        conversation informelle et que des frictions mineures ne puissent pas être instrumentalisées
        en examen formel.
      whatToDefine: >-
        Pour chaque classe, définis les critères d'entrée, l'étape d'entrée dans l'échelle, le délai
        de réponse initial et la charge de documentation.
      placeholders:
        - Interpersonnel
        - friction entre membres
        - Étape 1
        - délai
        - à partir de quelle étape
        - Lié au rôle
        - différend sur l'exercice d'un rôle
        - ...
        - ...
        - ...
        - Structurel
        - différend sur un processus de gouvernance
        - ...
        - ...
        - ...
        - Éthique / manquement à une obligation
        - ...
        - ...
        - ...
        - ...
        - Critique pour la sécurité
        - risque crédible pour la sécurité, coercition, abus ou menaces
        - contourne les étapes précédentes
        - délai court
        - dès la prise en charge ; action immédiate autorisée
    pt-br:
      title: Classificação de Conflitos
      whyItMatters: >-
        Sem classes nomeadas, toda disputa acaba tratada da mesma forma — ou, pior, tratada de forma
        diferente dependendo de quem está envolvido. Classes explícitas definem o ponto de entrada,
        o prazo de resposta e o ônus de documentação desde o início, de modo que questões críticas
        de segurança não possam ser silenciosamente encaminhadas por meio de uma conversa amigável e
        atritos menores não possam ser instrumentalizados em uma revisão formal.
      whatToDefine: >-
        Para cada classe, defina os critérios de entrada, o passo inicial na escada, o prazo de
        resposta inicial e o ônus de documentação.
      placeholders:
        - Interpessoal
        - atrito entre membros
        - Passo 1
        - prazo
        - a partir de qual passo
        - Baseado em papéis
        - disputa sobre desempenho de papel
        - ...
        - ...
        - ...
        - Estrutural
        - disputa sobre processo de governança
        - ...
        - ...
        - ...
        - Ética / violação de obrigação
        - ...
        - ...
        - ...
        - ...
        - Crítico de segurança
        - risco de segurança crível, coerção, abuso ou ameaças
        - contorna passos anteriores
        - prazo curto
        - desde a abertura; ação imediata permitida

- key: learning-log.entry-format
  artifact: learning-log
  order: 1
  clauseRefs:
    - 8.4.2
    - 8.4.3
    - 8.6.5
  i18n:
    en:
      title: Entry Format
      whyItMatters: >-
        Free-form reflection is valuable, but it does not aggregate. A consistent schema — trigger,
        signals, what changed, outcome, follow-up owner — makes it possible to scan years of entries
        for recurring patterns and to turn isolated incidents into structural evidence. It also
        forces each entry to name an owner, so learning does not stop at "we noticed."
      whatToDefine: >-
        Use the template below for every entry. Each field forces a different lens on the event; do
        not skip the follow-up owner.
      placeholders: []
    de:
      title: Eintragsformat
      whyItMatters: >-
        Freie Reflexion ist wertvoll, lässt sich aber nicht aggregieren. Ein einheitliches Schema —
        Auslöser, Signale, was sich geändert hat, Ergebnis, Verantwortliche*r für die Nachverfolgung
        — ermöglicht es, Einträge über Jahre hinweg nach wiederkehrenden Mustern zu durchsuchen und
        einzelne Vorfälle in strukturelle Erkenntnisse umzuwandeln. Es zwingt außerdem jeden
        Eintrag, eine verantwortliche Person zu benennen, damit Lernen nicht bei „wir haben es
        bemerkt" endet.
      whatToDefine: >-
        Verwende die unten stehende Vorlage für jeden Eintrag. Jedes Feld erzwingt einen anderen
        Blickwinkel auf das Ereignis; überspringe nicht die verantwortliche Person für die
        Nachverfolgung.
      placeholders: []
    es:
      title: Formato de entrada
      whyItMatters: >-
        La reflexión libre es valiosa, pero no se agrega. Un esquema consistente — detonante,
        señales, qué cambió, resultado, responsable de seguimiento — permite recorrer años de
        entradas buscando patrones recurrentes y convertir incidentes aislados en evidencia
        estructural. También obliga a cada entrada a nombrar un responsable, para que el aprendizaje
        no se detenga en "lo notamos".
      whatToDefine: >-
        Usa la plantilla de abajo para cada entrada. Cada campo impone una perspectiva distinta
        sobre el evento; no omitas el responsable de seguimiento.
      placeholders: []
    fr:
      title: Format des entrées
      whyItMatters: >-
        La réflexion libre a de la valeur, mais elle ne s'agrège pas. Un schéma cohérent —
        déclencheur, signaux, ce qui a changé, résultat, responsable du suivi — permet de parcourir
        des années d'entrées à la recherche de schémas récurrents et de transformer des incidents
        isolés en preuves structurelles. Il oblige aussi chaque entrée à nommer un responsable, pour
        que l'apprentissage ne s'arrête pas à « on a remarqué ».
      whatToDefine: >-
        Utilise le modèle ci-dessous pour chaque entrée. Chaque champ impose un angle différent sur
        l'événement ; ne saute pas le responsable du suivi.
      placeholders: []
    pt-br:
      title: Formato da Entrada
      whyItMatters: >-
        A reflexão em formato livre é valiosa, mas não se agrega. Um esquema consistente — gatilho,
        sinais, o que mudou, resultado, responsável pelo acompanhamento — permite revisar anos de
        entradas em busca de padrões recorrentes e transformar incidentes isolados em evidência
        estrutural. Também obriga cada entrada a nomear um responsável, para que o aprendizado não
        pare em "nós percebemos".
      whatToDefine: >-
        Use o modelo abaixo para cada entrada. Cada campo impõe uma lente diferente sobre o evento;
        não pule o responsável pelo acompanhamento.
      placeholders: []
  ownsClauses:
    - 8.4.2
    - 8.4.3

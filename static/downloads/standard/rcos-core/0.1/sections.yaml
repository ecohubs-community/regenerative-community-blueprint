- key: scope-declaration.in-scope-assets
  artifact: scope-declaration
  order: 0
  clauseRefs:
    - 2.2.1
    - 2.2.2
    - 2.2.4
  i18n:
    en:
      title: In-Scope Assets
      whyItMatters: >-
        If the community has not explicitly named an asset as in-scope, it isn't — full stop.
        Listing assets by name closes the gap where informal claims of authority grow over
        undeclared resources, and gives members a concrete checklist to verify what the community
        actually controls.
      whatToDefine: >-
        List every asset the community collectively governs: shared funds, treasuries, land, real
        estate, software, websites, social accounts, brand, intellectual property, physical
        infrastructure, etc. Be specific — name accounts, wallets, domains.
      placeholders:
        - Asset 1, e.g. the shared treasury held in a specific multi-sig wallet.
        - Asset 2, e.g. the community website and its domain.
        - Asset 3, e.g. shared physical infrastructure or land.
        - Asset 4.
    de:
      title: Erfasste Vermögenswerte
      whyItMatters: >-
        Wenn die Gemeinschaft einen Vermögenswert nicht ausdrücklich als erfasst benannt hat, ist er
        es nicht — Punkt. Vermögenswerte namentlich aufzulisten schließt die Lücke, in der
        informelle Autoritätsansprüche über nicht deklarierte Ressourcen wachsen, und gibt
        Mitgliedern eine konkrete Checkliste, um zu überprüfen, was die Gemeinschaft tatsächlich
        kontrolliert.
      whatToDefine: >-
        Liste jeden Vermögenswert auf, den die Gemeinschaft gemeinsam verwaltet: gemeinsame Kassen,
        Treasuries, Land, Immobilien, Software, Websites, Social-Media-Konten, Marke, geistiges
        Eigentum, physische Infrastruktur usw. Sei konkret — benenne Konten, Wallets, Domains.
      placeholders:
        - Vermögenswert 1, z. B. die gemeinsame Kasse in einer bestimmten Multi-Sig-Wallet.
        - Vermögenswert 2, z. B. die Gemeinschaftswebsite und ihre Domain.
        - Vermögenswert 3, z. B. gemeinsame physische Infrastruktur oder Land.
        - Vermögenswert 4.
    es:
      title: Activos Dentro del Alcance
      whyItMatters: >-
        Si la comunidad no ha nombrado explícitamente un activo como dentro del alcance, no lo está
        — punto final. Listar los activos por nombre cierra la brecha donde reclamos informales de
        autoridad crecen sobre recursos no declarados, y da a los miembros una lista de verificación
        concreta para comprobar qué controla realmente la comunidad.
      whatToDefine: >-
        Lista cada activo que la comunidad gobierna colectivamente: fondos compartidos, tesorerías,
        terrenos, bienes raíces, software, sitios web, cuentas en redes sociales, marca, propiedad
        intelectual, infraestructura física, etc. Sé específico/a — nombra cuentas, billeteras,
        dominios.
      placeholders:
        - Activo 1, p. ej. la tesorería compartida en una billetera multi-firma específica.
        - Activo 2, p. ej. el sitio web de la comunidad y su dominio.
        - Activo 3, p. ej. infraestructura física compartida o terrenos.
        - Activo 4.
    fr:
      title: Actifs dans le périmètre
      whyItMatters: >-
        Si la communauté n'a pas explicitement désigné un actif comme étant dans le périmètre, il ne
        l'est pas — point final. Lister les actifs par leur nom comble le vide dans lequel des
        revendications informelles d'autorité se développent sur des ressources non déclarées, et
        donne aux membres une liste de vérification concrète de ce que la communauté contrôle
        réellement.
      whatToDefine: >-
        Liste tous les actifs que la communauté gouverne collectivement : fonds partagés,
        trésoreries, terrains, biens immobiliers, logiciels, sites web, comptes sur les réseaux
        sociaux, marque, propriété intellectuelle, infrastructure physique, etc. Sois précis·e —
        nomme les comptes, portefeuilles, domaines.
      placeholders:
        - >-
          Actif 1, p. ex. la trésorerie commune détenue dans un portefeuille multi-signature
          spécifique.
        - Actif 2, p. ex. le site web de la communauté et son nom de domaine.
        - Actif 3, p. ex. l'infrastructure physique partagée ou le terrain.
        - Actif 4.
    pt-br:
      title: Ativos Dentro do Escopo
      whyItMatters: >-
        Se a comunidade não nomeou explicitamente um ativo como dentro do escopo, ele não está —
        ponto final. Listar os ativos pelo nome fecha a brecha onde reivindicações informais de
        autoridade crescem sobre recursos não declarados, e oferece aos membros uma lista concreta
        para verificar o que a comunidade de fato controla.
      whatToDefine: >-
        Liste todos os ativos que a comunidade governa coletivamente: fundos compartilhados,
        tesourarias, terras, imóveis, software, sites, contas em redes sociais, marca, propriedade
        intelectual, infraestrutura física, etc. Seja específico — nomeie contas, carteiras,
        domínios.
      placeholders:
        - 'Ativo 1, ex.: a tesouraria compartilhada mantida em uma carteira multi-sig específica.'
        - 'Ativo 2, ex.: o site da comunidade e seu domínio.'
        - 'Ativo 3, ex.: infraestrutura física ou terras compartilhadas.'
        - Ativo 4.
  ownsClauses:
    - 2.2.1
    - 2.2.2
- key: scope-declaration.in-scope-decision-domains
  artifact: scope-declaration
  order: 1
  clauseRefs:
    - 2.2.1
    - 2.2.2
  i18n:
    en:
      title: In-Scope Decision Domains
      whyItMatters: >-
        Scope isn't only about stuff — it's about which kinds of questions the community gets to
        answer collectively. Naming decision domains makes it unambiguous where collective authority
        applies and where an individual or external party still decides, preventing quiet capture of
        decision territory.
      whatToDefine: >-
        List the categories of decisions the community has authority over. These map to later layers
        (governance, membership, treasury, etc.) — name them at a level that makes it clear what
        kinds of questions the community decides together.
      placeholders:
        - Decision domain 1, e.g. governance rules and decision processes (Layer 2).
        - Decision domain 2, e.g. membership rules and admission (Layer 1).
        - Decision domain 3, e.g. treasury and shared resource allocation (Layer 3).
        - Decision domain 4.
    de:
      title: Erfasste Entscheidungsbereiche
      whyItMatters: >-
        Beim Geltungsbereich geht es nicht nur um Dinge — es geht darum, welche Arten von Fragen die
        Gemeinschaft gemeinsam beantworten darf. Entscheidungsbereiche zu benennen macht
        unmissverständlich, wo kollektive Autorität gilt und wo eine Einzelperson oder eine externe
        Partei weiterhin entscheidet, und verhindert die stille Übernahme von Entscheidungsgebieten.
      whatToDefine: >-
        Liste die Kategorien von Entscheidungen auf, über die die Gemeinschaft Autorität hat. Diese
        entsprechen späteren Layern (Governance, Mitgliedschaft, Kasse usw.) — benenne sie auf einem
        Niveau, das klarmacht, welche Arten von Fragen die Gemeinschaft gemeinsam entscheidet.
      placeholders:
        - Entscheidungsbereich 1, z. B. Governance-Regeln und Entscheidungsprozesse (Schicht 2).
        - Entscheidungsbereich 2, z. B. Mitgliedschaftsregeln und Aufnahme (Schicht 1).
        - Entscheidungsbereich 3, z. B. Kasse und Verteilung gemeinsamer Ressourcen (Schicht 3).
        - Entscheidungsbereich 4.
    es:
      title: Dominios de Decisión Dentro del Alcance
      whyItMatters: >-
        El alcance no se trata solo de cosas — se trata de qué tipos de preguntas la comunidad puede
        responder colectivamente. Nombrar los dominios de decisión deja claro sin ambigüedad dónde
        se aplica la autoridad colectiva y dónde un individuo o una parte externa aún decide,
        previniendo la captura silenciosa de territorio de decisión.
      whatToDefine: >-
        Lista las categorías de decisiones sobre las que la comunidad tiene autoridad. Estas se
        corresponden con capas posteriores (gobernanza, membresía, tesorería, etc.) — nómbralas a un
        nivel que deje claro qué tipos de preguntas la comunidad decide en conjunto.
      placeholders:
        - Dominio de decisión 1, p. ej. reglas de gobernanza y procesos de decisión (Capa 2).
        - Dominio de decisión 2, p. ej. reglas de membresía y admisión (Capa 1).
        - Dominio de decisión 3, p. ej. tesorería y asignación de recursos compartidos (Capa 3).
        - Dominio de decisión 4.
    fr:
      title: Domaines de décision dans le périmètre
      whyItMatters: >-
        Le périmètre ne concerne pas uniquement les biens — il s'agit aussi de savoir quels types de
        questions la communauté peut trancher collectivement. Nommer les domaines de décision rend
        explicite où s'applique l'autorité collective et où c'est un individu ou une partie externe
        qui décide, empêchant ainsi la capture silencieuse de territoires décisionnels.
      whatToDefine: >-
        Liste les catégories de décisions sur lesquelles la communauté a autorité. Elles
        correspondent aux couches ultérieures (gouvernance, adhésion, trésorerie, etc.) — nomme-les
        à un niveau qui rende clair quels types de questions la communauté décide ensemble.
      placeholders:
        - Domaine de décision 1, p. ex. règles de gouvernance et processus décisionnels (Couche 2).
        - Domaine de décision 2, p. ex. règles d'adhésion et admission (Couche 1).
        - >-
          Domaine de décision 3, p. ex. trésorerie et allocation des ressources partagées (Couche
          3).
        - Domaine de décision 4.
    pt-br:
      title: Domínios de Decisão Dentro do Escopo
      whyItMatters: >-
        Escopo não é só sobre coisas — é sobre quais tipos de perguntas a comunidade tem direito de
        responder coletivamente. Nomear os domínios de decisão deixa inequívoco onde a autoridade
        coletiva se aplica e onde um indivíduo ou parte externa ainda decide, evitando a captura
        silenciosa de território decisório.
      whatToDefine: >-
        Liste as categorias de decisões sobre as quais a comunidade tem autoridade. Estas se
        conectam às camadas posteriores (governança, associação, tesouraria, etc.) — nomeie-as em um
        nível que deixe claro quais tipos de perguntas a comunidade decide em conjunto.
      placeholders:
        - 'Domínio de decisão 1, ex.: regras de governança e processos de decisão (Camada 2).'
        - 'Domínio de decisão 2, ex.: regras de associação e admissão (Camada 1).'
        - 'Domínio de decisão 3, ex.: tesouraria e alocação de recursos compartilhados (Camada 3).'
        - Domínio de decisão 4.
  ownsClauses: []
- key: scope-declaration.in-scope-activities-and-responsibilities
  artifact: scope-declaration
  order: 2
  clauseRefs:
    - 2.2.1
    - 2.2.2
  i18n:
    en:
      title: In-Scope Activities and Responsibilities
      whyItMatters: >-
        Authority without owned responsibility produces paralysis; responsibility without declared
        authority produces burnout and blame. Listing the activities the community collectively
        governs makes the work visible, assignable, and accountable — and makes it obvious when
        something important has no owner.
      whatToDefine: >-
        List the ongoing activities the community is responsible for: maintaining shared
        infrastructure, admitting members, reporting on resources, stewarding the brand, etc. These
        are the things that need an owner via Layer 5.
      placeholders:
        - Activity 1.
        - Activity 2.
        - Activity 3.
        - Activity 4.
    de:
      title: Erfasste Aktivitäten und Verantwortlichkeiten
      whyItMatters: >-
        Autorität ohne übernommene Verantwortung erzeugt Stillstand; Verantwortung ohne erklärte
        Autorität erzeugt Burnout und Schuldzuweisungen. Die Aktivitäten aufzulisten, die die
        Gemeinschaft gemeinsam steuert, macht die Arbeit sichtbar, zuweisbar und
        rechenschaftspflichtig — und macht offensichtlich, wenn etwas Wichtiges keinen
        Verantwortlichen hat.
      whatToDefine: >-
        Liste die laufenden Aktivitäten auf, für die die Gemeinschaft verantwortlich ist: Pflege
        gemeinsamer Infrastruktur, Aufnahme von Mitgliedern, Berichterstattung über Ressourcen,
        Pflege der Marke usw. Das sind die Dinge, die über Schicht 5 einen Verantwortlichen
        brauchen.
      placeholders:
        - Aktivität 1.
        - Aktivität 2.
        - Aktivität 3.
        - Aktivität 4.
    es:
      title: Actividades y Responsabilidades Dentro del Alcance
      whyItMatters: >-
        Autoridad sin responsabilidad asumida produce parálisis; responsabilidad sin autoridad
        declarada produce agotamiento y culpa. Listar las actividades que la comunidad gobierna
        colectivamente hace el trabajo visible, asignable y con rendición de cuentas — y hace obvio
        cuándo algo importante no tiene responsable.
      whatToDefine: >-
        Lista las actividades continuas de las que la comunidad es responsable: mantener
        infraestructura compartida, admitir miembros, reportar sobre recursos, custodiar la marca,
        etc. Estas son las cosas que necesitan un responsable a través de la Capa 5.
      placeholders:
        - Actividad 1.
        - Actividad 2.
        - Actividad 3.
        - Actividad 4.
    fr:
      title: Activités et responsabilités dans le périmètre
      whyItMatters: >-
        L'autorité sans responsabilité assumée produit la paralysie ; la responsabilité sans
        autorité déclarée produit l'épuisement et les reproches. Lister les activités que la
        communauté gouverne collectivement rend le travail visible, assignable et imputable — et met
        en évidence quand quelque chose d'important n'a pas de responsable.
      whatToDefine: >-
        Liste les activités permanentes dont la communauté est responsable : entretien de
        l'infrastructure partagée, admission des membres, rapports sur les ressources, gestion de la
        marque, etc. Ce sont les choses qui ont besoin d'un·e responsable via la Couche 5.
      placeholders:
        - Activité 1.
        - Activité 2.
        - Activité 3.
        - Activité 4.
    pt-br:
      title: Atividades e Responsabilidades Dentro do Escopo
      whyItMatters: >-
        Autoridade sem responsabilidade assumida produz paralisia; responsabilidade sem autoridade
        declarada produz esgotamento e culpabilização. Listar as atividades que a comunidade governa
        coletivamente torna o trabalho visível, atribuível e responsabilizável — e deixa óbvio
        quando algo importante não tem dono.
      whatToDefine: >-
        Liste as atividades contínuas pelas quais a comunidade é responsável: manter a
        infraestrutura compartilhada, admitir membros, prestar contas sobre recursos, cuidar da
        marca, etc. Estas são as coisas que precisam de um dono via Camada 5.
      placeholders:
        - Atividade 1.
        - Atividade 2.
        - Atividade 3.
        - Atividade 4.
  ownsClauses: []
- key: scope-declaration.explicitly-out-of-scope
  artifact: scope-declaration
  order: 3
  clauseRefs:
    - 2.2.3
    - 2.2.4
    - 2.2.5
  i18n:
    en:
      title: Explicitly Out of Scope
      whyItMatters: >-
        An unstated boundary is no boundary at all. Explicit out-of-scope items protect members from
        the community reaching into their private lives and finances, and protect external parties
        from the community presuming authority over their affairs. If it isn't named here, the
        default rule of "not in-scope means out of scope" still applies — but naming the big ones
        removes any room for argument.
      whatToDefine: >-
        List the most important boundaries: things people might assume are in scope but aren't.
        Personal finances, private relationships, third-party infrastructure, external projects,
        etc.
      placeholders:
        - Out-of-scope item 1, e.g. personal income and private finances of members.
        - >-
          Out-of-scope item 2, e.g. private relationships and personal living arrangements (except
          where Layer 4 safety-critical conditions apply).
        - >-
          Out-of-scope item 3, e.g. underlying server infrastructure and third-party service
          contracts.
        - Out-of-scope item 4.
    de:
      title: Ausdrücklich nicht erfasst
      whyItMatters: >-
        Eine unausgesprochene Grenze ist überhaupt keine Grenze. Explizit nicht erfasste Punkte
        schützen Mitglieder davor, dass die Gemeinschaft in ihr Privatleben und ihre Finanzen
        eingreift, und schützen externe Parteien davor, dass die Gemeinschaft Autorität über ihre
        Angelegenheiten beansprucht. Wenn etwas hier nicht benannt ist, gilt die Standardregel
        „nicht erfasst bedeutet außerhalb des Geltungsbereichs" weiterhin — aber die großen Punkte
        zu benennen, beseitigt jeden Raum für Diskussionen.
      whatToDefine: >-
        Liste die wichtigsten Grenzen auf: Dinge, von denen Leute annehmen könnten, dass sie erfasst
        sind, es aber nicht sind. Persönliche Finanzen, private Beziehungen, Infrastruktur Dritter,
        externe Projekte usw.
      placeholders:
        - Nicht erfasster Punkt 1, z. B. persönliches Einkommen und private Finanzen der Mitglieder.
        - >-
          Nicht erfasster Punkt 2, z. B. private Beziehungen und persönliche Wohnsituationen (außer
          wenn sicherheitskritische Bedingungen aus Schicht 4 gelten).
        - >-
          Nicht erfasster Punkt 3, z. B. zugrundeliegende Serverinfrastruktur und Verträge mit
          Drittanbietern.
        - Nicht erfasster Punkt 4.
    es:
      title: Explícitamente Fuera del Alcance
      whyItMatters: >-
        Un límite no declarado no es ningún límite. Los elementos explícitamente fuera del alcance
        protegen a los miembros de que la comunidad se entrometa en sus vidas privadas y finanzas, y
        protegen a partes externas de que la comunidad presuma autoridad sobre sus asuntos. Si no
        está nombrado aquí, la regla por defecto de "no está dentro del alcance significa fuera del
        alcance" sigue aplicando — pero nombrar los más importantes elimina cualquier margen de
        discusión.
      whatToDefine: >-
        Lista los límites más importantes: cosas que la gente podría asumir que están dentro del
        alcance pero no lo están. Finanzas personales, relaciones privadas, infraestructura de
        terceros, proyectos externos, etc.
      placeholders:
        - >-
          Elemento fuera del alcance 1, p. ej. ingresos personales y finanzas privadas de los
          miembros.
        - >-
          Elemento fuera del alcance 2, p. ej. relaciones privadas y arreglos de vivienda personales
          (excepto donde apliquen condiciones críticas de seguridad de la Capa 4).
        - >-
          Elemento fuera del alcance 3, p. ej. infraestructura de servidores subyacente y contratos
          con servicios de terceros.
        - Elemento fuera del alcance 4.
    fr:
      title: Explicitement hors périmètre
      whyItMatters: >-
        Une limite non énoncée n'est pas une limite. Les éléments explicitement hors périmètre
        protègent les membres contre l'intrusion de la communauté dans leur vie privée et leurs
        finances, et protègent les parties externes contre toute présomption d'autorité de la
        communauté sur leurs affaires. Si un élément n'est pas nommé ici, la règle par défaut « ce
        qui n'est pas dans le périmètre est hors périmètre » s'applique toujours — mais nommer les
        éléments importants ne laisse aucune place à la contestation.
      whatToDefine: >-
        Liste les limites les plus importantes : les choses que les gens pourraient supposer être
        dans le périmètre mais qui ne le sont pas. Finances personnelles, relations privées,
        infrastructure de tiers, projets externes, etc.
      placeholders:
        - Élément hors périmètre 1, p. ex. revenus personnels et finances privées des membres.
        - >-
          Élément hors périmètre 2, p. ex. relations privées et arrangements de vie personnels (sauf
          lorsque les conditions critiques de sécurité de la Couche 4 s'appliquent).
        - >-
          Élément hors périmètre 3, p. ex. infrastructure serveur sous-jacente et contrats de
          services tiers.
        - Élément hors périmètre 4.
    pt-br:
      title: Explicitamente Fora do Escopo
      whyItMatters: >-
        Um limite não declarado não é limite nenhum. Itens explicitamente fora do escopo protegem os
        membros de a comunidade invadir suas vidas privadas e finanças, e protegem partes externas
        de a comunidade presumir autoridade sobre seus assuntos. Se algo não é nomeado aqui, a regra
        padrão de "não estar dentro do escopo significa estar fora do escopo" continua valendo — mas
        nomear os mais importantes elimina qualquer margem para discussão.
      whatToDefine: >-
        Liste os limites mais importantes: coisas que as pessoas podem supor estar dentro do escopo
        mas não estão. Finanças pessoais, relacionamentos privados, infraestrutura de terceiros,
        projetos externos, etc.
      placeholders:
        - 'Item fora do escopo 1, ex.: renda pessoal e finanças privadas dos membros.'
        - >-
          Item fora do escopo 2, ex.: relacionamentos privados e arranjos pessoais de moradia
          (exceto quando se aplicam condições críticas de segurança da Camada 4).
        - >-
          Item fora do escopo 3, ex.: infraestrutura de servidor subjacente e contratos de serviços
          de terceiros.
        - Item fora do escopo 4.
  ownsClauses:
    - 2.2.3
    - 2.2.4
    - 2.2.5

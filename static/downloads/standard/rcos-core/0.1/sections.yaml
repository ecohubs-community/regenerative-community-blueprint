      whyItMatters: >-
        Reflection that happens only when time allows never happens. A named meeting type with a
        defined cadence makes space for looking back — and keeps retrospection from getting squeezed
        out by operational urgency. Without it, the Learning Log (Layer 6) stays empty and the
        framework stops evolving.

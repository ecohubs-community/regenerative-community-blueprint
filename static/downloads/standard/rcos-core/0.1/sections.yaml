    fr:
      title: Unités internes
      whyItMatters: >-
        Les unités internes tendent à acquérir des pouvoirs que personne n'a votés — dépréciation,
        plafonds, transférabilité, poids de gouvernance — à moins que chaque propriété ne soit
        consignée par écrit. Lister l'émission, les règles de transfert, la confidentialité et le
        statut explicitement non-gouvernemental fait de ces unités des outils de reconnaissance
        plutôt que de discrètes devises parallèles.
      whatToDefine: >-
        Si ta communauté utilise des unités internes (XP, ECO, crédits, etc.), définis pour chaque
        unité son objectif, son émission, sa transférabilité, sa dépréciation, son plafond, la
        prévention de la fraude et la confidentialité. Indique explicitement que les unités
        n'accordent pas de droits de gouvernance au-delà de l'état d'adhésion.

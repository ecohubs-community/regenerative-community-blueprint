- key: internal-economy-protocol.recognized-contribution-categories
  artifact: internal-economy-protocol
  order: 1
  clauseRefs:
    - 5.2.1
    - 5.2.3
    - 5.6.3
  i18n:
    en:
      title: Recognized Contribution Categories
      whyItMatters: >-
        If the community never says out loud which kinds of work it depends on, the invisible work —
        care, facilitation, moderation, stewardship — stays invisible, and the people doing it burn
        out or leave. Enumerating categories converts "someone just does this" into recognized
        labour the system has to account for.
      whatToDefine: >-
        List the categories of contribution your community recognizes. Care, facilitation,
        stewardship, and informal participation are commonly under-recognized — name them explicitly
        if they apply.
      placeholders:
        - e.g. Knowledge & Research
        - examples
        - e.g. Technical Development
        - examples
        - e.g. Governance & Coordination
        - examples
        - e.g. Community Building
        - examples
        - e.g. Care & Support
        - examples
        - e.g. Stewardship
        - examples
        - e.g. Informal Participation
        - examples
    de:
      title: Anerkannte Beitragskategorien
      whyItMatters: >-
        Wenn die Gemeinschaft nie ausspricht, auf welche Arten von Arbeit sie angewiesen ist, bleibt
        die unsichtbare Arbeit — Fürsorge, Moderation, Facilitation, Verwaltung — unsichtbar, und
        die Menschen, die sie leisten, brennen aus oder gehen. Das Aufzählen von Kategorien
        verwandelt „das macht halt irgendjemand" in anerkannte Arbeit, die das System
        berücksichtigen muss.
      whatToDefine: >-
        Liste die Beitragskategorien auf, die deine Gemeinschaft anerkennt. Fürsorge, Facilitation,
        Verwaltung und informelle Teilnahme werden häufig zu wenig anerkannt — benenne sie explizit,
        wenn sie zutreffen.
      placeholders:
        - z. B. Wissen & Forschung
        - Beispiele
        - z. B. Technische Entwicklung
        - Beispiele
        - z. B. Governance & Koordination
        - Beispiele
        - z. B. Gemeinschaftsaufbau
        - Beispiele
        - z. B. Fürsorge & Unterstützung
        - Beispiele
        - z. B. Verwaltung
        - Beispiele
        - z. B. Informelle Teilnahme
        - Beispiele
    es:
      title: Categorías de Contribución Reconocidas
      whyItMatters: >-
        Si la comunidad nunca dice en voz alta de qué tipos de trabajo depende, el trabajo invisible
        — cuidado, facilitación, moderación, custodia — permanece invisible, y las personas que lo
        realizan se agotan o se van. Enumerar las categorías convierte "alguien simplemente hace
        esto" en trabajo reconocido que el sistema tiene que tener en cuenta.
      whatToDefine: >-
        Enumera las categorías de contribución que tu comunidad reconoce. El cuidado, la
        facilitación, la custodia y la participación informal suelen estar insuficientemente
        reconocidos — nómbralos explícitamente si aplican.
      placeholders:
        - p. ej. Conocimiento e Investigación
        - ejemplos
        - p. ej. Desarrollo Técnico
        - ejemplos
        - p. ej. Gobernanza y Coordinación
        - ejemplos
        - p. ej. Construcción de Comunidad
        - ejemplos
        - p. ej. Cuidado y Apoyo
        - ejemplos
        - p. ej. Custodia
        - ejemplos
        - p. ej. Participación Informal
        - ejemplos
    fr:
      title: Catégories de contribution reconnues
      whyItMatters: >-
        Si la communauté ne dit jamais à voix haute de quels types de travail elle dépend, le
        travail invisible — soin, facilitation, modération, intendance — reste invisible, et les
        personnes qui l'accomplissent s'épuisent ou partent. Énumérer les catégories transforme «
        quelqu'un s'en occupe, c'est tout » en travail reconnu que le système est tenu de prendre en
        compte.
      whatToDefine: >-
        Liste les catégories de contribution que ta communauté reconnaît. Le soin, la facilitation,
        l'intendance et la participation informelle sont souvent sous-reconnus — nomme-les
        explicitement si cela s'applique.
      placeholders:
        - ex. Connaissance et recherche
        - exemples
        - ex. Développement technique
        - exemples
        - ex. Gouvernance et coordination
        - exemples
        - ex. Construction communautaire
        - exemples

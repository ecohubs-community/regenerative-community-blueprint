- key: accountability-protocol.triggers
  artifact: accountability-protocol
  order: 0
  clauseRefs:
    - 6.4.1
    - 6.5.4
  i18n:
    en:
      title: Triggers
      whyItMatters: >-
        If accountability checks only happen when someone feels strongly enough to push, they become
        political. Naming the exact triggers — inactivity, breach, invariant violation, referral —
        means the process starts from a condition anyone can verify, not from a judgement about a
        person.
      whatToDefine: >-
        List the specific, verifiable triggers that initiate an accountability check. Each trigger
        should be observable from records or a direct referral.
      placeholders:
        - A member has not made a recognized contribution in X consecutive months.
        - A member has breached a Membership Agreement obligation.
        - A member has violated a Layer 0 identity constraint or invariant.
        - A referral is made from the Conflict Resolution Ladder (Step 3 or above).
    de:
      title: Auslöser
      whyItMatters: >-
        Wenn Rechenschaftsprüfungen nur stattfinden, wenn jemand sich stark genug fühlt, sie
        durchzusetzen, werden sie politisch. Die genauen Auslöser zu benennen — Inaktivität,
        Verstoß, Invarianten-Verletzung, Verweisung — bedeutet, dass der Prozess bei einer Bedingung
        ansetzt, die jeder überprüfen kann, und nicht bei einem Urteil über eine Person.
      whatToDefine: >-
        Liste die konkreten, überprüfbaren Auslöser auf, die eine Rechenschaftsprüfung einleiten.
        Jeder Auslöser sollte anhand von Aufzeichnungen oder einer direkten Verweisung
        nachvollziehbar sein.
      placeholders:
        - Ein Mitglied in X aufeinanderfolgenden Monaten keinen anerkannten Beitrag geleistet hat.
        - Ein Mitglied gegen eine Pflicht aus der Mitgliedschaftsvereinbarung verstoßen hat.
        - Ein Mitglied eine Identitäts-Einschränkung oder Invariante der Schicht 0 verletzt hat.
        - Eine Verweisung aus der Konfliktlösungsleiter (Stufe 3 oder höher) erfolgt ist.
    es:
      title: Desencadenantes
      whyItMatters: >-
        Si las revisiones de rendición de cuentas solo ocurren cuando alguien se siente lo
        suficientemente fuerte como para presionar, se vuelven políticas. Nombrar los
        desencadenantes exactos — inactividad, incumplimiento, violación de invariantes, derivación
        — significa que el proceso se inicia a partir de una condición que cualquiera puede
        verificar, no a partir de un juicio sobre una persona.
      whatToDefine: >-
        Enumera los desencadenantes específicos y verificables que inician una revisión de rendición
        de cuentas. Cada desencadenante debe ser observable a partir de registros o una derivación
        directa.
      placeholders:
        - Un miembro no ha realizado una contribución reconocida en X meses consecutivos.
        - Un miembro ha incumplido una obligación del Acuerdo de Membresía.
        - Un miembro ha violado una restricción de identidad o invariante de la Capa 0.
        - Se recibe una derivación de la Escalera de Resolución de Conflictos (Paso 3 o superior).
    fr:
      title: Déclencheurs
      whyItMatters: >-
        Si les contrôles de responsabilisation ne se produisent que lorsque quelqu'un se sent
        suffisamment motivé pour insister, ils deviennent politiques. Nommer les déclencheurs exacts
        — inactivité, manquement, violation d'un invariant, renvoi — signifie que le processus
        démarre à partir d'une condition que n'importe qui peut vérifier, et non à partir d'un
        jugement sur une personne.
      whatToDefine: >-
        Liste les déclencheurs spécifiques et vérifiables qui initient un contrôle de
        responsabilisation. Chaque déclencheur doit être observable à partir de registres ou d'un
        renvoi direct.
      placeholders:
        - Un membre n'a pas effectué de contribution reconnue pendant X mois consécutifs.
        - Un membre a manqué à une obligation de l'Accord d'adhésion.
        - Un membre a violé une contrainte d'identité ou un invariant de la Couche 0.
        - >-
          Un renvoi est effectué depuis l'Échelle de résolution des conflits (étape 3 ou
          supérieure).
    pt-br:
      title: Gatilhos
      whyItMatters: >-
        Se verificações de responsabilização só acontecem quando alguém se sente forte o suficiente
        para insistir, elas se tornam políticas. Nomear os gatilhos exatos — inatividade,
        descumprimento, violação de invariante, encaminhamento — significa que o processo começa a
        partir de uma condição que qualquer pessoa pode verificar, e não de um julgamento sobre uma
        pessoa.
      whatToDefine: >-
        Liste os gatilhos específicos e verificáveis que iniciam uma verificação de
        responsabilização. Cada gatilho deve ser observável a partir de registros ou de um
        encaminhamento direto.
      placeholders:
        - Um membro não fez uma contribuição reconhecida por X meses consecutivos.
        - Um membro descumpriu uma obrigação do Acordo de Membresia.
        - Um membro violou uma restrição ou invariante de identidade da Camada 0.
        - >-
          É feito um encaminhamento a partir da Escada de Resolução de Conflitos (Etapa 3 ou
          superior).
  ownsClauses:
    - 6.5.4
- key: accountability-protocol.investigation-and-review
  artifact: accountability-protocol
  order: 1
  clauseRefs:
    - 6.4.2
    - 6.4.3
    - 6.4.6
    - 6.5.4
  i18n:
    en:
      title: Investigation and Review
      whyItMatters: >-
        Treating a missed contribution the same as an invariant violation either crushes minor cases
        with heavy process or lets serious ones slip through a private chat. Graduated pathways —
        soft check-in, medium written notice, direct escalation for serious breaches — match
        response weight to breach weight and keep repair the default where repair is still possible.
      whatToDefine: >-
        Define soft (inactivity), medium (obligation breach), and serious (invariant violation,
        safety) pathways. State who initiates, the response window, and the escalation route for
        each.
      placeholders:
        - >-
          medium = non-compliance with a Membership Agreement obligation that does not threaten
          member safety or community integrity; serious = Layer 0 invariant violation, credible
          safety concern, persistent bad-faith conduct.
        - who contacts the member; response window; outcome paths.
        - written notice; response window; resolution / escalation paths.
        - direct escalation to the appropriate Conflict Resolution Ladder step.
    de:
      title: Untersuchung und Überprüfung
      whyItMatters: >-
        Einen versäumten Beitrag genauso zu behandeln wie eine Invarianten-Verletzung erdrückt
        entweder leichte Fälle mit schwerem Verfahren oder lässt schwere Fälle mit einem privaten
        Gespräch durchrutschen. Abgestufte Wege — sanftes Nachfragen, mittlere schriftliche
        Benachrichtigung, direkte Eskalation bei schweren Verstößen — passen das Gewicht der
        Reaktion an das Gewicht des Verstoßes an und machen Wiedergutmachung dort zum Standard, wo
        Wiedergutmachung noch möglich ist.
      whatToDefine: >-
        Definiere sanfte (Inaktivität), mittlere (Pflichtverletzung) und schwere
        (Invarianten-Verletzung, Sicherheit) Wege. Gib an, wer den Prozess einleitet, welche
        Reaktionsfrist gilt und wie die Eskalation jeweils verläuft.
      placeholders:
        - >-
          mittel = Nichteinhaltung einer Pflicht aus der Mitgliedschaftsvereinbarung, die weder die
          Sicherheit von Mitgliedern noch die Integrität der Gemeinschaft gefährdet; schwer =
          Verletzung einer Invariante der Schicht 0, glaubwürdige Sicherheitsbedenken, anhaltend
          bösgläubiges Verhalten.
        - Wer kontaktiert das Mitglied; Reaktionsfrist; mögliche Ergebnisse.
        - Schriftliche Benachrichtigung; Reaktionsfrist; Lösungs- / Eskalationswege.
        - Direkte Eskalation an die entsprechende Stufe der Konfliktlösungsleiter.
    es:
      title: Investigación y Revisión
      whyItMatters: >-
        Tratar una contribución omitida igual que una violación de invariante aplasta los casos
        menores con un proceso pesado o deja que los graves se resuelvan con una conversación
        privada. Vías graduadas — verificación suave, notificación escrita intermedia, escalamiento
        directo para incumplimientos graves — ajustan el peso de la respuesta al peso del
        incumplimiento y mantienen la reparación como opción predeterminada donde la reparación aún
        es posible.
      whatToDefine: >-
        Define las vías suave (inactividad), intermedia (incumplimiento de obligación) y grave
        (violación de invariantes, seguridad). Indica quién inicia, el plazo de respuesta y la ruta
        de escalamiento para cada una.
      placeholders:
        - >-
          intermedio = incumplimiento de una obligación del Acuerdo de Membresía que no amenaza la
          seguridad de los miembros ni la integridad de la comunidad; grave = violación de
          invariante de la Capa 0, preocupación creíble de seguridad, conducta persistente de mala
          fe.
        - quién contacta al miembro; plazo de respuesta; posibles resultados.
        - notificación escrita; plazo de respuesta; vías de resolución / escalamiento.
        - escalamiento directo al paso correspondiente de la Escalera de Resolución de Conflictos.
    fr:
      title: Enquête et examen
      whyItMatters: >-
        Traiter une contribution manquée de la même façon qu'une violation d'invariant soit écrase
        les cas mineurs sous un processus lourd, soit laisse les cas graves passer par une simple
        conversation privée. Des parcours gradués — vérification informelle, avis écrit de niveau
        intermédiaire, escalade directe pour les manquements graves — ajustent le poids de la
        réponse au poids du manquement et maintiennent la réparation comme option par défaut là où
        la réparation est encore possible.
      whatToDefine: >-
        Définis les parcours léger (inactivité), intermédiaire (manquement à une obligation) et
        grave (violation d'invariant, sécurité). Indique qui initie le processus, le délai de
        réponse et la voie d'escalade pour chacun.
      placeholders:
        - >-
          intermédiaire = non-respect d'une obligation de l'Accord d'adhésion qui ne menace pas la
          sécurité des membres ni l'intégrité de la communauté ; grave = violation d'un invariant de
          la Couche 0, préoccupation crédible de sécurité, conduite persistante de mauvaise foi.
        - qui contacte le membre ; délai de réponse ; issues possibles.
        - avis écrit ; délai de réponse ; voies de résolution / escalade.
        - escalade directe vers l'étape appropriée de l'Échelle de résolution des conflits.
    pt-br:
      title: Investigação e Revisão
      whyItMatters: >-
        Tratar uma contribuição não realizada da mesma forma que uma violação de invariante ou
        esmaga casos menores com processos pesados ou deixa casos sérios escaparem por uma conversa
        privada. Caminhos graduados — verificação leve, notificação escrita média, escalonamento
        direto para descumprimentos sérios — combinam o peso da resposta com o peso do
        descumprimento e mantêm a reparação como padrão onde a reparação ainda é possível.
      whatToDefine: >-
        Defina caminhos leve (inatividade), médio (descumprimento de obrigação) e sério (violação de
        invariante, segurança). Indique quem inicia, a janela de resposta e a rota de escalonamento
        para cada um.
      placeholders:
        - >-
          médio = descumprimento de uma obrigação do Acordo de Membresia que não ameaça a segurança
          dos membros ou a integridade da comunidade; sério = violação de invariante da Camada 0,
          preocupação crível com segurança, conduta persistente de má-fé.
        - quem contata o membro; janela de resposta; caminhos de desfecho.
        - notificação escrita; janela de resposta; caminhos de resolução / escalonamento.
        - escalonamento direto para a etapa apropriada da Escada de Resolução de Conflitos.
  ownsClauses: []
- key: accountability-protocol.due-process-guarantees
  artifact: accountability-protocol
  order: 2
  clauseRefs:
    - 6.4.2
    - 6.4.4
    - 6.5.4
  i18n:
    en:
      title: Due Process Guarantees
      whyItMatters: >-
        Accountability without due process is just punishment with paperwork. A member facing a
        sanction needs to know the concern, have real time to respond, and have somewhere to appeal
        to — otherwise the deciding body's word is final by default, which concentrates power
        exactly where it should not concentrate.
      whatToDefine: >-
        State the right to written notice, a minimum response window, and an explicit appeal path to
        Full Members.
      placeholders:
        - member is notified in writing of the concern before any review or sanction begins.
        - minimum response window — e.g. 30 days.
        - any decision may be appealed via the governance process (Strategic vote).
    de:
      title: Verfahrensgarantien
      whyItMatters: >-
        Rechenschaft ohne faires Verfahren ist nur Bestrafung mit Papierkram. Ein Mitglied, das mit
        einer Sanktion konfrontiert ist, muss das Anliegen kennen, echte Zeit zum Antworten haben
        und eine Stelle zum Einlegen eines Widerspruchs haben — andernfalls ist das Wort des
        Entscheidungsgremiums standardmäßig endgültig, was Macht genau dort konzentriert, wo sie
        sich nicht konzentrieren sollte.
      whatToDefine: >-
        Lege das Recht auf schriftliche Benachrichtigung, eine Mindest-Reaktionsfrist und einen
        expliziten Widerspruchsweg an die Vollmitglieder fest.
      placeholders:
        - >-
          Das Mitglied wird schriftlich über das Anliegen informiert, bevor eine Überprüfung oder
          Sanktion beginnt.
        - Mindest-Reaktionsfrist — z. B. 30 Tage.
        - >-
          Jede Entscheidung kann über den Governance-Prozess angefochten werden (strategische
          Abstimmung).
    es:
      title: Garantías de Debido Proceso
      whyItMatters: >-
        La rendición de cuentas sin debido proceso es solo castigo con papeleo. Un miembro que
        enfrenta una sanción necesita conocer la preocupación, tener tiempo real para responder y
        tener un lugar al que apelar — de lo contrario, la palabra del órgano decisor es definitiva
        por defecto, lo cual concentra el poder exactamente donde no debería concentrarse.
      whatToDefine: >-
        Establece el derecho a notificación por escrito, un plazo mínimo de respuesta y una vía de
        apelación explícita ante los Miembros Plenos.
      placeholders:
        - >-
          el miembro es notificado por escrito sobre la preocupación antes de que comience cualquier
          revisión o sanción.
        - plazo mínimo de respuesta — p. ej. 30 días.
        - cualquier decisión puede apelarse a través del proceso de gobernanza (voto Estratégico).
    fr:
      title: Garanties de procédure régulière
      whyItMatters: >-
        La responsabilisation sans procédure régulière n'est que de la punition avec de la
        paperasse. Un membre faisant face à une sanction doit connaître le motif de préoccupation,
        disposer d'un délai réel pour répondre, et avoir une instance à laquelle faire appel — sinon
        la décision de l'organe compétent est définitive par défaut, ce qui concentre le pouvoir
        exactement là où il ne devrait pas se concentrer.
      whatToDefine: >-
        Indique le droit à une notification écrite, un délai de réponse minimum et une voie d'appel
        explicite auprès des Membres titulaires.
      placeholders:
        - le membre est notifié par écrit du motif de préoccupation avant tout examen ou sanction.
        - délai de réponse minimum — par ex. 30 jours.
        - >-
          toute décision peut faire l'objet d'un appel via le processus de gouvernance (vote
          stratégique).
    pt-br:
      title: Garantias de Devido Processo
      whyItMatters: >-
        Responsabilização sem devido processo é apenas punição com papelada. Um membro diante de uma
        sanção precisa conhecer a preocupação, ter tempo real para responder e ter um lugar para
        recorrer — caso contrário, a palavra do órgão decisório é final por padrão, o que concentra
        poder exatamente onde ele não deveria se concentrar.
      whatToDefine: >-
        Indique o direito à notificação escrita, uma janela mínima de resposta e um caminho
        explícito de recurso aos Membros Plenos.
      placeholders:
        - >-
          o membro é notificado por escrito sobre a preocupação antes de qualquer revisão ou sanção
          ter início.
        - janela mínima de resposta — por exemplo, 30 dias.
        - >-
          qualquer decisão pode ser objeto de recurso por meio do processo de governança (voto
          Estratégico).
  ownsClauses: []
- key: accountability-protocol.anti-retaliation-protections
  artifact: accountability-protocol
  order: 3
  clauseRefs:
    - 6.3.2
  i18n:
    en:
      title: Anti-Retaliation Protections
      whyItMatters: >-
        If raising a concern or giving information can cost a member standing, relationships, or
        access, people will stay silent and the accountability system collapses in practice. Naming
        retaliation as itself a trigger makes the cost of suppression higher than the cost of
        reporting.
      whatToDefine: >-
        State that retaliation against any member who raises, participates in, or gives information
        to an accountability process is itself an accountability trigger.
      placeholders:
        - >-
          Retaliation against a member for participating in any part of this process is itself an
          accountability trigger.
    de:
      title: Schutz vor Vergeltung
      whyItMatters: >-
        Wenn das Äußern eines Anliegens oder das Bereitstellen von Informationen ein Mitglied
        Ansehen, Beziehungen oder Zugang kosten kann, werden die Menschen schweigen und das
        Rechenschaftssystem bricht in der Praxis zusammen. Vergeltung selbst als Auslöser zu
        benennen, macht die Kosten der Unterdrückung höher als die Kosten der Meldung.
      whatToDefine: >-
        Halte fest, dass Vergeltung gegen jedes Mitglied, das ein Anliegen erhebt, an einem
        Rechenschaftsprozess teilnimmt oder Informationen dazu beisteuert, selbst ein Auslöser für
        eine Rechenschaftsprüfung ist.
      placeholders:
        - >-
          Vergeltung gegen ein Mitglied für die Teilnahme an irgendeinem Teil dieses Prozesses ist
          selbst ein Auslöser für eine Rechenschaftsprüfung.
    es:
      title: Protecciones contra Represalias
      whyItMatters: >-
        Si plantear una preocupación o dar información puede costarle a un miembro su posición,
        relaciones o acceso, la gente guardará silencio y el sistema de rendición de cuentas
        colapsará en la práctica. Nombrar las represalias como un desencadenante en sí mismo hace
        que el costo de la supresión sea mayor que el costo de denunciar.
      whatToDefine: >-
        Establece que las represalias contra cualquier miembro que plantee, participe en o
        proporcione información a un proceso de rendición de cuentas son en sí mismas un
        desencadenante de rendición de cuentas.
      placeholders:
        - >-
          Las represalias contra un miembro por participar en cualquier parte de este proceso son en
          sí mismas un desencadenante de rendición de cuentas.
    fr:
      title: Protections contre les représailles
      whyItMatters: >-
        Si le fait de soulever une préoccupation ou de fournir des informations peut coûter à un
        membre son statut, ses relations ou son accès, les gens garderont le silence et le système
        de responsabilisation s'effondrera dans la pratique. Qualifier les représailles elles-mêmes
        comme déclencheur rend le coût de la suppression plus élevé que le coût du signalement.
      whatToDefine: >-
        Indique que les représailles contre tout membre qui soulève, participe à, ou fournit des
        informations dans le cadre d'un processus de responsabilisation constituent elles-mêmes un
        déclencheur de responsabilisation.
      placeholders:
        - >-
          Les représailles contre un membre pour sa participation à toute partie de ce processus
          constituent elles-mêmes un déclencheur de responsabilisation.
    pt-br:
      title: Proteções Antirretaliação
      whyItMatters: >-
        Se levantar uma preocupação ou prestar informação pode custar a um membro posição,
        relacionamentos ou acesso, as pessoas vão se calar e o sistema de responsabilização
        desmorona na prática. Nomear a retaliação como, ela própria, um gatilho torna o custo da
        supressão maior do que o custo do relato.
      whatToDefine: >-
        Indique que a retaliação contra qualquer membro que levante, participe ou preste informação
        a um processo de responsabilização é, ela própria, um gatilho de responsabilização.
      placeholders:
        - >-
          A retaliação contra um membro por participar de qualquer parte deste processo é, ela
          própria, um gatilho de responsabilização.
  ownsClauses:
    - 6.3.2
- key: accountability-protocol.sanction-and-repair-options
  artifact: accountability-protocol
  order: 4
  clauseRefs:
    - 6.4.1
    - 6.4.2
    - 6.4.3
    - 6.4.5
    - 6.4.6
    - 6.5.4
    - 6.6.3
  i18n:
    en:
      title: Sanction and Repair Options
      whyItMatters: >-
        Ad-hoc sanctions invented mid-process reflect whoever is loudest in the room, not what the
        breach warrants. A fixed menu — with preconditions, authorized body, and appeal path for
        each — keeps responses proportional, prevents informal exclusion from becoming the default
        punishment, and makes it obvious when a sanction is out of scope for the body applying it.
      whatToDefine: >-
        For each sanction type, define preconditions, authorized body, and appeal path.
        Repair-oriented responses should be the default; punitive ones reserved for safety-critical
        or unresolved breaches.
      placeholders:
        - Private check-in / reminder
        - inactivity or minor breach
        - role
        - 'yes'
        - Written warning
        - unresolved obligation breach after check-in
        - role
        - 'yes'
        - Temporary access restriction
        - safety-critical situation; review window
        - role
        - 'yes'
        - Forced exit
        - serious or unresolved breach, or Full Member decision
        - Full Members
        - yes — re-vote
    de:
      title: Sanktions- und Wiedergutmachungsoptionen
      whyItMatters: >-
        Ad-hoc-Sanktionen, die mitten im Prozess erfunden werden, spiegeln wider, wer am lautesten
        im Raum ist, nicht was der Verstoß rechtfertigt. Ein fester Katalog — mit Voraussetzungen,
        befugtem Gremium und Widerspruchsweg für jede Sanktion — hält die Reaktionen
        verhältnismäßig, verhindert, dass informeller Ausschluss zur Standardstrafe wird, und macht
        deutlich, wenn eine Sanktion außerhalb des Zuständigkeitsbereichs des anwendenden Gremiums
        liegt.
      whatToDefine: >-
        Definiere für jeden Sanktionstyp die Voraussetzungen, das befugte Gremium und den
        Widerspruchsweg. Auf Wiedergutmachung ausgerichtete Maßnahmen sollten der Standard sein;
        strafende Maßnahmen sind sicherheitskritischen oder ungelösten Verstößen vorbehalten.
      placeholders:
        - Persönliches Nachfragen / Erinnerung
        - Inaktivität oder geringfügiger Verstoß
        - Rolle
        - ja
        - Schriftliche Verwarnung
        - Ungelöste Pflichtverletzung nach Nachfragen
        - Rolle
        - ja
        - Vorübergehende Zugangsbeschränkung
        - Sicherheitskritische Situation; Überprüfungsfenster
        - Rolle
        - ja
        - Erzwungener Austritt
        - Schwerer oder ungelöster Verstoß, oder Entscheidung der Vollmitglieder
        - Vollmitglieder
        - ja — erneute Abstimmung
    es:
      title: Opciones de Sanción y Reparación
      whyItMatters: >-
        Las sanciones ad hoc inventadas en medio del proceso reflejan a quien más fuerte habla en la
        sala, no lo que el incumplimiento amerita. Un menú fijo — con precondiciones, órgano
        autorizado y vía de apelación para cada una — mantiene las respuestas proporcionales, evita
        que la exclusión informal se convierta en el castigo predeterminado y hace evidente cuándo
        una sanción está fuera del alcance del órgano que la aplica.
      whatToDefine: >-
        Para cada tipo de sanción, define las precondiciones, el órgano autorizado y la vía de
        apelación. Las respuestas orientadas a la reparación deben ser la opción predeterminada; las
        punitivas se reservan para incumplimientos críticos para la seguridad o no resueltos.
      placeholders:
        - Verificación privada / recordatorio
        - inactividad o incumplimiento menor
        - rol
        - sí
        - Advertencia escrita
        - incumplimiento de obligación no resuelto tras verificación
        - rol
        - sí
        - Restricción temporal de acceso
        - situación crítica para la seguridad; plazo de revisión
        - rol
        - sí
        - Salida forzada
        - incumplimiento grave o no resuelto, o decisión de los Miembros Plenos
        - Miembros Plenos
        - sí — nueva votación
    fr:
      title: Options de sanction et de réparation
      whyItMatters: >-
        Des sanctions improvisées en cours de processus reflètent la voix la plus forte dans la
        salle, pas ce que le manquement justifie. Un catalogue fixe — avec des conditions
        préalables, l'organe habilité et la voie d'appel pour chaque sanction — maintient la
        proportionnalité des réponses, empêche l'exclusion informelle de devenir la punition par
        défaut, et rend évident quand une sanction dépasse le périmètre de l'organe qui l'applique.
      whatToDefine: >-
        Pour chaque type de sanction, définis les conditions préalables, l'organe habilité et la
        voie d'appel. Les réponses orientées vers la réparation doivent être la règle par défaut ;
        les réponses punitives sont réservées aux manquements critiques pour la sécurité ou non
        résolus.
      placeholders:
        - Vérification privée / rappel
        - inactivité ou manquement mineur
        - rôle
        - oui
        - Avertissement écrit
        - manquement à une obligation non résolu après vérification
        - rôle
        - oui
        - Restriction d'accès temporaire
        - situation critique pour la sécurité ; fenêtre d'examen
        - rôle
        - oui
        - Exclusion forcée
        - manquement grave ou non résolu, ou décision des Membres titulaires
        - Membres titulaires
        - oui — nouveau vote
    pt-br:
      title: Opções de Sanção e Reparação
      whyItMatters: >-
        Sanções inventadas no meio do processo refletem quem fala mais alto na sala, não o que o
        descumprimento merece. Um menu fixo — com pré-condições, órgão autorizado e caminho de
        recurso para cada uma — mantém as respostas proporcionais, evita que a exclusão informal
        vire a punição padrão e torna óbvio quando uma sanção está fora do escopo do órgão que a
        aplica.
      whatToDefine: >-
        Para cada tipo de sanção, defina as pré-condições, o órgão autorizado e o caminho de
        recurso. Respostas orientadas à reparação devem ser o padrão; as punitivas reservadas para
        descumprimentos críticos à segurança ou não resolvidos.
      placeholders:
        - Verificação privada / lembrete
        - inatividade ou descumprimento menor
        - papel
        - sim
        - Advertência escrita
        - descumprimento de obrigação não resolvido após verificação
        - papel
        - sim
        - Restrição temporária de acesso
        - situação crítica à segurança; janela de revisão
        - papel
        - sim
        - Saída forçada
        - descumprimento sério ou não resolvido, ou decisão dos Membros Plenos
        - Membros Plenos
        - sim — nova votação

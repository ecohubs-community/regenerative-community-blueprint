        - p. ej. Sitio web / dominios de la comunidad
        - ...
        - ...
        - ...
        - ...
        - p. ej. Marca y cuentas en redes sociales
        - ...
        - ...
        - ...
        - ...
        - p. ej. Terreno o infraestructura física
        - ...
        - ...
        - ...
        - ...
    fr:
      title: Classification communs vs. privés
      whyItMatters: >-
        Les ressources non classifiées sont le terrain de la privatisation silencieuse — quelqu'un
        commence à traiter un bien partagé comme personnel, ou un bien privé se retrouve absorbé
        discrètement dans les obligations communautaires, et quand quelqu'un s'en aperçoit, la norme
        a déjà changé. Une classification explicite, avec des intendants et des règles de transfert
        nommés dès le départ, fait de tout changement de statut un acte de gouvernance visible
        plutôt qu'un glissement insidieux.
      whatToDefine: >-
        Pour chaque ressource détenue par la communauté, déclare la classification (Communs /
        Privé), nomme un intendant, définis les règles d'accès et indique les contraintes de
        transfert. Les ressources non classifiées NE DOIVENT PAS être allouées, grevées, monétisées
        ou transférées tant qu'elles ne sont pas classifiées.
      placeholders:

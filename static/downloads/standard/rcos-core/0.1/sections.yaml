- key: internal-economy-protocol.accumulation-constraints
  artifact: internal-economy-protocol
  order: 4
  clauseRefs:
    - 5.4.1
    - 5.4.2
    - 5.4.3
    - 5.4.4
    - 5.6.4
  i18n:
    en:
      title: Accumulation Constraints
      whyItMatters: >-
        Any internal unit that can pile up without limit eventually becomes leverage — a few members
        with large balances gain informal sway the governance system never granted them. Stating
        accumulation rules explicitly, even when the current rule is "none yet," keeps the question
        open and forces a visible decision before concentration becomes a structural problem.
      whatToDefine: >-
        State the current accumulation rule (cap, decay, none) and the rule that no internal unit
        may be converted into governance authority.
      placeholders:
        - Hard cap on internal units, if any.
        - Decay rule, if any.
        - >-
          Internal units cannot be converted into governance authority or used to bypass the
          Decision Matrix.
    de:
      title: Akkumulationsbeschränkungen
      whyItMatters: >-
        Jede interne Einheit, die sich ohne Limit anhäufen lässt, wird irgendwann zum Hebel — einige
        wenige Mitglieder mit großen Guthaben gewinnen informellen Einfluss, den das
        Governance-System ihnen nie verliehen hat. Das explizite Festlegen von Akkumulationsregeln —
        auch wenn die aktuelle Regel „noch keine" lautet — hält die Frage offen und erzwingt eine
        sichtbare Entscheidung, bevor Konzentration zum strukturellen Problem wird.
      whatToDefine: >-
        Lege die aktuelle Akkumulationsregel fest (Obergrenze, Verfall, keine) und die Regel, dass
        keine interne Einheit in Governance-Autorität umgewandelt werden darf.
      placeholders:
        - Obergrenze für interne Einheiten, falls vorhanden.
        - Verfallsregel, falls vorhanden.
        - >-
          Interne Einheiten dürfen nicht in Governance-Autorität umgewandelt oder dazu verwendet
          werden, die Entscheidungsmatrix zu umgehen.
    es:
      title: Restricciones de Acumulación
      whyItMatters: >-
        Cualquier unidad interna que pueda acumularse sin límite eventualmente se convierte en
        apalancamiento — unos pocos miembros con saldos grandes obtienen influencia informal que el
        sistema de gobernanza nunca les otorgó. Establecer las reglas de acumulación explícitamente,
        incluso cuando la regla actual es "ninguna todavía", mantiene la cuestión abierta y obliga a
        tomar una decisión visible antes de que la concentración se convierta en un problema
        estructural.
      whatToDefine: >-
        Indica la regla de acumulación actual (tope, decaimiento, ninguna) y la regla de que ninguna
        unidad interna PUEDE convertirse en autoridad de gobernanza.
      placeholders:
        - Tope máximo de unidades internas, si lo hay.
        - Regla de decaimiento, si la hay.
        - >-
          Las unidades internas no PUEDEN convertirse en autoridad de gobernanza ni usarse para
          eludir la Matriz de Decisiones.
    fr:
      title: Contraintes d'accumulation
      whyItMatters: >-
        Toute unité interne pouvant s'accumuler sans limite finit par devenir un levier — quelques
        membres avec des soldes élevés acquièrent une influence informelle que le système de
        gouvernance ne leur a jamais accordée. Énoncer les règles d'accumulation explicitement, même
        quand la règle actuelle est « aucune pour l'instant », maintient la question ouverte et
        impose une décision visible avant que la concentration ne devienne un problème structurel.
      whatToDefine: >-
        Indique la règle d'accumulation actuelle (plafond, dépréciation, aucune) et la règle selon
        laquelle aucune unité interne NE PEUT être convertie en autorité de gouvernance.
      placeholders:
        - Plafond sur les unités internes, le cas échéant.
        - Règle de dépréciation, le cas échéant.
        - >-
          Les unités internes ne peuvent pas être converties en autorité de gouvernance ni utilisées
          pour contourner la matrice de décision.
    pt-br:
      title: Restrições de Acumulação
      whyItMatters: >-
        Qualquer unidade interna que possa se acumular sem limite eventualmente se torna alavancagem
        — alguns membros com saldos grandes ganham influência informal que o sistema de governança
        nunca lhes concedeu. Declarar as regras de acumulação explicitamente, mesmo quando a regra
        atual é "nenhuma ainda", mantém a questão em aberto e força uma decisão visível antes que a
        concentração se torne um problema estrutural.
      whatToDefine: >-
        Indique a regra atual de acumulação (limite, decaimento, nenhuma) e a regra de que nenhuma
        unidade interna pode ser convertida em autoridade de governança.
      placeholders:
        - Limite máximo de unidades internas, se houver.
        - Regra de decaimento, se houver.
        - >-
          As unidades internas não podem ser convertidas em autoridade de governança nem usadas para
          contornar a Matriz de Decisão.
  ownsClauses:
    - 5.4.1
    - 5.4.2
    - 5.4.3
    - 5.4.4
    - 5.6.4
- key: internal-economy-protocol.external-income-interfaces
  artifact: internal-economy-protocol
  order: 5
  clauseRefs:
    - 5.3.2
  i18n:
    en:
      title: External Income Interfaces
      whyItMatters: >-
        Once funds are in hand, the conversation shifts from "should we accept this?" to "what do we
        do with it?" — and the conditions attached to the income (grant terms, partnership
        obligations, service commitments) are often already locked in. Requiring a Strategic
        decision before any new income channel opens keeps the community in control of what it takes
        on.
      whatToDefine: >-
        List current declared income channels, name potential future channels, and require Strategic
        approval before any new channel is opened.
      placeholders:
        - Current income channels.
        - Potential future income channels.
        - >-
          Rule: any new external income interface must be declared and approved via a Strategic
          decision before funds are received or commitments made.
    de:
      title: Externe Einkommensschnittstellen
      whyItMatters: >-
        Sobald Mittel eingegangen sind, verschiebt sich das Gespräch von „Sollen wir das annehmen?"
        zu „Was machen wir damit?" — und die an das Einkommen geknüpften Bedingungen
        (Förderbedingungen, Partnerschaftsverpflichtungen, Dienstleistungszusagen) sind oft bereits
        festgelegt. Eine strategische Entscheidung vor der Eröffnung eines neuen Einkommenskanals zu
        verlangen, stellt sicher, dass die Gemeinschaft die Kontrolle darüber behält, was sie auf
        sich nimmt.
      whatToDefine: >-
        Liste die aktuell erklärten Einkommenskanäle auf, benenne potenzielle zukünftige Kanäle, und
        verlange eine strategische Genehmigung, bevor ein neuer Kanal eröffnet wird.
      placeholders:
        - Aktuelle Einkommenskanäle.
        - Potenzielle zukünftige Einkommenskanäle.
        - >-
          Regel: Jede neue externe Einkommensschnittstelle muss erklärt und durch eine strategische
          Entscheidung genehmigt werden, bevor Mittel empfangen oder Verpflichtungen eingegangen
          werden.
    es:
      title: Interfaces de Ingresos Externos
      whyItMatters: >-
        Una vez que los fondos están en mano, la conversación pasa de "¿deberíamos aceptar esto?" a
        "¿qué hacemos con esto?" — y las condiciones vinculadas a los ingresos (términos de
        subvención, obligaciones de asociación, compromisos de servicio) a menudo ya están fijadas.
        Requerir una decisión Estratégica antes de abrir cualquier nuevo canal de ingresos mantiene
        a la comunidad en control de lo que asume.
      whatToDefine: >-
        Enumera los canales de ingresos actuales declarados, nombra posibles canales futuros y
        requiere aprobación Estratégica antes de abrir cualquier nuevo canal.
      placeholders:
        - Canales de ingresos actuales.
        - Posibles canales de ingresos futuros.
        - >-
          Regla: cualquier nueva interfaz de ingresos externos DEBE ser declarada y aprobada
          mediante una decisión Estratégica antes de que se reciban fondos o se asuman compromisos.
    fr:
      title: Interfaces de revenus externes
      whyItMatters: >-
        Une fois les fonds en main, la conversation passe de « devrions-nous accepter cela ? » à «
        qu'en fait-on ? » — et les conditions attachées au revenu (termes de subvention, obligations
        de partenariat, engagements de service) sont souvent déjà verrouillées. Exiger une décision
        Stratégique avant l'ouverture de tout nouveau canal de revenus permet à la communauté de
        garder le contrôle sur ce qu'elle prend en charge.
      whatToDefine: >-
        Liste les canaux de revenus actuellement déclarés, nomme les canaux futurs potentiels et
        exige une approbation Stratégique avant l'ouverture de tout nouveau canal.
      placeholders:
        - Canaux de revenus actuels.
        - Canaux de revenus futurs potentiels.
        - >-
          Règle : toute nouvelle interface de revenus externes DOIT être déclarée et approuvée par
          une décision Stratégique avant que des fonds ne soient reçus ou des engagements pris.
    pt-br:
      title: Interfaces de Receita Externa
      whyItMatters: >-
        Uma vez que os fundos estão em mãos, a conversa muda de "deveríamos aceitar isso?" para "o
        que fazemos com isso?" — e as condições associadas à receita (termos de subvenção,
        obrigações de parceria, compromissos de serviço) já estão frequentemente fixadas. Exigir uma
        decisão Estratégica antes da abertura de qualquer novo canal de receita mantém a comunidade
        no controle do que assume.
      whatToDefine: >-
        Liste os canais de receita atualmente declarados, nomeie potenciais canais futuros e exija
        aprovação Estratégica antes que qualquer novo canal seja aberto.
      placeholders:
        - Canais de receita atuais.
        - Potenciais canais de receita futuros.
        - >-
          Regra: qualquer nova interface de receita externa deve ser declarada e aprovada via uma
          decisão Estratégica antes que os fundos sejam recebidos ou compromissos sejam assumidos.
  ownsClauses: []
- key: internal-economy-protocol.dispute-resolution-for-economic-records
  artifact: internal-economy-protocol
  order: 6
  clauseRefs:
    - 5.5.3
  i18n:
    en:
      title: Dispute Resolution for Economic Records
      whyItMatters: >-
        Contribution and balance records accumulate fast; if disputes could be raised indefinitely,
        the ledger would never settle and every historical credit would stay contestable. A defined
        window with a named resolver and an appeal path gives members a real chance to correct
        errors without leaving the whole economic history perpetually unstable.
      whatToDefine: >-
        State the dispute window, named resolver, and appeal path. Reference the Contribution
        Recognition Mechanism for the full process.
      placeholders:
        - >-
          Window for contesting a contribution record or balance; named resolver; appeal path to
          Full Members via the governance process.
    de:
      title: Streitbeilegung für wirtschaftliche Aufzeichnungen
      whyItMatters: >-
        Beitrags- und Guthabeneinträge häufen sich schnell an; wenn Streitigkeiten unbegrenzt
        erhoben werden könnten, würde das Hauptbuch nie abgeschlossen und jeder historische Eintrag
        bliebe anfechtbar. Ein definiertes Zeitfenster mit einer benannten Schlichtungsperson und
        einem Beschwerdeweg gibt Mitgliedern eine echte Chance, Fehler zu korrigieren, ohne die
        gesamte wirtschaftliche Historie dauerhaft instabil zu lassen.
      whatToDefine: >-
        Lege das Zeitfenster für Streitigkeiten, die benannte Schlichtungsperson und den
        Beschwerdeweg fest. Verweise auf den Mechanismus zur Beitragsanerkennung für den
        vollständigen Prozess.
      placeholders:
        - >-
          Zeitfenster für die Anfechtung eines Beitragseintrags oder Guthabens; benannte
          Schlichtungsperson; Beschwerdeweg an Vollmitglieder über den Governance-Prozess.
    es:
      title: Resolución de Disputas para Registros Económicos
      whyItMatters: >-
        Los registros de contribuciones y saldos se acumulan rápido; si las disputas pudieran
        plantearse indefinidamente, el libro mayor nunca se estabilizaría y cada crédito histórico
        quedaría eternamente impugnable. Un plazo definido con un resolutor designado y una vía de
        apelación da a los miembros una oportunidad real de corregir errores sin dejar toda la
        historia económica perpetuamente inestable.
      whatToDefine: >-
        Indica el plazo de impugnación, el resolutor designado y la vía de apelación. Consulta el
        Mecanismo de Reconocimiento de Contribuciones para el proceso completo.
      placeholders:
        - >-
          Plazo para impugnar un registro de contribución o saldo; resolutor designado; vía de
          apelación a los Miembros Plenos mediante el proceso de gobernanza.
    fr:
      title: Résolution des litiges concernant les registres économiques
      whyItMatters: >-
        Les registres de contributions et de soldes s'accumulent vite ; si les litiges pouvaient
        être soulevés indéfiniment, le registre ne se stabiliserait jamais et chaque crédit
        historique resterait contestable. Un délai défini avec un résolveur nommé et une voie de
        recours donne aux membres une vraie chance de corriger les erreurs sans laisser l'historique
        économique perpétuellement instable.
      whatToDefine: >-
        Indique le délai de contestation, le résolveur nommé et la voie de recours. Réfère-toi au
        mécanisme de reconnaissance des contributions pour le processus complet.
      placeholders:
        - >-
          Délai pour contester un enregistrement de contribution ou un solde ; résolveur nommé ;
          voie de recours auprès des membres actifs via le processus de gouvernance.
    pt-br:
      title: Resolução de Disputas para Registros Econômicos
      whyItMatters: >-
        Registros de contribuição e saldo se acumulam rapidamente; se as disputas pudessem ser
        levantadas indefinidamente, o livro-razão nunca se estabilizaria e cada crédito histórico
        permaneceria contestável. Uma janela definida com um responsável nomeado e um caminho de
        apelação dá aos membros uma chance real de corrigir erros sem deixar toda a história
        econômica perpetuamente instável.
      whatToDefine: >-
        Indique a janela de disputa, o responsável nomeado e o caminho de apelação. Faça referência
        ao Mecanismo de Reconhecimento de Contribuições para o processo completo.
      placeholders:
        - >-
          Janela para contestar um registro de contribuição ou saldo; responsável nomeado; caminho
          de apelação aos Membros Plenos via processo de governança.

- key: purpose-charter.primary-purpose
  artifact: purpose-charter
  order: 0
  clauseRefs:
    - 2.1.1
    - 2.1.2
    - 2.1.5
  i18n:
    en:
      title: Primary Purpose
      whyItMatters: >-
        Every decision, role, and allocation of resources downstream has to stay consistent with one
        thing — the community's primary purpose. If it drifts, shifts with trends, or gets rewritten
        to justify the latest project, there is nothing left to anchor governance to. A single,
        stable primary purpose is the constitutional north star: strategies change, the purpose does
        not.
      whatToDefine: >-
        State exactly one primary purpose. It must describe the enduring reason your community
        exists — not a project, strategy, or short-term goal. One or two sentences.
      placeholders:
        - Your community's primary purpose, in one or two sentences.
    de:
      title: Primärer Zweck
      whyItMatters: >-
        Jede Entscheidung, jede Rolle und jede Ressourcenzuteilung muss mit einer Sache im Einklang
        bleiben — dem primären Zweck der Gemeinschaft. Wenn er abdriftet, sich Trends anpasst oder
        umgeschrieben wird, um das neueste Projekt zu rechtfertigen, gibt es nichts mehr, woran sich
        die Governance verankern lässt. Ein einzelner, stabiler primärer Zweck ist der
        konstitutionelle Nordstern: Strategien ändern sich, der Zweck nicht.
      whatToDefine: >-
        Formuliert genau einen primären Zweck. Er muss den dauerhaften Grund beschreiben, warum eure
        Gemeinschaft existiert — kein Projekt, keine Strategie und kein kurzfristiges Ziel. Ein bis
        zwei Sätze.
      placeholders:
        - Der primäre Zweck eurer Gemeinschaft, in ein bis zwei Sätzen.
    es:
      title: Propósito Principal
      whyItMatters: >-
        Cada decisión, rol y asignación de recursos en niveles posteriores tiene que mantenerse
        consistente con una sola cosa: el propósito principal de la comunidad. Si se desvía, cambia
        con las tendencias o se reescribe para justificar el último proyecto, no queda nada a lo que
        anclar la gobernanza. Un propósito principal único y estable es la estrella polar
        constitucional: las estrategias cambian, el propósito no.
      whatToDefine: >-
        Indica exactamente un propósito principal. DEBE describir la razón perdurable por la que tu
        comunidad existe — no un proyecto, estrategia u objetivo a corto plazo. Una o dos oraciones.
      placeholders:
        - El propósito principal de tu comunidad, en una o dos oraciones.
    fr:
      title: Raison d'être principale
      whyItMatters: >-
        Chaque décision, rôle et allocation de ressources en aval doit rester cohérent avec une
        seule chose — la raison d'être principale de la communauté. Si elle dérive, suit les
        tendances ou est réécrite pour justifier le dernier projet en date, il ne reste plus rien
        pour ancrer la gouvernance. Une raison d'être principale unique et stable est l'étoile
        polaire constitutionnelle : les stratégies changent, la raison d'être non.
      whatToDefine: >-
        Énonce exactement une raison d'être principale. Elle DOIT décrire la raison pérenne pour
        laquelle ta communauté existe — pas un projet, une stratégie ou un objectif à court terme.
        Une ou deux phrases.
      placeholders:
        - La raison d'être principale de ta communauté, en une ou deux phrases.
    pt-br:
      title: Propósito Primário
      whyItMatters: >-
        Toda decisão, papel e alocação de recursos a jusante precisa permanecer consistente com uma
        única coisa — o propósito primário da comunidade. Se ele deriva, muda com as tendências ou é
        reescrito para justificar o projeto mais recente, não sobra nada para ancorar a governança.
        Um propósito primário único e estável é a estrela polar constitucional: as estratégias
        mudam, o propósito não.
      whatToDefine: >-
        Declare exatamente um propósito primário. Ele deve descrever a razão duradoura pela qual sua
        comunidade existe — não um projeto, estratégia ou meta de curto prazo. Uma ou duas frases.
      placeholders:
        - O propósito primário da sua comunidade, em uma ou duas frases.
  ownsClauses:
    - 2.1.1
    - 2.1.2
    - 2.1.5
- key: purpose-charter.secondary-purposes
  artifact: purpose-charter
  order: 1
  clauseRefs:
    - 2.1.4
  i18n:
    en:
      title: Secondary Purposes
      whyItMatters: >-
        A community rarely does only one thing. Secondary purposes make space for the other concrete
        outcomes the community pursues — but they are subordinate. If a secondary purpose ever
        conflicts with the primary, the primary wins. Declaring them explicitly prevents scope creep
        from masquerading as core work.
      whatToDefine: >-
        List concrete secondary outcomes the community pursues. They must not conflict with or
        override the primary purpose. Remove the section entirely if you have none.
      placeholders:
        - Secondary purpose 1.
        - Secondary purpose 2.
        - Secondary purpose 3.
    de:
      title: Sekundäre Zwecke
      whyItMatters: >-
        Eine Gemeinschaft tut selten nur eine Sache. Sekundäre Zwecke schaffen Raum für die anderen
        konkreten Ergebnisse, die die Gemeinschaft verfolgt — aber sie sind nachrangig. Wenn ein
        sekundärer Zweck jemals mit dem primären in Konflikt gerät, hat der primäre Vorrang. Indem
        ihr sie explizit benennt, verhindert ihr, dass schleichende Ausweitung sich als Kernarbeit
        tarnt.
      whatToDefine: >-
        Listet konkrete sekundäre Ergebnisse auf, die die Gemeinschaft verfolgt. Sie dürfen nicht im
        Widerspruch zum primären Zweck stehen oder diesen überlagern. Entfernt diesen Abschnitt
        vollständig, wenn ihr keine habt.
      placeholders:
        - Sekundärer Zweck 1.
        - Sekundärer Zweck 2.
        - Sekundärer Zweck 3.
    es:
      title: Propósitos Secundarios
      whyItMatters: >-
        Una comunidad rara vez hace solo una cosa. Los propósitos secundarios dan espacio para los
        otros resultados concretos que la comunidad persigue — pero están subordinados. Si un
        propósito secundario alguna vez entra en conflicto con el principal, el principal prevalece.
        Declararlos explícitamente evita que la expansión del alcance se disfrace de trabajo
        esencial.
      whatToDefine: >-
        Enumera los resultados secundarios concretos que la comunidad persigue. NO DEBEN entrar en
        conflicto con ni anular el propósito principal. Elimina esta sección por completo si no
        tienes ninguno.
      placeholders:
        - Propósito secundario 1.
        - Propósito secundario 2.
        - Propósito secundario 3.
    fr:
      title: Raisons d'être secondaires
      whyItMatters: >-
        Une communauté fait rarement une seule chose. Les raisons d'être secondaires laissent de la
        place aux autres résultats concrets que la communauté poursuit — mais elles sont
        subordonnées. Si une raison d'être secondaire entre un jour en conflit avec la principale,
        la principale l'emporte. Les déclarer explicitement empêche la dérive de périmètre de se
        faire passer pour du travail fondamental.
      whatToDefine: >-
        Liste les résultats secondaires concrets que la communauté poursuit. Ils NE DOIVENT PAS
        entrer en conflit avec ou supplanter la raison d'être principale. Supprime entièrement cette
        section si tu n'en as aucun.
      placeholders:
        - Raison d'être secondaire 1.
        - Raison d'être secondaire 2.
        - Raison d'être secondaire 3.
    pt-br:
      title: Propósitos Secundários
      whyItMatters: >-
        Uma comunidade raramente faz apenas uma coisa. Os propósitos secundários abrem espaço para
        os outros resultados concretos que a comunidade persegue — mas são subordinados. Se um
        propósito secundário entrar em conflito com o primário, o primário vence. Declará-los
        explicitamente impede que a expansão de escopo se disfarce de trabalho central.
      whatToDefine: >-
        Liste resultados secundários concretos que a comunidade persegue. Eles não devem conflitar
        com nem sobrepor-se ao propósito primário. Remova a seção inteira se você não tiver nenhum.
      placeholders:
        - Propósito secundário 1.
        - Propósito secundário 2.
        - Propósito secundário 3.
  ownsClauses:
    - 2.1.4
- key: purpose-charter.non-goals-and-exclusions
  artifact: purpose-charter
  order: 2
  clauseRefs:
    - 2.1.5
  i18n:
    en:
      title: Non-Goals and Exclusions
      whyItMatters: >-
        Communities drift by accretion — one uncontested assumption at a time. Naming what the
        community is explicitly *not* makes boundary violations visible early, and gives anyone a
        clear basis to object before an activity becomes normalized. Silence here gets read as
        consent.
      whatToDefine: >-
        Name the things your community is explicitly NOT, especially identities or roles others
        might assume by default (political party, investment vehicle, religious group, etc.).
      placeholders:
        - Non-goal 1.
        - Non-goal 2.
        - Non-goal 3.
    de:
      title: Nicht-Ziele und Ausschlüsse
      whyItMatters: >-
        Gemeinschaften driften durch Anhäufung ab — eine unwidersprochen gebliebene Annahme nach der
        anderen. Zu benennen, was die Gemeinschaft ausdrücklich *nicht* ist, macht
        Grenzüberschreitungen frühzeitig sichtbar und gibt allen eine klare Grundlage, Einspruch zu
        erheben, bevor eine Aktivität zur Normalität wird. Schweigen wird hier als Zustimmung
        gelesen.
      whatToDefine: >-
        Benennt die Dinge, die eure Gemeinschaft ausdrücklich NICHT ist, insbesondere Identitäten
        oder Rollen, die andere möglicherweise standardmäßig annehmen könnten (politische Partei,
        Investmentvehikel, religiöse Gruppe usw.).
      placeholders:
        - Nicht-Ziel 1.
        - Nicht-Ziel 2.
        - Nicht-Ziel 3.
    es:
      title: No-Objetivos y Exclusiones
      whyItMatters: >-
        Las comunidades derivan por acumulación — una suposición no cuestionada a la vez. Nombrar lo
        que la comunidad explícitamente *no es* hace visibles las violaciones de límites desde el
        principio, y da a cualquiera una base clara para objetar antes de que una actividad se
        normalice. El silencio aquí se interpreta como consentimiento.
      whatToDefine: >-
        Nombra las cosas que tu comunidad explícitamente NO es, especialmente identidades o roles
        que otros podrían asumir por defecto (partido político, vehículo de inversión, grupo
        religioso, etc.).
      placeholders:
        - No-objetivo 1.
        - No-objetivo 2.
        - No-objetivo 3.
    fr:
      title: Non-objectifs et exclusions
      whyItMatters: >-
        Les communautés dérivent par accumulation — une hypothèse non contestée à la fois. Nommer ce
        que la communauté n'est explicitement *pas* rend les violations de périmètre visibles tôt,
        et donne à quiconque une base claire pour s'opposer avant qu'une activité ne devienne
        normalisée. Le silence ici est interprété comme un consentement.
      whatToDefine: >-
        Nomme les choses que ta communauté n'est explicitement PAS, en particulier les identités ou
        rôles que d'autres pourraient supposer par défaut (parti politique, véhicule
        d'investissement, groupe religieux, etc.).
      placeholders:
        - Non-objectif 1.
        - Non-objectif 2.
        - Non-objectif 3.
    pt-br:
      title: Não-Objetivos e Exclusões
      whyItMatters: >-
        Comunidades derivam por acréscimo — uma suposição não contestada de cada vez. Nomear o que a
        comunidade explicitamente *não é* torna as violações de fronteira visíveis cedo e dá a
        qualquer pessoa uma base clara para objetar antes que uma atividade se normalize. O silêncio
        aqui é lido como consentimento.
      whatToDefine: >-
        Nomeie as coisas que sua comunidade explicitamente NÃO é, especialmente identidades ou
        papéis que outros possam presumir por padrão (partido político, veículo de investimento,
        grupo religioso, etc.).
      placeholders:
        - Não-objetivo 1.
        - Não-objetivo 2.
        - Não-objetivo 3.
  ownsClauses: []
- key: purpose-charter.conditions-for-purpose-change
  artifact: purpose-charter
  order: 3
  clauseRefs:
    - 2.1.3
  i18n:
    en:
      title: Conditions for Purpose Change
      whyItMatters: >-
        Purpose is the one thing everything else depends on. If it were easy to change, nothing
        above it in the stack — membership, governance, invariants — could be trusted to mean the
        same thing from one year to the next. Constitutional-level thresholds and a ratification
        delay force a deliberate, visible act, not a quiet drift.
      whatToDefine: >-
        Describe the change procedure. At minimum: the decision type required for the primary
        purpose (Constitutional, per Layer 2), the threshold, the ratification delay, and where the
        change is recorded (Layer 6 version history). Secondary purposes typically need a lower bar.
      placeholders:
        - threshold, e.g. supermajority of Full Members ≥⅔ of votes cast
        - duration, e.g. 30 days
    de:
      title: Bedingungen für eine Zweckänderung
      whyItMatters: >-
        Der Zweck ist das eine Element, von dem alles andere abhängt. Wäre er leicht zu ändern,
        könnte nichts, was darauf aufbaut — Mitgliedschaft, Governance, Invarianten — darauf
        vertrauen, von einem Jahr zum nächsten dasselbe zu bedeuten. Konstitutionelle Schwellenwerte
        und eine Ratifizierungsfrist erzwingen einen bewussten, sichtbaren Akt statt eines stillen
        Abdriftens.
      whatToDefine: >-
        Beschreibt das Änderungsverfahren. Mindestens: den erforderlichen Entscheidungstyp für den
        primären Zweck (Konstitutionell, gemäß Schicht 2), den Schwellenwert, die
        Ratifizierungsfrist und wo die Änderung festgehalten wird (Versionshistorie in Schicht 6).
        Sekundäre Zwecke erfordern typischerweise eine niedrigere Hürde.
      placeholders:
        - Schwellenwert, z. B. qualifizierte Mehrheit der Vollmitglieder ≥⅔ der abgegebenen Stimmen
        - Dauer, z. B. 30 Tagen
    es:
      title: Condiciones para Cambiar el Propósito
      whyItMatters: >-
        El propósito es lo único de lo que depende todo lo demás. Si fuera fácil de cambiar, nada
        por encima en la pila — membresía, gobernanza, invariantes — podría confiarse en que
        significa lo mismo de un año al siguiente. Los umbrales de nivel constitucional y un periodo
        de ratificación obligan a un acto deliberado y visible, no a una deriva silenciosa.
      whatToDefine: >-
        Describe el procedimiento de cambio. Como mínimo: el tipo de decisión requerido para el
        propósito principal (Constitucional, según la Capa 2), el umbral, el periodo de ratificación
        y dónde se registra el cambio (historial de versiones de la Capa 6). Los propósitos
        secundarios típicamente necesitan un umbral menor.
      placeholders:
        - umbral, p. ej. supermayoría de Miembros Plenos ≥⅔ de los votos emitidos
        - duración, p. ej. 30 días
    fr:
      title: Conditions de modification de la raison d'être
      whyItMatters: >-
        La raison d'être est la seule chose dont tout le reste dépend. Si elle était facile à
        modifier, rien au-dessus dans la pile — adhésion, gouvernance, invariants — ne pourrait être
        considéré comme ayant le même sens d'une année à l'autre. Des seuils de niveau
        constitutionnel et un délai de ratification imposent un acte délibéré et visible, pas une
        dérive silencieuse.
      whatToDefine: >-
        Décris la procédure de modification. Au minimum : le type de décision requis pour la raison
        d'être principale (Constitutionnelle, selon la Couche 2), le seuil, le délai de
        ratification, et où la modification est enregistrée (historique des versions, Couche 6). Les
        raisons d'être secondaires nécessitent typiquement un seuil plus bas.
      placeholders:
        - seuil, par ex. supermajorité des Membres titulaires ≥⅔ des votes exprimés
        - durée, par ex. 30 jours
    pt-br:
      title: Condições para Mudança de Propósito
      whyItMatters: >-
        O propósito é a única coisa da qual todo o resto depende. Se fosse fácil de mudar, nada
        acima dele na pilha — associação, governança, invariantes — poderia ser confiado a
        significar a mesma coisa de um ano para o outro. Limiares de nível constitucional e um prazo
        de ratificação forçam um ato deliberado e visível, não uma deriva silenciosa.
      whatToDefine: >-
        Descreva o procedimento de mudança. No mínimo: o tipo de decisão exigido para o propósito
        primário (Constitucional, conforme a Camada 2), o limiar, o prazo de ratificação e onde a
        mudança é registrada (histórico de versões da Camada 6). Propósitos secundários normalmente
        precisam de um patamar mais baixo.
      placeholders:
        - 'limiar, ex.: supermaioria de Membros Plenos ≥⅔ dos votos emitidos'
        - 'duração, ex.: 30 dias'
  ownsClauses:
    - 2.1.3

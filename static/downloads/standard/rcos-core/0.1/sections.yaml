- key: accountability-protocol.conditions-for-restoring-rights
  artifact: accountability-protocol
  order: 5
  clauseRefs:
    - 6.4.4
  i18n:
    en:
      title: Conditions for Restoring Rights
      whyItMatters: >-
        If there is no defined path back, every sanction becomes effectively permanent and every
        exit becomes a life sentence. Explicit restoration conditions signal that accountability is
        about repair where repair is possible, and they prevent post-hoc gatekeeping about whether
        someone is "really" welcome back.
      whatToDefine: >-
        For each sanction class, state the path to restoration of rights — re-application after
        voluntary exit, re-application block after forced exit, restoration after temporary
        restriction.
      placeholders:
        - re-application via Onboarding Protocol; no automatic restoration.
        - minimum re-application block; standard admission process applies.
        - rights restored upon confirmation of resolution within review window.
    de:
      title: Bedingungen für die Wiederherstellung von Rechten
      whyItMatters: >-
        Wenn es keinen definierten Weg zurück gibt, wird jede Sanktion faktisch dauerhaft und jeder
        Austritt zu einer lebenslangen Strafe. Explizite Bedingungen für die Wiederherstellung
        signalisieren, dass Rechenschaft auf Wiedergutmachung abzielt, wo Wiedergutmachung möglich
        ist, und sie verhindern nachträgliches Gatekeeping darüber, ob jemand „wirklich" willkommen
        zurück ist.
      whatToDefine: >-
        Lege für jede Sanktionsklasse den Weg zur Wiederherstellung der Rechte fest — erneute
        Bewerbung nach freiwilligem Austritt, Sperrfrist für erneute Bewerbung nach erzwungenem
        Austritt, Wiederherstellung nach vorübergehender Einschränkung.
      placeholders:
        - Erneute Bewerbung über das Onboarding-Protokoll; keine automatische Wiederherstellung.
        - Mindest-Sperrfrist für erneute Bewerbung; das reguläre Aufnahmeverfahren gilt.
        - >-
          Rechte werden nach Bestätigung der Lösung innerhalb des Überprüfungsfensters
          wiederhergestellt.
    es:
      title: Condiciones para la Restitución de Derechos
      whyItMatters: >-
        Si no hay un camino definido de regreso, toda sanción se vuelve efectivamente permanente y
        toda salida se convierte en una sentencia de por vida. Las condiciones de restitución
        explícitas señalan que la rendición de cuentas busca la reparación donde la reparación es
        posible, y evitan el control de acceso posterior sobre si alguien es "realmente" bienvenido
        de vuelta.
      whatToDefine: >-
        Para cada clase de sanción, establece el camino hacia la restitución de derechos —
        re-solicitud tras salida voluntaria, bloqueo de re-solicitud tras salida forzada,
        restitución tras restricción temporal.
      placeholders:
        - re-solicitud a través del Protocolo de Incorporación; sin restitución automática.
        - bloqueo mínimo de re-solicitud; se aplica el proceso estándar de admisión.
        - >-
          los derechos se restituyen tras la confirmación de resolución dentro del plazo de
          revisión.
    fr:
      title: Conditions de rétablissement des droits
      whyItMatters: >-
        S'il n'existe pas de chemin de retour défini, chaque sanction devient effectivement
        permanente et chaque sortie devient une condamnation à vie. Des conditions de rétablissement
        explicites signalent que la responsabilisation vise la réparation là où la réparation est
        possible, et elles empêchent un filtrage a posteriori pour décider si quelqu'un est «
        vraiment » le bienvenu de retour.
      whatToDefine: >-
        Pour chaque catégorie de sanction, indique le chemin vers le rétablissement des droits —
        nouvelle candidature après un départ volontaire, période de blocage de candidature après une
        exclusion forcée, rétablissement après une restriction temporaire.
      placeholders:
        - nouvelle candidature via le Protocole d'intégration ; pas de rétablissement automatique.
        - période minimale de blocage de candidature ; le processus d'admission standard s'applique.
        - droits rétablis après confirmation de la résolution dans la fenêtre d'examen.
    pt-br:
      title: Condições para Restauração de Direitos
      whyItMatters: >-
        Se não há um caminho de volta definido, toda sanção se torna efetivamente permanente e toda
        saída se torna uma sentença vitalícia. Condições explícitas de restauração sinalizam que a
        responsabilização é sobre reparação onde a reparação é possível, e impedem o controle de
        acesso ad hoc sobre se alguém é "realmente" bem-vindo de volta.
      whatToDefine: >-
        Para cada classe de sanção, indique o caminho para a restauração de direitos — nova
        candidatura após saída voluntária, bloqueio de nova candidatura após saída forçada,
        restauração após restrição temporária.
      placeholders:
        - nova candidatura via Protocolo de Integração; sem restauração automática.
        - bloqueio mínimo de nova candidatura; aplica-se o processo padrão de admissão.
        - direitos restaurados mediante confirmação de resolução dentro da janela de revisão.
  ownsClauses: []
- key: accountability-protocol.coordination-with-layer-1
  artifact: accountability-protocol
  order: 6
  clauseRefs:
    - 6.4.4
  i18n:
    en:
      title: Coordination with Layer 1
      whyItMatters: >-
        Exit rules live in Layer 1 for a reason — they govern who is and is not a member. If
        accountability actions created their own parallel exit path, there would be two sets of
        rules, two sets of records, and a loophole for skipping due process. One canonical exit
        protocol closes that gap.
      whatToDefine: >-
        State that all forced exits and temporary access restrictions follow the Exit & Separation
        Protocol (Layer 1), and clarify that a temporary restriction does not constitute exit.
      placeholders:
        - >-
          All forced exits and temporary access restrictions follow the Exit & Separation Protocol
          (Layer 1). A temporary access restriction does not constitute exit and does not trigger
          the re-application block unless a forced exit is subsequently voted by Full Members.
    de:
      title: Abstimmung mit Schicht 1
      whyItMatters: >-
        Austrittsregeln sind aus gutem Grund in Schicht 1 angesiedelt — sie regeln, wer Mitglied ist
        und wer nicht. Wenn Rechenschaftsmaßnahmen ihren eigenen parallelen Austrittsweg schaffen
        würden, gäbe es zwei Regelwerke, zwei Sätze von Aufzeichnungen und ein Schlupfloch, um das
        faire Verfahren zu umgehen. Ein einziges kanonisches Austrittsprotokoll schließt diese
        Lücke.
      whatToDefine: >-
        Halte fest, dass alle erzwungenen Austritte und vorübergehenden Zugangsbeschränkungen dem
        Austritts- und Trennungsprotokoll (Schicht 1) folgen, und stelle klar, dass eine
        vorübergehende Einschränkung keinen Austritt darstellt.
      placeholders:
        - >-
          Alle erzwungenen Austritte und vorübergehenden Zugangsbeschränkungen folgen dem Austritts-
          und Trennungsprotokoll (Schicht 1). Eine vorübergehende Zugangsbeschränkung stellt keinen
          Austritt dar und löst keine Sperrfrist für eine erneute Bewerbung aus, es sei denn, ein
          erzwungener Austritt wird anschließend von den Vollmitgliedern beschlossen.
    es:
      title: Coordinación con la Capa 1
      whyItMatters: >-
        Las reglas de salida están en la Capa 1 por una razón — gobiernan quién es y quién no es
        miembro. Si las acciones de rendición de cuentas crearan su propia vía de salida paralela,
        habría dos conjuntos de reglas, dos conjuntos de registros y una laguna para eludir el
        debido proceso. Un único protocolo de salida canónico cierra esa brecha.
      whatToDefine: >-
        Establece que todas las salidas forzadas y restricciones temporales de acceso siguen el
        Protocolo de Salida y Separación (Capa 1), y aclara que una restricción temporal no
        constituye una salida.
      placeholders:
        - >-
          Todas las salidas forzadas y restricciones temporales de acceso siguen el Protocolo de
          Salida y Separación (Capa 1). Una restricción temporal de acceso no constituye una salida
          y no activa el bloqueo de re-solicitud a menos que los Miembros Plenos voten
          posteriormente una salida forzada.
    fr:
      title: Coordination avec la Couche 1
      whyItMatters: >-
        Les règles de sortie se trouvent dans la Couche 1 pour une bonne raison — elles régissent
        qui est et qui n'est pas membre. Si les actions de responsabilisation créaient leur propre
        chemin de sortie parallèle, il y aurait deux ensembles de règles, deux ensembles de
        registres, et une faille pour contourner la procédure régulière. Un seul protocole de sortie
        canonique comble cette lacune.
      whatToDefine: >-
        Indique que toutes les exclusions forcées et restrictions d'accès temporaires suivent le
        Protocole de sortie et de séparation (Couche 1), et précise qu'une restriction temporaire ne
        constitue pas une sortie.
      placeholders:
        - >-
          Toutes les exclusions forcées et restrictions d'accès temporaires suivent le Protocole de
          sortie et de séparation (Couche 1). Une restriction d'accès temporaire ne constitue pas
          une sortie et ne déclenche pas la période de blocage de candidature, sauf si une exclusion
          forcée est ensuite votée par les Membres titulaires.
    pt-br:
      title: Coordenação com a Camada 1
      whyItMatters: >-
        As regras de saída vivem na Camada 1 por um motivo — elas governam quem é e quem não é
        membro. Se ações de responsabilização criassem seu próprio caminho paralelo de saída,
        haveria dois conjuntos de regras, dois conjuntos de registros e uma brecha para pular o
        devido processo. Um único protocolo canônico de saída fecha essa brecha.
      whatToDefine: >-
        Indique que todas as saídas forçadas e restrições temporárias de acesso seguem o Protocolo
        de Saída e Separação (Camada 1), e esclareça que uma restrição temporária não constitui
        saída.
      placeholders:
        - >-
          Todas as saídas forçadas e restrições temporárias de acesso seguem o Protocolo de Saída e
          Separação (Camada 1). Uma restrição temporária de acesso não constitui saída e não aciona
          o bloqueio de nova candidatura, a menos que uma saída forçada seja subsequentemente votada
          pelos Membros Plenos.

- key: authority-registry.registered-authorities
  artifact: authority-registry
  order: 0
  clauseRefs:
    - 4.3.1
    - 4.3.2
    - 4.3.3
    - 4.3.4
    - 4.3.5
  i18n:
    en:
      title: Registered Authorities
      whyItMatters: >-
        Authority that is not explicitly registered gets filled in by default — by whoever has been
        around longest, speaks loudest, or controls the keys. A single registry that names every
        role, bounds its scope, caps its limits, and ties its basis to a delegation act makes
        unauthorized action detectable and prevents authority from being derived from charisma,
        seniority, or ownership.
      whatToDefine: >-
        For each role, body, or circle that holds authority, list the scope of authority, hard
        limits, term/duration, and the basis (membership state, delegation act, etc.). The
        collective body of Full Members is itself an authority and belongs in this table.
      placeholders:
        - e.g. Full Members (collective)
        - scope
        - limits — cannot override invariants; cannot act outside Decision Matrix
        - duration
        - basis — membership state
        - e.g. Membership Admin
        - scope
        - limits
        - duration
        - basis — delegated by Full Members
        - e.g. Finance Steward
        - scope
        - limits — spending cap
        - duration
        - basis
        - ...
        - ...
        - ...
        - ...
        - ...
    de:
      title: Registrierte Autoritäten
      whyItMatters: >-
        Autorität, die nicht explizit registriert ist, wird stillschweigend gefüllt — von wem auch
        immer am längsten dabei ist, am lautesten spricht oder die Schlüssel kontrolliert. Ein
        einziges Register, das jede Rolle benennt, ihren Geltungsbereich eingrenzt, ihre Grenzen
        festlegt und ihre Grundlage an einen Delegationsakt knüpft, macht unautorisiertes Handeln
        erkennbar und verhindert, dass Autorität aus Charisma, Seniorität oder Eigentum abgeleitet
        wird.
      whatToDefine: >-
        Liste für jede Rolle, jedes Gremium oder jeden Kreis, der Autorität besitzt, den
        Geltungsbereich der Autorität, harte Grenzen, Amtszeit/Dauer und die Grundlage
        (Mitgliedschaftsstatus, Delegationsakt usw.) auf. Das Kollektivgremium der Vollmitglieder
        ist selbst eine Autorität und gehört in diese Tabelle.
      placeholders:
        - z. B. Vollmitglieder (kollektiv)
        - Geltungsbereich
        - >-
          Grenzen — darf Invarianten nicht außer Kraft setzen; darf nicht außerhalb der
          Entscheidungsmatrix handeln
        - Dauer
        - Grundlage — Mitgliedschaftsstatus
        - z. B. Mitgliedschaftsverwaltung
        - Geltungsbereich
        - Grenzen
        - Dauer
        - Grundlage — delegiert durch Vollmitglieder
        - z. B. Finanz-Steward
        - Geltungsbereich
        - Grenzen — Ausgabenobergrenze
        - Dauer
        - Grundlage
        - ...
        - ...
        - ...
        - ...
        - ...
    es:
      title: Autoridades Registradas
      whyItMatters: >-
        La autoridad que no se registra explícitamente se llena por defecto — por quien lleva más
        tiempo, habla más fuerte o controla las llaves. Un registro único que nombre cada rol,
        delimite su alcance, establezca sus límites y vincule su base a un acto de delegación hace
        que la acción no autorizada sea detectable e impide que la autoridad se derive del carisma,
        la antigüedad o la propiedad.
      whatToDefine: >-
        Para cada rol, órgano o círculo que posea autoridad, enumera el alcance de autoridad, los
        límites estrictos, la duración del mandato y la base (estado de membresía, acto de
        delegación, etc.). El cuerpo colectivo de Miembros Plenos es en sí mismo una autoridad y
        pertenece a esta tabla.
      placeholders:
        - p. ej. Miembros Plenos (colectivo)
        - alcance
        - límites — no puede anular invariantes; no puede actuar fuera de la Matriz de Decisiones
        - duración
        - base — estado de membresía
        - p. ej. Administración de Membresía
        - alcance
        - límites
        - duración
        - base — delegada por los Miembros Plenos
        - p. ej. Responsable de Finanzas
        - alcance
        - límites — tope de gasto
        - duración
        - base
        - ...
        - ...
        - ...
        - ...
        - ...
    fr:
      title: Autorités enregistrées
      whyItMatters: >-
        Une autorité qui n'est pas explicitement enregistrée est comblée par défaut — par la
        personne présente depuis le plus longtemps, qui parle le plus fort ou qui détient les clés.
        Un registre unique qui nomme chaque rôle, délimite son périmètre, plafonne ses limites et
        rattache sa base à un acte de délégation rend toute action non autorisée détectable et
        empêche que l'autorité ne découle du charisme, de l'ancienneté ou de la propriété.
      whatToDefine: >-
        Pour chaque rôle, organe ou cercle détenant une autorité, indique le périmètre d'autorité,
        les limites strictes, la durée du mandat et la base (statut de membre, acte de délégation,
        etc.). Le corps collectif des membres à part entière est lui-même une autorité et doit
        figurer dans ce tableau.
      placeholders:
        - p. ex. Membres à part entière (collectif)
        - périmètre
        - >-
          limites — ne peut pas outrepasser les invariants ; ne peut pas agir en dehors de la
          matrice de décision
        - durée
        - base — statut de membre
        - p. ex. Admin des adhésions
        - périmètre
        - limites
        - durée
        - base — délégué par les membres à part entière
        - p. ex. Responsable des finances
        - périmètre
        - limites — plafond de dépenses
        - durée
        - base
        - ...
        - ...
        - ...
        - ...
        - ...
    pt-br:
      title: Autoridades Registradas
      whyItMatters: >-
        A autoridade que não é registrada explicitamente acaba sendo preenchida por padrão — por
        quem está há mais tempo, fala mais alto ou controla as chaves. Um único registro que nomeia
        cada papel, delimita seu escopo, define seus limites e vincula sua base a um ato de
        delegação torna ações não autorizadas detectáveis e impede que a autoridade seja derivada de
        carisma, antiguidade ou propriedade.
      whatToDefine: >-
        Para cada papel, órgão ou círculo que detém autoridade, liste o escopo da autoridade, os
        limites rígidos, o mandato/duração e a base (estado de associação, ato de delegação, etc.).
        O conjunto coletivo de Membros Plenos é em si uma autoridade e pertence a esta tabela.
      placeholders:
        - 'ex.: Membros Plenos (coletivo)'
        - escopo
        - limites — não pode anular invariantes; não pode agir fora da Matriz de Decisão

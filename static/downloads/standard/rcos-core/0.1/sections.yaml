- key: onboarding-protocol.admission-criteria
  artifact: onboarding-protocol
  order: 0
  clauseRefs:
    - 3.2.3
    - 3.2.4
  i18n:
    en:
      title: Admission Criteria
      whyItMatters: >-
        Admission is the moment a stranger becomes bound by — and protected by — the community's
        rules. If the criteria are informal, the decision collapses into whoever happens to like the
        applicant. Written criteria make admission a governance act, not a social favor, and make
        rejection defensible on grounds the community can point to.
      whatToDefine: >-
        State the explicit conditions under which an applicant may be admitted. Each criterion
        should be testable from the application itself or from an external check.
      placeholders:
        - Criterion 1, e.g. alignment with the primary purpose and Layer 0 identity constraints.
        - Criterion 2, e.g. willingness to actively contribute in at least one recognized category.
        - Criterion 3, e.g. no prior forced exit or rejection within the last X months.
        - Criterion 4, e.g. completion of the application form in good faith — no misrepresentation.
    de:
      title: Aufnahmekriterien
      whyItMatters: >-
        Die Aufnahme ist der Moment, in dem eine fremde Person an die Regeln der Gemeinschaft
        gebunden — und durch sie geschützt — wird. Wenn die Kriterien informell sind, hängt die
        Entscheidung davon ab, wer die bewerbende Person zufällig sympathisch findet. Schriftliche
        Kriterien machen die Aufnahme zu einem Governance-Akt statt zu einem sozialen Gefallen und
        machen eine Ablehnung mit Gründen vertretbar, auf die die Gemeinschaft verweisen kann.
      whatToDefine: >-
        Formuliere die expliziten Bedingungen, unter denen eine bewerbende Person aufgenommen werden
        kann. Jedes Kriterium sollte anhand der Bewerbung selbst oder einer externen Prüfung
        überprüfbar sein.
      placeholders:
        - >-
          Kriterium 1, z. B. Übereinstimmung mit dem Hauptzweck und den Identitätsbeschränkungen aus
          Schicht 0.
        - >-
          Kriterium 2, z. B. Bereitschaft, in mindestens einer anerkannten Kategorie aktiv
          beizutragen.
        - >-
          Kriterium 3, z. B. kein erzwungener Austritt oder Ablehnung innerhalb der letzten X
          Monate.
        - Kriterium 4, z. B. Bewerbungsformular in gutem Glauben ausgefüllt — keine Falschangaben.
    es:
      title: Criterios de Admisión
      whyItMatters: >-
        La admisión es el momento en que una persona desconocida queda vinculada por — y protegida
        por — las reglas de la comunidad. Si los criterios son informales, la decisión se reduce a
        quién le cae bien al solicitante en ese momento. Los criterios escritos hacen de la admisión
        un acto de gobernanza, no un favor social, y hacen que un rechazo sea defendible con
        fundamentos que la comunidad puede señalar.
      whatToDefine: >-
        Indica las condiciones explícitas bajo las cuales un solicitante puede ser admitido. Cada
        criterio debería ser verificable a partir de la propia solicitud o mediante una comprobación
        externa.
      placeholders:
        - >-
          Criterio 1, p. ej. alineación con el propósito principal y las restricciones de identidad
          de la Capa 0.
        - >-
          Criterio 2, p. ej. disposición a contribuir activamente en al menos una categoría
          reconocida.
        - Criterio 3, p. ej. sin expulsión forzosa ni rechazo previo en los últimos X meses.
        - Criterio 4, p. ej. formulario de solicitud completado de buena fe — sin tergiversación.
    fr:
      title: Critères d'admission
      whyItMatters: >-
        L'admission est le moment où un inconnu devient lié par — et protégé par — les règles de la
        communauté. Si les critères sont informels, la décision se réduit à savoir si les présents
        apprécient le candidat. Des critères écrits font de l'admission un acte de gouvernance, pas
        une faveur sociale, et rendent un refus défendable sur des bases que la communauté peut
        invoquer.
      whatToDefine: >-
        Énonce les conditions explicites sous lesquelles un candidat peut être admis. Chaque critère
        doit être vérifiable à partir de la candidature elle-même ou d'une vérification externe.
      placeholders:
        - >-
          Critère 1, p. ex. alignement avec l'objectif principal et les contraintes d'identité de la
          Couche 0.
        - Critère 2, p. ex. volonté de contribuer activement dans au moins une catégorie reconnue.
        - Critère 3, p. ex. aucune sortie forcée ou rejet au cours des X derniers mois.
        - >-
          Critère 4, p. ex. formulaire de candidature rempli de bonne foi — pas de déclaration
          trompeuse.
    pt-br:
      title: Critérios de Admissão
      whyItMatters: >-
        A admissão é o momento em que uma pessoa estranha passa a estar vinculada — e protegida —
        pelas regras da comunidade. Se os critérios forem informais, a decisão se reduz a quem por
        acaso simpatiza com a pessoa candidata. Critérios escritos tornam a admissão um ato de
        governança, não um favor social, e permitem que uma recusa seja defensável com base em
        fundamentos que a comunidade pode apontar.
      whatToDefine: >-
        Declare as condições explícitas sob as quais uma pessoa candidata pode ser admitida. Cada
        critério deve ser verificável a partir da própria candidatura ou de uma checagem externa.
      placeholders:
        - >-
          Critério 1, ex. alinhamento com o propósito principal e com as restrições de identidade da
          Camada 0.
        - >-
          Critério 2, ex. disposição para contribuir ativamente em pelo menos uma categoria
          reconhecida.
        - Critério 3, ex. nenhuma saída forçada ou rejeição prévia nos últimos X meses.
        - >-
          Critério 4, ex. preenchimento do formulário de candidatura em boa-fé — sem informações
          falsas.
  ownsClauses:
    - 3.2.3
    - 3.2.4
- key: onboarding-protocol.onboarding-steps
  artifact: onboarding-protocol
  order: 1
  clauseRefs:
    - 3.2.1
    - 3.2.2
  i18n:
    en:
      title: Onboarding Steps
      whyItMatters: >-
        Consent to governance only means something if the member has actually seen the governance. A
        fixed sequence — review, consent, technical setup — ensures every Full Member crossed the
        same threshold in the same order, so nobody slips into full rights without having
        encountered the constraints that come with them.
      whatToDefine: >-
        List the ordered steps every new member must complete to move from applicant to Full Member.
        Include explicit consent steps and any tooling/access provisioning required.
      placeholders:
        - Step 1, e.g. review all Layer 0–6 artifacts and this onboarding protocol.
        - >-
          Step 2, e.g. explicitly consent to the Membership Agreement and Layer 0 identity
          constraints.
        - Step 3, e.g. set up required tooling (wallet, accounts, identity).
        - Step 4, e.g. join member-only communication channels.
        - Step 5, e.g. be granted any required permissions for governance participation.
        - Step 6, e.g. onboarding completion recorded — membership state transitions to Full Member.
    de:
      title: Onboarding-Schritte
      whyItMatters: >-
        Zustimmung zu Governance bedeutet nur dann etwas, wenn das Mitglied die Governance
        tatsächlich gesehen hat. Eine feste Abfolge — Prüfung, Zustimmung, technisches Setup —
        stellt sicher, dass jedes Vollmitglied die gleiche Schwelle in der gleichen Reihenfolge
        überschritten hat, sodass niemand volle Rechte erhält, ohne die damit verbundenen
        Einschränkungen kennengelernt zu haben.
      whatToDefine: >-
        Liste die geordneten Schritte auf, die jedes neue Mitglied durchlaufen muss, um von der
        bewerbenden zur vollwertigen Person zu werden. Füge explizite Zustimmungsschritte und alle
        erforderlichen Werkzeug-/Zugangsbereitstellungen hinzu.
      placeholders:
        - >-
          Schritt 1, z. B. alle Artefakte der Schichten 0–6 und dieses Onboarding-Protokoll
          durchsehen.
        - >-
          Schritt 2, z. B. der Mitgliedschaftsvereinbarung und den Identitätsbeschränkungen aus
          Schicht 0 ausdrücklich zustimmen.
        - Schritt 3, z. B. erforderliche Werkzeuge einrichten (Wallet, Konten, Identität).
        - Schritt 4, z. B. den mitgliederexklusiven Kommunikationskanälen beitreten.
        - Schritt 5, z. B. erforderliche Berechtigungen für die Governance-Teilnahme erhalten.
        - >-
          Schritt 6, z. B. Onboarding-Abschluss dokumentiert — Mitgliedschaftsstatus wechselt zu
          Vollmitglied.
    es:
      title: Pasos de Incorporación
      whyItMatters: >-
        El consentimiento a la gobernanza solo tiene sentido si el miembro realmente ha visto la
        gobernanza. Una secuencia fija — revisión, consentimiento, configuración técnica — garantiza
        que cada Miembro Pleno cruzó el mismo umbral en el mismo orden, de modo que nadie accede a
        derechos plenos sin haber conocido las restricciones que los acompañan.
      whatToDefine: >-
        Enumera los pasos ordenados que cada nuevo miembro debe completar para pasar de solicitante
        a Miembro Pleno. Incluye pasos explícitos de consentimiento y cualquier aprovisionamiento de
        herramientas o acceso requerido.
      placeholders:
        - >-
          Paso 1, p. ej. revisar todos los artefactos de las Capas 0–6 y este protocolo de
          incorporación.
        - >-
          Paso 2, p. ej. consentir explícitamente el Acuerdo de Membresía y las restricciones de
          identidad de la Capa 0.
        - Paso 3, p. ej. configurar las herramientas requeridas (billetera, cuentas, identidad).
        - Paso 4, p. ej. unirse a los canales de comunicación exclusivos para miembros.
        - Paso 5, p. ej. recibir los permisos necesarios para participar en la gobernanza.
        - >-
          Paso 6, p. ej. finalización de la incorporación registrada — el estado de membresía cambia
          a Miembro Pleno.
    fr:
      title: Étapes d'intégration
      whyItMatters: >-
        Le consentement à la gouvernance n'a de sens que si le membre a réellement vu la
        gouvernance. Une séquence fixe — examen, consentement, configuration technique — garantit
        que chaque Membre à part entière a franchi le même seuil dans le même ordre, de sorte que
        personne n'accède aux pleins droits sans avoir pris connaissance des contraintes qui les
        accompagnent.
      whatToDefine: >-
        Liste les étapes ordonnées que chaque nouveau membre doit accomplir pour passer de candidat
        à Membre à part entière. Inclus les étapes de consentement explicite et tout provisionnement
        d'outils ou d'accès nécessaire.
      placeholders:
        - >-
          Étape 1, p. ex. examiner tous les artefacts des Couches 0 à 6 et ce protocole
          d'intégration.
        - >-
          Étape 2, p. ex. consentir explicitement à l'Accord d'adhésion et aux contraintes
          d'identité de la Couche 0.
        - Étape 3, p. ex. configurer les outils requis (portefeuille, comptes, identité).
        - Étape 4, p. ex. rejoindre les canaux de communication réservés aux membres.
        - >-
          Étape 5, p. ex. se voir accorder les permissions nécessaires à la participation à la
          gouvernance.
        - >-
          Étape 6, p. ex. achèvement de l'intégration enregistré — l'état d'adhésion passe à Membre
          à part entière.
    pt-br:
      title: Etapas de Integração
      whyItMatters: >-
        O consentimento à governança só significa algo se a pessoa membro de fato conheceu a
        governança. Uma sequência fixa — revisão, consentimento, configuração técnica — garante que
        toda Pessoa Membro Plena cruzou o mesmo limiar na mesma ordem, de modo que ninguém entre nos
        direitos plenos sem ter encontrado as restrições que vêm junto com eles.
      whatToDefine: >-
        Liste as etapas ordenadas que toda pessoa nova membro DEVE completar para passar de
        candidata a Membro Pleno. Inclua etapas explícitas de consentimento e qualquer provisão de
        ferramentas/acessos necessária.
      placeholders:
        - Etapa 1, ex. revisar todos os artefatos das Camadas 0–6 e este protocolo de integração.
        - >-
          Etapa 2, ex. consentir explicitamente com o Acordo de Associação e com as restrições de
          identidade da Camada 0.
        - Etapa 3, ex. configurar as ferramentas necessárias (carteira, contas, identidade).
        - Etapa 4, ex. entrar nos canais de comunicação exclusivos para membros.
        - Etapa 5, ex. receber as permissões necessárias para participar da governança.
        - >-
          Etapa 6, ex. conclusão da integração registrada — o estado de associação transita para
          Membro Pleno.
  ownsClauses:
    - 3.2.1
    - 3.2.2
- key: onboarding-protocol.initial-membership-state
  artifact: onboarding-protocol
  order: 2
  clauseRefs:
    - 3.1.2
    - 3.1.4
  i18n:
    en:
      title: Initial Membership State
      whyItMatters: >-
        Between "applicant approved" and "fully integrated" there is a real gap — permissions,
        access, and expectations all change. Declaring the exact state a new member holds at each
        step removes ambiguity about what they can do right now, and prevents unintentional grants
        of rights before onboarding is complete.
      whatToDefine: >-
        State the membership states a member transitions through during onboarding, and what
        triggers each transition. Reference the Membership State Registry.
      placeholders:
        - e.g. Trial Member.
        - e.g. Full Member (automatic upon completion).
    de:
      title: Anfänglicher Mitgliedschaftsstatus
      whyItMatters: >-
        Zwischen „Bewerbung genehmigt" und „vollständig integriert" gibt es eine echte Lücke —
        Berechtigungen, Zugang und Erwartungen ändern sich. Wenn du den genauen Status festlegst,
        den ein neues Mitglied in jedem Schritt innehat, beseitigst du Unklarheiten darüber, was es
        gerade tun darf, und verhinderst unbeabsichtigte Rechtevergaben, bevor das Onboarding
        abgeschlossen ist.
      whatToDefine: >-
        Gib die Mitgliedschaftsstatus an, die ein Mitglied während des Onboardings durchläuft, und
        was jeden Übergang auslöst. Verweise auf das Mitgliedschaftsstatus-Register.
      placeholders:
        - z. B. Probemitglied.
        - z. B. Vollmitglied (automatisch bei Abschluss).
    es:
      title: Estado Inicial de Membresía
      whyItMatters: >-
        Entre "solicitante aprobado" y "totalmente integrado" hay una brecha real — los permisos, el
        acceso y las expectativas cambian. Declarar el estado exacto que un nuevo miembro tiene en
        cada paso elimina la ambigüedad sobre lo que puede hacer en ese momento, y evita concesiones
        involuntarias de derechos antes de que la incorporación esté completa.
      whatToDefine: >-
        Indica los estados de membresía por los que transita un miembro durante la incorporación, y
        qué desencadena cada transición. Consulta el Registro de Estados de Membresía.
      placeholders:
        - p. ej. Miembro en Prueba.
        - p. ej. Miembro Pleno (automático al completar).
    fr:
      title: État d'adhésion initial
      whyItMatters: >-
        Entre « candidat approuvé » et « pleinement intégré », il y a un vrai décalage — les
        permissions, les accès et les attentes changent tous. Déclarer l'état exact que détient un
        nouveau membre à chaque étape supprime toute ambiguïté sur ce qu'il peut faire à l'instant
        présent, et empêche l'octroi involontaire de droits avant la fin de l'intégration.
      whatToDefine: >-
        Indique les états d'adhésion par lesquels un membre transite pendant l'intégration, et ce
        qui déclenche chaque transition. Réfère-toi au Registre des états d'adhésion.
      placeholders:
        - p. ex. Membre en période d'essai.
        - p. ex. Membre à part entière (automatique à l'achèvement).
    pt-br:
      title: Estado Inicial de Associação
      whyItMatters: >-
        Entre "candidatura aprovada" e "totalmente integrada" existe uma lacuna real — permissões,
        acesso e expectativas mudam. Declarar o estado exato que uma pessoa nova membro ocupa em
        cada etapa elimina a ambiguidade sobre o que ela pode fazer naquele momento, e evita
        concessões não intencionais de direitos antes que a integração esteja completa.
      whatToDefine: >-
        Declare os estados de associação pelos quais uma pessoa membro transita durante a integração
        e o que dispara cada transição. Faça referência ao Registro de Estados de Associação.
      placeholders:
        - ex. Membro em Período de Experiência.
        - ex. Membro Pleno (automático ao concluir).
  ownsClauses: []
- key: onboarding-protocol.trial-and-evaluation
  artifact: onboarding-protocol
  order: 3
  clauseRefs:
    - 3.3.1
    - 3.3.2
    - 3.3.3
    - 3.3.4
  i18n:
    en:
      title: Trial and Evaluation
      whyItMatters: >-
        An unbounded trial is a second-class membership that never ends — all obligations, fewer
        rights. Fixing the duration, the criteria, and the failure path forces a decision point:
        either the new member transitions into full standing or a defined exit runs. It prevents the
        trial state from becoming a permanent holding pen.
      whatToDefine: >-
        Define the duration, evaluation criteria, transition decision, grace period, failure path,
        and any extension rules. Trial rights are defined in the Membership State Registry.
      placeholders:
        - e.g. 30 days from approval.
        - e.g. all onboarding steps completed and recorded.
        - e.g. automatic on completion; or vote-based.
        - e.g. additional X days if onboarding not complete on time.
        - e.g. exit process triggered automatically after total period elapses.
        - e.g. one-time X-day extension on request.
        - reference Membership State Registry.
        - e.g. members exited due to incomplete onboarding may not reapply for X months.
    de:
      title: Probezeit und Bewertung
      whyItMatters: >-
        Eine unbegrenzte Probezeit ist eine Mitgliedschaft zweiter Klasse, die nie endet — alle
        Pflichten, weniger Rechte. Dauer, Kriterien und den Pfad bei Nichtbestehen festzulegen
        erzwingt einen Entscheidungspunkt: Entweder geht das neue Mitglied in den vollen Status
        über, oder ein definierter Austrittsprozess wird ausgelöst. Das verhindert, dass die
        Probezeit zu einem dauerhaften Wartezustand wird.
      whatToDefine: >-
        Lege Dauer, Bewertungskriterien, Übergangsentscheidung, Nachfrist, Pfad bei Nichtbestehen
        und etwaige Verlängerungsregeln fest. Proberechte werden im Mitgliedschaftsstatus-Register
        definiert.
      placeholders:
        - z. B. 30 Tage ab Genehmigung.
        - z. B. alle Onboarding-Schritte abgeschlossen und dokumentiert.
        - z. B. automatisch bei Abschluss; oder abstimmungsbasiert.
        - z. B. zusätzliche X Tage, falls Onboarding nicht rechtzeitig abgeschlossen.
        - z. B. Austrittsprozess wird automatisch nach Ablauf der Gesamtfrist ausgelöst.
        - z. B. einmalige X-Tage-Verlängerung auf Anfrage.
        - Verweis auf das Mitgliedschaftsstatus-Register.
        - >-
          z. B. Mitglieder, die wegen unvollständigem Onboarding ausgetreten sind, dürfen sich X
          Monate lang nicht erneut bewerben.
    es:
      title: Prueba y Evaluación
      whyItMatters: >-
        Un periodo de prueba sin límite es una membresía de segunda clase que nunca termina — todas
        las obligaciones, menos derechos. Fijar la duración, los criterios y el camino en caso de
        fallo obliga a un punto de decisión: o el nuevo miembro pasa a pleno derecho o se ejecuta
        una salida definida. Esto evita que el estado de prueba se convierta en un limbo permanente.
      whatToDefine: >-
        Define la duración, los criterios de evaluación, la decisión de transición, el periodo de
        gracia, el camino en caso de fallo y cualquier regla de extensión. Los derechos durante la
        prueba se definen en el Registro de Estados de Membresía.
      placeholders:
        - p. ej. 30 días desde la aprobación.
        - p. ej. todos los pasos de incorporación completados y registrados.
        - p. ej. automática al completar; o por votación.
        - p. ej. X días adicionales si la incorporación no se completa a tiempo.
        - p. ej. proceso de salida activado automáticamente tras agotarse el periodo total.
        - p. ej. extensión única de X días bajo solicitud.
        - consultar el Registro de Estados de Membresía.
        - >-
          p. ej. los miembros que salieron por incorporación incompleta no pueden volver a solicitar
          durante X meses.
    fr:
      title: Période d'essai et évaluation
      whyItMatters: >-
        Une période d'essai sans limite est une adhésion de seconde classe qui ne prend jamais fin —
        toutes les obligations, moins de droits. Fixer la durée, les critères et le parcours en cas
        d'échec impose un point de décision : soit le nouveau membre accède au statut plein, soit un
        processus de sortie défini s'exécute. Cela empêche la période d'essai de devenir un sas
        d'attente permanent.
      whatToDefine: >-
        Définis la durée, les critères d'évaluation, la décision de transition, le délai de grâce,
        le parcours en cas d'échec et les règles de prolongation éventuelles. Les droits pendant la
        période d'essai sont définis dans le Registre des états d'adhésion.
      placeholders:
        - p. ex. 30 jours à compter de l'approbation.
        - p. ex. toutes les étapes d'intégration accomplies et enregistrées.
        - p. ex. automatique à l'achèvement ; ou par vote.
        - p. ex. X jours supplémentaires si l'intégration n'est pas terminée dans les temps.
        - p. ex. processus de sortie déclenché automatiquement à l'expiration de la période totale.
        - p. ex. une prolongation unique de X jours sur demande.
        - référence au Registre des états d'adhésion.
        - >-
          p. ex. les membres sortis pour intégration incomplète ne peuvent pas recandidater pendant
          X mois.
    pt-br:
      title: Período de Experiência e Avaliação
      whyItMatters: >-
        Um período de experiência sem prazo é uma associação de segunda classe que nunca termina —
        todas as obrigações, menos direitos. Fixar a duração, os critérios e o caminho de falha
        força um ponto de decisão: ou a pessoa nova membro transita para o status pleno ou uma saída
        definida é acionada. Isso impede que o estado de experiência se torne uma sala de espera
        permanente.
      whatToDefine: >-
        Defina a duração, os critérios de avaliação, a decisão de transição, o período de carência,
        o caminho de falha e quaisquer regras de prorrogação. Os direitos durante o período de
        experiência são definidos no Registro de Estados de Associação.
      placeholders:
        - ex. 30 dias a partir da aprovação.
        - ex. todas as etapas de integração concluídas e registradas.
        - ex. automática ao concluir; ou baseada em votação.
        - ex. mais X dias se a integração não for concluída no prazo.
        - ex. processo de saída acionado automaticamente após o término do período total.
        - ex. prorrogação única de X dias mediante solicitação.
        - faça referência ao Registro de Estados de Associação.
        - >-
          ex. pessoas membros excluídas por integração incompleta NÃO PODEM se recandidatar por X
          meses.
  ownsClauses:
    - 3.3.1
    - 3.3.2
    - 3.3.3
    - 3.3.4
- key: onboarding-protocol.completion-record
  artifact: onboarding-protocol
  order: 4
  clauseRefs:
    - 3.8.2
  i18n:
    en:
      title: Completion Record
      whyItMatters: >-
        The completion record is the evidence that a member consented to a specific version of the
        rules on a specific date. Losing or editing it would make it impossible to answer, months or
        years later, "what exactly did they agree to?" — which is the only question that matters
        when a dispute arrives.
      whatToDefine: >-
        State where the completion record is kept, what it captures (timestamp, artifact versions
        consented to), and the retention rule.
      placeholders:
        - >-
          Description of the onboarding completion record — where it lives, what it captures, and
          that it is retained permanently after exit.
    de:
      title: Abschlussnachweis
      whyItMatters: >-
        Der Abschlussnachweis ist der Beleg dafür, dass ein Mitglied einer bestimmten Version der
        Regeln an einem bestimmten Datum zugestimmt hat. Ihn zu verlieren oder zu bearbeiten würde
        es unmöglich machen, Monate oder Jahre später die Frage zu beantworten: „Was genau hat die
        Person zugestimmt?" — und das ist die einzige Frage, die zählt, wenn ein Streitfall
        eintritt.
      whatToDefine: >-
        Gib an, wo der Abschlussnachweis aufbewahrt wird, was er erfasst (Zeitstempel, Versionen der
        zugestimmten Artefakte) und welche Aufbewahrungsregel gilt.
      placeholders:
        - >-
          Beschreibung des Onboarding-Abschlussnachweises — wo er gespeichert ist, was er erfasst
          und dass er auch nach einem Austritt dauerhaft aufbewahrt wird.
    es:
      title: Registro de Finalización
      whyItMatters: >-
        El registro de finalización es la evidencia de que un miembro consintió a una versión
        específica de las reglas en una fecha específica. Perderlo o editarlo haría imposible
        responder, meses o años después, "¿a qué exactamente accedió?" — que es la única pregunta
        que importa cuando llega una disputa.
      whatToDefine: >-
        Indica dónde se guarda el registro de finalización, qué captura (marca de tiempo, versiones
        de artefactos consentidos) y la regla de retención.
      placeholders:
        - >-
          Descripción del registro de finalización de la incorporación — dónde se almacena, qué
          captura y que se retiene permanentemente después de la salida.
    fr:
      title: Dossier d'achèvement
      whyItMatters: >-
        Le dossier d'achèvement est la preuve qu'un membre a consenti à une version spécifique des
        règles à une date spécifique. Le perdre ou le modifier rendrait impossible de répondre, des
        mois ou des années plus tard, à la question « à quoi exactement a-t-il consenti ? » — qui
        est la seule question qui compte lorsqu'un litige survient.
      whatToDefine: >-
        Indique où le dossier d'achèvement est conservé, ce qu'il capture (horodatage, versions des
        artefacts auxquelles le membre a consenti), et la règle de conservation.
      placeholders:
        - >-
          Description du dossier d'achèvement de l'intégration — où il est stocké, ce qu'il capture,
          et qu'il est conservé de manière permanente après la sortie.
    pt-br:
      title: Registro de Conclusão
      whyItMatters: >-
        O registro de conclusão é a evidência de que uma pessoa membro consentiu com uma versão
        específica das regras em uma data específica. Perdê-lo ou editá-lo tornaria impossível
        responder, meses ou anos depois, "com o que exatamente ela concordou?" — que é a única
        pergunta que importa quando surge uma disputa.
      whatToDefine: >-
        Declare onde o registro de conclusão é mantido, o que ele captura (carimbo de data/hora,
        versões dos artefatos consentidos) e a regra de retenção.
      placeholders:
        - >-
          Descrição do registro de conclusão da integração — onde fica, o que captura e que é retido
          permanentemente após a saída.
  ownsClauses:
    - 3.8.2

- key: version-history.entry-format
  artifact: version-history
  order: 0
  clauseRefs:
    - 8.2.1
    - 8.2.2
    - 8.2.3
    - 8.2.4
    - 8.2.5
    - 8.6.4
    - 8.7.2
  i18n:
    en:
      title: Entry Format
      whyItMatters: >-
        Governance that cannot point to "what changed, when, and why" is indistinguishable from
        governance by whoever speaks loudest. A single append-only ledger of adopted changes — with
        the superseded versions preserved in version control — makes the current state of the rules
        unambiguous and gives members, auditors, and future stewards a way to reconstruct the path
        that got us here.
      whatToDefine: >-
        Use the entry template below for every adopted change. New entries are prepended above the
        most recent. Do not edit historical entries — corrections are recorded as new entries.
      placeholders: []
    de:
      title: Eintragsformat
      whyItMatters: >-
        Governance, die nicht auf „was hat sich wann und warum geändert" verweisen kann, ist nicht
        von Governance durch diejenigen zu unterscheiden, die am lautesten reden. Ein einziges, nur
        fortschreibbares Protokoll übernommener Änderungen — wobei die abgelösten Versionen in der
        Versionskontrolle erhalten bleiben — macht den aktuellen Stand der Regeln eindeutig und gibt
        Mitgliedern, Prüfenden und zukünftigen Verantwortlichen die Möglichkeit, den Weg
        nachzuvollziehen, der uns hierhergeführt hat.
      whatToDefine: >-
        Nutzt die Eintragsvorlage unten für jede übernommene Änderung. Neue Einträge werden über dem
        jeweils neuesten eingefügt. Ändert keine historischen Einträge — Korrekturen werden als neue
        Einträge erfasst.
      placeholders: []
    es:
      title: Formato de Entrada
      whyItMatters: >-
        Una gobernanza que no puede señalar "qué cambió, cuándo y por qué" es indistinguible de una
        gobernanza donde manda quien más alto habla. Un único registro de solo-anexión de cambios
        adoptados — con las versiones sustituidas preservadas en el control de versiones — hace que
        el estado actual de las reglas sea inequívoco y ofrece a los miembros, auditores y futuros
        responsables una forma de reconstruir el camino que nos trajo hasta aquí.
      whatToDefine: >-
        Usa la plantilla de entrada a continuación para cada cambio adoptado. Las nuevas entradas se
        anteponen por encima de la más reciente. No edites entradas históricas — las correcciones se
        registran como nuevas entradas.
      placeholders: []
    fr:
      title: Format des entrées
      whyItMatters: >-
        Une gouvernance qui ne peut pas indiquer « ce qui a changé, quand et pourquoi » est
        indiscernable d'une gouvernance par celui qui parle le plus fort. Un registre unique en
        ajout seul des changements adoptés — avec les versions remplacées conservées dans le
        contrôle de version — rend l'état actuel des règles sans ambiguïté et donne aux membres, aux
        auditeurs et aux futurs responsables un moyen de reconstituer le chemin qui nous a menés
        ici.
      whatToDefine: >-
        Utilise le modèle d'entrée ci-dessous pour chaque changement adopté. Les nouvelles entrées
        sont ajoutées au-dessus de la plus récente. Ne modifie pas les entrées historiques — les
        corrections sont enregistrées comme de nouvelles entrées.
      placeholders: []
    pt-br:
      title: Formato da Entrada
      whyItMatters: >-
        Uma governança que não consegue apontar "o que mudou, quando e por quê" é indistinguível de
        uma governança ditada por quem fala mais alto. Um único livro-razão apenas-acréscimo de
        mudanças adotadas — com as versões substituídas preservadas no controle de versão — torna o
        estado atual das regras inequívoco e dá aos membros, auditores e futuros administradores uma
        forma de reconstruir o caminho que nos trouxe até aqui.
      whatToDefine: >-
        Use o modelo de entrada abaixo para cada mudança adotada. Novas entradas são adicionadas
        acima da mais recente. Não edite entradas históricas — correções são registradas como novas
        entradas.
      placeholders: []

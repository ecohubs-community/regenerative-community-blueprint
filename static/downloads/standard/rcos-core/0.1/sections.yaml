        - Réunion récurrente
        - facilitateur·rice
        - publication de l'ordre du jour ; notes ; suivi des actions
        - Gestion de la trésorerie
        - intendant·e finances
        - voir Règles de trésorerie (Couche 3)
        - Revue des accès aux plateformes
        - intendant·e infrastructure
        - cadence de revue ; révocation des accès pour les membres sortis
    pt-br:
      title: Processos Operacionais Essenciais
      whyItMatters: >-
        Se um processo só existe na cabeça de uma pessoa, a comunidade depende dela aparecer — para
        sempre. Escrever os processos críticos, com pessoas responsáveis nomeadas, é o que
        transforma conhecimento privado em um ativo comunitário que sobrevive a transições,

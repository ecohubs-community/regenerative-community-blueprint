      whyItMatters: >-
        Si una reunión puede tanto discutir como decidir, quien esté en la sala ese día decide —
        independientemente del quórum o las reglas de autoridad. Mantener la deliberación separada
        de la votación vinculante preserva la integridad de la Matriz de Decisión y asegura que los
        miembros ausentes sigan teniendo voto.

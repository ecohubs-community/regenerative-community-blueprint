- key: role-registry.functional-roles
  artifact: role-registry
  order: 3
  clauseRefs:
    - 7.1.1
    - 7.1.2
  i18n:
    en:
      title: Functional Roles
      whyItMatters: >-
        Not every contribution needs delegated authority — most work is about doing, not deciding.
        Functional roles name contribution scopes without bundling in governance power, so members
        can opt into work without an authority transfer, and so the governance system stays clear
        about who can act on behalf of the community.
      whatToDefine: >-
        For each functional role, define purpose, scope, interfaces, eligibility, and handover.
        Functional roles do not require a vote to assume — declaration is sufficient.
      placeholders:
        - Functional Role Name, e.g. Facilitator
        - purpose.
        - responsibilities.
        - Full Member rights only.
        - other roles.
        - Full Member; any additional preferences.
        - ongoing until vacated.
        - self-declaration.
        - may be vacated at any time; conflict-of-interest substitution per Layer 4 if relevant.
        - active commitments to brief in.
        - Add additional functional roles as needed.
    de:
      title: Funktionale Rollen
      whyItMatters: >-
        Nicht jeder Beitrag braucht delegierte Autorität — die meiste Arbeit dreht sich ums Tun,
        nicht ums Entscheiden. Funktionale Rollen benennen Beitragsbereiche, ohne Governance-Macht
        zu bündeln, sodass Mitglieder sich in Arbeit einbringen können, ohne eine
        Autoritätsübertragung, und damit das Governance-System klar bleibt, wer im Namen der
        Gemeinschaft handeln darf.
      whatToDefine: >-
        Definiert für jede funktionale Rolle Zweck, Zuständigkeitsbereich, Schnittstellen,
        Berechtigung und Übergabe. Funktionale Rollen erfordern keine Abstimmung zur Übernahme —
        eine Erklärung genügt.
      placeholders:
        - Name der funktionalen Rolle, z. B. Moderation
        - Zweck.
        - Verantwortlichkeiten.
        - nur Vollmitglieder-Rechte.
        - andere Rollen.
        - Vollmitglied; ggf. weitere Präferenzen.
        - fortlaufend bis zur Niederlegung.
        - Selbsterklärung.
        - >-
          kann jederzeit niedergelegt werden; Befangenheitsvertretung gemäß Schicht 4 falls
          relevant.
        - laufende Verpflichtungen einweisen.
        - Weitere funktionale Rollen nach Bedarf hinzufügen.
    es:
      title: Roles funcionales
      whyItMatters: >-
        No toda contribución necesita autoridad delegada — la mayor parte del trabajo consiste en
        hacer, no en decidir. Los roles funcionales nombran ámbitos de contribución sin agrupar
        poder de gobernanza, de modo que los miembros puedan optar por realizar trabajo sin una
        transferencia de autoridad, y para que el sistema de gobernanza mantenga claridad sobre
        quién puede actuar en nombre de la comunidad.
      whatToDefine: >-
        Para cada rol funcional, define propósito, ámbito, interfaces, elegibilidad y traspaso. Los
        roles funcionales no requieren votación para asumirlos — basta con una declaración.
      placeholders:
        - Nombre del rol funcional, p. ej. Facilitador
        - propósito.
        - responsabilidades.
        - solo derechos de Miembro Pleno.
        - otros roles.
        - Miembro Pleno; cualquier preferencia adicional.
        - continuo hasta dejar vacante.
        - autodeclaración.
        - >-
          puede dejarse vacante en cualquier momento; sustitución por conflicto de interés según la
          Capa 4 si corresponde.
        - compromisos activos a informar.
        - Añade roles funcionales adicionales según sea necesario.
    fr:
      title: Rôles fonctionnels
      whyItMatters: >-
        Chaque contribution n'a pas besoin d'une autorité déléguée — la plupart du travail consiste
        à faire, pas à décider. Les rôles fonctionnels nomment des périmètres de contribution sans y
        associer de pouvoir de gouvernance, de sorte que les membres peuvent s'engager dans le
        travail sans transfert d'autorité, et que le système de gouvernance reste clair sur qui peut
        agir au nom de la communauté.
      whatToDefine: >-
        Pour chaque rôle fonctionnel, définis l'objet, le périmètre, les interfaces, l'éligibilité
        et la passation. Les rôles fonctionnels ne nécessitent pas de vote pour être assumés — une
        déclaration suffit.
      placeholders:
        - Nom du rôle fonctionnel, p. ex. Facilitateur·ice
        - objet.
        - responsabilités.
        - droits de Membre à part entière uniquement.
        - autres rôles.
        - Membre à part entière ; toute préférence supplémentaire.
        - continu jusqu'à libération.
        - auto-déclaration.
        - >-
          peut être libéré à tout moment ; substitution en cas de conflit d'intérêts selon la Couche
          4 si pertinent.
        - engagements en cours à transmettre.
        - Ajouter d'autres rôles fonctionnels selon les besoins.
    pt-br:
      title: Papéis Funcionais
      whyItMatters: >-
        Nem toda contribuição precisa de autoridade delegada — a maior parte do trabalho é sobre
        fazer, não decidir. Papéis funcionais nomeiam escopos de contribuição sem agregar poder de
        governança, para que os membros possam aderir ao trabalho sem uma transferência de
        autoridade e para que o sistema de governança permaneça claro sobre quem pode agir em nome
        da comunidade.
      whatToDefine: >-
        Para cada papel funcional, defina propósito, escopo, interfaces, elegibilidade e transição.
        Papéis funcionais não requerem votação para serem assumidos — a declaração é suficiente.
      placeholders:
        - 'Nome do Papel Funcional, ex.: Facilitador(a)'
        - propósito.
        - responsabilidades.
        - apenas direitos de Membro Pleno.
        - outros papéis.
        - Membro Pleno; quaisquer preferências adicionais.
        - contínuo até ser deixado.
        - autodeclaração.
        - >-
          PODE ser deixado a qualquer momento; substituição por conflito de interesse conforme a
          Camada 4, se relevante.
        - compromissos ativos a serem informados.
        - Adicione papéis funcionais adicionais conforme necessário.

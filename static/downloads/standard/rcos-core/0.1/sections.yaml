        - ...
    pt-br:
      title: Classificação Bens Comuns vs. Privados
      whyItMatters: >-
        Recursos não classificados são onde a privatização silenciosa acontece — alguém começa a
        tratar um ativo compartilhado como pessoal, ou um ativo privado é absorvido silenciosamente
        pelas obrigações da comunidade, e quando alguém percebe a norma já mudou. A classificação
        explícita, com guardiões e regras de transferência nomeadas desde o início, transforma
        qualquer mudança nesse status em um ato de governança visível, em vez de um fato que se
        infiltra.
      whatToDefine: >-
        Para cada recurso que a comunidade possui, declare a classificação (Bens Comuns / Privado),

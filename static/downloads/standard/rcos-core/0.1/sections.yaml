- key: membership-state-registry.defined-membership-states
  artifact: membership-state-registry
  order: 0
  clauseRefs:
    - 3.1.1
    - 3.1.2
    - 3.1.3
    - 3.1.4
    - 3.1.5
  i18n:
    en:
      title: Defined Membership States
      whyItMatters: >-
        Rights and obligations scattered across documents drift apart. Collecting every state, its
        rights, its obligations, and its transitions into one table makes the membership system
        auditable at a glance — you can see every door into and out of the community, and what each
        one grants. If two documents ever disagree, this registry is the tiebreaker.
      whatToDefine: >-
        Define every membership state your community recognizes (e.g. Applicant, Trial Member, Full
        Member, Exited Member). For each, list rights, obligations, entry condition, and exit
        condition. Keep states mutually exclusive — no individual may hold two states
        simultaneously.
      placeholders:
        - State 1, e.g. Applicant
        - rights
        - obligations
        - entry
        - exit
        - State 2, e.g. Trial Member
        - rights
        - obligations
        - entry
        - exit
        - State 3, e.g. Full Member
        - rights
        - obligations
        - entry
        - exit
        - State 4, e.g. Exited Member
        - rights
        - obligations
        - entry
        - exit
    de:
      title: Definierte Mitgliedschaftsstatus
      whyItMatters: >-
        Rechte und Pflichten, die über verschiedene Dokumente verstreut sind, driften auseinander.
        Alle Status, ihre Rechte, Pflichten und Übergänge in einer Tabelle zu sammeln, macht das
        Mitgliedschaftssystem auf einen Blick überprüfbar — ihr seht jede Tür in die und aus der
        Gemeinschaft und was jede davon gewährt. Falls zwei Dokumente jemals widersprüchlich sind,
        ist dieses Register der Schiedsrichter.
      whatToDefine: >-
        Definiert jeden Mitgliedschaftsstatus, den eure Gemeinschaft anerkennt (z. B. Bewerber·in,
        Probemitglied, Vollmitglied, Ausgetretenes Mitglied). Listet für jeden Status Rechte,
        Pflichten, Eintrittsbedingung und Austrittsbedingung auf. Haltet die Status gegenseitig
        ausschließend — keine Person darf zwei Status gleichzeitig innehaben.
      placeholders:
        - Status 1, z. B. Bewerber·in
        - Rechte
        - Pflichten
        - Eintritt
        - Austritt
        - Status 2, z. B. Probemitglied
        - Rechte
        - Pflichten
        - Eintritt
        - Austritt
        - Status 3, z. B. Vollmitglied
        - Rechte
        - Pflichten
        - Eintritt
        - Austritt
        - Status 4, z. B. Ausgetretenes Mitglied
        - Rechte
        - Pflichten
        - Eintritt
        - Austritt
    es:
      title: Estados de Membresía Definidos
      whyItMatters: >-
        Los derechos y obligaciones dispersos en distintos documentos terminan divergiendo. Reunir
        cada estado, sus derechos, sus obligaciones y sus transiciones en una sola tabla hace que el
        sistema de membresía sea auditable de un vistazo — puedes ver cada puerta de entrada y
        salida de la comunidad, y lo que cada una otorga. Si dos documentos alguna vez se
        contradicen, este registro es el que prevalece.
      whatToDefine: >-
        Define cada estado de membresía que tu comunidad reconoce (p. ej., Solicitante, Miembro en
        Prueba, Miembro Pleno, Miembro Saliente). Para cada uno, enumera derechos, obligaciones,
        condición de entrada y condición de salida. Mantén los estados mutuamente excluyentes —
        ninguna persona puede tener dos estados simultáneamente.
      placeholders:
        - Estado 1, p. ej. Solicitante
        - derechos
        - obligaciones
        - entrada
        - salida
        - Estado 2, p. ej. Miembro en Prueba
        - derechos
        - obligaciones
        - entrada
        - salida
        - Estado 3, p. ej. Miembro Pleno
        - derechos
        - obligaciones
        - entrada
        - salida
        - Estado 4, p. ej. Miembro Saliente
        - derechos
        - obligaciones
        - entrada
        - salida
    fr:
      title: États de membre définis
      whyItMatters: >-
        Les droits et obligations dispersés dans plusieurs documents finissent par diverger.
        Rassembler chaque état, ses droits, ses obligations et ses transitions dans un seul tableau
        rend le système de membres vérifiable d'un coup d'œil — tu peux voir chaque porte d'entrée
        et de sortie de la communauté, et ce que chacune accorde. Si deux documents se contredisent,
        ce registre fait foi.
      whatToDefine: >-
        Définis chaque état de membre que ta communauté reconnaît (par ex. Candidat·e, Membre en
        période d'essai, Membre à part entière, Membre sorti·e). Pour chacun, liste les droits, les
        obligations, la condition d'entrée et la condition de sortie. Les états doivent être
        mutuellement exclusifs — aucune personne ne peut détenir deux états simultanément.
      placeholders:
        - État 1, par ex. Candidat·e
        - droits
        - obligations
        - entrée
        - sortie
        - État 2, par ex. Membre en période d'essai
        - droits
        - obligations
        - entrée
        - sortie
        - État 3, par ex. Membre à part entière
        - droits
        - obligations
        - entrée
        - sortie
        - État 4, par ex. Membre sorti·e
        - droits
        - obligations
        - entrée
        - sortie
    pt-br:
      title: Estados de Associação Definidos
      whyItMatters: >-
        Direitos e obrigações espalhados por vários documentos acabam divergindo. Reunir cada
        estado, seus direitos, suas obrigações e suas transições em uma única tabela torna o sistema
        de associação auditável de relance — você consegue ver cada porta de entrada e de saída da
        comunidade, e o que cada uma concede. Se dois documentos algum dia discordarem, este
        registro é o desempate.
      whatToDefine: >-
        Defina cada estado de associação que sua comunidade reconhece (por exemplo, Candidato,
        Membro em Período de Experiência, Membro Pleno, Membro Egresso). Para cada um, liste
        direitos, obrigações, condição de entrada e condição de saída. Mantenha os estados
        mutuamente exclusivos — nenhuma pessoa pode estar em dois estados ao mesmo tempo.
      placeholders:
        - Estado 1, por exemplo, Candidato

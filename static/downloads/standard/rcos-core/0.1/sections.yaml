      whyItMatters: >-
        If the rules for who decides what live in people's heads, authority becomes whatever the
        loudest or most senior person says it is. A public matrix that binds every decision to a
        domain, body, mechanism, and threshold makes out-of-scope action visible the moment it
        happens — and makes any decision made outside it invalid by construction.

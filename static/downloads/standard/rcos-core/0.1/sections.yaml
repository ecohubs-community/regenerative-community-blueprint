    es:
      title: 'Tipo de Reunión: Gestión de Conflictos'
      whyItMatters: >-
        El trabajo con conflictos tiene reglas que otras reuniones no tienen: confidencialidad,
        selección de Facilitador/a que no depende de la preferencia de las partes, protecciones
        contra represalias y registros restringidos. Usar la plantilla de Operaciones para una
        sesión de conflicto violaría silenciosamente todas estas reglas. Una plantilla dedicada hace
        visible el contenedor diferente desde el primer minuto.
      whatToDefine: >-
        Usa esta plantilla solo para sesiones facilitadas bajo los Pasos 2–4 de la Escalera de
        Resolución de Conflictos. Las reglas de privacidad y selección del Facilitador/a están
        gobernadas por la Capa 4, no por la reunión en sí.

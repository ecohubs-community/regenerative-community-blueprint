  i18n:
    en:
      title: 'Meeting Type: Governance'
      whyItMatters: >-
        If a meeting can both discuss and decide, whoever is in the room that day gets to decide —
        regardless of quorum or authority rules. Keeping deliberation separate from the binding vote
        preserves the integrity of the Decision Matrix and ensures absent members still get a vote.
      whatToDefine: >-
        This meeting deliberates on active proposals during their deliberation period. The binding
        decision is made via the governance process per the Decision Matrix.
      placeholders:
        - all Full Members invited; proposer must be present.
        - who may observe.
        - as needed during deliberation periods.
        - e.g. 60 minutes maximum.
        - facilitator role.
        - duration
        - >-
          duration — proposer presents the proposal: what it changes, why, and alternatives
          considered.
        - duration — factual questions only; no advocacy yet.
        - duration.
        - duration — facilitator summarises; confirms vote timeline.
        - link to proposal
        - Strategic / Constitutional
        - vote mechanism + threshold
        - Passed / Rejected / Tabled
    de:
      title: 'Sitzungstyp: Governance'
      whyItMatters: >-
        Wenn eine Sitzung gleichzeitig diskutieren und entscheiden kann, bestimmen diejenigen, die
        gerade im Raum sind — ungeachtet der Quorum- oder Befugnisregeln. Die Trennung von Beratung
        und verbindlicher Abstimmung wahrt die Integrität der Entscheidungsmatrix und stellt sicher,
        dass abwesende Mitglieder trotzdem mitabstimmen können.
      whatToDefine: >-
        Diese Sitzung berät über aktive Vorschläge während ihrer Beratungsphase. Die verbindliche
        Entscheidung erfolgt über den Governance-Prozess gemäß der Entscheidungsmatrix.
      placeholders:
        - alle Vollmitglieder eingeladen; Antragsteller:in muss anwesend sein.

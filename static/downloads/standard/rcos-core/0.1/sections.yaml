- key: operations-manual.core-operational-processes
  artifact: operations-manual
  order: 0
  clauseRefs:
    - 7.3.4
    - 7.7.2
    - 7.6.3
  i18n:
    en:
      title: Core Operational Processes
      whyItMatters: >-
        If a process only lives in one person's head, the community depends on that person showing
        up — forever. Writing the critical processes down, with named owners, is what converts
        private knowledge into a community asset that survives handovers, absences, and exits.
      whatToDefine: >-
        For every recurring critical process (onboarding, exit, proposal publication, contribution
        recording, meeting cadence, treasury management, platform access review), name an owner and
        a brief description.
      placeholders:
        - Member onboarding
        - role
        - see Onboarding Protocol (Layer 1)
        - Member exit
        - role
        - see Exit & Separation Protocol (Layer 1)
        - Proposal publication
        - role
        - see Governance Protocol (Layer 2)
        - Contribution recording
        - role
        - see Internal Economy Protocol (Layer 3)
        - Recurring meeting
        - facilitator
        - agenda publication; notes; action tracking
        - Treasury management
        - finance steward
        - see Treasury Ruleset (Layer 3)
        - Platform access review
        - infrastructure steward
        - review cadence; access revocation for exited members
    de:
      title: Zentrale Betriebsprozesse
      whyItMatters: >-
        Wenn ein Prozess nur im Kopf einer einzigen Person existiert, hängt die Gemeinschaft davon
        ab, dass diese Person immer verfügbar ist — für immer. Kritische Prozesse schriftlich
        festzuhalten, mit benannten Verantwortlichen, verwandelt privates Wissen in ein
        Gemeinschaftsgut, das Übergaben, Abwesenheiten und Austritte übersteht.
      whatToDefine: >-
        Benennt für jeden wiederkehrenden kritischen Prozess (Onboarding, Austritt,
        Antragsveröffentlichung, Beitragserfassung, Sitzungsrhythmus, Kassenverwaltung, Überprüfung
        von Plattformzugängen) eine verantwortliche Person und eine kurze Beschreibung.
      placeholders:
        - Mitglieder-Onboarding
        - Rolle
        - siehe Onboarding-Protokoll (Schicht 1)
        - Mitgliederaustritt
        - Rolle
        - siehe Austritts- & Trennungsprotokoll (Schicht 1)
        - Antragsveröffentlichung
        - Rolle
        - siehe Governance-Protokoll (Schicht 2)
        - Beitragserfassung
        - Rolle
        - siehe Binnenwirtschaftsprotokoll (Schicht 3)
        - Regelmäßige Sitzung
        - Moderation
        - Agenda-Veröffentlichung; Protokoll; Aufgabennachverfolgung
        - Kassenverwaltung
        - Finanzverantwortliche:r
        - siehe Kassenordnung (Schicht 3)
        - Überprüfung der Plattformzugänge
        - Infrastrukturverantwortliche:r
        - Prüfrhythmus; Zugangsentzug für ausgetretene Mitglieder
    es:
      title: Procesos Operativos Fundamentales
      whyItMatters: >-
        Si un proceso solo existe en la cabeza de una persona, la comunidad depende de que esa
        persona aparezca — para siempre. Documentar los procesos críticos por escrito, con
        responsables nombrados, es lo que convierte el conocimiento privado en un activo comunitario
        que sobrevive a traspasos, ausencias y salidas.
      whatToDefine: >-
        Para cada proceso crítico recurrente (incorporación, salida, publicación de propuestas,
        registro de contribuciones, cadencia de reuniones, gestión de tesorería, revisión de accesos
        a plataformas), nombra un responsable y una breve descripción.
      placeholders:
        - Incorporación de miembros
        - rol
        - ver Protocolo de Incorporación (Capa 1)
        - Salida de miembros
        - rol
        - ver Protocolo de Salida y Separación (Capa 1)
        - Publicación de propuestas
        - rol
        - ver Protocolo de Gobernanza (Capa 2)
        - Registro de contribuciones
        - rol
        - ver Protocolo de Economía Interna (Capa 3)
        - Reunión recurrente
        - facilitador/a
        - publicación de agenda; actas; seguimiento de acciones
        - Gestión de tesorería
        - administrador/a de finanzas
        - ver Reglamento de Tesorería (Capa 3)
        - Revisión de accesos a plataformas
        - administrador/a de infraestructura
        - cadencia de revisión; revocación de accesos para miembros que han salido
    fr:
      title: Processus opérationnels essentiels
      whyItMatters: >-
        Si un processus n'existe que dans la tête d'une seule personne, la communauté dépend de la
        présence de cette personne — indéfiniment. Mettre par écrit les processus critiques, avec
        des responsables nommés, c'est ce qui transforme un savoir privé en un bien commun capable
        de survivre aux passations, aux absences et aux départs.
      whatToDefine: >-
        Pour chaque processus critique récurrent (intégration, départ, publication de propositions,
        enregistrement des contributions, cadence des réunions, gestion de la trésorerie, revue des
        accès aux plateformes), nomme un·e responsable et fournis une brève description.
      placeholders:
        - Intégration des membres
        - rôle
        - voir Protocole d'intégration (Couche 1)
        - Départ des membres

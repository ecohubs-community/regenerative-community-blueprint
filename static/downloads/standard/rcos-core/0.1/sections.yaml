- key: membership-agreement.membership-state-on-signing
  artifact: membership-agreement
  order: 0
  clauseRefs:
    - 3.1.2
    - 3.1.4
  i18n:
    en:
      title: Membership State on Signing
      whyItMatters: >-
        Membership is not a single binary. A person joining must know exactly which state they are
        entering — Trial or Full — because the state determines what they can do and what is
        expected of them. Naming it at the moment of consent prevents ambiguity later about what
        they actually signed up for.
      whatToDefine: >-
        State which membership state(s) a new member enters at signing (e.g. Trial Member, Full
        Member, or any custom state defined in your Membership State Registry).
      placeholders:
        - >-
          Membership state assigned at signing — e.g. Trial Member on application approval; Full
          Member on onboarding completion.
    de:
      title: Mitgliedschaftsstatus bei Unterzeichnung
      whyItMatters: >-
        Mitgliedschaft ist kein einfaches Ja oder Nein. Eine beitretende Person muss genau wissen,
        in welchen Status sie eintritt — Probe oder Voll — denn der Status bestimmt, was sie tun
        kann und was von ihr erwartet wird. Den Status im Moment der Zustimmung zu benennen,
        verhindert spätere Unklarheiten darüber, wofür sie sich eigentlich angemeldet hat.
      whatToDefine: >-
        Gib an, in welchen Mitgliedschaftsstatus ein neues Mitglied bei Unterzeichnung eintritt (z.
        B. Probemitglied, Vollmitglied oder ein anderer im Mitgliedschaftsstatus-Register
        definierter Status).
      placeholders:
        - >-
          Mitgliedschaftsstatus bei Unterzeichnung — z. B. Probemitglied nach Genehmigung der
          Bewerbung; Vollmitglied nach Abschluss des Onboardings.
    es:
      title: Estado de Membresía al Firmar
      whyItMatters: >-
        La membresía no es un simple binario. Una persona que se incorpora debe saber exactamente en
        qué estado está entrando — Prueba o Pleno — porque el estado determina lo que puede hacer y
        lo que se espera de ella. Nombrarlo en el momento del consentimiento evita ambigüedades
        posteriores sobre lo que realmente aceptó.
      whatToDefine: >-
        Indica qué estado(s) de membresía recibe un nuevo miembro al firmar (p. ej., Miembro en
        Prueba, Miembro Pleno, o cualquier estado personalizado definido en tu Registro de Estados
        de Membresía).
      placeholders:
        - >-
          Estado de membresía asignado al firmar — p. ej., Miembro en Prueba tras la aprobación de
          la solicitud; Miembro Pleno tras completar la incorporación.
    fr:
      title: État d'adhésion à la signature
      whyItMatters: >-
        L'adhésion n'est pas un simple binaire. Une personne qui rejoint la communauté doit savoir
        exactement dans quel état elle entre — Essai ou Plein — car cet état détermine ce qu'elle
        peut faire et ce qu'on attend d'elle. Le nommer au moment du consentement évite toute
        ambiguïté ultérieure sur ce à quoi elle s'est réellement engagée.
      whatToDefine: >-
        Indique quel(s) état(s) d'adhésion un nouveau membre obtient à la signature (par ex. Membre
        à l'essai, Membre à part entière, ou tout état personnalisé défini dans ton Registre des
        états d'adhésion).
      placeholders:
        - >-
          État d'adhésion attribué à la signature — par ex. Membre à l'essai après approbation de la
          candidature ; Membre à part entière après achèvement de l'intégration.
    pt-br:
      title: Estado de Associação na Assinatura
      whyItMatters: >-
        A associação não é um único binário. Uma pessoa que está entrando precisa saber exatamente
        em qual estado está ingressando — Experimental ou Pleno — porque o estado determina o que
        ela pode fazer e o que se espera dela. Nomeá-lo no momento do consentimento evita
        ambiguidade posterior sobre aquilo com que ela realmente concordou.
      whatToDefine: >-
        Indique em qual(is) estado(s) de associação um novo membro entra no momento da assinatura
        (por exemplo, Membro Experimental, Membro Pleno ou qualquer estado personalizado definido no
        Registro de Estados de Associação).
      placeholders:
        - >-
          Estado de associação atribuído na assinatura — por exemplo, Membro Experimental na
          aprovação da candidatura; Membro Pleno na conclusão da integração.
  ownsClauses: []
- key: membership-agreement.member-rights
  artifact: membership-agreement
  order: 1
  clauseRefs:
    - 3.4.1
    - 3.4.3
    - 3.4.4
  i18n:
    en:
      title: Member Rights
      whyItMatters: >-
        Rights that are not written down are rights that can be quietly withdrawn. Enumerating them
        makes the community's commitments legible, enforceable, and symmetrical with the obligations
        members are asked to carry. Without this list, obligations become open-ended demands with no
        reciprocal protection.
      whatToDefine: >-
        List concrete rights granted to each membership state. Reference the Decision Matrix (Layer
        2) for voting rights, the Role Registry (Layer 5) for role eligibility, and Layer 4 for
        due-process guarantees.
      placeholders:
        - Right 1, e.g. the right to vote on all decisions as defined in the Decision Matrix.
        - Right 2, e.g. the right to access all member-only channels, calls, and community records.
        - Right 3, e.g. the right to hold roles as defined in the Role Registry.
        - Right 4, e.g. the right to earn recognition through recognized contributions.
        - Right 5, e.g. the right to propose changes through the governance process.
        - >-
          Right 6, e.g. the right to raise a conflict through the Conflict Resolution Ladder without
          retaliation.
        - Right 7, e.g. the right to exit the community voluntarily at any time.
        - >-
          Right 8, e.g. the right to due process before any forced exit, suspension, or access
          restriction.
    de:
      title: Rechte der Mitglieder
      whyItMatters: >-
        Rechte, die nicht schriftlich festgehalten sind, können stillschweigend entzogen werden. Sie
        aufzuzählen macht die Verpflichtungen der Gemeinschaft lesbar, durchsetzbar und symmetrisch
        zu den Pflichten, die den Mitgliedern auferlegt werden. Ohne diese Liste werden Pflichten zu
        unbegrenzten Forderungen ohne gegenseitigen Schutz.
      whatToDefine: >-
        Liste konkrete Rechte auf, die jedem Mitgliedschaftsstatus gewährt werden. Verweise auf die
        Entscheidungsmatrix (Schicht 2) für Stimmrechte, das Rollenregister (Schicht 5) für
        Rollenberechtigung und Schicht 4 für Verfahrensgarantien.
      placeholders:
        - >-
          Recht 1, z. B. das Recht, bei allen Entscheidungen gemäß der Entscheidungsmatrix
          abzustimmen.
        - >-
          Recht 2, z. B. das Recht auf Zugang zu allen mitgliederexklusiven Kanälen, Calls und
          Gemeinschaftsunterlagen.
        - Recht 3, z. B. das Recht, Rollen gemäß dem Rollenregister zu übernehmen.
        - Recht 4, z. B. das Recht, Anerkennung durch anerkannte Beiträge zu erhalten.
        - Recht 5, z. B. das Recht, Änderungen über den Governance-Prozess vorzuschlagen.
        - >-
          Recht 6, z. B. das Recht, einen Konflikt über die Konfliktlösungsstufen ohne Vergeltung
          anzusprechen.
        - Recht 7, z. B. das Recht, die Gemeinschaft jederzeit freiwillig zu verlassen.
        - >-
          Recht 8, z. B. das Recht auf ein ordentliches Verfahren vor jedem erzwungenen Austritt,
          jeder Suspendierung oder Zugangsbeschränkung.
    es:
      title: Derechos del Miembro
      whyItMatters: >-
        Los derechos que no están escritos son derechos que pueden retirarse en silencio.
        Enumerarlos hace que los compromisos de la comunidad sean legibles, exigibles y simétricos
        con las obligaciones que se pide a los miembros que asuman. Sin esta lista, las obligaciones
        se convierten en demandas abiertas sin protección recíproca.
      whatToDefine: >-
        Enumera los derechos concretos otorgados a cada estado de membresía. Consulta la Matriz de
        Decisiones (Capa 2) para los derechos de voto, el Registro de Roles (Capa 5) para la
        elegibilidad de roles, y la Capa 4 para las garantías de debido proceso.
      placeholders:
        - >-
          Derecho 1, p. ej., el derecho a votar en todas las decisiones según lo definido en la
          Matriz de Decisiones.
        - >-
          Derecho 2, p. ej., el derecho a acceder a todos los canales, llamadas y registros
          exclusivos para miembros.
        - Derecho 3, p. ej., el derecho a ocupar roles según lo definido en el Registro de Roles.
        - >-
          Derecho 4, p. ej., el derecho a obtener reconocimiento a través de contribuciones
          reconocidas.
        - Derecho 5, p. ej., el derecho a proponer cambios a través del proceso de gobernanza.
        - >-
          Derecho 6, p. ej., el derecho a plantear un conflicto a través de la Escalera de
          Resolución de Conflictos sin represalias.
        - >-
          Derecho 7, p. ej., el derecho a salir de la comunidad voluntariamente en cualquier
          momento.
        - >-
          Derecho 8, p. ej., el derecho al debido proceso antes de cualquier salida forzada,
          suspensión o restricción de acceso.
    fr:
      title: Droits des membres
      whyItMatters: >-
        Les droits qui ne sont pas écrits sont des droits qui peuvent être discrètement retirés. Les
        énumérer rend les engagements de la communauté lisibles, opposables et symétriques avec les
        obligations que les membres sont invités à assumer. Sans cette liste, les obligations
        deviennent des exigences ouvertes sans protection réciproque.
      whatToDefine: >-
        Liste les droits concrets accordés à chaque état d'adhésion. Réfère-toi à la Matrice de
        décision (Couche 2) pour les droits de vote, au Registre des rôles (Couche 5) pour
        l'éligibilité aux rôles, et à la Couche 4 pour les garanties de procédure régulière.
      placeholders:
        - >-
          Droit 1, par ex. le droit de voter sur toutes les décisions telles que définies dans la
          Matrice de décision.
        - >-
          Droit 2, par ex. le droit d'accéder à tous les canaux, appels et documents réservés aux
          membres.
        - Droit 3, par ex. le droit d'occuper des rôles tels que définis dans le Registre des rôles.
        - Droit 4, par ex. le droit d'obtenir une reconnaissance via des contributions reconnues.
        - Droit 5, par ex. le droit de proposer des changements via le processus de gouvernance.
        - >-
          Droit 6, par ex. le droit de signaler un conflit via l'Échelle de résolution des conflits
          sans représailles.
        - Droit 7, par ex. le droit de quitter la communauté volontairement à tout moment.
        - >-
          Droit 8, par ex. le droit à une procédure régulière avant toute exclusion forcée,
          suspension ou restriction d'accès.
    pt-br:
      title: Direitos dos Membros
      whyItMatters: >-
        Direitos que não estão escritos são direitos que podem ser silenciosamente retirados.
        Enumerá-los torna os compromissos da comunidade legíveis, exigíveis e simétricos em relação
        às obrigações que se pede aos membros que carreguem. Sem essa lista, as obrigações se tornam
        exigências em aberto, sem proteção recíproca.
      whatToDefine: >-
        Liste direitos concretos concedidos a cada estado de associação. Faça referência à Matriz de
        Decisão (Camada 2) para os direitos de voto, ao Registro de Papéis (Camada 5) para a
        elegibilidade a papéis e à Camada 4 para as garantias de devido processo.
      placeholders:
        - >-
          Direito 1, por exemplo, o direito de votar em todas as decisões definidas na Matriz de
          Decisão.
        - >-
          Direito 2, por exemplo, o direito de acessar todos os canais exclusivos para membros,
          chamadas e registros da comunidade.
        - >-
          Direito 3, por exemplo, o direito de ocupar papéis conforme definido no Registro de
          Papéis.
        - >-
          Direito 4, por exemplo, o direito de obter reconhecimento por meio de contribuições
          reconhecidas.
        - Direito 5, por exemplo, o direito de propor mudanças por meio do processo de governança.
        - >-
          Direito 6, por exemplo, o direito de apresentar um conflito por meio da Escada de
          Resolução de Conflitos sem sofrer retaliação.
        - >-
          Direito 7, por exemplo, o direito de sair da comunidade voluntariamente a qualquer
          momento.
        - >-
          Direito 8, por exemplo, o direito ao devido processo antes de qualquer saída forçada,
          suspensão ou restrição de acesso.
  ownsClauses:
    - 3.4.1
    - 3.4.3
- key: membership-agreement.member-obligations
  artifact: membership-agreement
  order: 2
  clauseRefs:
    - 3.4.2
    - 3.4.4
    - 3.4.5
  i18n:
    en:
      title: Member Obligations
      whyItMatters: >-
        Open-ended obligations are how communities slide into exploitation — "contribute more," "be
        available," "show up" with no defined limit. Listing obligations discretely, and tying each
        one to a corresponding right, keeps the ask bounded and contestable. A member must always be
        able to tell whether they are meeting the agreement or being asked for something beyond it.
      whatToDefine: >-
        List concrete, bounded obligations. Each obligation must be testable: a member must be able
        to know whether they are meeting it. Avoid vague duties.
      placeholders:
        - Obligation 1, e.g. adhere to all Layer 0 identity constraints and invariants at all times.
        - >-
          Obligation 2, e.g. contribute to the community in at least one recognized category per
          defined period.
        - >-
          Obligation 3, e.g. participate in conflict resolution processes when named as a party or
          requested as a witness.
        - Obligation 4, e.g. complete onboarding before exercising Full Member rights.
        - Obligation 5, e.g. notify the community before extended absence.
        - >-
          Obligation 6, e.g. not misrepresent the community, its members, or its governance
          externally.
        - >-
          Obligation 7, e.g. not exercise authority beyond what is explicitly assigned through the
          governance system.
    de:
      title: Pflichten der Mitglieder
      whyItMatters: >-
        Unbegrenzte Pflichten sind der Weg, auf dem Gemeinschaften in Ausbeutung abgleiten — „trag
        mehr bei", „sei verfügbar", „sei da" ohne definierte Grenze. Pflichten einzeln aufzulisten
        und jede mit einem entsprechenden Recht zu verknüpfen, hält die Anforderungen begrenzt und
        anfechtbar. Ein Mitglied muss immer erkennen können, ob es die Vereinbarung erfüllt oder ob
        etwas verlangt wird, das darüber hinausgeht.
      whatToDefine: >-
        Liste konkrete, begrenzte Pflichten auf. Jede Pflicht muss überprüfbar sein: Ein Mitglied
        muss erkennen können, ob es sie erfüllt. Vermeide vage Anforderungen.
      placeholders:
        - >-
          Pflicht 1, z. B. alle Identitätsvorgaben und Invarianten der Schicht 0 jederzeit
          einhalten.
        - >-
          Pflicht 2, z. B. in mindestens einer anerkannten Kategorie pro definiertem Zeitraum zur
          Gemeinschaft beitragen.
        - >-
          Pflicht 3, z. B. an Konfliktlösungsverfahren teilnehmen, wenn als Partei benannt oder als
          Zeuge angefragt.
        - Pflicht 4, z. B. das Onboarding abschließen, bevor Vollmitgliedsrechte ausgeübt werden.
        - Pflicht 5, z. B. die Gemeinschaft vor längerer Abwesenheit benachrichtigen.
        - >-
          Pflicht 6, z. B. die Gemeinschaft, ihre Mitglieder oder ihre Governance nach außen nicht
          falsch darstellen.
        - >-
          Pflicht 7, z. B. keine Befugnisse ausüben, die nicht ausdrücklich durch das
          Governance-System zugewiesen wurden.
    es:
      title: Obligaciones del Miembro
      whyItMatters: >-
        Las obligaciones abiertas son la vía por la que las comunidades caen en la explotación —
        "contribuye más", "estate disponible", "preséntate" sin límite definido. Enumerar las
        obligaciones de forma discreta, y vincular cada una a un derecho correspondiente, mantiene
        lo que se pide acotado e impugnable. Un miembro siempre debe poder saber si está cumpliendo
        el acuerdo o si se le está pidiendo algo que lo excede.
      whatToDefine: >-
        Enumera obligaciones concretas y acotadas. Cada obligación debe ser verificable: un miembro
        debe poder saber si la está cumpliendo. Evita deberes vagos.
      placeholders:
        - >-
          Obligación 1, p. ej., cumplir en todo momento con todas las restricciones de identidad e
          invariantes de la Capa 0.
        - >-
          Obligación 2, p. ej., contribuir a la comunidad en al menos una categoría reconocida por
          período definido.
        - >-
          Obligación 3, p. ej., participar en los procesos de resolución de conflictos cuando sea
          nombrado como parte o solicitado como testigo.
        - >-
          Obligación 4, p. ej., completar la incorporación antes de ejercer los derechos de Miembro
          Pleno.
        - Obligación 5, p. ej., notificar a la comunidad antes de una ausencia prolongada.
        - >-
          Obligación 6, p. ej., no tergiversar a la comunidad, sus miembros o su gobernanza ante el
          exterior.
        - >-
          Obligación 7, p. ej., no ejercer autoridad más allá de lo explícitamente asignado a través
          del sistema de gobernanza.
    fr:
      title: Obligations des membres
      whyItMatters: >-
        Les obligations ouvertes sont le mécanisme par lequel les communautés glissent vers
        l'exploitation — « contribue plus », « sois disponible », « sois présent·e » sans limite
        définie. Lister les obligations de manière discrète, et associer chacune à un droit
        correspondant, maintient la demande bornée et contestable. Un membre doit toujours pouvoir
        déterminer s'il respecte l'accord ou si on lui demande quelque chose qui va au-delà.
      whatToDefine: >-
        Liste des obligations concrètes et bornées. Chaque obligation doit être vérifiable : un
        membre doit pouvoir savoir s'il la remplit. Évite les devoirs vagues.
      placeholders:
        - >-
          Obligation 1, par ex. respecter en permanence toutes les contraintes d'identité et
          invariants de la Couche 0.
        - >-
          Obligation 2, par ex. contribuer à la communauté dans au moins une catégorie reconnue par
          période définie.
        - >-
          Obligation 3, par ex. participer aux processus de résolution des conflits lorsqu'on est
          nommé comme partie ou sollicité comme témoin.
        - >-
          Obligation 4, par ex. terminer l'intégration avant d'exercer les droits de Membre à part
          entière.
        - Obligation 5, par ex. prévenir la communauté avant une absence prolongée.
        - >-
          Obligation 6, par ex. ne pas déformer l'image de la communauté, de ses membres ou de sa
          gouvernance à l'extérieur.
        - >-
          Obligation 7, par ex. ne pas exercer d'autorité au-delà de ce qui est explicitement
          attribué par le système de gouvernance.
    pt-br:
      title: Obrigações dos Membros
      whyItMatters: >-
        Obrigações em aberto são o caminho pelo qual as comunidades escorregam para a exploração —
        "contribua mais", "esteja disponível", "apareça" sem nenhum limite definido. Listar as
        obrigações de forma discreta, e amarrar cada uma a um direito correspondente, mantém o
        pedido delimitado e contestável. Um membro precisa sempre conseguir distinguir se está
        cumprindo o acordo ou se está sendo demandado para algo além dele.
      whatToDefine: >-
        Liste obrigações concretas e delimitadas. Cada obrigação deve ser verificável: um membro
        precisa conseguir saber se está cumprindo-a. Evite deveres vagos.
      placeholders:
        - >-
          Obrigação 1, por exemplo, aderir a todas as restrições e invariantes de identidade da
          Camada 0 em todos os momentos.
        - >-
          Obrigação 2, por exemplo, contribuir para a comunidade em pelo menos uma categoria
          reconhecida por período definido.
        - >-
          Obrigação 3, por exemplo, participar dos processos de resolução de conflitos quando
          nomeado como parte ou solicitado como testemunha.
        - >-
          Obrigação 4, por exemplo, concluir a integração antes de exercer os direitos de Membro
          Pleno.
        - Obrigação 5, por exemplo, notificar a comunidade antes de uma ausência prolongada.
        - >-
          Obrigação 6, por exemplo, não deturpar externamente a comunidade, seus membros ou sua
          governança.
        - >-
          Obrigação 7, por exemplo, não exercer autoridade além daquilo que foi explicitamente
          atribuído pelo sistema de governança.
  ownsClauses:
    - 3.4.2
    - 3.4.4
    - 3.4.5
- key: membership-agreement.participation-and-contribution-expectations
  artifact: membership-agreement
  order: 3
  clauseRefs:
    - 3.5.1
    - 3.5.2
    - 3.5.3
    - 3.5.4
  i18n:
    en:
      title: Participation and Contribution Expectations
      whyItMatters: >-
        "Active member" means nothing without a threshold. A defined minimum — in time, category,
        and cadence — turns participation from a feeling into a fact, so nobody has to guess whether
        they are in good standing, and nobody can be accused of drifting without evidence. It also
        makes the line between a genuine absence and quiet abandonment visible early enough to act
        on.
      whatToDefine: >-
        State a measurable minimum (frequency × category), substitution and absence rules, and the
        trigger that moves a non-participating member into a Layer 4 process.
      placeholders:
        - e.g. at least one recognized contribution per 6 months, in any recognized category.
        - reference the Internal Economy Protocol (Layer 3).
        - >-
          e.g. a member may delegate a specific task but remains responsible for meeting overall
          contribution expectations.
        - >-
          e.g. notification required before absences longer than X months; expectations paused for
          the notified period up to a maximum.
        - >-
          e.g. absence of recognized contribution for X consecutive months without prior notice
          triggers an accountability check (Layer 4).
    de:
      title: Erwartungen an Teilnahme und Beitrag
      whyItMatters: >-
        „Aktives Mitglied" bedeutet nichts ohne einen Schwellenwert. Ein definiertes Minimum — in
        Zeit, Kategorie und Häufigkeit — macht Teilnahme von einem Gefühl zu einer Tatsache, sodass
        niemand raten muss, ob er in gutem Ansehen steht, und niemand ohne Beweise beschuldigt
        werden kann, sich zurückgezogen zu haben. Es macht außerdem die Grenze zwischen einer echten
        Abwesenheit und stillem Rückzug früh genug sichtbar, um darauf reagieren zu können.
      whatToDefine: >-
        Gib ein messbares Minimum an (Häufigkeit × Kategorie), Vertretungs- und Abwesenheitsregeln
        sowie den Auslöser, der ein nicht teilnehmendes Mitglied in einen Ebene-4-Prozess überführt.
      placeholders:
        - >-
          z. B. mindestens ein anerkannter Beitrag pro 6 Monate, in einer beliebigen anerkannten
          Kategorie.
        - Verweis auf das Binnenwirtschaftsprotokoll (Schicht 3).
        - >-
          z. B. ein Mitglied kann eine bestimmte Aufgabe delegieren, bleibt aber für die Erfüllung
          der Gesamtbeitragserwartungen verantwortlich.
        - >-
          z. B. Benachrichtigung erforderlich bei Abwesenheiten länger als X Monate; Erwartungen
          werden für den gemeldeten Zeitraum bis zu einem Maximum pausiert.
        - >-
          z. B. Fehlen anerkannter Beiträge über X aufeinanderfolgende Monate ohne vorherige
          Mitteilung löst eine Rechenschaftsprüfung (Schicht 4) aus.
    es:
      title: Expectativas de Participación y Contribución
      whyItMatters: >-
        "Miembro activo" no significa nada sin un umbral. Un mínimo definido — en tiempo, categoría
        y cadencia — convierte la participación de una sensación en un hecho, de modo que nadie
        tenga que adivinar si está al día y nadie pueda ser acusado de alejarse sin evidencia.
        También hace visible la línea entre una ausencia genuina y un abandono silencioso lo
        suficientemente pronto como para actuar.
      whatToDefine: >-
        Establece un mínimo medible (frecuencia × categoría), reglas de sustitución y ausencia, y el
        detonante que mueve a un miembro no participante a un proceso de la Capa 4.
      placeholders:
        - >-
          p. ej., al menos una contribución reconocida cada 6 meses, en cualquier categoría
          reconocida.
        - hacer referencia al Protocolo de Economía Interna (Capa 3).
        - >-
          p. ej., un miembro puede delegar una tarea específica pero sigue siendo responsable de
          cumplir las expectativas generales de contribución.
        - >-
          p. ej., se requiere notificación antes de ausencias superiores a X meses; las expectativas
          se pausan durante el período notificado hasta un máximo.
        - >-
          p. ej., la ausencia de contribución reconocida durante X meses consecutivos sin aviso
          previo activa una verificación de rendición de cuentas (Capa 4).
    fr:
      title: Attentes en matière de participation et de contribution
      whyItMatters: >-
        « Membre actif » ne veut rien dire sans seuil. Un minimum défini — en temps, en catégorie et
        en cadence — transforme la participation d'un ressenti en un fait, de sorte que personne n'a
        à deviner s'il est en règle, et personne ne peut être accusé de dérive sans preuves. Cela
        rend aussi la frontière entre une absence réelle et un abandon silencieux visible assez tôt
        pour agir.
      whatToDefine: >-
        Indique un minimum mesurable (fréquence × catégorie), les règles de substitution et
        d'absence, et le déclencheur qui oriente un membre non participant vers un processus de
        Couche 4.
      placeholders:
        - >-
          par ex. au moins une contribution reconnue par période de 6 mois, dans n'importe quelle
          catégorie reconnue.
        - référence au Protocole d'économie interne (Couche 3).
        - >-
          par ex. un membre peut déléguer une tâche spécifique mais reste responsable du respect des
          attentes globales de contribution.
        - >-
          par ex. notification requise avant toute absence de plus de X mois ; les attentes sont
          suspendues pour la période notifiée, jusqu'à un maximum.
        - >-
          par ex. l'absence de contribution reconnue pendant X mois consécutifs sans préavis
          déclenche un contrôle de redevabilité (Couche 4).
    pt-br:
      title: Expectativas de Participação e Contribuição
      whyItMatters: >-
        "Membro ativo" não significa nada sem um limite. Um mínimo definido — em tempo, categoria e
        cadência — transforma a participação de uma sensação em um fato, de modo que ninguém precisa
        adivinhar se está em boa situação, e ninguém pode ser acusado de afastamento sem evidências.
        Isso também torna visível, cedo o suficiente para se agir, a linha entre uma ausência
        genuína e um abandono silencioso.
      whatToDefine: >-
        Indique um mínimo mensurável (frequência × categoria), regras de substituição e ausência, e
        o gatilho que move um membro não participante para um processo da Camada 4.
      placeholders:
        - >-
          por exemplo, pelo menos uma contribuição reconhecida a cada 6 meses, em qualquer categoria
          reconhecida.
        - faça referência ao Protocolo de Economia Interna (Camada 3).
        - >-
          por exemplo, um membro pode delegar uma tarefa específica, mas permanece responsável por
          cumprir as expectativas gerais de contribuição.
        - >-
          por exemplo, notificação obrigatória antes de ausências superiores a X meses; expectativas
          suspensas pelo período notificado até um limite máximo.
        - >-
          por exemplo, ausência de contribuição reconhecida por X meses consecutivos sem aviso
          prévio aciona uma verificação de responsabilização (Camada 4).
  ownsClauses:
    - 3.5.1
    - 3.5.2
    - 3.5.3
    - 3.5.4
- key: membership-agreement.due-process-reference
  artifact: membership-agreement
  order: 4
  clauseRefs:
    - 3.6.3
  i18n:
    en:
      title: Due Process Reference
      whyItMatters: >-
        The Membership Agreement is the one document every member actually reads and consents to.
        Naming due process here — not only in Layer 4 — guarantees that no member can be removed or
        restricted under a rule they were not shown when they joined. It closes the gap between what
        the community promises and what it can do.
      whatToDefine: >-
        Reference the Conflict Resolution Ladder (Layer 4) and the Exit & Separation Protocol so
        that any member reading the Membership Agreement knows where the procedural protections
        live.
      placeholders: []
    de:
      title: Verweis auf ordentliches Verfahren
      whyItMatters: >-
        Die Mitgliedschaftsvereinbarung ist das eine Dokument, das jedes Mitglied tatsächlich liest
        und dem es zustimmt. Das ordentliche Verfahren hier zu benennen — nicht nur in Schicht 4 —
        stellt sicher, dass kein Mitglied nach einer Regel entfernt oder eingeschränkt werden kann,
        die ihm beim Beitritt nicht gezeigt wurde. Es schließt die Lücke zwischen dem, was die
        Gemeinschaft verspricht, und dem, was sie tun kann.
      whatToDefine: >-
        Verweise auf die Konfliktlösungsstufen (Schicht 4) und das Austritts- und
        Trennungsprotokoll, damit jedes Mitglied, das die Mitgliedschaftsvereinbarung liest, weiß,
        wo die Verfahrensgarantien zu finden sind.
      placeholders: []
    es:
      title: Referencia al Debido Proceso
      whyItMatters: >-
        El Acuerdo de Membresía es el único documento que cada miembro realmente lee y al que da su
        consentimiento. Nombrar el debido proceso aquí — no solo en la Capa 4 — garantiza que ningún
        miembro pueda ser expulsado o restringido bajo una regla que no le fue mostrada cuando se
        incorporó. Cierra la brecha entre lo que la comunidad promete y lo que puede hacer.
      whatToDefine: >-
        Haz referencia a la Escalera de Resolución de Conflictos (Capa 4) y al Protocolo de Salida y
        Separación para que cualquier miembro que lea el Acuerdo de Membresía sepa dónde residen las
        protecciones procedimentales.
      placeholders: []
    fr:
      title: Référence à la procédure régulière
      whyItMatters: >-
        L'Accord d'adhésion est le seul document que chaque membre lit réellement et auquel il
        consent. Nommer la procédure régulière ici — et pas seulement dans la Couche 4 — garantit
        qu'aucun membre ne peut être exclu ou restreint en vertu d'une règle qui ne lui a pas été
        présentée au moment de son adhésion. Cela comble l'écart entre ce que la communauté promet
        et ce qu'elle peut faire.
      whatToDefine: >-
        Fais référence à l'Échelle de résolution des conflits (Couche 4) et au Protocole de sortie
        et de séparation afin que tout membre lisant l'Accord d'adhésion sache où se trouvent les
        protections procédurales.
      placeholders: []
    pt-br:
      title: Referência ao Devido Processo
      whyItMatters: >-
        O Acordo de Associação é o único documento que cada membro realmente lê e consente. Nomear o
        devido processo aqui — e não somente na Camada 4 — garante que nenhum membro possa ser
        removido ou restringido sob uma regra que não lhe foi mostrada quando entrou. Isso fecha a
        lacuna entre o que a comunidade promete e o que ela pode fazer.
      whatToDefine: >-
        Faça referência à Escada de Resolução de Conflitos (Camada 4) e ao Protocolo de Saída e
        Separação, para que qualquer membro que leia o Acordo de Associação saiba onde residem as
        proteções procedimentais.
      placeholders: []

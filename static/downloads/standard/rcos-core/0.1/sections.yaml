  i18n:
    en:
      title: 'Meeting Type: Conflict Handling'
      whyItMatters: >-
        Conflict work has rules that other meetings don't: confidentiality, Facilitator selection
        that bypasses party preference, anti-retaliation protections, and restricted records. Using
        the Operations template for a conflict session would quietly violate all of these. A
        dedicated template makes the different container visible from the first minute.
      whatToDefine: >-
        Use this template only for facilitated sessions under Conflict Resolution Ladder Steps 2–4.
        Privacy and Facilitator-selection rules are governed by Layer 4, not by the meeting itself.
      placeholders:
        - typically 60–90 minutes; Facilitator may extend.
        - duration; consent, confidentiality, anti-retaliation, pause rights.
        - uninterrupted; equal time.
        - duration.
        - duration.
        - duration.
        - duration.
        - duration; record per Layer 4 privacy rules.
        - Agreement reached / Escalated to next step / Adjourned
    de:
      title: 'Sitzungstyp: Konfliktbearbeitung'
      whyItMatters: >-
        Konfliktarbeit hat Regeln, die andere Sitzungen nicht haben: Vertraulichkeit,
        Moderator:innen-Auswahl, die die Parteipräferenzen umgeht, Schutz vor Vergeltung und
        eingeschränkte Protokollierung. Die operative Vorlage für eine Konfliktsitzung zu verwenden,
        würde stillschweigend all diese Regeln verletzen. Eine eigene Vorlage macht den
        unterschiedlichen Rahmen ab der ersten Minute sichtbar.
      whatToDefine: >-
        Verwendet diese Vorlage nur für moderierte Sitzungen gemäß den Stufen 2–4 der
        Konfliktlösungsleiter. Datenschutz- und Moderator:innen-Auswahlregeln werden durch Schicht 4
        geregelt, nicht durch die Sitzung selbst.
      placeholders:
        - typischerweise 60–90 Minuten; Moderator:in kann verlängern.
        - Dauer; Einverständnis, Vertraulichkeit, Vergeltungsschutz, Pausenrecht.
        - ohne Unterbrechung; gleiche Redezeit.
        - Dauer.

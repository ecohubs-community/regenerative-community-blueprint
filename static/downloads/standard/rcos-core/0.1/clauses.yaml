  specSection:
    ref: '7.4'
    title: Workload and Capacity Boundaries
  normativity: MUST
  key: l5.workload-and-capacity-boundaries.1
  i18n:
    en: >-
      Time, attention, coordination capacity, and emotional labor MUST be treated as finite and
      limited resources.
    de: >-
      Zeit, Aufmerksamkeit, Koordinationskapazität und emotionale Arbeit MUSS als endliche und
      begrenzte Ressourcen behandelt werden.
    es: >-
      El tiempo, la atención, la capacidad de coordinación y el trabajo emocional DEBEN tratarse
      como recursos finitos y limitados.
    fr: >-
      Le temps, l'attention, la capacité de coordination et le travail émotionnel DOIVENT être
      traités comme des ressources finies et limitées.
    pt-br: >-
      Tempo, atenção, capacidade de coordenação e trabalho emocional DEVEM ser tratados como
      recursos finitos e limitados.
  disposition: defined_by_section
  referencedBy:
    - operations-manual.workload-boundaries
  owner: operations-manual.workload-boundaries
- ref: 7.4.2
  layer: 5
  specSection:
    ref: '7.4'
    title: Workload and Capacity Boundaries
  normativity: MUST
  key: l5.workload-and-capacity-boundaries.2
  i18n:
    en: |-
      The community MUST define explicit workload boundaries, including:
      - Limits on meeting load (frequency, duration, or total time)
      - Limits on role load (number of roles, scope, or expected hours)
      - Expectations for response times and availability (if any)
      - Mechanisms for renegotiation, relief, substitution, or redistribution
    de: |-
      Die Gemeinschaft MUSS explizite Belastungsgrenzen definieren, darunter:
      - Begrenzungen der Sitzungsbelastung (Häufigkeit, Dauer oder Gesamtzeit)
      - Begrenzungen der Rollenbelastung (Anzahl der Rollen, Umfang oder erwartete Stunden)
      - Erwartungen an Reaktionszeiten und Verfügbarkeit (falls vorhanden)
      - Mechanismen für Neuverhandlung, Entlastung, Vertretung oder Umverteilung
    es: |-
      La comunidad DEBE definir límites explícitos de carga de trabajo, incluyendo:
      - Límites a la carga de reuniones (frecuencia, duración o tiempo total)
      - Límites a la carga de roles (número de roles, alcance u horas esperadas)
      - Expectativas de tiempos de respuesta y disponibilidad (si las hay)
      - Mecanismos de renegociación, alivio, sustitución o redistribución
    fr: |-
      La communauté DOIT définir des limites de charge de travail explicites, incluant :
      - Des limites sur la charge de réunions (fréquence, durée ou temps total)
      - Des limites sur la charge de rôles (nombre de rôles, périmètre ou heures attendues)
      - Des attentes concernant les délais de réponse et la disponibilité (le cas échéant)
      - Des mécanismes de renégociation, de relève, de substitution ou de redistribution
    pt-br: |-
      A comunidade DEVE definir limites explícitos de carga de trabalho, incluindo:
      - Limites de carga de reuniões (frequência, duração ou tempo total)
      - Limites de carga de papéis (número de papéis, escopo ou horas esperadas)
      - Expectativas de tempo de resposta e disponibilidade (se houver)
      - Mecanismos de renegociação, alívio, substituição ou redistribuição
  disposition: defined_by_section
  referencedBy:
    - operations-manual.workload-boundaries
  owner: operations-manual.workload-boundaries
- ref: 7.4.3
  layer: 5
  specSection:
    ref: '7.4'

  owner: internal-economy-protocol.accumulation-constraints
- ref: 5.4.3
  layer: 3
  specSection:
    ref: '5.4'
    title: Accumulation Constraints
  normativity: MUST
  key: l3.accumulation-constraints.3
  i18n:
    en: >-
      Economic mechanisms MUST NOT allow members to bypass governance authority boundaries defined
      in Layer 2, including through purchasing influence, creating dependency, or converting
      economic power into informal decision authority.
    de: >-
      Wirtschaftsmechanismen DÜRFEN es Mitgliedern NICHT ermöglichen, die in Schicht 2 definierten
      Governance-Befugnisgrenzen zu umgehen — auch nicht durch den Kauf von Einfluss, das Schaffen
      von Abhängigkeiten oder die Umwandlung von wirtschaftlicher Macht in informelle
      Entscheidungsbefugnis.
    es: >-
      Los mecanismos económicos NO DEBEN permitir que los miembros eludan los límites de autoridad
      de gobernanza definidos en la Capa 2, incluyendo mediante la compra de influencia, la creación
      de dependencia o la conversión de poder económico en autoridad informal de decisión.
    fr: >-
      Les mécanismes économiques NE DOIVENT PAS permettre aux membres de contourner les limites
      d'autorité de gouvernance définies dans la Couche 2, y compris par l'achat d'influence, la
      création de dépendance ou la conversion du pouvoir économique en autorité décisionnelle
      informelle.
    pt-br: >-
      Mecanismos econômicos NÃO DEVEM permitir que membros contornem as fronteiras de autoridade de
      governança definidas na Camada 2, inclusive por meio da compra de influência, da criação de
      dependência ou da conversão de poder econômico em autoridade decisória informal.

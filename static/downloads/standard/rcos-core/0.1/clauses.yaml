  key: l3.explicitness-rules.1
  i18n:
    en: |-
      The following MUST be explicit:
      - Commons vs private classifications
      - Allocation and access rules for shared resources
      - Spending authority limits
      - Transparency rules
      - External income interfaces
    de: |-
      Folgendes MUSS explizit sein:
      - Klassifikation als Gemeingut oder privat
      - Zuweisungs- und Zugangsregeln für geteilte Ressourcen
      - Grenzen der Ausgabenbefugnis
      - Transparenzregeln
      - Externe Einkommensschnittstellen
    es: |-
      Lo siguiente DEBE ser explícito:
      - Clasificaciones de recursos comunes vs privados
      - Reglas de asignación y acceso para recursos compartidos
      - Límites de autoridad de gasto
      - Reglas de transparencia
      - Interfaces de ingresos externos
    fr: |-
      Les éléments suivants DOIVENT être explicites :
      - Les classifications commun vs privé
      - Les règles d'allocation et d'accès aux ressources partagées
      - Les limites d'autorité de dépense
      - Les règles de transparence
      - Les interfaces de revenus externes
    pt-br: |-
      O seguinte DEVE ser explícito:
      - Classificações entre comuns e privados
      - Regras de alocação e acesso para recursos compartilhados
      - Limites de autoridade de gastos
      - Regras de transparência
      - Interfaces externas de receita
  disposition: defined_by_section
  referencedBy:
    - treasury-ruleset.spending-authority
  owner: treasury-ruleset.spending-authority
- ref: 5.7.2
  layer: 3
  specSection:
    ref: '5.7'
    title: Explicitness Rules
  normativity: MAY
  key: l3.explicitness-rules.2
  i18n:
    en: |-
      The following MAY be explicit:
      - Contribution valuation models
      - Internal units (tokens, hours, points)
      - Budget categories and internal accounting structures
    de: |-
      Folgendes KANN explizit sein:
      - Modelle zur Beitragsbewertung

    en: >-
      Shared resources, flows, and obligations MUST be visible to the community by default, with
      only limited and explicit exceptions.
    de: >-
      Geteilte Ressourcen, Flüsse und Verpflichtungen MÜSSEN standardmäßig für die Gemeinschaft
      sichtbar sein, mit nur begrenzten und expliziten Ausnahmen.
    es: >-
      Los recursos compartidos, los flujos y las obligaciones DEBEN ser visibles para la comunidad
      por defecto, con excepciones únicamente limitadas y explícitas.
    fr: >-
      Les ressources partagées, les flux et les obligations DOIVENT être visibles par la communauté
      par défaut, avec uniquement des exceptions limitées et explicites.
    pt-br: >-
      Recursos compartilhados, fluxos e obrigações DEVEM ser visíveis para a comunidade por padrão,
      com apenas exceções limitadas e explícitas.
  disposition: defined_by_section
  referencedBy:
    - treasury-ruleset.transparency-and-reporting
  owner: treasury-ruleset.transparency-and-reporting
- ref: 5.6.2
  layer: 3
  specSection:

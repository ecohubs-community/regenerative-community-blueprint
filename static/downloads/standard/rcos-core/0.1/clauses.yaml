- ref: 6.1.1
  layer: 4
  specSection:
    ref: '6.1'
    title: Conflict Classification
  normativity: MUST
  key: l4.conflict-classification.1
  i18n:
    en: >-
      The community MUST define an explicit conflict classification system that is known,
      accessible, and usable by all members.
    de: >-
      Die Gemeinschaft MUSS ein explizites Konfliktklassifikationssystem definieren, das allen
      Mitgliedern bekannt, zugänglich und nutzbar ist.
    es: >-
      La comunidad DEBE definir un sistema explícito de clasificación de conflictos que sea
      conocido, accesible y utilizable por todos los miembros.
    fr: >-
      La communauté DOIT définir un système explicite de classification des conflits qui soit connu,
      accessible et utilisable par tous les membres.
    pt-br: >-
      A comunidade DEVE definir um sistema explícito de classificação de conflitos que seja
      conhecido, acessível e utilizável por todos os membros.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.1.2
  layer: 4
  specSection:
    ref: '6.1'
    title: Conflict Classification
  normativity: MUST
  key: l4.conflict-classification.2
  i18n:
    en: |-
      At minimum, the classification system MUST include the following classes:
      - Interpersonal conflicts (between individuals)
      - Role-based conflicts (authority, responsibility, or mandate disputes)
      - Structural conflicts (systemic incentives, rules, or resource allocation issues)
      - Ethical or boundary violations (violations of declared norms, scope, or safety boundaries)
    de: >-
      Das Klassifikationssystem MUSS mindestens die folgenden Klassen umfassen:

      - Zwischenmenschliche Konflikte (zwischen Einzelpersonen)

      - Rollenbasierte Konflikte (Streitigkeiten um Autorität, Verantwortung oder Mandat)

      - Strukturelle Konflikte (systemische Anreize, Regeln oder Fragen der Ressourcenverteilung)

      - Ethische oder Grenzverletzungen (Verstöße gegen erklärte Normen, Geltungsbereich oder
      Sicherheitsgrenzen)
    es: >-
      Como mínimo, el sistema de clasificación DEBE incluir las siguientes clases:

      - Conflictos interpersonales (entre individuos)

      - Conflictos de rol (disputas de autoridad, responsabilidad o mandato)

      - Conflictos estructurales (incentivos sistémicos, reglas o problemas de asignación de
      recursos)

      - Violaciones éticas o de límites (violaciones de normas declaradas, alcance o límites de
      seguridad)
    fr: >-
      Au minimum, le système de classification DOIT inclure les classes suivantes :

      - Conflits interpersonnels (entre individus)

      - Conflits liés aux rôles (autorité, responsabilité ou litiges de mandat)

      - Conflits structurels (incitations systémiques, règles ou problèmes d'allocation des
      ressources)

      - Violations éthiques ou de limites (violations des normes déclarées, du périmètre ou des
      limites de sécurité)
    pt-br: >-
      No mínimo, o sistema de classificação DEVE incluir as seguintes classes:

      - Conflitos interpessoais (entre indivíduos)

      - Conflitos baseados em papéis (disputas de autoridade, responsabilidade ou mandato)

      - Conflitos estruturais (incentivos sistêmicos, regras ou questões de alocação de recursos)

      - Violações éticas ou de limites (violações de normas declaradas, escopo ou limites de
      segurança)
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.1.3
  layer: 4
  specSection:
    ref: '6.1'
    title: Conflict Classification
  normativity: MUST
  key: l4.conflict-classification.3
  i18n:
    en: |-
      Each conflict class MUST explicitly define:
      - Entry criteria (how a situation is classified into this class)
      - Expected response priority and timelines (if any)
      - Permitted and required resolution pathways
      - Documentation requirements and privacy boundaries
    de: |-
      Jede Konfliktklasse MUSS explizit definieren:
      - Eintrittskriterien (wie eine Situation in diese Klasse eingestuft wird)
      - Erwartete Reaktionspriorität und Fristen (falls vorhanden)
      - Zulässige und erforderliche Lösungswege
      - Dokumentationsanforderungen und Datenschutzgrenzen
    es: |-
      Cada clase de conflicto DEBE definir explícitamente:
      - Criterios de entrada (cómo se clasifica una situación en esta clase)
      - Prioridad de respuesta esperada y plazos (si los hay)
      - Vías de resolución permitidas y requeridas
      - Requisitos de documentación y límites de privacidad
    fr: |-
      Chaque classe de conflit DOIT définir explicitement :
      - Les critères d'entrée (comment une situation est classée dans cette classe)
      - La priorité de réponse attendue et les délais (le cas échéant)
      - Les voies de résolution autorisées et requises
      - Les exigences de documentation et les limites de confidentialité
    pt-br: |-
      Cada classe de conflito DEVE definir explicitamente:
      - Critérios de entrada (como uma situação é classificada nesta classe)
      - Prioridade e prazos esperados de resposta (se houver)
      - Caminhos de resolução permitidos e obrigatórios
      - Requisitos de documentação e limites de privacidade
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.1.4
  layer: 4
  specSection:
    ref: '6.1'
    title: Conflict Classification
  normativity: MUST
  key: l4.conflict-classification.4
  i18n:
    en: >-
      Conflicts involving credible safety risks, coercion, abuse, or threats MUST be classified as
      **safety-critical** and MUST trigger elevated safeguards as defined in Section 6.3.
    de: >-
      Konflikte, die glaubhafte Sicherheitsrisiken, Zwang, Missbrauch oder Drohungen beinhalten,
      MUSS als **sicherheitskritisch** klassifiziert werden und MUSS erhöhte Schutzmaßnahmen
      auslösen, wie in Abschnitt 6.3 definiert.
    es: >-
      Los conflictos que impliquen riesgos creíbles para la seguridad, coerción, abuso o amenazas
      DEBEN clasificarse como **críticos para la seguridad** y DEBEN activar salvaguardas elevadas
      según lo definido en la Sección 6.3.
    fr: >-
      Les conflits impliquant des risques crédibles pour la sécurité, de la coercition, des abus ou
      des menaces DOIVENT être classés comme **critiques pour la sécurité** et DOIVENT déclencher
      des mesures de protection renforcées telles que définies à la Section 6.3.
    pt-br: >-
      Conflitos que envolvam riscos credíveis à segurança, coerção, abuso ou ameaças DEVEM ser
      classificados como **críticos para a segurança** e DEVEM acionar salvaguardas elevadas
      conforme definido na Seção 6.3.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.1.5
  layer: 4
  specSection:
    ref: '6.1'
    title: Conflict Classification
  normativity: MUST
  key: l4.conflict-classification.5
  i18n:
    en: >-
      Misclassification or avoidance of classification MUST be treated as a process failure subject
      to review.
    de: >-
      Fehlklassifikation oder Vermeidung der Klassifikation MUSS als Prozessversagen behandelt
      werden, das einer Überprüfung unterliegt.
    es: >-
      La clasificación errónea o la evasión de la clasificación DEBE tratarse como un fallo de
      proceso sujeto a revisión.
    fr: >-
      La classification erronée ou l'évitement de la classification DOIT être traité comme une
      défaillance de processus soumise à examen.
    pt-br: >-
      A classificação incorreta ou a evitação de classificação DEVE ser tratada como uma falha de
      processo sujeita a revisão.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
    - conflict-resolution-ladder.non-response-withdrawal-and-deadlock
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.2.1
  layer: 4
  specSection:
    ref: '6.2'
    title: Resolution Pathways
  normativity: MUST
  key: l4.resolution-pathways.1
  i18n:
    en: >-
      The community MUST define a minimum conflict resolution process applicable to all conflict
      classes.
    de: >-
      Die Gemeinschaft MUSS einen Mindest-Konfliktlösungsprozess definieren, der auf alle
      Konfliktklassen anwendbar ist.
    es: >-
      La comunidad DEBE definir un proceso mínimo de resolución de conflictos aplicable a todas las
      clases de conflicto.
    fr: >-
      La communauté DOIT définir un processus minimum de résolution des conflits applicable à toutes
      les classes de conflits.
    pt-br: >-
      A comunidade DEVE definir um processo mínimo de resolução de conflitos aplicável a todas as
      classes de conflito.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.resolution-ladder-steps
  owner: conflict-resolution-ladder.resolution-ladder-steps
- ref: 6.2.2
  layer: 4
  specSection:
    ref: '6.2'
    title: Resolution Pathways
  normativity: MUST
  key: l4.resolution-pathways.2
  i18n:
    en: >-
      The resolution process MUST include a clearly defined **resolution ladder** with explicit
      escalation steps.
    de: >-
      Der Lösungsprozess MUSS eine klar definierte **Eskalationsleiter** mit expliziten
      Eskalationsschritten umfassen.
    es: >-
      El proceso de resolución DEBE incluir una **escalera de resolución** claramente definida con
      pasos de escalamiento explícitos.
    fr: >-
      Le processus de résolution DOIT inclure une **échelle de résolution** clairement définie avec
      des étapes d'escalade explicites.
    pt-br: >-
      O processo de resolução DEVE incluir uma **escada de resolução** claramente definida com
      etapas explícitas de escalonamento.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.resolution-ladder-steps
  owner: conflict-resolution-ladder.resolution-ladder-steps
- ref: 6.2.3
  layer: 4
  specSection:
    ref: '6.2'
    title: Resolution Pathways
  normativity: MUST
  key: l4.resolution-pathways.3
  i18n:
    en: |-
      The resolution ladder MUST define, at minimum:
      - How a conflict is raised, logged, and acknowledged
      - How involved parties are notified and invited to participate
      - How refusal, non-response, or withdrawal is handled
      - How mediators or facilitators are selected, replaced, or declined
      - Time-bounded expectations for each stage (where applicable)
      - Documentation requirements and access rules
      - A process for reviewing procedural failures or deadlock
    de: |-
      Die Eskalationsleiter MUSS mindestens definieren:
      - Wie ein Konflikt eingebracht, protokolliert und bestätigt wird
      - Wie beteiligte Parteien benachrichtigt und zur Teilnahme eingeladen werden
      - Wie Verweigerung, Nichtreaktion oder Rückzug behandelt wird
      - Wie Mediator\*innen oder Moderator\*innen ausgewählt, ersetzt oder abgelehnt werden
      - Zeitlich begrenzte Erwartungen für jede Phase (wo zutreffend)
      - Dokumentationsanforderungen und Zugriffsregeln
      - Ein Verfahren zur Überprüfung von Prozessfehlern oder Blockaden
    es: |-
      La escalera de resolución DEBE definir, como mínimo:
      - Cómo se plantea, registra y reconoce un conflicto
      - Cómo se notifica a las partes involucradas y se las invita a participar
      - Cómo se manejan la negativa, la falta de respuesta o la retirada
      - Cómo se seleccionan, reemplazan o recusan los mediadores o facilitadores
      - Expectativas con plazos definidos para cada etapa (cuando corresponda)
      - Requisitos de documentación y reglas de acceso
      - Un proceso para revisar fallos procedimentales o puntos muertos
    fr: |-
      L'échelle de résolution DOIT définir, au minimum :
      - Comment un conflit est signalé, enregistré et accusé de réception
      - Comment les parties impliquées sont notifiées et invitées à participer
      - Comment le refus, l'absence de réponse ou le retrait est géré
      - Comment les médiateurs ou facilitateurs sont sélectionnés, remplacés ou récusés
      - Les attentes temporelles pour chaque étape (le cas échéant)
      - Les exigences de documentation et les règles d'accès
      - Un processus d'examen des défaillances procédurales ou des blocages
    pt-br: |-
      A escada de resolução DEVE definir, no mínimo:
      - Como um conflito é levantado, registrado e reconhecido
      - Como as partes envolvidas são notificadas e convidadas a participar
      - Como recusa, não-resposta ou retirada é tratada
      - Como mediadores ou facilitadores são selecionados, substituídos ou recusados
      - Expectativas com prazo definido para cada estágio (quando aplicável)
      - Requisitos de documentação e regras de acesso
      - Um processo para revisar falhas processuais ou impasses
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.resolution-ladder-steps
  owner: conflict-resolution-ladder.resolution-ladder-steps
- ref: 6.2.4
  layer: 4
  specSection:
    ref: '6.2'
    title: Resolution Pathways
  normativity: MUST
  key: l4.resolution-pathways.4
  i18n:
    en: >-
      The resolution process MUST be accessible without requiring social status, seniority,
      charisma, or informal proximity to decision-makers.
    de: >-
      Der Lösungsprozess MUSS zugänglich sein, ohne dass sozialer Status, Dienstalter, Charisma oder
      informelle Nähe zu Entscheidungsträger\*innen erforderlich ist.
    es: >-
      El proceso de resolución DEBE ser accesible sin requerir estatus social, antigüedad, carisma o
      proximidad informal a los tomadores de decisiones.
    fr: >-
      Le processus de résolution DOIT être accessible sans exiger de statut social, d'ancienneté, de
      charisme ou de proximité informelle avec les décideurs.
    pt-br: >-
      O processo de resolução DEVE ser acessível sem exigir status social, antiguidade, carisma ou
      proximidade informal com tomadores de decisão.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.resolution-ladder-steps
  owner: conflict-resolution-ladder.resolution-ladder-steps
- ref: 6.2.5
  layer: 4
  specSection:
    ref: '6.2'
    title: Resolution Pathways
  normativity: MUST
  key: l4.resolution-pathways.5
  i18n:
    en: >-
      Unresolved conflicts MUST escalate through defined governance pathways without bypassing the
      Decision Matrix defined in Layer 2.
    de: >-
      Ungelöste Konflikte MUSS über definierte Governance-Wege eskaliert werden, ohne die in Schicht
      2 definierte Entscheidungsmatrix zu umgehen.
    es: >-
      Los conflictos no resueltos DEBEN escalar a través de las vías de gobernanza definidas sin
      eludir la Matriz de Decisión definida en la Capa 2.
    fr: >-

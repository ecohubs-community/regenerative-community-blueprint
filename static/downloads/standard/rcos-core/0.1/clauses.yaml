      seguida de una revisión posterior.
    fr: >-
      Si une expérimentation introduit un risque pour la sécurité, de la coercition ou un préjudice
      durable, la communauté DOIT suspendre ou mettre fin à l'expérimentation immédiatement par une
      action protectrice, suivie d'une révision a posteriori.
    pt-br: >-
      Se um experimento introduzir risco de segurança, coerção ou dano sustentado, a comunidade DEVE
      suspender ou encerrar o experimento imediatamente por meio de uma ação protetiva, seguida de
      revisão posterior.

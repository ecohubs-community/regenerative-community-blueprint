  owner: change-protocol.transition-and-migration
- ref: 8.5.3
  layer: 6
  specSection:
    ref: '8.5'
    title: Change Safety and Reversibility
  normativity: MUST
  key: l6.change-safety-and-reversibility.3
  i18n:
    en: >-
      Emergency changes MAY be permitted only where explicitly defined, MUST be time-bounded, MUST
      NOT override Layer 0 invariants, and MUST undergo mandatory post-hoc review and ratification
      or rollback.
    de: >-
      Notfalländerungen KANN nur dort zulässig sein, wo sie ausdrücklich definiert sind, MUSS
      zeitlich begrenzt sein, DARF NICHT die Invarianten von Schicht 0 außer Kraft setzen und MUSS
      einer verpflichtenden nachträglichen Überprüfung und Ratifizierung oder Rücknahme unterzogen
      werden.
    es: >-
      Los cambios de emergencia PUEDEN permitirse solo cuando estén explícitamente definidos, DEBEN
      estar acotados en el tiempo, NO DEBEN anular las invariantes de la Capa 0 y DEBEN someterse a
      una revisión posterior obligatoria y a ratificación o reversión.
    fr: >-
      Les changements d'urgence NE PEUVENT être autorisés que lorsqu'ils sont explicitement définis,
      DOIVENT être limités dans le temps, NE DOIVENT PAS outrepasser les invariants de la Couche 0,
      et DOIVENT faire l'objet d'une révision a posteriori obligatoire suivie d'une ratification ou
      d'un retour en arrière.
    pt-br: >-
      Mudanças emergenciais PODEM ser permitidas apenas onde explicitamente definidas, DEVEM ter
      prazo definido, NÃO DEVEM sobrepor-se aos invariantes da Camada 0 e DEVEM passar por revisão
      posterior obrigatória e ratificação ou reversão.

- ref: 7.3.2
  layer: 5
  specSection:
    ref: '7.3'
    title: Documentation and Information Flow
  normativity: MUST
  key: l5.documentation-and-information-flow.2
  i18n:
    en: |-
      Documentation rules MUST specify, at minimum:
      - What information MUST be recorded
      - Where records are stored
      - Who has access to which records
      - Publication or notification timelines (if any)
      - Privacy boundaries and conditions for restricted access
    de: |-
      Dokumentationsregeln MUSS mindestens Folgendes festlegen:
      - Welche Informationen aufgezeichnet werden MUSS
      - Wo Aufzeichnungen gespeichert werden

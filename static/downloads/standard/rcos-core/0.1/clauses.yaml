      - Budgetkategorien und interne Buchhaltungsstrukturen
    es: |-
      Lo siguiente PUEDE ser explícito:
      - Modelos de valoración de contribuciones
      - Unidades internas (tokens, horas, puntos)
      - Categorías presupuestarias y estructuras de contabilidad interna
    fr: |-
      Les éléments suivants PEUVENT être explicites :
      - Les modèles de valorisation des contributions
      - Les unités internes (jetons, heures, points)
      - Les catégories budgétaires et les structures comptables internes
    pt-br: |-
      O seguinte PODE ser explícito:
      - Modelos de valoração de contribuições
      - Unidades internas (tokens, horas, pontos)
      - Categorias orçamentárias e estruturas internas de contabilidade
  disposition: defined_by_section
  referencedBy: []
  owner: null
- ref: 5.7.3
  layer: 3
  specSection:
    ref: '5.7'
    title: Explicitness Rules
  normativity: MUST
  key: l3.explicitness-rules.3
  i18n:
    en: |-
      The following MUST remain optional and out of scope:
      - Attitudes toward wealth
      - Equal vs differentiated outcomes
      - Personal financial choices
    de: |-
      Folgendes MUSS optional und außerhalb des Geltungsbereichs bleiben:
      - Einstellungen gegenüber Wohlstand
      - Gleiche vs. differenzierte Ergebnisse
      - Persönliche finanzielle Entscheidungen
    es: |-
      Lo siguiente DEBE permanecer opcional y fuera del ámbito:
      - Actitudes hacia la riqueza
      - Resultados igualitarios vs diferenciados
      - Decisiones financieras personales
    fr: |-
      Les éléments suivants DOIVENT rester optionnels et hors périmètre :
      - Les attitudes envers la richesse
      - Les résultats égalitaires vs différenciés
      - Les choix financiers personnels
    pt-br: |-
      O seguinte DEVE permanecer opcional e fora do escopo:
      - Atitudes em relação à riqueza
      - Resultados iguais vs diferenciados
      - Escolhas financeiras pessoais
  disposition: not_a_definition

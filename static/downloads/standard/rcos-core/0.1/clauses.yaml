    fr: >-
      Les mesures de protection liées à la sécurité DOIVENT prévaloir sur les droits de
      participation, la continuité des rôles et la commodité opérationnelle.
    pt-br: >-
      As salvaguardas de segurança DEVEM prevalecer sobre direitos de participação, continuidade de
      papéis e conveniência operacional.

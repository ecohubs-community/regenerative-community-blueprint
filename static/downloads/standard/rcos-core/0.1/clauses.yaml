      - Reglas de privacidad y transparencia para saldos y transacciones
    fr: >-
      Si des unités économiques internes sont utilisées (par ex. crédits-temps, points, jetons), le
      Protocole d'Économie Interne DOIT définir :

      - Les règles d'émission

      - Les règles de transférabilité

      - Les mécanismes d'expiration, de décroissance ou de plafonnement (le cas échéant)


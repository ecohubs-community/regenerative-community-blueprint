      Todas las decisiones DEBEN ser trazables hasta:
      - Tipo y dominio de la decisión
      - Rol o cuerpo autorizado
      - Mecanismo de decisión y umbral
      - Resultado registrado y fecha de entrada en vigor
    fr: |-
      Toutes les décisions DOIVENT être traçables jusqu'à :
      - Le type et le domaine de décision
      - Le rôle ou l'organe autorisé
      - Le mécanisme de décision et le seuil
      - Le résultat consigné et la date d'entrée en vigueur
    pt-br: |-

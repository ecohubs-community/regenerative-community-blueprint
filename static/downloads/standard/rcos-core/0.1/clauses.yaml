- ref: 8.5.2
  layer: 6
  specSection:
    ref: '8.5'
    title: Change Safety and Reversibility
  normativity: MUST
  key: l6.change-safety-and-reversibility.2
  i18n:
    en: |-
      Irreversible or high-impact changes MUST include:
      - Extended deliberation or review periods
      - Higher decision thresholds where appropriate
      - Explicit risk acknowledgment
    de: |-
      Irreversible oder folgenschwere Änderungen MUSS beinhalten:
      - Verlängerte Beratungs- oder Überprüfungszeiträume
      - Höhere Entscheidungsschwellen, wo angemessen
      - Ausdrückliche Risikoanerkennung
    es: |-
      Los cambios irreversibles o de alto impacto DEBEN incluir:
      - Períodos extendidos de deliberación o revisión
      - Umbrales de decisión más altos cuando sea apropiado
      - Reconocimiento explícito del riesgo
    fr: |-
      Les changements irréversibles ou à fort impact DOIVENT inclure :
      - Des périodes prolongées de délibération ou de révision
      - Des seuils de décision plus élevés lorsque c'est approprié
      - Une reconnaissance explicite des risques
    pt-br: |-
      Mudanças irreversíveis ou de alto impacto DEVEM incluir:
      - Períodos prolongados de deliberação ou revisão
      - Limiares de decisão mais elevados, quando apropriado
      - Reconhecimento explícito de risco
  disposition: defined_by_section
  referencedBy:

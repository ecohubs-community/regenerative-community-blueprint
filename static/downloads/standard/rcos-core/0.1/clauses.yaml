      - Les limites d'endettement

      - Les obligations à long terme

      - Les réserves de contingence (le cas échéant)
    pt-br: |-
      A comunidade DEVE definir políticas de reserva, risco e responsabilidade, incluindo:
      - Limites de endividamento
      - Obrigações de longo prazo
      - Reservas de contingência (se houver)
  disposition: defined_by_section

  normativity: MUST
  key: l3.layer-invariants.2
  i18n:
    en: >-
      Resources declared as commons MUST NOT be privatized through informal, implicit, or unilateral
      action.
    de: >-
      Als Gemeingüter deklarierte Ressourcen DÜRFEN NICHT durch informelles, implizites oder
      einseitiges Handeln privatisiert werden.
    es: >-
      Los recursos declarados como comunes NO DEBEN privatizarse mediante acciones informales,
      implícitas o unilaterales.
    fr: >-
      Les ressources déclarées comme communes NE DOIVENT PAS être privatisées par une action
      informelle, implicite ou unilatérale.
    pt-br: >-
      Recursos declarados como comuns NÃO DEVEM ser privatizados por meio de ação informal,
      implícita ou unilateral.
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.6.3
  layer: 3
  specSection:
    ref: '5.6'
    title: Layer Invariants
  normativity: MUST
  key: l3.layer-invariants.3
  i18n:
    en: >-
      Contribution recognition MUST be explicit such that unpaid or invisible labor is not
      structurally required for system survival.
    de: >-
      Beitragsanerkennung MUSS explizit sein, sodass unbezahlte oder unsichtbare Arbeit nicht
      strukturell für das Überleben des Systems erforderlich ist.
    es: >-
      El reconocimiento de contribuciones DEBE ser explícito, de modo que el trabajo no remunerado o
      invisible no sea estructuralmente necesario para la supervivencia del sistema.
    fr: >-
      La reconnaissance des contributions DOIT être explicite de sorte que le travail non rémunéré
      ou invisible ne soit pas structurellement requis pour la survie du système.
    pt-br: >-
      O reconhecimento de contribuições DEVE ser explícito, de modo que o trabalho não pago ou
      invisível não seja estruturalmente exigido para a sobrevivência do sistema.

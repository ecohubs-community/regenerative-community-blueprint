      - Welche Layer, Regeln oder Artefakte betroffen waren
      - Was geändert, versucht oder gestoppt wurde
      - Welche Signale, Nachweise oder Schwellenwerte eine Handlung ausgelöst haben
    es: |-
      La captura de aprendizajes DEBE incluir, como mínimo:
      - Qué ocurrió y por qué fue relevante
      - Qué capas, reglas o artefactos estuvieron implicados
      - Qué se cambió, intentó o detuvo
      - Qué señales, evidencias o umbrales desencadenaron la acción
    fr: |-
      La capture des apprentissages DOIT inclure, au minimum :
      - Ce qui s'est passé et pourquoi c'est important
      - Quelles couches, règles ou artefacts étaient impliqués
      - Ce qui a été modifié, tenté ou arrêté
      - Quels signaux, preuves ou seuils ont déclenché l'action
    pt-br: |-
      A captura de aprendizado DEVE incluir, no mínimo:
      - O que ocorreu e por que isso importou
      - Quais camadas, regras ou artefatos estiveram envolvidos
      - O que foi alterado, tentado ou interrompido
      - Quais sinais, evidências ou limiares desencadearam a ação

      - Des plafonds

      - La décroissance ou l'expiration

      - La non-transférabilité

      - Des mécanismes de redistribution ou de taxation

      - Une validité limitée dans le temps
    pt-br: >-
      Se existirem unidades internas, a comunidade DEVE definir um ou mais mecanismos limitadores de
      acumulação, que PODEM incluir:

      - Limites máximos

      - Decaimento ou expiração

      - Não transferibilidade

      - Mecanismos de redistribuição ou taxação

      - Validade limitada no tempo

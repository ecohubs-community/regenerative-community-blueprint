- ref: 2.1.1
  layer: 0
  specSection:
    ref: '2.1'
    title: Purpose Definition
  normativity: MUST
  key: l0.purpose-definition.1
  i18n:
    en: A community MUST define exactly one primary purpose.
    de: Eine Gemeinschaft MUSS genau einen primären Zweck definieren.
    es: Una comunidad DEBE definir exactamente un propósito primario.
    fr: Une communauté DOIT définir exactement une raison d'être principale.
    pt-br: Uma comunidade DEVE definir exatamente um propósito primário.
  disposition: defined_by_section
  referencedBy:
    - purpose-charter.primary-purpose
  owner: purpose-charter.primary-purpose
- ref: 2.1.2
  layer: 0
  specSection:
    ref: '2.1'
    title: Purpose Definition
  normativity: MUST
  key: l0.purpose-definition.2
  i18n:
    en: >-
      The primary purpose MUST describe the enduring reason for the community’s existence and MUST
      NOT be a short-term goal, project, or strategy.
    de: >-
      Der primäre Zweck MUSS den dauerhaften Grund für die Existenz der Gemeinschaft beschreiben und
      DARF NICHT ein kurzfristiges Ziel, Projekt oder eine Strategie sein.
    es: >-
      El propósito primario DEBE describir la razón perdurable de la existencia de la comunidad y NO
      DEBE ser un objetivo, proyecto o estrategia a corto plazo.
    fr: >-
      La raison d'être principale DOIT décrire la raison durable de l'existence de la communauté et
      NE DOIT PAS être un objectif à court terme, un projet ou une stratégie.
    pt-br: >-
      O propósito primário DEVE descrever a razão duradoura da existência da comunidade e NÃO DEVE
      ser uma meta, projeto ou estratégia de curto prazo.
  disposition: defined_by_section
  referencedBy:
    - purpose-charter.primary-purpose
  owner: purpose-charter.primary-purpose
- ref: 2.1.3
  layer: 0
  specSection:
    ref: '2.1'
    title: Purpose Definition
  normativity: MUST
  key: l0.purpose-definition.3
  i18n:
    en: >-
      The primary purpose MUST be stable across time and MUST only be changed through a
      constitutional decision as defined in Layer 2 and executed via the change process defined in
      Layer 6.
    de: >-
      Der primäre Zweck MUSS über die Zeit stabil sein und MUSS nur durch eine konstitutionelle
      Entscheidung gemäß Schicht 2 und über den in Schicht 6 definierten Änderungsprozess geändert
      werden.
    es: >-
      El propósito primario DEBE ser estable a lo largo del tiempo y solo DEBE ser modificado
      mediante una decisión constitucional tal como se define en la Capa 2 y ejecutada a través del
      proceso de cambio definido en la Capa 6.
    fr: >-
      La raison d'être principale DOIT être stable dans le temps et NE DOIT être modifiée que par
      une décision constitutionnelle telle que définie dans la Couche 2 et exécutée via le processus
      de modification défini dans la Couche 6.
    pt-br: >-
      O propósito primário DEVE ser estável ao longo do tempo e só DEVE ser alterado por meio de uma
      decisão constitucional conforme definido na Camada 2 e executada pelo processo de mudança
      definido na Camada 6.
  disposition: defined_by_section
  referencedBy:
    - purpose-charter.conditions-for-purpose-change
  owner: purpose-charter.conditions-for-purpose-change
- ref: 2.1.4
  layer: 0
  specSection:
    ref: '2.1'
    title: Purpose Definition
  normativity: MUST
  key: l0.purpose-definition.4
  i18n:
    en: Secondary purposes MAY be defined, but MUST NOT conflict with or override the primary purpose.
    de: >-
      Sekundäre Zwecke KANN definiert werden, DARF NICHT jedoch dem primären Zweck widersprechen
      oder ihn außer Kraft setzen.
    es: >-
      Se PUEDEN definir propósitos secundarios, pero NO DEBEN entrar en conflicto con el propósito
      primario ni anularlo.
    fr: >-
      Des raisons d'être secondaires PEUVENT être définies, mais NE DOIVENT PAS entrer en conflit
      avec la raison d'être principale ni la supplanter.
    pt-br: >-
      Propósitos secundários PODEM ser definidos, mas NÃO DEVEM conflitar com nem sobrepor-se ao
      propósito primário.
  disposition: defined_by_section
  referencedBy:
    - purpose-charter.secondary-purposes
  owner: purpose-charter.secondary-purposes
- ref: 2.1.5
  layer: 0
  specSection:
    ref: '2.1'
    title: Purpose Definition
  normativity: MAY
  key: l0.purpose-definition.5
  i18n:
    en: >-
      No action, decision, or allocation of resources MAY materially contradict the stated primary
      purpose.
    de: >-
      Keine Handlung, Entscheidung oder Ressourcenzuweisung KANN dem erklärten primären Zweck
      materiell widersprechen.
    es: >-
      Ninguna acción, decisión o asignación de recursos PUEDE contradecir materialmente el propósito
      primario declarado.
    fr: >-
      Aucune action, décision ou allocation de ressources NE PEUT contredire matériellement la
      raison d'être principale déclarée.
    pt-br: >-
      Nenhuma ação, decisão ou alocação de recursos PODE contradizer materialmente o propósito
      primário declarado.
  disposition: defined_by_section
  referencedBy:
    - purpose-charter.primary-purpose
    - purpose-charter.non-goals-and-exclusions
  owner: purpose-charter.primary-purpose
- ref: 2.2.1
  layer: 0
  specSection:
    ref: '2.2'
    title: Scope Declaration
  normativity: MUST
  key: l0.scope-declaration.1
  i18n:
    en: The community MUST explicitly declare the scope of what it governs.
    de: Die Gemeinschaft MUSS den Geltungsbereich dessen, was sie regiert, explizit erklären.
    es: La comunidad DEBE declarar explícitamente el alcance de lo que gobierna.
    fr: La communauté DOIT déclarer explicitement le périmètre de ce qu'elle gouverne.
    pt-br: A comunidade DEVE declarar explicitamente o escopo daquilo que governa.
  disposition: defined_by_section
  referencedBy:
    - scope-declaration.in-scope-assets
    - scope-declaration.in-scope-decision-domains
    - scope-declaration.in-scope-activities-and-responsibilities
  owner: scope-declaration.in-scope-assets
- ref: 2.2.2
  layer: 0
  specSection:
    ref: '2.2'
    title: Scope Declaration
  normativity: MUST
  key: l0.scope-declaration.2
  i18n:
    en: |-
      The scope declaration MUST include, at minimum:
      - Assets governed by the community
      - Domains of decision-making authority
      - Activities and responsibilities under collective control
    de: |-
      Die Geltungsbereichserklärung MUSS mindestens Folgendes umfassen:
      - Von der Gemeinschaft verwaltete Vermögenswerte
      - Bereiche der Entscheidungsbefugnis
      - Aktivitäten und Verantwortlichkeiten unter kollektiver Kontrolle
    es: |-
      La declaración de alcance DEBE incluir, como mínimo:
      - Activos gobernados por la comunidad
      - Dominios de autoridad en la toma de decisiones
      - Actividades y responsabilidades bajo control colectivo
    fr: |-
      La déclaration de périmètre DOIT inclure, au minimum :
      - Les actifs gouvernés par la communauté
      - Les domaines d'autorité décisionnelle
      - Les activités et responsabilités sous contrôle collectif
    pt-br: |-
      A declaração de escopo DEVE incluir, no mínimo:
      - Ativos governados pela comunidade
      - Domínios de autoridade decisória
      - Atividades e responsabilidades sob controle coletivo
  disposition: defined_by_section
  referencedBy:
    - scope-declaration.in-scope-assets
    - scope-declaration.in-scope-decision-domains
    - scope-declaration.in-scope-activities-and-responsibilities
  owner: scope-declaration.in-scope-assets
- ref: 2.2.3
  layer: 0
  specSection:
    ref: '2.2'
    title: Scope Declaration
  normativity: MUST
  key: l0.scope-declaration.3
  i18n:
    en: The scope declaration MUST explicitly list what is out of scope.
    de: >-
      Die Geltungsbereichserklärung MUSS explizit auflisten, was außerhalb des Geltungsbereichs
      liegt.
    es: La declaración de alcance DEBE listar explícitamente lo que queda fuera de alcance.
    fr: La déclaration de périmètre DOIT lister explicitement ce qui est hors périmètre.
    pt-br: A declaração de escopo DEVE listar explicitamente o que está fora do escopo.
  disposition: defined_by_section
  referencedBy:
    - scope-declaration.explicitly-out-of-scope
  owner: scope-declaration.explicitly-out-of-scope
- ref: 2.2.4
  layer: 0
  specSection:
    ref: '2.2'
    title: Scope Declaration
  normativity: MUST
  key: l0.scope-declaration.4
  i18n:
    en: Anything not explicitly declared as in scope MUST be treated as out of scope.
    de: >-
      Alles, was nicht explizit als innerhalb des Geltungsbereichs erklärt ist, MUSS als außerhalb
      des Geltungsbereichs behandelt werden.
    es: >-
      Todo lo que no esté explícitamente declarado como dentro del alcance DEBE tratarse como fuera
      de alcance.
    fr: >-
      Tout ce qui n'est pas explicitement déclaré comme étant dans le périmètre DOIT être considéré
      comme hors périmètre.
    pt-br: >-
      Qualquer coisa que não seja explicitamente declarada como dentro do escopo DEVE ser tratada
      como fora do escopo.
  disposition: defined_by_section
  referencedBy:
    - scope-declaration.in-scope-assets
    - scope-declaration.explicitly-out-of-scope
  owner: scope-declaration.explicitly-out-of-scope
- ref: 2.2.5
  layer: 0
  specSection:
    ref: '2.2'
    title: Scope Declaration
  normativity: MUST
  key: l0.scope-declaration.5
  i18n:
    en: >-
      The community MUST NOT exercise authority over persons, assets, or domains that are declared
      out of scope.
    de: >-
      Die Gemeinschaft DARF NICHT Autorität über Personen, Vermögenswerte oder Bereiche ausüben, die
      als außerhalb des Geltungsbereichs erklärt sind.
    es: >-
      La comunidad NO DEBE ejercer autoridad sobre personas, activos o dominios que estén declarados
      fuera de alcance.
    fr: >-
      La communauté NE DOIT PAS exercer d'autorité sur des personnes, des actifs ou des domaines
      déclarés hors périmètre.
    pt-br: >-
      A comunidade NÃO DEVE exercer autoridade sobre pessoas, ativos ou domínios declarados como
      fora do escopo.
  disposition: defined_by_section
  referencedBy:
    - scope-declaration.explicitly-out-of-scope
  owner: scope-declaration.explicitly-out-of-scope
- ref: 2.3.1
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MUST
  key: l0.invariants.1
  i18n:
    en: Invariants are constraints that define what MUST NOT be violated while they are in force.
    de: >-
      Invarianten sind Einschränkungen, die definieren, was DARF NICHT verletzt werden darf, solange
      sie in Kraft sind.
    es: >-
      Las invariantes son restricciones que definen lo que NO DEBE ser violado mientras estén
      vigentes.
    fr: >-
      Les invariants sont des contraintes qui définissent ce qui NE DOIT PAS être violé tant qu'ils
      sont en vigueur.
    pt-br: Invariantes são restrições que definem o que NÃO DEVE ser violado enquanto estiverem em vigor.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.3.2
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MUST
  key: l0.invariants.2
  i18n:
    en: Invariants MUST be explicitly listed and documented.
    de: Invarianten MUSS explizit aufgelistet und dokumentiert sein.
    es: Las invariantes DEBEN estar explícitamente listadas y documentadas.
    fr: Les invariants DOIVENT être explicitement listés et documentés.
    pt-br: Invariantes DEVEM ser listadas e documentadas explicitamente.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.3.3
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MUST
  key: l0.invariants.3
  i18n:
    en: Invariants MUST apply across all layers of RCOS.
    de: Invarianten MUSS über alle Layer von RCOS hinweg gelten.
    es: Las invariantes DEBEN aplicarse a todas las capas de RCOS.
    fr: Les invariants DOIVENT s'appliquer à travers toutes les couches du RCOS.
    pt-br: Invariantes DEVEM se aplicar a todas as camadas do RCOS.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.3.4
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MAY
  key: l0.invariants.4
  i18n:
    en: No decision, role, process, or emergency measure MAY override an invariant.
    de: >-
      Keine Entscheidung, Rolle, kein Prozess und keine Notfallmaßnahme KANN eine Invariante außer
      Kraft setzen.
    es: Ninguna decisión, rol, proceso o medida de emergencia PUEDE anular una invariante.
    fr: Aucune décision, rôle, processus ou mesure d'urgence NE PEUT outrepasser un invariant.
    pt-br: Nenhuma decisão, papel, processo ou medida de emergência PODE sobrepor-se a uma invariante.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.3.5
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MUST
  key: l0.invariants.5
  i18n:
    en: If a conflict arises between an invariant and any other rule, the invariant MUST prevail.
    de: >-
      Wenn ein Konflikt zwischen einer Invariante und einer anderen Regel entsteht, MUSS die
      Invariante Vorrang haben.
    es: >-
      Si surge un conflicto entre una invariante y cualquier otra regla, la invariante DEBE
      prevalecer.
    fr: Si un conflit survient entre un invariant et toute autre règle, l'invariant DOIT prévaloir.
    pt-br: >-
      Se surgir um conflito entre uma invariante e qualquer outra regra, a invariante DEVE
      prevalecer.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.3.6
  layer: 0
  specSection:
    ref: '2.3'
    title: Invariants
  normativity: MAY
  key: l0.invariants.6
  i18n:
    en: >-
      Invariants MAY only be changed or removed through a constitutional change process as defined
      in Layer 2 and Layer 6.
    de: >-
      Invarianten KANN nur durch einen konstitutionellen Änderungsprozess gemäß Schicht 2 und
      Schicht 6 geändert oder entfernt werden.
    es: >-
      Las invariantes solo PUEDEN ser modificadas o eliminadas mediante un proceso de cambio
      constitucional tal como se define en la Capa 2 y la Capa 6.
    fr: >-
      Les invariants NE PEUVENT être modifiés ou supprimés que par un processus de modification
      constitutionnelle tel que défini dans la Couche 2 et la Couche 6.
    pt-br: >-
      Invariantes só PODEM ser alteradas ou removidas por meio de um processo de mudança
      constitucional conforme definido na Camada 2 e na Camada 6.
  disposition: defined_by_section
  referencedBy:
    - invariants-register.active-invariants
  owner: invariants-register.active-invariants
- ref: 2.4.1
  layer: 0
  specSection:
    ref: '2.4'
    title: Identity Constraints
  normativity: MUST
  key: l0.identity-constraints.1
  i18n:
    en: >-
      The community MUST declare any identity-level constraints that materially affect
      participation, behavior, or governance.
    de: >-
      Die Gemeinschaft MUSS alle Einschränkungen auf Identitätsebene erklären, die Teilnahme,
      Verhalten oder Governance wesentlich beeinflussen.
    es: >-
      La comunidad DEBE declarar cualquier restricción a nivel de identidad que afecte materialmente
      la participación, el comportamiento o la gobernanza.
    fr: >-
      La communauté DOIT déclarer toute contrainte d'identité qui affecte matériellement la
      participation, le comportement ou la gouvernance.
    pt-br: >-
      A comunidade DEVE declarar quaisquer restrições no nível da identidade que afetem
      materialmente a participação, o comportamento ou a governança.
  disposition: defined_by_section
  referencedBy:
    - identity-constraints-register.active-identity-constraints
    - identity-constraints-register.conditions-for-change
  owner: identity-constraints-register.active-identity-constraints
- ref: 2.4.2
  layer: 0
  specSection:
    ref: '2.4'
    title: Identity Constraints
  normativity: MAY
  key: l0.identity-constraints.2
  i18n:
    en: |-
      Identity constraints MAY include, but are not limited to:
      - Ethical or behavioral boundaries
      - Participation prerequisites
      - Non-negotiable cultural or ecological constraints
    de: |-
      Identitätseinschränkungen KANN unter anderem Folgendes umfassen:
      - Ethische oder verhaltensbezogene Grenzen
      - Teilnahmevoraussetzungen
      - Nicht verhandelbare kulturelle oder ökologische Einschränkungen
    es: |-
      Las restricciones de identidad PUEDEN incluir, entre otras:
      - Límites éticos o de comportamiento
      - Requisitos previos de participación
      - Restricciones culturales o ecológicas innegociables
    fr: |-
      Les contraintes d'identité PEUVENT inclure, sans s'y limiter :
      - Les limites éthiques ou comportementales
      - Les prérequis de participation
      - Les contraintes culturelles ou écologiques non négociables
    pt-br: |-
      Restrições de identidade PODEM incluir, entre outras:
      - Limites éticos ou comportamentais
      - Pré-requisitos para participação
      - Restrições culturais ou ecológicas inegociáveis
  disposition: defined_by_section
  referencedBy:
    - identity-constraints-register.active-identity-constraints
  owner: identity-constraints-register.active-identity-constraints
- ref: 2.4.3
  layer: 0
  specSection:
    ref: '2.4'
    title: Identity Constraints
  normativity: MUST
  key: l0.identity-constraints.3
  i18n:
    en: Identity constraints MUST be testable and enforceable through defined processes.
    de: Identitätseinschränkungen MUSS überprüfbar und durch definierte Prozesse durchsetzbar sein.
    es: >-
      Las restricciones de identidad DEBEN ser verificables y aplicables mediante procesos
      definidos.
    fr: >-
      Les contraintes d'identité DOIVENT être vérifiables et applicables à travers des processus
      définis.
    pt-br: Restrições de identidade DEVEM ser testáveis e aplicáveis por meio de processos definidos.
  disposition: defined_by_section
  referencedBy:
    - identity-constraints-register.active-identity-constraints
    - identity-constraints-register.enforcement-and-testability
  owner: identity-constraints-register.enforcement-and-testability
- ref: 2.4.4
  layer: 0
  specSection:
    ref: '2.4'
    title: Identity Constraints
  normativity: MUST
  key: l0.identity-constraints.4
  i18n:
    en: Identity constraints MUST NOT be enforced implicitly or informally.
    de: Identitätseinschränkungen DARF NICHT implizit oder informell durchgesetzt werden.
    es: Las restricciones de identidad NO DEBEN aplicarse de manera implícita o informal.
    fr: Les contraintes d'identité NE DOIVENT PAS être appliquées de manière implicite ou informelle.
    pt-br: Restrições de identidade NÃO DEVEM ser aplicadas de forma implícita ou informal.
  disposition: defined_by_section
  referencedBy:
    - identity-constraints-register.active-identity-constraints
    - identity-constraints-register.enforcement-and-testability
  owner: identity-constraints-register.enforcement-and-testability
- ref: 2.5.1
  layer: 0
  specSection:
    ref: '2.5'
    title: Artifacts
  normativity: INFORMATIVE
  key: l0.artifacts.1
  i18n:
    en: |-
      The following artifacts are mandatory for Layer 0 compliance:
      - Purpose Charter
      - Scope Declaration
      - Invariants Register
      - Identity Constraints Register
    de: |-
      Die folgenden Artefakte sind für die Konformität mit Schicht 0 verpflichtend:
      - Zweck-Charta
      - Geltungsbereichserklärung
      - Invarianten-Register
      - Register der Identitätseinschränkungen
    es: |-
      Los siguientes artefactos son obligatorios para el cumplimiento de la Capa 0:
      - Carta de Propósito
      - Declaración de Alcance
      - Registro de Invariantes
      - Registro de Restricciones de Identidad
    fr: |-
      Les artefacts suivants sont obligatoires pour la conformité à la Couche 0 :
      - Charte de raison d'être
      - Déclaration de périmètre
      - Registre des invariants
      - Registre des contraintes d'identité
    pt-br: |-
      Os seguintes artefatos são obrigatórios para conformidade com a Camada 0:
      - Carta de Propósito
      - Declaração de Escopo
      - Registro de Invariantes
      - Registro de Restrições de Identidade
  disposition: defined_by_section
  referencedBy: []
  owner: null
- ref: 2.5.2
  layer: 0
  specSection:
    ref: '2.5'
    title: Artifacts
  normativity: MUST
  key: l0.artifacts.2
  i18n:
    en: |-
      Layer 0 artifacts MUST be:
      - Publicly accessible to all members
      - Versioned
      - Adopted through a formal ratification process
    de: |-
      Artefakte von Schicht 0 MUSS:
      - Für alle Mitglieder öffentlich zugänglich sein
      - Versioniert sein
      - Durch einen formalen Ratifizierungsprozess angenommen werden
    es: |-
      Los artefactos de la Capa 0 DEBEN:
      - Ser accesibles públicamente para todos los miembros
      - Estar versionados
      - Ser adoptados mediante un proceso formal de ratificación
    fr: |-
      Les artefacts de la Couche 0 DOIVENT être :
      - Accessibles publiquement à tous les membres
      - Versionnés
      - Adoptés par un processus formel de ratification
    pt-br: |-
      Os artefatos da Camada 0 DEVEM ser:
      - Publicamente acessíveis a todos os membros
      - Versionados
      - Adotados por meio de um processo formal de ratificação
  disposition: defined_by_section
  referencedBy:
    - identity-constraints-register.conditions-for-change
  owner: identity-constraints-register.conditions-for-change
- ref: 2.5.3
  layer: 0
  specSection:
    ref: '2.5'
    title: Artifacts
  normativity: MUST
  key: l0.artifacts.3
  i18n:
    en: >-
      If Layer 0 artifacts are missing, ambiguous, or internally contradictory, the community MUST
      be considered non-compliant with RCOS-Core.
    de: >-
      Wenn Artefakte von Schicht 0 fehlen, mehrdeutig oder in sich widersprüchlich sind, MUSS die
      Gemeinschaft als nicht konform mit RCOS-Core betrachtet werden.
    es: >-
      Si los artefactos de la Capa 0 están ausentes, son ambiguos o internamente contradictorios, la
      comunidad DEBE considerarse no conforme con RCOS-Core.
    fr: >-
      Si les artefacts de la Couche 0 sont manquants, ambigus ou en contradiction interne, la
      communauté DOIT être considérée comme non conforme au RCOS-Core.
    pt-br: >-
      Se os artefatos da Camada 0 estiverem ausentes, ambíguos ou internamente contraditórios, a
      comunidade DEVE ser considerada não conforme com o RCOS-Core.
  disposition: satisfied_by_platform
  dispositionNote: >-
    Compliance is computed as false while any mandatory artifact is incomplete, and a published
    claim is withdrawn automatically when that happens.
  owner: null
  referencedBy: []
- ref: 3.1.1
  layer: 1
  specSection:
    ref: '3.1'
    title: Membership States
  normativity: MUST
  key: l1.membership-states.1
  i18n:
    en: The community MUST define explicit membership states.
    de: Die Gemeinschaft MUSS explizite Mitgliedschaftsstatus definieren.
    es: La comunidad DEBE definir estados de membresía explícitos.
    fr: La communauté DOIT définir des états d'adhésion explicites.
    pt-br: A comunidade DEVE definir estados explícitos de filiação.
  disposition: defined_by_section
  referencedBy:

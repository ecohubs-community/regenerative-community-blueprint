    es: >-
      Las reuniones NO DEBEN exceder su alcance de decisión declarado ni eludir los límites de
      autoridad definidos en la Capa 2.
    fr: >-
      Les réunions NE DOIVENT PAS dépasser leur périmètre décisionnel déclaré ni contourner les
      limites d'autorité définies dans la Couche 2.
    pt-br: >-
      As reuniões NÃO DEVEM exceder seu escopo decisório declarado nem contornar os limites de
      autoridade definidos na Camada 2.
  disposition: defined_by_section
  referencedBy:
    - meeting-templates.meeting-type-operations
    - meeting-templates.meeting-type-governance
    - meeting-templates.meeting-type-coordination-alignment
    - meeting-templates.meeting-type-reflection-learning
    - meeting-templates.meeting-type-conflict-handling
  owner: meeting-templates.meeting-type-operations
- ref: 7.2.4
  layer: 5
  specSection:
    ref: '7.2'
    title: Meeting System
  normativity: MUST
  key: l5.meeting-system.4
  i18n:
    en: Meeting load MUST be bounded, monitored, and reviewable as defined in Section 7.4.
    de: >-
      Die Sitzungsbelastung MUSS begrenzt, überwacht und überprüfbar sein, wie in Abschnitt 7.4
      definiert.
    es: >-
      La carga de reuniones DEBE estar acotada, monitoreada y ser revisable según lo definido en la
      Sección 7.4.
    fr: >-
      La charge de réunions DOIT être limitée, suivie et révisable tel que défini dans la Section
      7.4.
    pt-br: A carga de reuniões DEVE ser limitada, monitorada e revisável, conforme definido na Seção 7.4.
  disposition: defined_by_section
  referencedBy:
    - meeting-templates.meeting-type-operations
  owner: meeting-templates.meeting-type-operations
- ref: 7.3.1
  layer: 5
  specSection:
    ref: '7.3'
    title: Documentation and Information Flow
  normativity: MUST
  key: l5.documentation-and-information-flow.1
  i18n:
    en: >-
      The community MUST define explicit documentation rules for decisions, roles, operations, and
      shared obligations.
    de: >-
      Die Gemeinschaft MUSS explizite Dokumentationsregeln für Entscheidungen, Rollen,
      Betriebsabläufe und gemeinsame Pflichten definieren.
    es: >-
      La comunidad DEBE definir reglas explícitas de documentación para decisiones, roles,
      operaciones y obligaciones compartidas.
    fr: >-
      La communauté DOIT définir des règles de documentation explicites pour les décisions, les
      rôles, les opérations et les obligations partagées.
    pt-br: >-
      A comunidade DEVE definir regras explícitas de documentação para decisões, papéis, operações e
      obrigações compartilhadas.
  disposition: defined_by_section
  referencedBy:
    - operations-manual.documentation-locations-and-update-procedures

- ref: 8.6.3
  layer: 6
  specSection:
    ref: '8.6'
    title: Artifacts
  normativity: MUST
  key: l6.artifacts.3
  i18n:
    en: |-
      The Change Protocol MUST define, at minimum:
      - How changes are proposed, reviewed, adopted, published, and rejected
      - How proposals are classified by decision type
      - Required contents of change proposals
      - Transition, migration, and deprecation expectations
      - Review, revision, and rollback mechanisms
      - Emergency change provisions, including strict time bounds and mandatory review
    de: >-
      Das Änderungsprotokoll MUSS mindestens folgendes definieren:

      - Wie Änderungen vorgeschlagen, überprüft, angenommen, veröffentlicht und abgelehnt werden

      - Wie Vorschläge nach Entscheidungstyp klassifiziert werden

      - Erforderliche Inhalte von Änderungsvorschlägen

      - Übergangs-, Migrations- und Abkündigungserwartungen

      - Überprüfungs-, Überarbeitungs- und Rollback-Mechanismen

      - Notfalländerungsbestimmungen, einschließlich strikter Zeitbegrenzung und verpflichtender
      Überprüfung
    es: >-
      El Protocolo de Cambios DEBE definir, como mínimo:

      - Cómo se proponen, revisan, adoptan, publican y rechazan los cambios

      - Cómo se clasifican las propuestas por tipo de decisión

      - El contenido requerido de las propuestas de cambio

      - Las expectativas de transición, migración y deprecación

      - Los mecanismos de revisión, corrección y reversión

      - Las disposiciones para cambios de emergencia, incluyendo límites temporales estrictos y
      revisión obligatoria
    fr: >-
      Le Protocole de changement DOIT définir, au minimum :

      - Comment les changements sont proposés, examinés, adoptés, publiés et rejetés

      - Comment les propositions sont classées par type de décision

      - Le contenu requis des propositions de changement

      - Les attentes en matière de transition, de migration et de dépréciation

      - Les mécanismes de révision, de modification et de retour en arrière

      - Les dispositions relatives aux changements d'urgence, y compris des limites temporelles
      strictes et une révision obligatoire
    pt-br: >-
      O Protocolo de Mudança DEVE definir, no mínimo:

      - Como as mudanças são propostas, revisadas, adotadas, publicadas e rejeitadas

      - Como as propostas são classificadas por tipo de decisão

      - O conteúdo obrigatório das propostas de mudança

      - As expectativas de transição, migração e descontinuação

      - Os mecanismos de revisão, alteração e reversão

      - As disposições para mudanças emergenciais, incluindo limites estritos de tempo e revisão
      obrigatória
  disposition: defined_by_section
  referencedBy:

  normativity: MUST
  key: l3.accumulation-constraints.2
  i18n:
    en: >-
      If internal units exist, the community MUST define one or more accumulation-limiting
      mechanisms, which MAY include:

      - Caps

      - Decay or expiration

      - Non-transferability

      - Redistribution or taxation mechanisms

      - Time-bounded validity
    de: >-
      Falls interne Einheiten existieren, MUSS die Gemeinschaft einen oder mehrere
      akkumulationsbegrenzende Mechanismen definieren, die Folgendes umfassen KÖNNEN:

      - Obergrenzen

      - Verfall oder Ablauf

      - Nicht-Übertragbarkeit

      - Umverteilungs- oder Besteuerungsmechanismen

      - Zeitlich begrenzte Gültigkeit
    es: >-
      Si existen unidades internas, la comunidad DEBE definir uno o más mecanismos de limitación de
      acumulación, que PUEDEN incluir:

      - Límites máximos

      - Decaimiento o expiración

      - No transferibilidad

      - Mecanismos de redistribución o tributación

      - Validez acotada en el tiempo
    fr: >-
      Si des unités internes existent, la communauté DOIT définir un ou plusieurs mécanismes de

    de: >-
      Konflikte MUSS als behandelte Bedingung mit definierten Wegen betrachtet werden; das
      Ignorieren, Unterdrücken oder Normalisieren ungelöster Konflikte MUSS als Systemverstoß
      gelten.
    es: >-
      El conflicto DEBE tratarse como una condición gestionada con vías definidas; ignorar, suprimir
      o normalizar un conflicto no resuelto DEBE considerarse una violación del sistema.
    fr: >-
      Le conflit DOIT être traité comme une condition gérée avec des voies définies ; ignorer,
      supprimer ou normaliser un conflit non résolu DOIT être considéré comme une violation du
      système.
    pt-br: >-
      O conflito DEVE ser tratado como uma condição gerenciada com caminhos definidos; ignorar,
      suprimir ou normalizar conflitos não resolvidos DEVE ser considerado uma violação do sistema.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.resolution-ladder-steps
  owner: conflict-resolution-ladder.resolution-ladder-steps
- ref: 6.6.2
  layer: 4
  specSection:
    ref: '6.6'
    title: Layer Invariants
  normativity: MUST
  key: l4.layer-invariants.2
  i18n:
    en: Conflicts involving power asymmetries MUST trigger elevated safeguards.
    de: Konflikte mit Machtasymmetrien MUSS erhöhte Schutzmaßnahmen auslösen.
    es: Los conflictos que involucren asimetrías de poder DEBEN activar salvaguardas elevadas.
    fr: >-
      Les conflits impliquant des asymétries de pouvoir DOIVENT déclencher des mesures de protection
      renforcées.
    pt-br: Conflitos que envolvam assimetrias de poder DEVEM acionar salvaguardas elevadas.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.safeguards
  owner: conflict-resolution-ladder.safeguards
- ref: 6.6.3
  layer: 4
  specSection:
    ref: '6.6'
    title: Layer Invariants
  normativity: MUST
  key: l4.layer-invariants.3
  i18n:
    en: Repair and restoration MUST precede punishment except where immediate safety is at risk.
    de: >-
      Wiedergutmachung und Wiederherstellung MUSS vor Bestrafung stehen, außer wenn unmittelbare
      Sicherheit gefährdet ist.
    es: >-
      La reparación y la restauración DEBEN preceder al castigo, excepto cuando la seguridad
      inmediata esté en riesgo.
    fr: >-
      La réparation et la restauration DOIVENT précéder la punition, sauf lorsque la sécurité
      immédiate est en jeu.
    pt-br: >-
      Reparação e restauração DEVEM preceder a punição, exceto quando a segurança imediata estiver
      em risco.
  disposition: defined_by_section
  referencedBy:
    - accountability-protocol.sanction-and-repair-options
  owner: accountability-protocol.sanction-and-repair-options
- ref: 6.6.4
  layer: 4
  specSection:
    ref: '6.6'
    title: Layer Invariants
  normativity: MUST
  key: l4.layer-invariants.4
  i18n:
    en: >-
      Physical, psychological, and child safety MUST override participation rights, role continuity,
      and reputational concerns.
    de: >-
      Physische, psychische und Kindersicherheit MUSS Teilnahmerechte, Rollenkontinuität und
      Reputationsbelange übersteuern.
    es: >-
      La seguridad física, psicológica y de menores DEBE prevalecer sobre los derechos de
      participación, la continuidad del rol y las consideraciones de reputación.
    fr: >-
      La sécurité physique, psychologique et celle des enfants DOIT prévaloir sur les droits de
      participation, la continuité des rôles et les préoccupations de réputation.
    pt-br: >-
      A segurança física, psicológica e infantil DEVE prevalecer sobre direitos de participação,
      continuidade de papéis e preocupações reputacionais.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.7.1
  layer: 4
  specSection:
    ref: '6.7'
    title: Explicitness Rules
  normativity: MUST
  key: l4.explicitness-rules.1
  i18n:
    en: |-
      The following MUST be explicit:
      - Conflict classification system
      - Minimum resolution and escalation process
      - Safeguards and anti-retaliation protections
      - Sanction, repair, and separation thresholds
    de: |-
      Folgendes MUSS explizit sein:
      - Konfliktklassifikationssystem
      - Mindest-Lösungs- und Eskalationsprozess
      - Schutzmaßnahmen und Vergeltungsschutz
      - Sanktions-, Wiedergutmachungs- und Trennungsschwellen
    es: |-
      Lo siguiente DEBE ser explícito:
      - Sistema de clasificación de conflictos
      - Proceso mínimo de resolución y escalamiento
      - Salvaguardas y protecciones contra represalias
      - Umbrales de sanción, reparación y separación
    fr: |-
      Les éléments suivants DOIVENT être explicites :
      - Le système de classification des conflits
      - Le processus minimum de résolution et d'escalade
      - Les mesures de protection et les protections contre les représailles
      - Les seuils de sanctions, de réparation et de séparation
    pt-br: |-
      O seguinte DEVE ser explícito:
      - Sistema de classificação de conflitos
      - Processo mínimo de resolução e escalonamento
      - Salvaguardas e proteções anti-retaliação
      - Limiares de sanção, reparação e separação
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.conflict-classification
  owner: conflict-resolution-ladder.conflict-classification
- ref: 6.7.2
  layer: 4
  specSection:
    ref: '6.7'
    title: Explicitness Rules
  normativity: MAY
  key: l4.explicitness-rules.2
  i18n:
    en: |-
      The following MAY be explicit:
      - Mediation styles or methodologies
      - Facilitator selection preferences beyond minimum safeguards
      - Restorative or reparative practices
    de: |-
      Folgendes KANN explizit sein:
      - Mediationsstile oder -methoden
      - Präferenzen bei der Auswahl von Moderator\*innen über die Mindestschutzmaßnahmen hinaus
      - Restaurative oder reparative Praktiken
    es: |-
      Lo siguiente PUEDE ser explícito:
      - Estilos o metodologías de mediación
      - Preferencias de selección de facilitadores más allá de las salvaguardas mínimas
      - Prácticas restaurativas o reparativas
    fr: |-
      Les éléments suivants PEUVENT être explicites :
      - Les styles ou méthodologies de médiation
      - Les préférences de sélection des facilitateurs au-delà des mesures de protection minimales
      - Les pratiques restauratives ou réparatrices
    pt-br: |-
      O seguinte PODE ser explícito:
      - Estilos ou metodologias de mediação
      - Preferências de seleção de facilitadores além das salvaguardas mínimas
      - Práticas restaurativas ou reparativas
  disposition: defined_by_section
  referencedBy: []
  owner: null
- ref: 6.7.3
  layer: 4
  specSection:
    ref: '6.7'
    title: Explicitness Rules
  normativity: MUST
  key: l4.explicitness-rules.3
  i18n:
    en: |-
      The following MUST remain optional and out of scope:
      - Emotional expression norms
      - Therapeutic, spiritual, or ideological framing of conflict
    de: |-
      Folgendes MUSS optional und außerhalb des Geltungsbereichs bleiben:
      - Normen für emotionalen Ausdruck
      - Therapeutische, spirituelle oder ideologische Rahmung von Konflikten
    es: |-
      Lo siguiente DEBE permanecer opcional y fuera de alcance:
      - Normas de expresión emocional
      - Encuadre terapéutico, espiritual o ideológico del conflicto
    fr: |-
      Les éléments suivants DOIVENT rester optionnels et hors périmètre :
      - Les normes d'expression émotionnelle
      - Le cadrage thérapeutique, spirituel ou idéologique du conflit
    pt-br: |-
      O seguinte DEVE permanecer opcional e fora do escopo:
      - Normas de expressão emocional
      - Enquadramentos terapêuticos, espirituais ou ideológicos do conflito
  disposition: not_a_definition
  dispositionNote: >-
    Bounds the standard: emotional expression norms and therapeutic, spiritual or ideological
    framings of conflict stay out of scope.
  owner: null
  referencedBy: []
- ref: 7.1.1
  layer: 5
  specSection:
    ref: '7.1'
    title: Roles and Responsibilities
  normativity: MUST
  key: l5.roles-and-responsibilities.1
  i18n:
    en: >-
      All ongoing responsibilities MUST be assigned to explicit, named roles rather than implicit
      expectations or informal agreements.
    de: >-
      Alle laufenden Verantwortlichkeiten MUSS expliziten, benannten Rollen zugewiesen werden —
      nicht impliziten Erwartungen oder informellen Absprachen.
    es: >-
      Todas las responsabilidades continuas DEBEN asignarse a roles explícitos y con nombre, en
      lugar de expectativas implícitas o acuerdos informales.
    fr: >-
      Toutes les responsabilités continues DOIVENT être assignées à des rôles explicites et nommés
      plutôt qu'à des attentes implicites ou des accords informels.
    pt-br: >-
      Todas as responsabilidades contínuas DEVEM ser atribuídas a papéis explícitos e nomeados, em
      vez de expectativas implícitas ou acordos informais.
  disposition: defined_by_section
  referencedBy:
    - role-registry.overview
    - role-registry.functional-roles
  owner: role-registry.overview
- ref: 7.1.2
  layer: 5
  specSection:
    ref: '7.1'
    title: Roles and Responsibilities
  normativity: MUST
  key: l5.roles-and-responsibilities.2
  i18n:
    en: |-
      The community MUST maintain a **Role Registry** that includes, at minimum:
      - Role name and purpose
      - Scope of responsibility and decision authority
      - Explicit boundaries and interfaces with other roles, circles, or domains
      - Eligibility criteria (if any)
      - Term length, rotation, or review conditions (if any)
      - Appointment, review, and removal process
    de: |-
      Die Gemeinschaft MUSS ein **Rollenregister** führen, das mindestens Folgendes enthält:
      - Rollenname und Zweck
      - Umfang der Verantwortung und Entscheidungsbefugnis
      - Explizite Abgrenzungen und Schnittstellen zu anderen Rollen, Kreisen oder Bereichen
      - Eignungskriterien (falls vorhanden)
      - Amtszeit, Rotation oder Überprüfungsbedingungen (falls vorhanden)
      - Ernennungs-, Überprüfungs- und Abberufungsverfahren
    es: |-
      La comunidad DEBE mantener un **Registro de Roles** que incluya, como mínimo:
      - Nombre y propósito del rol
      - Alcance de la responsabilidad y autoridad de decisión
      - Límites explícitos e interfaces con otros roles, círculos o dominios
      - Criterios de elegibilidad (si los hay)
      - Duración del mandato, rotación o condiciones de revisión (si las hay)
      - Proceso de designación, revisión y remoción
    fr: |-
      La communauté DOIT maintenir un **Registre des rôles** qui inclut, au minimum :
      - Nom et raison d'être du rôle
      - Périmètre de responsabilité et autorité décisionnelle
      - Limites explicites et interfaces avec les autres rôles, cercles ou domaines
      - Critères d'éligibilité (le cas échéant)
      - Durée du mandat, rotation ou conditions de révision (le cas échéant)
      - Processus de nomination, d'évaluation et de révocation
    pt-br: |-
      A comunidade DEVE manter um **Registro de Papéis** que inclua, no mínimo:
      - Nome e propósito do papel
      - Escopo de responsabilidade e autoridade decisória
      - Limites explícitos e interfaces com outros papéis, círculos ou domínios
      - Critérios de elegibilidade (se houver)
      - Duração do mandato, rotação ou condições de revisão (se houver)
      - Processo de nomeação, revisão e remoção
  disposition: defined_by_section
  referencedBy:
    - role-registry.overview
    - role-registry.operational-roles
    - role-registry.functional-roles
  owner: role-registry.overview
- ref: 7.1.3
  layer: 5
  specSection:
    ref: '7.1'
    title: Roles and Responsibilities
  normativity: MUST
  key: l5.roles-and-responsibilities.3
  i18n:
    en: |-
      Each role MUST include an explicit accountability mechanism defining:
      - How role performance is reviewed
      - How underperformance, overload, or role failure is handled
      - How handover and knowledge transfer occur
    de: |-
      Jede Rolle MUSS einen expliziten Rechenschaftsmechanismus beinhalten, der Folgendes definiert:
      - Wie die Rollenerfüllung überprüft wird
      - Wie mit mangelhafter Leistung, Überlastung oder Rollenversagen umgegangen wird
      - Wie Übergabe und Wissenstransfer erfolgen
    es: |-
      Cada rol DEBE incluir un mecanismo explícito de rendición de cuentas que defina:
      - Cómo se revisa el desempeño del rol
      - Cómo se gestiona el bajo rendimiento, la sobrecarga o el fallo del rol
      - Cómo se realizan los traspasos y la transferencia de conocimiento
    fr: |-
      Chaque rôle DOIT inclure un mécanisme de redevabilité explicite définissant :
      - Comment la performance du rôle est évaluée
      - Comment la sous-performance, la surcharge ou la défaillance du rôle est traitée
      - Comment la passation et le transfert de connaissances s'effectuent
    pt-br: |-
      Cada papel DEVE incluir um mecanismo explícito de prestação de contas que defina:
      - Como o desempenho no papel é avaliado
      - Como o baixo desempenho, sobrecarga ou falha no papel é tratado
      - Como ocorrem a transição e a transferência de conhecimento
  disposition: defined_by_section
  referencedBy:
    - role-registry.operational-roles
  owner: role-registry.operational-roles
- ref: 7.1.4
  layer: 5
  specSection:
    ref: '7.1'
    title: Roles and Responsibilities
  normativity: MAY
  key: l5.roles-and-responsibilities.4
  i18n:
    en: >-
      No ongoing responsibility MAY exist without an explicit role, and no person MAY be held
      accountable for responsibilities not formally assigned to a role.
    de: >-
      Keine laufende Verantwortlichkeit KANN ohne eine explizite Rolle bestehen, und keine Person
      KANN für Verantwortlichkeiten zur Rechenschaft gezogen werden, die nicht formal einer Rolle
      zugewiesen sind.
    es: >-
      Ninguna responsabilidad continua PUEDE existir sin un rol explícito, y ninguna persona PUEDE
      ser responsabilizada por obligaciones que no estén formalmente asignadas a un rol.
    fr: >-
      Aucune responsabilité continue NE PEUT exister sans un rôle explicite, et aucune personne NE
      PEUT être tenue responsable de responsabilités qui ne sont pas formellement assignées à un
      rôle.
    pt-br: >-
      Nenhuma responsabilidade contínua PODE existir sem um papel explícito, e nenhuma pessoa PODE
      ser responsabilizada por responsabilidades que não foram formalmente atribuídas a um papel.
  disposition: defined_by_section
  referencedBy:
    - operations-manual.temporary-and-ad-hoc-responsibilities
    - role-registry.overview
  owner: role-registry.overview
- ref: 7.1.5
  layer: 5
  specSection:
    ref: '7.1'
    title: Roles and Responsibilities
  normativity: MUST
  key: l5.roles-and-responsibilities.5
  i18n:
    en: >-
      Temporary or ad-hoc responsibilities MUST be explicitly time-bounded and MUST NOT become
      ongoing without formal role definition.
    de: >-
      Temporäre oder Ad-hoc-Verantwortlichkeiten MUSS explizit zeitlich begrenzt sein und DARF NICHT
      ohne formale Rollendefinition dauerhaft werden.
    es: >-
      Las responsabilidades temporales o ad-hoc DEBEN estar explícitamente acotadas en el tiempo y
      NO DEBEN convertirse en continuas sin una definición formal de rol.
    fr: >-
      Les responsabilités temporaires ou ponctuelles DOIVENT être explicitement limitées dans le
      temps et NE DOIVENT PAS devenir continues sans une définition formelle de rôle.
    pt-br: >-
      Responsabilidades temporárias ou pontuais DEVEM ter um prazo explícito e NÃO DEVEM se tornar
      contínuas sem a definição formal de um papel.
  disposition: defined_by_section
  referencedBy:
    - operations-manual.temporary-and-ad-hoc-responsibilities
  owner: operations-manual.temporary-and-ad-hoc-responsibilities
- ref: 7.2.1
  layer: 5
  specSection:
    ref: '7.2'
    title: Meeting System
  normativity: MUST
  key: l5.meeting-system.1
  i18n:
    en: |-
      The community MUST define explicit meeting types sufficient to support:
      - Operations
      - Governance
      - Coordination and alignment
      - Reflection and learning
      - Conflict handling (as required by Layer 4)
    de: >-
      Die Gemeinschaft MUSS explizite Sitzungstypen definieren, die ausreichen, um Folgendes zu
      unterstützen:

      - Betrieb

      - Governance

      - Koordination und Abstimmung

      - Reflexion und Lernen

      - Konfliktbearbeitung (wie von Schicht 4 gefordert)
    es: |-
      La comunidad DEBE definir tipos de reuniones explícitos suficientes para dar soporte a:
      - Operaciones
      - Gobernanza
      - Coordinación y alineación
      - Reflexión y aprendizaje
      - Gestión de conflictos (según lo requerido por la Capa 4)
    fr: |-
      La communauté DOIT définir des types de réunions explicites suffisants pour couvrir :
      - Les opérations
      - La gouvernance
      - La coordination et l'alignement
      - La réflexion et l'apprentissage
      - Le traitement des conflits (tel que requis par la Couche 4)
    pt-br: |-
      A comunidade DEVE definir tipos de reunião explícitos, suficientes para apoiar:
      - Operações
      - Governança
      - Coordenação e alinhamento
      - Reflexão e aprendizado
      - Tratamento de conflitos (conforme exigido pela Camada 4)
  disposition: defined_by_section
  referencedBy:
    - meeting-templates.meeting-type-operations
    - meeting-templates.meeting-type-governance
    - meeting-templates.meeting-type-coordination-alignment
    - meeting-templates.meeting-type-reflection-learning
    - meeting-templates.meeting-type-conflict-handling
  owner: meeting-templates.meeting-type-operations
- ref: 7.2.2
  layer: 5
  specSection:
    ref: '7.2'
    title: Meeting System
  normativity: MUST
  key: l5.meeting-system.2
  i18n:
    en: |-
      Each meeting type MUST define, at minimum:
      - Purpose and decision scope
      - Required vs optional participants
      - Cadence and duration boundaries
      - Facilitation role and selection or rotation process
      - Agenda structure
      - Documentation and publication requirements
      - Decision capture requirements where decisions are made
    de: |-
      Jeder Sitzungstyp MUSS mindestens Folgendes definieren:
      - Zweck und Entscheidungsumfang
      - Erforderliche vs. optionale Teilnehmende
      - Kadenz und zeitliche Begrenzungen
      - Moderationsrolle und Auswahl- oder Rotationsverfahren
      - Tagesordnungsstruktur
      - Dokumentations- und Veröffentlichungsanforderungen
      - Anforderungen an die Entscheidungserfassung, wo Entscheidungen getroffen werden
    es: |-
      Cada tipo de reunión DEBE definir, como mínimo:
      - Propósito y alcance de decisión
      - Participantes obligatorios vs opcionales
      - Cadencia y límites de duración
      - Rol de facilitación y proceso de selección o rotación
      - Estructura de la agenda
      - Requisitos de documentación y publicación
      - Requisitos de captura de decisiones cuando se toman decisiones
    fr: |-
      Chaque type de réunion DOIT définir, au minimum :
      - L'objectif et le périmètre décisionnel
      - Les participants obligatoires et facultatifs
      - La cadence et les limites de durée
      - Le rôle de facilitation et le processus de sélection ou de rotation
      - La structure de l'ordre du jour
      - Les exigences de documentation et de publication
      - Les exigences de consignation des décisions lorsque des décisions sont prises
    pt-br: |-
      Cada tipo de reunião DEVE definir, no mínimo:
      - Propósito e escopo decisório
      - Participantes obrigatórios versus opcionais
      - Limites de cadência e duração
      - Papel de facilitação e processo de seleção ou rotação
      - Estrutura da pauta
      - Requisitos de documentação e publicação
      - Requisitos de registro de decisões quando decisões são tomadas
  disposition: defined_by_section
  referencedBy:
    - meeting-templates.meeting-type-operations
    - meeting-templates.meeting-type-governance
    - meeting-templates.meeting-type-coordination-alignment
    - meeting-templates.meeting-type-reflection-learning
    - meeting-templates.meeting-type-conflict-handling
  owner: meeting-templates.meeting-type-operations
- ref: 7.2.3
  layer: 5
  specSection:
    ref: '7.2'
    title: Meeting System
  normativity: MUST
  key: l5.meeting-system.3
  i18n:
    en: >-
      Meetings MUST NOT exceed their declared decision scope or bypass authority boundaries defined
      in Layer 2.
    de: >-
      Sitzungen DARF NICHT ihren erklärten Entscheidungsumfang überschreiten oder die in Schicht 2

      - Reglas de conflicto de intereses para gastos y adquisiciones
    fr: |-
      Le Règlement de Trésorerie DOIT définir, au minimum :
      - Les sources de revenus
      - Les seuils d'autorité de dépense et les parcours d'approbation
      - Les exigences de transparence et de reporting (y compris les exceptions encadrées)
      - Les contraintes de réserve, de risque et d'endettement
      - Les règles relatives aux conflits d'intérêts pour les dépenses et les approvisionnements
    pt-br: |-
      O Conjunto de Regras da Tesouraria DEVE definir, no mínimo:
      - Fontes de receita
      - Limites de autoridade de gastos e caminhos de aprovação
      - Requisitos de transparência e prestação de contas (incluindo quaisquer exceções limitadas)
      - Restrições de reserva, risco e endividamento
      - Regras de conflito de interesse para gastos e aquisições
  disposition: defined_by_section
  referencedBy:
    - treasury-ruleset.treasury-scope
  owner: treasury-ruleset.treasury-scope
- ref: 5.6.1
  layer: 3
  specSection:
    ref: '5.6'

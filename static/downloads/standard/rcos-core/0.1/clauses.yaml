  normativity: MUST
  key: l6.experiments.5
  i18n:
    en: >-
      If an experiment introduces safety risk, coercion, or sustained harm, the community MUST
      suspend or terminate the experiment immediately through a protective action, followed by
      post-hoc review.
    de: >-
      Wenn ein Experiment Sicherheitsrisiken, Zwang oder anhaltenden Schaden verursacht, MUSS die

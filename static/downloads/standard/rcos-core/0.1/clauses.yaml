      - Roles and responsibilities
      - Operational authority boundaries and interfaces
      - Meeting types and scopes
      - Decision documentation rules
      - Information access and privacy boundaries
    de: |-
      Folgendes MUSS explizit sein:
      - Rollen und Verantwortlichkeiten
      - Betriebliche Autoritätsgrenzen und Schnittstellen
      - Sitzungstypen und -umfänge
      - Regeln zur Entscheidungsdokumentation
      - Informationszugang und Datenschutzgrenzen
    es: |-
      Lo siguiente DEBE ser explícito:
      - Roles y responsabilidades
      - Límites e interfaces de autoridad operativa
      - Tipos y alcances de reuniones
      - Reglas de documentación de decisiones
      - Límites de acceso a la información y privacidad
    fr: |-
      Les éléments suivants DOIVENT être explicites :
      - Les rôles et responsabilités
      - Les limites d'autorité opérationnelle et les interfaces
      - Les types et périmètres de réunions
      - Les règles de documentation des décisions
      - Les limites d'accès à l'information et de confidentialité
    pt-br: |-
      Os seguintes itens DEVEM ser explícitos:
      - Papéis e responsabilidades
      - Limites e interfaces de autoridade operacional
      - Tipos de reunião e seus escopos
      - Regras de documentação de decisões
      - Limites de acesso à informação e de privacidade
  disposition: defined_by_section
  referencedBy:
    - operations-manual.documentation-locations-and-update-procedures
  owner: operations-manual.documentation-locations-and-update-procedures
- ref: 7.8.2
  layer: 5
  specSection:
    ref: '7.8'
    title: Explicitness Rules
  normativity: MAY
  key: l5.explicitness-rules.2
  i18n:
    en: |-
      The following MAY be explicit:
      - Detailed meeting cadence beyond minimum constraints
      - Tooling choices for documentation and coordination
      - Role rotation or succession schedules
    de: |-
      Folgendes KANN explizit sein:
      - Detaillierte Sitzungskadenz über die Mindestanforderungen hinaus
      - Tooling-Entscheidungen für Dokumentation und Koordination
      - Rotations- oder Nachfolgepläne für Rollen
    es: |-
      Lo siguiente PUEDE ser explícito:
      - Cadencia detallada de reuniones más allá de las restricciones mínimas
      - Elección de herramientas para documentación y coordinación
      - Calendarios de rotación o sucesión de roles
    fr: |-
      Les éléments suivants PEUVENT être explicites :
      - La cadence détaillée des réunions au-delà des contraintes minimales
      - Les choix d'outils pour la documentation et la coordination
      - Les calendriers de rotation ou de succession des rôles
    pt-br: |-
      Os seguintes itens PODEM ser explícitos:
      - Cadência detalhada de reuniões além das restrições mínimas
      - Escolhas de ferramentas para documentação e coordenação
      - Cronogramas de rotação ou sucessão de papéis
  disposition: defined_by_section
  referencedBy: []
  owner: null
- ref: 7.8.3
  layer: 5
  specSection:
    ref: '7.8'
    title: Explicitness Rules
  normativity: MUST
  key: l5.explicitness-rules.3
  i18n:
    en: |-
      The following MUST remain optional and out of scope:
      - Personal work styles
      - Aesthetic or cultural preferences
      - Informal social coordination
    de: |-
      Folgendes MUSS optional und außerhalb des Geltungsbereichs bleiben:
      - Persönliche Arbeitsstile
      - Ästhetische oder kulturelle Präferenzen
      - Informelle soziale Koordination
    es: |-
      Lo siguiente DEBE permanecer opcional y fuera de alcance:
      - Estilos de trabajo personales
      - Preferencias estéticas o culturales
      - Coordinación social informal
    fr: |-
      Les éléments suivants DOIVENT rester optionnels et hors périmètre :
      - Les styles de travail personnels
      - Les préférences esthétiques ou culturelles
      - La coordination sociale informelle
    pt-br: |-
      Os seguintes itens DEVEM permanecer opcionais e fora do escopo:
      - Estilos pessoais de trabalho
      - Preferências estéticas ou culturais
      - Coordenação social informal
  disposition: not_a_definition
  dispositionNote: >-
    Bounds the standard: personal work styles, aesthetic preferences and informal social
    coordination stay out of scope.
  owner: null
  referencedBy: []
- ref: 8.1.1
  layer: 6
  specSection:
    ref: '8.1'
    title: Change Mechanisms
  normativity: MUST
  key: l6.change-mechanisms.1
  i18n:
    en: >-
      The community MUST define explicit change mechanisms for modifying, adding, suspending, or
      removing rules, roles, artifacts, or decision structures.
    de: >-
      Die Gemeinschaft MUSS explizite Änderungsmechanismen für das Modifizieren, Hinzufügen,
      Aussetzen oder Entfernen von Regeln, Rollen, Artefakten oder Entscheidungsstrukturen
      definieren.
    es: >-
      La comunidad DEBE definir mecanismos de cambio explícitos para modificar, agregar, suspender o
      eliminar reglas, roles, artefactos o estructuras de decisión.
    fr: >-
      La communauté DOIT définir des mécanismes de changement explicites pour modifier, ajouter,
      suspendre ou supprimer des règles, rôles, artefacts ou structures de décision.
    pt-br: >-
      A comunidade DEVE definir mecanismos explícitos de mudança para modificar, adicionar,
      suspender ou remover regras, papéis, artefatos ou estruturas de decisão.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.how-changes-are-proposed
  owner: change-protocol.how-changes-are-proposed
- ref: 8.1.2
  layer: 6
  specSection:
    ref: '8.1'
    title: Change Mechanisms
  normativity: MUST
  key: l6.change-mechanisms.2
  i18n:
    en: |-
      Change mechanisms MUST explicitly distinguish between:
      - Permanent rule changes
      - Time-bounded experiments as defined in Section 8.3
    de: |-
      Änderungsmechanismen MUSS explizit unterscheiden zwischen:
      - Dauerhaften Regeländerungen
      - Zeitlich begrenzten Experimenten gemäß Abschnitt 8.3
    es: |-
      Los mecanismos de cambio DEBEN distinguir explícitamente entre:
      - Cambios permanentes de reglas
      - Experimentos con duración acotada según lo definido en la Sección 8.3
    fr: |-
      Les mécanismes de changement DOIVENT explicitement distinguer entre :
      - Les modifications permanentes de règles
      - Les expérimentations limitées dans le temps telles que définies dans la Section 8.3
    pt-br: |-
      Os mecanismos de mudança DEVEM distinguir explicitamente entre:
      - Mudanças permanentes de regras
      - Experimentos com prazo definido, conforme descrito na Seção 8.3
  disposition: defined_by_section
  referencedBy:
    - change-protocol.how-proposals-are-classified
    - change-protocol.review-and-deliberation
  owner: change-protocol.how-proposals-are-classified
- ref: 8.1.3
  layer: 6
  specSection:
    ref: '8.1'
    title: Change Mechanisms
  normativity: MUST
  key: l6.change-mechanisms.3
  i18n:
    en: |-
      Every proposed change MUST specify, at minimum:
      - The artifact(s), layer(s), and section(s) affected
      - The decision type and authorized decision path as defined in Layer 2
      - The intended effect, scope, and known risks
      - The effective date and any transition period
      - Migration requirements for existing roles, agreements, or records
    de: |-
      Jede vorgeschlagene Änderung MUSS mindestens folgendes angeben:
      - Die betroffenen Artefakte, Layer und Abschnitte
      - Den Entscheidungstyp und den autorisierten Entscheidungspfad gemäß Schicht 2
      - Die beabsichtigte Wirkung, den Geltungsbereich und bekannte Risiken
      - Das Inkrafttretungsdatum und etwaige Übergangsfristen
      - Migrationsanforderungen für bestehende Rollen, Vereinbarungen oder Aufzeichnungen
    es: |-
      Cada cambio propuesto DEBE especificar, como mínimo:
      - El/los artefacto(s), capa(s) y sección(es) afectados
      - El tipo de decisión y la vía de decisión autorizada según lo definido en la Capa 2
      - El efecto previsto, el alcance y los riesgos conocidos
      - La fecha de entrada en vigor y cualquier período de transición
      - Los requisitos de migración para roles, acuerdos o registros existentes
    fr: |-
      Chaque changement proposé DOIT spécifier, au minimum :
      - Le(s) artefact(s), couche(s) et section(s) concerné(e)s
      - Le type de décision et le chemin de décision autorisé tel que défini dans la Couche 2
      - L'effet visé, la portée et les risques connus
      - La date d'entrée en vigueur et toute période de transition
      - Les exigences de migration pour les rôles, accords ou registres existants
    pt-br: |-
      Toda mudança proposta DEVE especificar, no mínimo:
      - O(s) artefato(s), camada(s) e seção(ões) afetados
      - O tipo de decisão e o caminho decisório autorizado, conforme definido na Camada 2
      - O efeito pretendido, o escopo e os riscos conhecidos
      - A data de vigência e qualquer período de transição
      - Os requisitos de migração para papéis, acordos ou registros existentes
  disposition: defined_by_section
  referencedBy:
    - change-protocol.how-changes-are-proposed
  owner: change-protocol.how-changes-are-proposed
- ref: 8.1.4
  layer: 6
  specSection:
    ref: '8.1'
    title: Change Mechanisms
  normativity: MUST
  key: l6.change-mechanisms.4
  i18n:
    en: >-
      Changes affecting Layer 0 purpose, scope, invariants, or identity constraints MUST be
      classified as constitutional changes and MUST follow the constitutional decision mechanism.
    de: >-
      Änderungen, die den Zweck, den Geltungsbereich, die Invarianten oder die
      Identitätsbeschränkungen von Schicht 0 betreffen, MUSS als konstitutionelle Änderungen
      klassifiziert werden und MUSS dem konstitutionellen Entscheidungsmechanismus folgen.
    es: >-
      Los cambios que afecten el propósito, alcance, invariantes o restricciones de identidad de la
      Capa 0 DEBEN clasificarse como cambios constitucionales y DEBEN seguir el mecanismo de
      decisión constitucional.
    fr: >-
      Les changements affectant la finalité, la portée, les invariants ou les contraintes d'identité
      de la Couche 0 DOIVENT être classés comme changements constitutionnels et DOIVENT suivre le
      mécanisme de décision constitutionnel.
    pt-br: >-
      Mudanças que afetem o propósito, o escopo, os invariantes ou as restrições de identidade da
      Camada 0 DEVEM ser classificadas como mudanças constitucionais e DEVEM seguir o mecanismo de
      decisão constitucional.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.how-proposals-are-classified
  owner: change-protocol.how-proposals-are-classified
- ref: 8.1.5
  layer: 6
  specSection:
    ref: '8.1'
    title: Change Mechanisms
  normativity: MUST
  key: l6.change-mechanisms.5
  i18n:
    en: >-
      The community MUST define explicit review mechanisms for adopted changes, including how
      changes are evaluated, revised, or reverted when they produce harm, instability, or unintended
      concentration of power.
    de: >-
      Die Gemeinschaft MUSS explizite Überprüfungsmechanismen für angenommene Änderungen definieren,
      einschließlich wie Änderungen bewertet, überarbeitet oder rückgängig gemacht werden, wenn sie
      Schaden, Instabilität oder unbeabsichtigte Machtkonzentration verursachen.
    es: >-
      La comunidad DEBE definir mecanismos de revisión explícitos para los cambios adoptados,
      incluyendo cómo se evalúan, revisan o revierten los cambios cuando producen daño,
      inestabilidad o concentración no intencionada de poder.
    fr: >-
      La communauté DOIT définir des mécanismes de révision explicites pour les changements adoptés,
      y compris la manière dont les changements sont évalués, révisés ou annulés lorsqu'ils
      produisent des préjudices, de l'instabilité ou une concentration involontaire du pouvoir.
    pt-br: >-
      A comunidade DEVE definir mecanismos explícitos de revisão para as mudanças adotadas,
      incluindo como as mudanças são avaliadas, revisadas ou revertidas quando produzem dano,
      instabilidade ou concentração não intencional de poder.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.rollback
  owner: change-protocol.rollback
- ref: 8.2.1
  layer: 6
  specSection:
    ref: '8.2'
    title: Versioning and Authority
  normativity: MUST
  key: l6.versioning-and-authority.1
  i18n:
    en: All adopted changes MUST be versioned and traceable.
    de: Alle angenommenen Änderungen MUSS versioniert und nachvollziehbar sein.
    es: Todos los cambios adoptados DEBEN ser versionados y trazables.
    fr: Tous les changements adoptés DOIVENT être versionnés et traçables.
    pt-br: Todas as mudanças adotadas DEVEM ser versionadas e rastreáveis.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.adoption-and-publication
    - version-history.entry-format
  owner: version-history.entry-format
- ref: 8.2.2
  layer: 6
  specSection:
    ref: '8.2'
    title: Versioning and Authority
  normativity: MUST
  key: l6.versioning-and-authority.2
  i18n:
    en: |-
      The community MUST maintain a **Version History** that records, at minimum:
      - Version identifier
      - Adoption date and effective date
      - Decision record reference (authority, mechanism, threshold)
      - Summary of changes
      - Migration notes and compatibility constraints (if any)
    de: |-
      Die Gemeinschaft MUSS eine **Versionshistorie** führen, die mindestens folgendes dokumentiert:
      - Versionskennung
      - Annahmedatum und Inkrafttretungsdatum
      - Referenz zum Entscheidungsprotokoll (Autorität, Mechanismus, Schwellenwert)
      - Zusammenfassung der Änderungen
      - Migrationshinweise und Kompatibilitätsbeschränkungen (falls vorhanden)
    es: |-
      La comunidad DEBE mantener un **Historial de Versiones** que registre, como mínimo:
      - Identificador de versión
      - Fecha de adopción y fecha de entrada en vigor
      - Referencia al registro de decisión (autoridad, mecanismo, umbral)
      - Resumen de los cambios
      - Notas de migración y restricciones de compatibilidad (si las hay)
    fr: |-
      La communauté DOIT maintenir un **Historique des versions** qui enregistre, au minimum :
      - L'identifiant de version
      - La date d'adoption et la date d'entrée en vigueur
      - La référence au registre de décision (autorité, mécanisme, seuil)
      - Le résumé des changements
      - Les notes de migration et les contraintes de compatibilité (le cas échéant)
    pt-br: |-
      A comunidade DEVE manter um **Histórico de Versões** que registre, no mínimo:
      - Identificador da versão
      - Data de adoção e data de vigência
      - Referência ao registro da decisão (autoridade, mecanismo, limiar)
      - Resumo das mudanças
      - Notas de migração e restrições de compatibilidade (se houver)
  disposition: defined_by_section
  referencedBy:
    - change-protocol.adoption-and-publication
    - change-protocol.rejection
    - version-history.entry-format
  owner: version-history.entry-format
- ref: 8.2.3
  layer: 6
  specSection:
    ref: '8.2'
    title: Versioning and Authority
  normativity: MUST
  key: l6.versioning-and-authority.3
  i18n:
    en: |-
      At any point in time, the community MUST be able to unambiguously determine:
      - Which version is currently in force
      - Which artifacts are authoritative for compliance
    de: |-
      Zu jedem Zeitpunkt MUSS die Gemeinschaft eindeutig feststellen können:
      - Welche Version derzeit in Kraft ist
      - Welche Artefakte für die Konformität maßgeblich sind
    es: |-
      En cualquier momento, la comunidad DEBE poder determinar sin ambigüedad:
      - Qué versión está actualmente en vigor
      - Qué artefactos son los autoritativos para el cumplimiento
    fr: |-
      À tout moment, la communauté DOIT être en mesure de déterminer sans ambiguïté :
      - Quelle version est actuellement en vigueur
      - Quels artefacts font autorité en matière de conformité
    pt-br: |-
      A qualquer momento, a comunidade DEVE ser capaz de determinar inequivocamente:
      - Qual versão está atualmente em vigor
      - Quais artefatos são autoritativos para fins de conformidade
  disposition: defined_by_section
  referencedBy:
    - version-history.entry-format
  owner: version-history.entry-format
- ref: 8.2.4
  layer: 6
  specSection:
    ref: '8.2'
    title: Versioning and Authority
  normativity: MUST
  key: l6.versioning-and-authority.4
  i18n:
    en: >-
      Superseded rules MUST remain accessible for auditability, learning, and dispute resolution,
      together with the dates during which they were in force.
    de: >-
      Abgelöste Regeln MUSS zusammen mit den Zeiträumen, in denen sie galten, für Prüfbarkeit,
      Lernen und Streitbeilegung zugänglich bleiben.
    es: >-
      Las reglas reemplazadas DEBEN permanecer accesibles para auditoría, aprendizaje y resolución
      de disputas, junto con las fechas durante las cuales estuvieron en vigor.
    fr: >-
      Les règles remplacées DOIVENT rester accessibles à des fins d'auditabilité, d'apprentissage et
      de résolution de conflits, accompagnées des dates pendant lesquelles elles étaient en vigueur.
    pt-br: >-
      As regras substituídas DEVEM permanecer acessíveis para fins de auditabilidade, aprendizado e
      resolução de disputas, juntamente com as datas durante as quais estiveram em vigor.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.rejection
    - version-history.entry-format
  owner: version-history.entry-format
- ref: 8.2.5
  layer: 6
  specSection:
    ref: '8.2'
    title: Versioning and Authority
  normativity: MAY
  key: l6.versioning-and-authority.5
  i18n:
    en: No informal, undocumented, or “understood” rule changes MAY be considered valid.
    de: >-
      Keine informellen, undokumentierten oder „stillschweigend verstandenen" Regeländerungen KANN
      als gültig betrachtet werden.
    es: Ningún cambio de reglas informal, no documentado o "sobreentendido" PUEDE considerarse válido.
    fr: >-
      Aucune modification de règle informelle, non documentée ou « implicitement convenue » NE PEUT
      être considérée comme valide.
    pt-br: >-
      Nenhuma mudança de regra informal, não documentada ou "subentendida" PODE ser considerada
      válida.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.adoption-and-publication
    - version-history.entry-format
  owner: change-protocol.adoption-and-publication
- ref: 8.3.1
  layer: 6
  specSection:
    ref: '8.3'
    title: Experiments
  normativity: MAY
  key: l6.experiments.1
  i18n:
    en: >-
      The community MAY adopt experiments as explicitly time-bounded and reversible deviations,
      extensions, or pilots intended for learning.
    de: >-
      Die Gemeinschaft KANN Experimente als ausdrücklich zeitlich begrenzte und reversible
      Abweichungen, Erweiterungen oder Pilotprojekte zum Zweck des Lernens einführen.
    es: >-
      La comunidad PUEDE adoptar experimentos como desviaciones, extensiones o pilotos
      explícitamente acotados en el tiempo y reversibles, destinados al aprendizaje.
    fr: >-
      La communauté PEUT adopter des expérimentations en tant que déviations, extensions ou projets
      pilotes explicitement limités dans le temps et réversibles, destinés à l'apprentissage.
    pt-br: >-
      A comunidade PODE adotar experimentos como desvios, extensões ou pilotos explicitamente com
      prazo definido e reversíveis, destinados ao aprendizado.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.experiments
    - experiment-template.required-fields
  owner: change-protocol.experiments
- ref: 8.3.2
  layer: 6
  specSection:
    ref: '8.3'
    title: Experiments
  normativity: MUST
  key: l6.experiments.2
  i18n:
    en: |-
      Every experiment MUST define, at minimum:
      - Scope (what is changed and what is explicitly not changed)
      - Duration and review checkpoints
      - Success and failure criteria
      - Rollback conditions and rollback process
      - Authorized decision path for starting, extending, modifying, or terminating the experiment
    de: >-
      Jedes Experiment MUSS mindestens folgendes definieren:

      - Geltungsbereich (was geändert wird und was ausdrücklich nicht geändert wird)

      - Dauer und Überprüfungszeitpunkte

      - Erfolgs- und Misserfolgskriterien

      - Rollback-Bedingungen und Rollback-Prozess

      - Autorisierter Entscheidungspfad für das Starten, Verlängern, Ändern oder Beenden des
      Experiments
    es: |-
      Cada experimento DEBE definir, como mínimo:
      - Alcance (qué se cambia y qué explícitamente no se cambia)
      - Duración y puntos de revisión
      - Criterios de éxito y fracaso
      - Condiciones de reversión y proceso de reversión
      - Vía de decisión autorizada para iniciar, extender, modificar o terminar el experimento
    fr: >-
      Chaque expérimentation DOIT définir, au minimum :

      - La portée (ce qui est modifié et ce qui ne l'est explicitement pas)

      - La durée et les points de contrôle de révision

      - Les critères de succès et d'échec

      - Les conditions de retour en arrière et le processus de retour en arrière

      - Le chemin de décision autorisé pour démarrer, prolonger, modifier ou mettre fin à
      l'expérimentation
    pt-br: |-
      Todo experimento DEVE definir, no mínimo:
      - Escopo (o que é alterado e o que explicitamente não é alterado)
      - Duração e pontos de revisão
      - Critérios de sucesso e fracasso
      - Condições de reversão e processo de reversão
      - Caminho decisório autorizado para iniciar, estender, modificar ou encerrar o experimento
  disposition: defined_by_section
  referencedBy:
    - change-protocol.experiments
    - experiment-template.required-fields
  owner: change-protocol.experiments
- ref: 8.3.3
  layer: 6
  specSection:
    ref: '8.3'
    title: Experiments
  normativity: MUST
  key: l6.experiments.3
  i18n:
    en: >-
      Experiments MUST NOT override Layer 0 invariants and MUST NOT bypass governance constraints
      defined in Layer 2.
    de: >-
      Experimente DARF NICHT die Invarianten von Schicht 0 außer Kraft setzen und DARF NICHT die in
      Schicht 2 definierten Governance-Beschränkungen umgehen.
    es: >-
      Los experimentos NO DEBEN anular las invariantes de la Capa 0 y NO DEBEN eludir las
      restricciones de gobernanza definidas en la Capa 2.
    fr: >-
      Les expérimentations NE DOIVENT PAS outrepasser les invariants de la Couche 0 et NE DOIVENT
      PAS contourner les contraintes de gouvernance définies dans la Couche 2.
    pt-br: >-
      Os experimentos NÃO DEVEM sobrepor-se aos invariantes da Camada 0 e NÃO DEVEM contornar as
      restrições de governança definidas na Camada 2.
  disposition: defined_by_section
  referencedBy:
    - change-protocol.experiments
    - experiment-template.required-fields
  owner: change-protocol.experiments
- ref: 8.3.4
  layer: 6
  specSection:
    ref: '8.3'
    title: Experiments
  normativity: MUST
  key: l6.experiments.4
  i18n:
    en: >-
      Experiments MUST be explicitly labeled as experimental in all affected artifacts and MUST
      include a non-extendable expiration date unless renewed through an authorized decision.
    de: >-
      Experimente MUSS in allen betroffenen Artefakten ausdrücklich als experimentell gekennzeichnet
      sein und MUSS ein nicht verlängerbares Ablaufdatum enthalten, sofern sie nicht durch eine
      autorisierte Entscheidung erneuert werden.
    es: >-
      Los experimentos DEBEN estar explícitamente etiquetados como experimentales en todos los
      artefactos afectados y DEBEN incluir una fecha de expiración no prorrogable, a menos que se
      renueven mediante una decisión autorizada.
    fr: >-
      Les expérimentations DOIVENT être explicitement étiquetées comme expérimentales dans tous les
      artefacts concernés et DOIVENT inclure une date d'expiration non prolongeable, sauf
      renouvellement par une décision autorisée.
    pt-br: >-
      Os experimentos DEVEM ser explicitamente rotulados como experimentais em todos os artefatos
      afetados e DEVEM incluir uma data de expiração não prorrogável, a menos que sejam renovados
      por meio de uma decisão autorizada.

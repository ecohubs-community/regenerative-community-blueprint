    es: Los mecanismos económicos DEBEN prevenir la concentración indefinida de influencia interna.
    fr: Les mécanismes économiques DOIVENT empêcher la concentration indéfinie d'influence interne.
    pt-br: Mecanismos econômicos DEVEM impedir a concentração indefinida de influência interna.
  disposition: defined_by_section
  referencedBy:

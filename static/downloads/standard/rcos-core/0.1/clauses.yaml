- ref: 5.6.4
  layer: 3
  specSection:
    ref: '5.6'
    title: Layer Invariants
  normativity: MUST
  key: l3.layer-invariants.4
  i18n:
    en: Economic mechanisms MUST prevent indefinite concentration of internal influence.

    pt-br: >-
      A comunidade DEVE definir indicadores revisáveis de risco de concentração econômica e um
      mecanismo explícito para ajustar as restrições quando tais riscos forem detectados.
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.accumulation-constraints
  owner: internal-economy-protocol.accumulation-constraints

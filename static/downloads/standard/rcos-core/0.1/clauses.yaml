- ref: 6.3.1
  layer: 4
  specSection:
    ref: '6.3'
    title: Safeguards
  normativity: MUST
  key: l4.safeguards.1
  i18n:
    en: >-
      The community MUST define explicit safeguards for conflicts involving power asymmetries,
      dependency relationships, or safety risks.
    de: >-
      Die Gemeinschaft MUSS explizite Schutzmaßnahmen für Konflikte definieren, die
      Machtasymmetrien, Abhängigkeitsverhältnisse oder Sicherheitsrisiken beinhalten.
    es: >-
      La comunidad DEBE definir salvaguardas explícitas para conflictos que involucren asimetrías de
      poder, relaciones de dependencia o riesgos de seguridad.
    fr: >-
      La communauté DOIT définir des mesures de protection explicites pour les conflits impliquant
      des asymétries de pouvoir, des relations de dépendance ou des risques pour la sécurité.
    pt-br: >-
      A comunidade DEVE definir salvaguardas explícitas para conflitos que envolvam assimetrias de
      poder, relações de dependência ou riscos à segurança.
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.facilitator-selection-and-replacement
    - conflict-resolution-ladder.safeguards
  owner: conflict-resolution-ladder.safeguards
- ref: 6.3.2
  layer: 4
  specSection:
    ref: '6.3'
    title: Safeguards
  normativity: MUST
  key: l4.safeguards.2
  i18n:
    en: |-
      Safeguards MUST include protections against retaliation for:
      - Raising a concern
      - Requesting mediation
      - Providing testimony or evidence
      - Participating in a review or appeal
    de: |-
      Schutzmaßnahmen MUSS Schutz vor Vergeltung umfassen für:
      - Das Vorbringen eines Anliegens
      - Das Anfordern von Mediation
      - Das Abgeben von Aussagen oder Beweisen
      - Die Teilnahme an einer Überprüfung oder Berufung
    es: |-
      Las salvaguardas DEBEN incluir protecciones contra represalias por:
      - Plantear una preocupación
      - Solicitar mediación
      - Proporcionar testimonio o evidencia
      - Participar en una revisión o apelación
    fr: |-
      Les mesures de protection DOIVENT inclure des protections contre les représailles pour :
      - Le signalement d'une préoccupation
      - La demande de médiation
      - La fourniture de témoignages ou de preuves
      - La participation à un examen ou un appel
    pt-br: |-
      As salvaguardas DEVEM incluir proteções contra retaliação por:
      - Levantar uma preocupação
      - Solicitar mediação
      - Fornecer testemunho ou evidência
      - Participar de uma revisão ou apelação
  disposition: defined_by_section
  referencedBy:
    - accountability-protocol.anti-retaliation-protections
    - conflict-resolution-ladder.safeguards
  owner: accountability-protocol.anti-retaliation-protections
- ref: 6.3.3
  layer: 4
  specSection:
    ref: '6.3'
    title: Safeguards
  normativity: MUST
  key: l4.safeguards.3
  i18n:
    en: >-
      Where a power differential exists between parties, elevated safeguards MUST be applied, which
      MAY include:

      - Independent or external facilitation

      - Separate intake, documentation, or communication channels

      - Temporary suspension or limitation of role authority

      - Additional evidence and review thresholds prior to sanctions
    de: >-
      Wenn ein Machtgefälle zwischen den Parteien besteht, MUSS erhöhte Schutzmaßnahmen angewendet
      werden, die KANN umfassen:

      - Unabhängige oder externe Moderation

      - Getrennte Aufnahme-, Dokumentations- oder Kommunikationskanäle

      - Vorübergehende Aussetzung oder Einschränkung der Rollenbefugnisse

      - Zusätzliche Beweis- und Überprüfungsschwellen vor Sanktionen
    es: >-
      Cuando exista un diferencial de poder entre las partes, DEBEN aplicarse salvaguardas elevadas,
      que PUEDEN incluir:

      - Facilitación independiente o externa

      - Canales separados de recepción, documentación o comunicación

      - Suspensión o limitación temporal de la autoridad del rol

      - Umbrales adicionales de evidencia y revisión previos a las sanciones
    fr: >-
      Lorsqu'un différentiel de pouvoir existe entre les parties, des mesures de protection
      renforcées DOIVENT être appliquées, ce qui PEUT inclure :

      - Une facilitation indépendante ou externe

      - Des canaux séparés de collecte, de documentation ou de communication

      - La suspension ou la limitation temporaire de l'autorité liée au rôle

      - Des seuils supplémentaires de preuves et d'examen avant les sanctions
    pt-br: >-
      Quando existir um diferencial de poder entre as partes, salvaguardas elevadas DEVEM ser
      aplicadas, que PODEM incluir:

      - Facilitação independente ou externa

      - Canais separados de acolhimento, documentação ou comunicação

      - Suspensão ou limitação temporária da autoridade do papel

      - Limiares adicionais de evidência e revisão antes de sanções
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.facilitator-selection-and-replacement
    - conflict-resolution-ladder.safeguards
  owner: conflict-resolution-ladder.safeguards
- ref: 6.3.4
  layer: 4
  specSection:
    ref: '6.3'
    title: Safeguards
  normativity: MUST
  key: l4.safeguards.4
  i18n:
    en: >-
      For safety-critical conflicts, the community MUST define immediate protective actions that may
      be taken prior to full process completion, which MAY include:

      - Temporary separation measures

      - Restricted access to shared spaces or resources

      - Temporary role suspension

      - Emergency escalation timelines
    de: >-
      Bei sicherheitskritischen Konflikten MUSS die Gemeinschaft sofortige Schutzmaßnahmen
      definieren, die vor Abschluss des vollständigen Verfahrens ergriffen werden können, die KANN
      umfassen:

      - Vorübergehende Trennungsmaßnahmen

      - Eingeschränkter Zugang zu gemeinsamen Räumen oder Ressourcen

      - Vorübergehende Rollensuspendierung

      - Notfall-Eskalationsfristen
    es: >-
      Para conflictos críticos para la seguridad, la comunidad DEBE definir acciones protectoras
      inmediatas que puedan tomarse antes de completar el proceso completo, que PUEDEN incluir:

      - Medidas de separación temporal

      - Acceso restringido a espacios o recursos compartidos

      - Suspensión temporal del rol

      - Plazos de escalamiento de emergencia
    fr: >-
      Pour les conflits critiques pour la sécurité, la communauté DOIT définir des actions de
      protection immédiates pouvant être prises avant l'achèvement complet du processus, ce qui PEUT
      inclure :

      - Des mesures de séparation temporaire

      - Un accès restreint aux espaces ou ressources partagés

      - La suspension temporaire de rôle

      - Des délais d'escalade d'urgence
    pt-br: >-
      Para conflitos críticos para a segurança, a comunidade DEVE definir ações protetivas imediatas
      que podem ser tomadas antes da conclusão completa do processo, que PODEM incluir:

      - Medidas temporárias de separação

      - Acesso restrito a espaços ou recursos compartilhados

      - Suspensão temporária de papel

      - Prazos de escalonamento emergencial
  disposition: defined_by_section
  referencedBy:
    - conflict-resolution-ladder.safeguards
  owner: conflict-resolution-ladder.safeguards
- ref: 6.3.5
  layer: 4
  specSection:
    ref: '6.3'
    title: Safeguards
  normativity: MUST
  key: l4.safeguards.5
  i18n:
    en: >-
      Safety safeguards MUST override participation rights, role continuity, and operational
      convenience.
    de: >-
      Sicherheitsmaßnahmen MUSS Teilnahmerechte, Rollenkontinuität und betriebliche Zweckmäßigkeit

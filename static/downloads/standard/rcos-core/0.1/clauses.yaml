- ref: 5.1.1
  layer: 3
  specSection:
    ref: '5.1'
    title: Commons vs Private Resources
  normativity: MUST
  key: l3.commons-vs-private-resources.1
  i18n:
    en: >-
      All resources within the declared governed scope MUST be explicitly classified as either
      **commons** or **private**.
    de: >-
      Alle Ressourcen innerhalb des deklarierten Governance-Geltungsbereichs MÜSSEN explizit
      entweder als **Gemeingüter** oder als **privat** klassifiziert werden.
    es: >-
      Todos los recursos dentro del ámbito gobernado declarado DEBEN clasificarse explícitamente
      como **comunes** o **privados**.
    fr: >-
      Toutes les ressources comprises dans le périmètre gouverné déclaré DOIVENT être explicitement
      classifiées comme **communes** ou **privées**.
    pt-br: >-
      Todos os recursos dentro do escopo governado declarado DEVEM ser explicitamente classificados
      como **comuns** ou **privados**.
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.1.2
  layer: 3
  specSection:
    ref: '5.1'
    title: Commons vs Private Resources
  normativity: MUST
  key: l3.commons-vs-private-resources.2
  i18n:
    en: >-
      The community MUST maintain a single, explicit, and versioned registry of governed resources,
      including at minimum:

      - Resource name or unique identifier

      - Classification (commons or private)

      - Steward or owner (as applicable)

      - Access and use rules

      - Transfer, sale, or privatization constraints (if any)
    de: >-
      Die Gemeinschaft MUSS ein einziges, explizites und versioniertes Register der verwalteten
      Ressourcen führen, das mindestens Folgendes enthält:

      - Ressourcenname oder eindeutiger Bezeichner

      - Klassifikation (Gemeingut oder privat)

      - Verwalter:in oder Eigentümer:in (je nach Zutreffendem)

      - Zugangs- und Nutzungsregeln

      - Übertragungs-, Verkaufs- oder Privatisierungsbeschränkungen (falls vorhanden)
    es: >-
      La comunidad DEBE mantener un registro único, explícito y versionado de los recursos
      gobernados, que incluya como mínimo:

      - Nombre o identificador único del recurso

      - Clasificación (comunes o privados)

      - Administrador/a o propietario/a (según corresponda)

      - Reglas de acceso y uso

      - Restricciones de transferencia, venta o privatización (si las hay)
    fr: >-
      La communauté DOIT maintenir un registre unique, explicite et versionné des ressources
      gouvernées, incluant au minimum :

      - Nom ou identifiant unique de la ressource

      - Classification (commune ou privée)

      - Intendant ou propriétaire (selon le cas)

      - Règles d'accès et d'utilisation

      - Contraintes de transfert, de vente ou de privatisation (le cas échéant)
    pt-br: >-
      A comunidade DEVE manter um registro único, explícito e versionado dos recursos governados,
      incluindo no mínimo:

      - Nome do recurso ou identificador único

      - Classificação (comum ou privado)

      - Administrador ou proprietário (conforme aplicável)

      - Regras de acesso e uso

      - Restrições de transferência, venda ou privatização (se houver)
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.1.3
  layer: 3
  specSection:
    ref: '5.1'
    title: Commons vs Private Resources
  normativity: MUST
  key: l3.commons-vs-private-resources.3
  i18n:
    en: >-
      Any resource not explicitly classified MUST be treated as **unclassified**, and the community
      MUST NOT allocate, encumber, monetize, or transfer it until classification is completed
      through an authorized decision.
    de: >-
      Jede nicht explizit klassifizierte Ressource MUSS als **unklassifiziert** behandelt werden,
      und die Gemeinschaft DARF sie NICHT zuweisen, belasten, monetarisieren oder übertragen, bis
      die Klassifizierung durch eine autorisierte Entscheidung abgeschlossen ist.
    es: >-
      Cualquier recurso no clasificado explícitamente DEBE tratarse como **sin clasificar**, y la
      comunidad NO DEBE asignarlo, gravarlo, monetizarlo ni transferirlo hasta que la clasificación
      se complete mediante una decisión autorizada.
    fr: >-
      Toute ressource non explicitement classifiée DOIT être traitée comme **non classifiée**, et la
      communauté NE DOIT PAS l'allouer, la grever, la monétiser ou la transférer tant que la
      classification n'a pas été effectuée par une décision autorisée.
    pt-br: >-
      Qualquer recurso não classificado explicitamente DEVE ser tratado como **não classificado**, e
      a comunidade NÃO DEVE alocá-lo, onerá-lo, monetizá-lo ou transferi-lo até que a classificação
      seja concluída por meio de uma decisão autorizada.
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.1.4
  layer: 3
  specSection:
    ref: '5.1'
    title: Commons vs Private Resources
  normativity: MUST
  key: l3.commons-vs-private-resources.4
  i18n:
    en: |-
      For commons resources, the community MUST explicitly define:
      - Stewardship responsibilities
      - The authorized decision-making body or role
      - Maintenance obligations
      - Funding or contribution mechanisms (if any)
    de: |-
      Für Gemeingüter MUSS die Gemeinschaft explizit Folgendes definieren:
      - Verwaltungspflichten
      - Das autorisierte Entscheidungsgremium oder die zuständige Rolle
      - Instandhaltungspflichten
      - Finanzierungs- oder Beitragsmechanismen (falls vorhanden)
    es: |-
      Para los recursos comunes, la comunidad DEBE definir explícitamente:
      - Responsabilidades de administración
      - El órgano o rol autorizado para la toma de decisiones
      - Obligaciones de mantenimiento
      - Mecanismos de financiación o contribución (si los hay)
    fr: |-
      Pour les ressources communes, la communauté DOIT définir explicitement :
      - Les responsabilités d'intendance
      - L'organe ou le rôle décisionnel autorisé
      - Les obligations de maintenance
      - Les mécanismes de financement ou de contribution (le cas échéant)
    pt-br: |-
      Para recursos comuns, a comunidade DEVE definir explicitamente:
      - Responsabilidades de administração
      - O órgão ou papel de tomada de decisão autorizado
      - Obrigações de manutenção
      - Mecanismos de financiamento ou contribuição (se houver)
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.1.5
  layer: 3
  specSection:
    ref: '5.1'
    title: Commons vs Private Resources
  normativity: MUST
  key: l3.commons-vs-private-resources.5
  i18n:
    en: >-
      For private resources, the community MUST NOT exercise authority beyond what is explicitly
      declared in the scope, membership agreements, or other governed artifacts.
    de: >-
      Für Privatressourcen DARF die Gemeinschaft KEINE Autorität über das hinaus ausüben, was
      explizit im Geltungsbereich, in Mitgliedschaftsvereinbarungen oder anderen verwalteten
      Artefakten deklariert ist.
    es: >-
      Para los recursos privados, la comunidad NO DEBE ejercer autoridad más allá de lo
      explícitamente declarado en el ámbito, los acuerdos de membresía u otros artefactos
      gobernados.
    fr: >-
      Pour les ressources privées, la communauté NE DOIT PAS exercer d'autorité au-delà de ce qui
      est explicitement déclaré dans le périmètre, les accords d'adhésion ou les autres artefacts
      gouvernés.
    pt-br: >-
      Para recursos privados, a comunidade NÃO DEVE exercer autoridade além do que está
      explicitamente declarado no escopo, nos acordos de associação ou em outros artefatos
      governados.
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.commons-vs-private-classification
  owner: internal-economy-protocol.commons-vs-private-classification
- ref: 5.2.1
  layer: 3
  specSection:
    ref: '5.2'
    title: Contribution Recognition
  normativity: MUST
  key: l3.contribution-recognition.1
  i18n:
    en: >-
      The community MUST explicitly define which contribution categories are recognized. These MAY
      include, but are not limited to:

      - Labor

      - Care and emotional work

      - Knowledge and education

      - Stewardship and maintenance

      - Administrative or coordination work
    de: >-
      Die Gemeinschaft MUSS explizit definieren, welche Beitragskategorien anerkannt werden. Diese
      KÖNNEN unter anderem umfassen:

      - Arbeit

      - Fürsorge- und emotionale Arbeit

      - Wissen und Bildung

      - Verwaltung und Instandhaltung

      - Administrative oder koordinierende Arbeit
    es: >-
      La comunidad DEBE definir explícitamente qué categorías de contribución se reconocen. Estas
      PUEDEN incluir, entre otras:

      - Trabajo

      - Cuidados y trabajo emocional

      - Conocimiento y educación

      - Administración y mantenimiento

      - Trabajo administrativo o de coordinación
    fr: >-
      La communauté DOIT définir explicitement quelles catégories de contributions sont reconnues.
      Celles-ci PEUVENT inclure, sans s'y limiter :

      - Le travail

      - Le soin et le travail émotionnel

      - Le savoir et l'éducation

      - L'intendance et la maintenance

      - Le travail administratif ou de coordination
    pt-br: >-
      A comunidade DEVE definir explicitamente quais categorias de contribuição são reconhecidas.
      Estas PODEM incluir, mas não se limitam a:

      - Trabalho

      - Cuidado e trabalho emocional

      - Conhecimento e educação

      - Administração e manutenção

      - Trabalho administrativo ou de coordenação
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.recognized-contribution-categories
  owner: internal-economy-protocol.recognized-contribution-categories
- ref: 5.2.2
  layer: 3
  specSection:
    ref: '5.2'
    title: Contribution Recognition
  normativity: MUST
  key: l3.contribution-recognition.2
  i18n:
    en: >-
      The community MUST define a contribution recognition mechanism specifying:

      - What qualifies as a contribution

      - How contributions are recorded or acknowledged

      - Who may record, validate, or contest contributions

      - Whether and how contribution recognition affects access to resources, privileges, or
      obligations
    de: >-
      Die Gemeinschaft MUSS einen Mechanismus zur Beitragsanerkennung definieren, der festlegt:

      - Was als Beitrag gilt

      - Wie Beiträge erfasst oder anerkannt werden

      - Wer Beiträge erfassen, validieren oder anfechten darf

      - Ob und wie die Beitragsanerkennung den Zugang zu Ressourcen, Privilegien oder
      Verpflichtungen beeinflusst
    es: >-
      La comunidad DEBE definir un mecanismo de reconocimiento de contribuciones que especifique:

      - Qué califica como contribución

      - Cómo se registran o reconocen las contribuciones

      - Quién puede registrar, validar o impugnar contribuciones

      - Si el reconocimiento de contribuciones afecta al acceso a recursos, privilegios u
      obligaciones, y de qué manera
    fr: >-
      La communauté DOIT définir un mécanisme de reconnaissance des contributions spécifiant :

      - Ce qui constitue une contribution

      - Comment les contributions sont enregistrées ou reconnues

      - Qui peut enregistrer, valider ou contester des contributions

      - Si et comment la reconnaissance des contributions affecte l'accès aux ressources, privilèges
      ou obligations
    pt-br: >-
      A comunidade DEVE definir um mecanismo de reconhecimento de contribuições especificando:

      - O que se qualifica como contribuição

      - Como as contribuições são registradas ou reconhecidas

      - Quem PODE registrar, validar ou contestar contribuições

      - Se e como o reconhecimento de contribuições afeta o acesso a recursos, privilégios ou
      obrigações
  disposition: defined_by_section
  referencedBy:
    - internal-economy-protocol.contribution-recognition-mechanism
  owner: internal-economy-protocol.contribution-recognition-mechanism
- ref: 5.2.3
  layer: 3
  specSection:
    ref: '5.2'
    title: Contribution Recognition
  normativity: MUST
  key: l3.contribution-recognition.3
  i18n:
    en: >-
      The community MUST NOT structurally depend on unpaid, invisible, or informal labor for system
      survival without explicitly defining corresponding obligations, recognition, or compensation
      mechanisms.
    de: >-
      Die Gemeinschaft DARF NICHT strukturell auf unbezahlte, unsichtbare oder informelle Arbeit für
      das Überleben des Systems angewiesen sein, ohne entsprechende Verpflichtungen, Anerkennung
      oder Kompensationsmechanismen explizit zu definieren.
    es: >-
      La comunidad NO DEBE depender estructuralmente de trabajo no remunerado, invisible o informal
      para la supervivencia del sistema sin definir explícitamente las obligaciones, el
      reconocimiento o los mecanismos de compensación correspondientes.
    fr: >-
      La communauté NE DOIT PAS dépendre structurellement d'un travail non rémunéré, invisible ou
      informel pour la survie du système sans définir explicitement les obligations, la
      reconnaissance ou les mécanismes de compensation correspondants.
    pt-br: >-
      A comunidade NÃO DEVE depender estruturalmente de trabalho não pago, invisível ou informal
      para a sobrevivência do sistema sem definir explicitamente as obrigações correspondentes, o

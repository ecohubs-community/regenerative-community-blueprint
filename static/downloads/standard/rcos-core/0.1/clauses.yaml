      La transparencia DEBE ser la norma por defecto para los saldos de tesorería, los ingresos, los
      egresos, las obligaciones y los compromisos.
    fr: >-
      La transparence DOIT être la règle par défaut pour les soldes de trésorerie, les entrées, les
      sorties, les obligations et les engagements.
    pt-br: >-
      A transparência DEVE ser o padrão para saldos da tesouraria, entradas, saídas, obrigações e
      compromissos.
  disposition: defined_by_section
  referencedBy:
    - treasury-ruleset.transparency-and-reporting
  owner: treasury-ruleset.transparency-and-reporting
- ref: 5.3.5
  layer: 3
  specSection:
    ref: '5.3'
    title: Treasury Management
  normativity: MUST
  key: l3.treasury-management.5
  i18n:
    en: >-
      Any exceptions to transparency MUST be explicitly defined, justified, time-bounded, and MUST
      NOT prevent members from auditing compliance.
    de: >-
      Alle Ausnahmen von der Transparenz MÜSSEN explizit definiert, begründet und zeitlich begrenzt
      sein und DÜRFEN Mitglieder NICHT daran hindern, die Einhaltung der Regeln zu prüfen.
    es: >-
      Cualquier excepción a la transparencia DEBE estar explícitamente definida, justificada,
      acotada en el tiempo y NO DEBE impedir que los miembros auditen el cumplimiento.
    fr: >-
      Toute exception à la transparence DOIT être explicitement définie, justifiée, limitée dans le
      temps, et NE DOIT PAS empêcher les membres de vérifier la conformité.
    pt-br: >-
      Quaisquer exceções à transparência DEVEM ser explicitamente definidas, justificadas, limitadas
      no tempo, e NÃO DEVEM impedir que membros auditem a conformidade.

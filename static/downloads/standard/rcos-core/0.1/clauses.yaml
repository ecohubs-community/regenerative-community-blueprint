    title: Workload and Capacity Boundaries
  normativity: MUST
  key: l5.workload-and-capacity-boundaries.4
  i18n:
    en: >-
      Persistent overload, burnout risk, chronic non-participation, or dependency on
      over-functioning individuals MUST trigger review or repair processes as defined in Layer 4.
    de: >-

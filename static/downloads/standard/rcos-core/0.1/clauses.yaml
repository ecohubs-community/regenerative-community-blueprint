      in Schicht 4 definiert.
    es: >-
      La sobrecarga persistente, el riesgo de agotamiento, la no-participación crónica o la
      dependencia de personas que funcionan en exceso DEBEN activar procesos de revisión o
      reparación según lo definido en la Capa 4.
    fr: >-
      La surcharge persistante, le risque d'épuisement, la non-participation chronique ou la
      dépendance à des individus en sur-fonctionnement DOIVENT déclencher des processus de révision
      ou de réparation tels que définis dans la Couche 4.
    pt-br: >-
      Sobrecarga persistente, risco de esgotamento, não participação crônica ou dependência de
      indivíduos que assumem funções em excesso DEVEM acionar processos de revisão ou reparo,
      conforme definido na Camada 4.
  disposition: defined_by_section
  referencedBy:
    - operations-manual.workload-boundaries
  owner: operations-manual.workload-boundaries

    title: Treasury Management
  normativity: MUST
  key: l3.treasury-management.3
  i18n:
    en: |-
      Spending authority MUST be explicitly bounded through:
      - Clear authority assignments
      - Thresholds by amount and/or category
      - Approval and escalation paths
      - Mandatory recordkeeping requirements
    de: |-
      Ausgabenbefugnis MUSS explizit begrenzt werden durch:
      - Klare Zuständigkeitszuweisungen
      - Schwellenwerte nach Betrag und/oder Kategorie
      - Genehmigungs- und Eskalationswege
      - Verpflichtende Aufzeichnungspflichten
    es: |-
      La autoridad de gasto DEBE estar explícitamente acotada mediante:
      - Asignaciones claras de autoridad
      - Umbrales por monto y/o categoría
      - Vías de aprobación y escalamiento
      - Requisitos obligatorios de registro
    fr: |-
      L'autorité de dépense DOIT être explicitement encadrée par :
      - Des attributions d'autorité claires
      - Des seuils par montant et/ou catégorie
      - Des parcours d'approbation et d'escalade
      - Des exigences obligatoires de tenue de registres
    pt-br: |-
      A autoridade de gastos DEVE ser explicitamente limitada por meio de:
      - Atribuições claras de autoridade
      - Limites por valor e/ou categoria
      - Caminhos de aprovação e escalonamento
      - Requisitos obrigatórios de registro

  key: l6.change-safety-and-reversibility.1
  i18n:
    en: The system MUST prefer reversible changes over irreversible ones where possible.
    de: Das System MUSS wo möglich reversible Änderungen gegenüber irreversiblen bevorzugen.
    es: El sistema DEBE preferir cambios reversibles sobre los irreversibles cuando sea posible.
    fr: >-
      Le système DOIT privilégier les changements réversibles par rapport aux changements
      irréversibles lorsque c'est possible.
    pt-br: O sistema DEVE preferir mudanças reversíveis a mudanças irreversíveis, quando possível.

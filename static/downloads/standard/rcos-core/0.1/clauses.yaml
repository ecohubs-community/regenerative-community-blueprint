  normativity: MUST
  key: l3.accumulation-constraints.1
  i18n:
    en: >-
      Internal economic systems MUST prevent unbounded concentration of internal influence or
      control through resources, credits, or financial obligations.
    de: >-
      Interne Wirtschaftssysteme MÜSSEN eine unbegrenzte Konzentration von internem Einfluss oder
      Kontrolle durch Ressourcen, Guthaben oder finanzielle Verpflichtungen verhindern.
    es: >-
      Los sistemas económicos internos DEBEN prevenir la concentración ilimitada de influencia o
      control interno a través de recursos, créditos u obligaciones financieras.
    fr: >-
      Les systèmes économiques internes DOIVENT empêcher la concentration illimitée d'influence ou
      de contrôle interne par le biais de ressources, de crédits ou d'obligations financières.
    pt-br: >-
      Sistemas econômicos internos DEVEM impedir a concentração ilimitada de influência ou controle
